da Provisória nº 767, de 6/1/2017, e não mantido na Lei nº 13.457, de 26/6/2017, na qual foi convertida a referida Medida Provisória)","§ 13 (Parágrafo acrescido pela Medida Provisória nº 767, de 6/1/2017, e não mantido na Lei nº 13.457, de 26/6/2017, na qual foi convertida a referida Medida Provisória)","§ 14. Ato do Ministro de Estado do Trabalho e Previdência poderá estabelecer as condições de dispensa da emissão de parecer conclusivo da perícia médica federal quanto à incapacidade laboral, hipótese na qual a concessão do benefício de que trata este artigo será feita por meio de análise documental, incluídos atestados ou laudos médicos, realizada pelo INSS. (Parágrafo acrescido pela Medida Provisória nº 1.113, de 20/4/2022, convertida na Lei nº 14.441, de 2/9/2022)","§ 15. Os segurados com síndrome da imunodeficiência adquirida, doença de Alzheimer, doença de Parkinson e esclerose lateral amiotrófica são dispensados da avaliação referida no § 10 deste artigo. (Parágrafo acrescido pela Lei nº 15.157, de 1º/7/2025)","§ 16. A perícia médica de segurado com síndrome da imunodeficiência adquirida deverá ter a participação de pelo menos 1 (um) médico especialista em infectologia. (Parágrafo acrescido pela Lei nº 15.157, de 1º/7/2025)"],"118":["Art. 118. O segurado que sofreu acidente do trabalho tem garantida, pelo prazo mínimo de doze meses, a manutenção do seu contrato de trabalho na empresa, após a cessação do auxílio-doença acidentário, independentemente de percepção de auxílio-acidente.","Parágrafo único. (Revogado pela Lei n° 9.032, de 28/4/1995)"]}},"Lei 12.506/2011":{"url":"https://www2.camara.leg.br/legin/fed/lei/2011/lei-12506-11-outubro-2011-611572-publicacaooriginal-133781-pl.html","articles":{"1":["Art. 1º O aviso prévio, de que trata o Capítulo VI do Título IV da Consolidação das Leis do Trabalho - CLT, aprovada pelo Decreto-Lei nº 5.452, de 1º de maio de 1943, será concedido na proporção de 30 (trinta) dias aos empregados que contem até 1 (um) ano de serviço na mesma empresa.","Parágrafo único. Ao aviso prévio previsto neste artigo serão acrescidos 3 (três) dias por ano de serviço prestado na mesma empresa, até o máximo de 60 (sessenta) dias, perfazendo um total de até 90 (noventa) dias."]}},"Lei 8.212/1991":{"url":"https://www2.camara.leg.br/legin/fed/lei/1991/lei-8212-24-julho-1991-363647-normaatualizada-pl.html","articles":{"25-A":["Art. 25-A. Equipara-se ao empregador rural pessoa física o consórcio simplificado de produtores rurais, formado pela união de produtores rurais pessoas físicas, que outorgar a um deles poderes para contratar, gerir e demitir trabalhadores para prestação de serviços, exclusivamente, aos seus integrantes, mediante documento registrado em cartório de títulos e documentos.","§ 1º O documento de que trata o caput deverá conter a identificação de cada produtor, seu endereço pessoal e o de sua propriedade rural, bem como o respectivo registro no Instituto Nacional de Colonização e Reforma Agrária - INCRA ou informações relativas a parceria, arrendamento ou equivalente e a matrícula no Instituto Nacional do Seguro Social - INSS de cada um dos produtores rurais.","§ 2º O consórcio deverá ser matriculado no INSS em nome do empregador a quem hajam sido outorgados os poderes, na forma do regulamento.","§ 3º Os produtores rurais integrantes do consórcio de que trata o caput serão responsáveis solidários em relação às obrigações previdenciárias.","§ 4º (VETADO) (Artigo acrescido pela Lei nº 10.256, de 9/7/2001)"]}},"EC 141/2026":{"url":"https://www2.camara.leg.br/legin/fed/emecon/2026/emendaconstitucional-141-16-outubro-2026-800062-publicacaooriginal-181622-pl.html","articles":{"2":["Art. 2º A diminuição da duração do trabalho normal e o incremento do repouso semanal remunerado em cumprimento a esta Emenda Constitucional aplicam-se aos contratos de trabalho em vigor e serão implementados sem qualquer redução salarial nominal, proporcional ou de qualquer outra espécie.","Parágrafo único. A irredutibilidade salarial estabelecida no caput deste artigo aplica-se inclusive aos pisos salariais."],"6":["Art. 6º A redução da duração do trabalho normal para 40 (quarenta) horas semanais será implementada de forma progressiva, observado o seguinte:","I - 2 (dois) meses após a publicação desta Emenda Constitucional, a duração do trabalho normal não excederá a 42 (quarenta e duas) horas semanais;","II - 1 (um) ano após o decurso do prazo de que trata o inciso I deste artigo, a duração do trabalho normal não excederá a 40 (quarenta) horas semanais."],"8":["Art. 8º Ao empregado portador de diploma de nível superior e que perceba remuneração mensal igual ou superior a duas vezes e meia o limite máximo dos benefícios do Regime Geral de Previdência Social não se aplicam as regras relativas à duração do trabalho e ao controle da jornada, salvo por liberalidade do empregador ou se houver previsão em acordo ou convenção coletiva de trabalho, respeitados o inciso XV e o","§ 2º do art. 7º da Constituição Federal.","§ 1º O disposto no caput deste artigo não se aplica aos empregados públicos da administração direta e indireta de quaisquer dos Poderes da União, dos Estados, do Distrito Federal e dos Municípios.","§ 2º Compete à Justiça do Trabalho processar e julgar as ações relativas ao disposto no caput deste artigo."]}},"Lei 605/1949":{"url":"https://www2.camara.leg.br/legin/fed/lei/1940-1949/lei-605-5-janeiro-1949-367115-normaatualizada-pl.html","articles":{"1":["Art. 1º Todo empregado tem direito ao repouso semanal remunerado, de vinte e quatro horas consecutivas, preferentemente aos domingos e, nos limites das exigências técnicas das empresas, nos feriados civis e religiosos, de acordo com a tradição local."],"6":["Art. 6º Não será devida a remuneração quando, sem motivo justificado, o empregado não tiver trabalhado durante toda a semana anterior, cumprindo integralmente o seu horário de trabalho.","§ 1º São motivos justificados:","a) os previstos no artigo 473 e seu parágrafo único da Consolidação das Leis do Trabalho;","b) a ausência do empregado, devidamente justificada, a critério da administração do estabelecimento;","c) a paralisação do serviço nos dias em que, por conveniência do empregador, não tenha havido trabalho;","d) a ausência do empregado, até três dias consecutivos, em virtude de seu casamento;","e) a falta ao serviço com fundamento na lei sobre acidente do trabalho;","f) a doença do empregado, devidamente comprovada.","§ 2º A doença será comprovada mediante atestado de médico da instituição da previdência social a que estiver filiado o empregado, e, na falta deste e sucessivamente, de médico do Serviço Social do Comércio ou da Indústria; de médico da empresa ou por ela designado; de médico a serviço de representação federal, estadual ou municipal incumbido de assuntos de higiene ou de saúde pública; ou não existindo estes, na localidade em que trabalhar, de médico de sua escolha. (Parágrafo com redação dada pela Lei nº 2.761, de 26/4/1956)","§ 3º Nas empresas em que vigorar regime de trabalho reduzido a freqüência exigida corresponderá ao número de dias em que o empregado tiver de trabalhar.","§ 4º Durante período de emergência em saúde pública decorrente da Covid-19, a imposição de isolamento dispensará o empregado da comprovação de doença por 7 (sete) dias. (Parágrafo acrescido pela Lei nº 14.128, de 26/3/2021)","§ 5º No caso de imposição de isolamento em razão da Covid-19, o trabalhador poderá apresentar como justificativa válida, no oitavo dia de afastamento, além do disposto neste artigo, documento de unidade de saúde do Sistema Único de Saúde (SUS) ou documento eletrônico regulamentado pelo Ministério da Saúde. (Parágrafo acrescido pela Lei nº 14.128, de 26/3/2021)"],"7":["Art. 7º A remuneração do repouso semanal corresponderá:","a) para os que trabalham por dia, semana, quinzena ou mês, à de um dia de serviço, computadas as horas extraordinárias habitualmente prestadas; (Alínea com redação dada pela Lei nº 7.415, de 9/12/1985)","b) para os que trabalham por hora, à de sua jornada normal de trabalho, computadas as horas extraordinárias habitualmente prestadas; (Alínea com redação dada pela Lei nº 7.415, de 9/12/1985)","c) para os que trabalham por tarefa ou peça, o equivalente ao salário correspondente às tarefas ou peças feitas durante a semana, no horário normal de trabalho, dividido pelos dias de serviço efetivamente prestados ao empregador;","d) para o empregado em domicílio, o equivalente ao cociente da divisão por seis (6) da importância total da sua produção na semana.","§ 1º Os empregados cujos salários não sofram descontos por motivo de feriados civis ou religiosos são considerados já remunerados nesses mesmos dias de repouso conquanto tenham direito à remuneração dominical.","§ 2º Consideram-se já remunerados os dias de repouso semanal do empregado mensalista ou quinzenalista, cujo cálculo de salário mensal ou quinzenal, ou cujos descontos por faltas sejam efetuados na base do número de dias do mês ou de trinta (30) e quinze (15) diárias, respectivamente."],"9":["Art. 9º Nas atividades em que não for possível, em virtude das exigências técnicas das empresas a suspensão do trabalho, nos dias feriados civis e religiosos, a remuneração será paga em dôbro, salvo se o empregador determinar outro dia de folga."]}},"ADCT":{"url":"https://portal.stf.jus.br/constituicao-supremo/artigo.asp?abrirArtigo=10&abrirBase=AD","articles":{"10":["Art. 10. Até que seja promulgada a lei complementar a que se refere o art. 7º, I, da Constituição:","I - fica limitada a proteção nele referida ao aumento, para quatro vezes, da porcentagem prevista no art. 6º, caput e § 1º, da Lei n.º 5.107, de 13 de setembro de 1966;","II - fica vedada a dispensa arbitrária ou sem justa causa:","a) do empregado eleito para cargo de direção de comissões internas de prevenção de acidentes, desde o registro de sua candidatura até um ano após o final de seu mandato;","b) da empregada gestante, desde a confirmação da gravidez até cinco meses após o parto.","§ 1º Até que a lei venha a disciplinar o disposto no art. 7º, XIX, da Constituição, o prazo da licença-paternidade a que se refere o inciso é de cinco dias.","§ 2º Até ulterior disposição legal, a cobrança das contribuições para o custeio das atividades dos sindicatos rurais será feita juntamente com a do imposto territorial rural, pelo mesmo órgão arrecadador.","§ 3º Na primeira comprovação do cumprimento das obrigações trabalhistas pelo empregador rural, na forma do art. 233, após a promulgação da Constituição, será certificada perante a Justiça do Trabalho a regularidade do contrato e das atualizações das obrigações trabalhistas de todo o período."]}}},"factCases":[{"id":"ferias-1","chapter":"ferias","title":"Gozo e pagamento em datas diferentes","common":["Uma empregada tem direito a 30 dias de férias.","O pagamento foi feito no dia em que as férias começaram."],"changed":["Todos os dias foram gozados dentro do período concessivo.","Dez dias foram gozados depois de terminar o período concessivo."],"question":"Em quantos dias incide a dobra do art. 137?","options":["Em nenhum dia, por esses fatos.","Em dez dias.","Em todos os 30 dias.","Em 20 dias.","Em dois dias."],"answers":[0,1],"explanation":["O pagamento foi tardio, mas o gozo ocorreu dentro do prazo. O atraso no pagamento não gera, por si só, a dobra do art. 137.","O gozo extemporâneo de dez dias aciona a dobra para esses dez dias. O atraso no pagamento continua igual nas duas situações."],"refs":[{"law":"CLT","ids":["137","145"],"label":"arts. 137, 145","highlights":{"137":{"0":["direct",140],"1":["related",179]},"145":{"0":["direct",169],"1":["related",171]}}}]},{"id":"ferias-2","chapter":"ferias","title":"Uma falta a mais","common":["O período aquisitivo foi completado.","As demais ausências foram justificadas nos termos da lei."],"changed":["Houve 14 faltas injustificadas.","Houve 15 faltas injustificadas."],"question":"A quantos dias de férias a pessoa tem direito?","options":["30 dias.","24 dias.","18 dias.","12 dias.","26 dias."],"answers":[1,2],"explanation":["Quatorze faltas ficam no limite superior da faixa de seis a 14. O resultado é 24 dias.","A 15ª falta muda a faixa do art. 130. De 15 a 23 faltas, o direito é de 18 dias."],"refs":[{"law":"CLT","ids":["130","131"],"label":"arts. 130, 131","highlights":{"130":{"2":["direct",91],"0":["related",141],"5":["related",81],"3":["direct",95]},"131":{"0":["direct",109],"1":["direct",36],"4":["direct",118],"3":["related",160]}}}]},{"id":"aviso-1","chapter":"aviso","title":"Empregador ou empregado","common":["O contrato é por prazo indeterminado e o posto é urbano.","O período de aviso trabalhado considerado é de 30 dias."],"changed":["O empregador dispensou a pessoa sem justa causa.","A pessoa pediu demissão."],"question":"A redução de jornada do art. 488 se aplica por essa modalidade de saída?","options":["Sim, na hipótese de aviso trabalhado dado pelo empregador.","Não, a modalidade descrita não ativa a redução do art. 488.","Sim, mas somente com desconto salarial.","Sim, somente se a pessoa provar um novo emprego.","Sim em qualquer aviso trabalhado, inclusive no pedido de demissão."],"answers":[0,1],"explanation":["A empresa tomou a iniciativa da ruptura. No aviso trabalhado, a redução prevista no art. 488 protege o tempo do empregado sem prejuízo salarial.","No pedido de demissão a iniciativa é da pessoa empregada. A redução do art. 488 está vinculada à ruptura promovida pelo empregador."],"refs":[{"law":"CLT","ids":["488"],"label":"art. 488","highlights":{"488":{"0":["direct",207],"1":["direct",376]}}}]},{"id":"aviso-2","chapter":"aviso","title":"O limite da proporcionalidade","common":["Uma empresa dispensou um empregado sem justa causa.","Todo o tempo de serviço foi na mesma empresa."],"changed":["O empregado completou 20 anos de serviço.","O empregado completou 23 anos de serviço."],"question":"Qual é a duração total do aviso prévio proporcional?","options":["90 dias.","99 dias.","60 dias.","87 dias.","93 dias."],"answers":[0,0],"explanation":["Vinte anos geram o acréscimo máximo de 60 dias sobre a base de 30. O total é de 90 dias.","A mudança no tempo de serviço não muda o resultado. O acréscimo continua limitado a 60 dias e o total a 90."],"refs":[{"law":"Lei 12.506/2011","ids":["1"],"label":"art. 1","highlights":{"1":{"0":["direct",284],"1":["direct",213]}}}]},{"id":"verbas-1","chapter":"verbas","title":"Quem antecipou o fim do contrato","common":["Restavam três meses de contrato a termo, a R$ 2.400 por mês, sem cláusula assecuratória.","Para a hipótese de iniciativa do empregado, o prejuízo da empresa foi comprovado em R$ 1.500."],"changed":["A empresa dispensou antes do termo sem justa causa.","O empregado encerrou antes do termo sem falta do empregador."],"question":"Qual indenização específica cabe nos termos dos arts. 479 e 480?","options":["A empresa deve R$ 3.600 ao empregado.","O empregado deve R$ 1.500 à empresa.","O empregado deve R$ 3.600 à empresa, automaticamente.","A empresa deve R$ 7.200 ao empregado.","O empregado deve R$ 750 à empresa."],"answers":[0,1],"explanation":["Com iniciativa patronal, aplica-se na hipótese a metade da remuneração restante. R$ 7.200 divididos por dois resultam em R$ 3.600.","Com iniciativa do empregado, R$ 3.600 é o teto, não o valor automático. O prejuízo demonstrado de R$ 1.500 fica abaixo dele."],"refs":[{"law":"CLT","ids":["479","480"],"label":"arts. 479, 480","highlights":{"479":{"0":["direct",234],"1":["related",244]},"480":{"0":["direct",195],"1":["direct",187]}}}]},{"id":"verbas-2","chapter":"verbas","title":"O que foi admitido no processo","common":["A discussão envolve R$ 4.000 de verbas rescisórias.","No comparecimento à Justiça do Trabalho, a empresa não pagou esse valor."],"changed":["A empresa reconheceu que devia os R$ 4.000.","A empresa controverteu efetivamente a totalidade dos R$ 4.000."],"question":"Quanto é o acréscimo do art. 467 sobre essa quantia?","options":["R$ 4.000.","R$ 2.000.","R$ 0.","R$ 800.","R$ 1.000."],"answers":[1,2],"explanation":["A empresa deixou de pagar parte incontroversa no momento legal. O acréscimo de 50% sobre R$ 4.000 resulta em R$ 2.000.","Sem parte incontroversa no caso descrito, falta o requisito para o acréscimo. A existência da reclamação por si só não o aciona."],"refs":[{"law":"CLT","ids":["467"],"label":"art. 467","highlights":{"467":{"0":["direct",305]}}}]}]}</script>
<script>
'use strict';

const data = JSON.parse(document.querySelector('#study-data').textContent);
const chapters = new Map(data.chapters.map(chapter => [chapter.id, chapter]));
const bank = new Map(data.chapters.flatMap(chapter => chapter.questions.map(question => [question.id, question])));
const main = document.querySelector('#main');
const index = document.querySelector('#index');
const list = document.querySelector('#chapter-list');
const key = 'direito-do-trabalho-v1';
const levels = { B: 'Baixo', M: 'Médio', A: 'Alto' };
const panels = { leitura: 'Conteúdo', mapa: 'Mapa mental', questoes: 'Questões', glossario: 'Glossário' };
const narrow = matchMedia('(max-width:710px)');
let studyLevel = 'M';
let session;

function restore() {
  try {
    const saved = JSON.parse(localStorage.getItem(key) || '{}');
    return {
      read: Array.isArray(saved.read) ? saved.read.filter(id => chapters.has(id)) : [],
      mistakes: Array.isArray(saved.mistakes) ? saved.mistakes.filter(id => bank.has(id)) : []
    };
  } catch {
    return { read: [], mistakes: [] };
  }
}
const progress = restore();
function save() {
  try { localStorage.setItem(key, JSON.stringify(progress)); } catch {}
  updateProgress();
}

function e(value) {
  return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}

function href(id, panel = 'leitura') {
  return '#' + id + (panel === 'leitura' ? '' : '/' + panel);
}

function updateProgress() {
  document.querySelector('#progress').value = progress.read.length;
  document.querySelector('#progress-label').textContent = progress.read.length + ' de ' + chapters.size + ' capítulos lidos';
  list.querySelectorAll('[data-chapter]').forEach(link => {
    const read = progress.read.includes(link.dataset.chapter);
    link.querySelector('.nav-number').textContent = read ? '✓' : link.dataset.number;
    const title = chapters.get(link.dataset.chapter).title;
    link.setAttribute('aria-label', title + (read ? ', lido' : ''));
  });
}

function renderIndex(id) {
  list.innerHTML = [1,2].map(semester => '<h2 class="group">' + semester + 'º semestre</h2>' +
    data.chapters.filter(chapter => chapter.semester === semester).map(chapter =>
      '<a class="nav-item" href="' + href(chapter.id) + '" data-chapter="' + chapter.id + '" data-number="' + chapter.number +
      '"' + (id === chapter.id ? ' aria-current="page"' : '') + ' aria-describedby="articles-' + chapter.id + '"><span class="nav-number" aria-hidden="true"></span>' +
      '<span class="nav-chapter">' + e(chapter.title) + '<small class="nav-articles" id="articles-' + chapter.id + '">' +
      chapter.citedArticles.map(text => '<span>' + e(text) + '</span>').join('') + '</small></span></a>').join('')).join('');
  updateProgress();
}

function header(title, eyebrow, chapter, current) {
  const tabs = chapter ? '<nav class="tabs" aria-label="Recursos do capítulo">' +
    Object.entries(panels).map(([code, label]) => '<a href="' + href(chapter.id, code) + '"' +
      (code === 'glossario' ? ' class="glossary-tab"' : '') +
      (current === code ? ' aria-current="page"' : '') + '>' + label + '</a>').join('') +
    (data.factCases.some(item => item.chapter === chapter.id) ? '<a class="fact-tab" href="#fato/' + chapter.id + '">E se o fato mudar?</a>' : '') +
    (chapter.lesson ? '<a class="video-tab" href="' + href(chapter.id, 'video') + '"' +
      (current === 'video' ? ' aria-current="page"' : '') + '>Vídeo</a>' : '') +
    '</nav>' : '';
  return '<div class="hero"><p class="eyebrow">' + e(eyebrow) + '</p><h1>' + e(title) + '</h1></div>' + tabs;
}

function prose(blocks) {
  let output = '';
  let activeList = '';
  for (const block of blocks) {
    const tag = {bullet:'ul',number:'ol'}[block.type] || '';
    if (activeList !== tag) {
      if (activeList) output += '</' + activeList + '>';
      if (tag) output += '<' + tag + '>';
      activeList = tag;
    }
    if (tag) output += '<li>' + e(block.text) + inlineLaw(block.refs) + '</li>';
    else if (block.type === 'heading') output += '<h2>' + e(block.text) + '</h2>';
    else if (block.type === 'prompt') output += '<div class="callout">' + e(block.text) + '</div>'; 
    else if (block.type === 'example') output += '<div class="example"><strong>Exemplo</strong><p>' + e(block.text.slice('Exemplo. '.length)) + '</p></div>';
    else if (block.type === 'link') output += '<p><a href="' + e(block.url) + '" target="_blank" rel="noopener">' + e(block.text) + '</a></p>';
    else output += '<p>' + e(block.text) + '</p>';
    if (!tag) output += inlineLaw(block.refs);
  }
  if (activeList) output += '</' + activeList + '>';
  return output;
}

function reading(chapter) {
  const previous = data.chapters[chapter.number - 2];
  const next = data.chapters[chapter.number];
  const read = progress.read.includes(chapter.id);
  return '<div class="prose">' + prose(chapter.body) + '</div><div class="actions">' +
    '<a class="button primary" href="' + href(chapter.id, 'questoes') + '">Responder questões</a>' +
    '<a class="button" href="' + href(chapter.id, 'mapa') + '">Ver mapa mental</a>' +
    '<button class="button" id="mark" aria-pressed="' + read + '">' + (read ? '✓ Marcado como lido' : 'Marcar como lido') +
    '</button></div><nav class="chapter-nav" aria-label="Capítulos próximos"><span>' +
    (previous ? '<a href="' + href(previous.id) + '">Capítulo anterior</a>' : '') + '</span><a href="' +
    (next ? href(next.id) + '">Próximo capítulo' : '#simulado">Fazer simulado') + '</a></nav>';
}

function mentalMap(chapter) {
  const branches = chapter.map.map(([label, description, example]) =>
    '<li class="map-branch"><details><summary><strong>' + e(label) + '</strong><span>' + e(description) +
    '</span><span class="map-affordance" aria-hidden="true"></span></summary><p class="map-case"><strong>Na prática</strong>' + e(example) + '</p></details></li>').join('');
  return '<div class="map-toolbar"><div><h2 class="section-title">Mapa mental</h2>' +
    '<p class="hint">Abra um ramo para ver o exemplo.</p></div>' +
    '<button class="button" type="button" id="map-toggle" aria-controls="map-branches">Abrir todos os exemplos</button></div>' +
    '<div class="map"><p class="map-root">' + e(chapter.mapTitle) + '</p>' +
    '<ul class="map-branches" id="map-branches" role="list">' + branches + '</ul></div>' +
    '<div class="actions"><a class="button primary" href="' + href(chapter.id, 'questoes') + '">Praticar este capítulo</a></div>';
}

function videoLesson(chapter) {
  const { title, file, poster } = chapter.lesson;
  const media = 'media/' + e(file);
  const sources = chapter.id === 'ferias' ?
    ' · <a href="https://portal.stf.jus.br/noticias/verNoticiaDetalhe.asp?idConteudo=492245&amp;tip=UN" target="_blank" rel="noopener">STF e o julgamento da ADPF 501</a>' : '';
  return '<h2 class="section-title">' + e(title) + '</h2>' +
    '<figure class="lesson-video"><video controls playsinline preload="metadata" aria-label="' + e(title) + ' com legendas" poster="media/' + e(poster) + '">' +
    '<source src="' + media + '" type="video/mp4"><a href="' + media + '">Abrir o vídeo em MP4</a>' +
    '</video><figcaption>Professor Rafael, personagem com animação contínua, voz neural em português e legendas.</figcaption></figure>' +
    '<div class="actions"><a class="button primary" href="' + href(chapter.id, 'questoes') + '">Responder questões</a>' +
    '<a class="button" href="' + href(chapter.id) + '">Ler o capítulo</a>' +
    (data.factCases.some(item => item.chapter === chapter.id) ?
      '<a class="button" href="#fato/' + chapter.id + '">Praticar com casos</a>' : '') + '</div>' +
    '<p><a href="https://www2.camara.leg.br/legin/fed/declei/1940-1949/decreto-lei-5452-1-maio-1943-415500-normaatualizada-pe.html" target="_blank" rel="noopener">CLT</a>' + sources + '</p>';
}

function glossary(chapter) {
  const terms = [...chapter.glossary].sort((a,b) => a.term.localeCompare(b.term, 'pt-BR'));
  return '<div class="glossary"><h2 class="section-title">Glossário do capítulo</h2>' +
    '<p class="hint">Selecione um termo para ver o significado e um exemplo.</p>' +
    terms.map(({term, meaning, example}) =>
      '<details class="glossary-entry"><summary>' + e(term) + '</summary><div class="glossary-definition"><p>' +
      e(meaning) + '</p><p><strong>Exemplo</strong> ' + e(example) + '</p></div></details>').join('') + '</div>' +
    '<div class="actions"><a class="button" href="' + href(chapter.id) + '">Voltar ao conteúdo</a></div>';
}

function inlineLaw(refs) {
  if (!refs?.length) return '';
  const label = refs.map(({law, label}) => law + ', ' + label).join(' · ');
  const articles = refs.map(({law, ids, highlights, relevantOnly}) => {
    const source = data.laws[law];
    return '<section class="law-source"><h3>' + e(law) + '</h3>' + ids.map(number => {
      const marked = highlights?.[number] || {};
      const copy = source.articles[number].map((text, index) => {
        const highlight = marked[index];
        if (!highlight) return relevantOnly ? '' : '<p>' + e(text) + '</p>';
        const [kind, end] = highlight;
        return '<p><mark class="law-' + kind + '">' + e(text.slice(0, end)) + '</mark>' + e(text.slice(end)) + '</p>';
      }).join('');
      return ids.length > 4
        ? '<details class="law-article"><summary>Art. ' + e(number) + '</summary><div class="article-copy">' + copy + '</div></details>'
        : '<div class="article-copy">' + copy + '</div>';
    }).join('') + '<a href="' + e(source.url) + '" target="_blank" rel="noopener">Abrir fonte oficial de ' +
      e(law) + '</a></section>';
  }).join('');
  return '<details class="law"><summary><strong>Ver texto legal</strong><span>' + e(label) +
    '</span></summary><div class="law-copy"><div class="law-legend" aria-label="Legenda dos grifos">' +
    '<span class="law-direct">Amarelo · trecho direto</span><span class="law-related">Azul · trecho relacionado</span></div>' +
    articles + '</div></details>';
}

function shuffle(items) {
  const result = [...items];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function start(mode, chapter, level) {
  const questions = mode === 'review' ? progress.mistakes.map(id => bank.get(id)) :
    mode === 'exam' ? data.chapters.map(item => shuffle(item.questions.filter(q => q.level === level))[0]) :
    chapter.questions.filter(q => q.level === level);
  session = { mode, chapter, level, queue: shuffle(questions), step: 0, correct: 0, answered: false };
  renderQuestion();
}

function difficulty() {
  return '<div class="levels" aria-label="Nível de dificuldade">' + Object.entries(levels).map(([code,label]) =>
    '<button type="button" class="level" data-level="' + code + '" aria-pressed="' + (studyLevel === code) + '">' + label + '</button>').join('') + '</div>';
}

function renderQuestion(moveFocus = false) {
  const box = document.querySelector('#quiz');
  const question = session.queue[session.step];
  if (!question) {
    const total = session.queue.length;
    box.innerHTML = '<h2 class="section-title" tabindex="-1" id="question-focus">' +
      (total ? session.correct + ' de ' + total + ' corretas' : 'Nenhuma questão pendente') + '</h2>' +
      (total ? '<p>As respostas incorretas ficam disponíveis em Revisar erros.</p><div class="actions"><button class="button primary" id="restart">Refazer treino</button><a class="button" href="#revisao">Revisar erros</a></div>' : '');
  } else {
    session.answered = false;
    session.options = shuffle(question.options.map((text, i) => ({text, correct: i === 0})));
    const context = session.mode === 'chapter' ? levels[question.level] :
      chapters.get(question.chapter).title + ' · ' + levels[question.level];
    box.innerHTML = '<p class="quiz-meta" tabindex="-1" id="question-focus">Questão ' + (session.step + 1) + ' de ' + session.queue.length +
      ' · ' + e(context) + '</p><form id="answer"><fieldset><legend>' + e(question.text) + '</legend>' +
      session.options.map((option,i) => '<label class="option"><input type="radio" name="option" value="' + i +
        '" required><span class="option-letter" aria-hidden="true">' + String.fromCharCode(65 + i) + '.</span><span>' +
        e(option.text) + '</span></label>').join('') + '</fieldset>' +
      '<div id="feedback" class="feedback" role="status" hidden></div>' +
      '<div class="actions"><button class="button primary" type="submit">Conferir resposta</button>' +
      '<button type="button" class="button primary" id="next" hidden>' +
      (session.step + 1 === session.queue.length ? 'Ver resultado' : 'Próxima questão') + '</button></div></form>';
  }
  if (moveFocus) document.querySelector('#question-focus').focus();
}

function checkAnswer(form) {
  if (session.answered) return;
  const selected = new FormData(form).get('option');
  if (selected === null) return;
  const index = Number(selected);
  const question = session.queue[session.step];
  const correct = session.options[index].correct;
  session.answered = true;
  if (correct) {
    session.correct++;
    progress.mistakes = progress.mistakes.filter(id => id !== question.id);
  } else if (!progress.mistakes.includes(question.id)) {
    progress.mistakes.push(question.id);
  }
  save();
  form.querySelectorAll('.option').forEach((label,i) => {
    label.querySelector('input').disabled = true;
    if (session.options[i].correct) label.classList.add('correct');
    else if (i === index) label.classList.add('wrong');
  });
  const feedback = document.querySelector('#feedback');
  feedback.classList.add(correct ? 'ok' : 'err');
  feedback.innerHTML = '<strong>' + (correct ? 'Resposta correta' : 'Resposta correta · ' + e(question.options[0])) + '</strong><p>' + e(question.explanation) + '</p>';
  feedback.hidden = false;
  form.querySelector('[type=submit]').hidden = true;
  document.querySelector('#next').hidden = false;
  document.querySelector('#next').focus();
}

let factRun;

function factCatalog(chapter) {
  const available = data.factCases.filter(item => !chapter || item.chapter === chapter);
  return '<p class="hint">Em cada caso, marque o fato decisivo e responda. Depois, veja o efeito de mudar um único detalhe.</p>' +
    '<ul class="fact-catalog">' + available.map(item =>
      '<li><a href="#fato/' + item.id + '"><strong>' + e(item.title) + '</strong><span>' +
      e(chapters.get(item.chapter).title) + '</span></a></li>').join('') + '</ul>';
}

function factChoices(name, choices) {
  return choices.map(({value, text}, index) =>
    '<label class="option"><input type="radio" name="' + name + '" value="' + value + '" required>' +
    (name === 'result' ? '<span class="option-letter" aria-hidden="true">' + String.fromCharCode(65 + index) + '.</span>' : '') +
    '<span>' + e(text) + '</span></label>').join('');
}

function factQuestion() {
  const { item, round, order } = factRun;
  const facts = [...item.common, item.changed[round]];
  return '<p class="quiz-meta">Situação ' + (round + 1) + ' de 2</p><h2 class="section-title">' + e(item.question) +
    '</h2><form id="fact-answer">' +
    '<fieldset><legend id="fact-focus" tabindex="-1">Qual fato é decisivo para responder?</legend>' +
    factChoices('fact', facts.map((text, value) => ({text, value}))) + '</fieldset>' +
    '<fieldset id="fact-response" hidden disabled><legend>Escolha a resposta</legend>' +
    factChoices('result', order.map(value => ({value, text:item.options[value]}))) + '</fieldset>' +
    '<div class="actions"><button class="button primary" type="submit" hidden>Conferir situação</button></div></form>';
}

function factCorrection(form) {
  const {item, round} = factRun;
  const submission = new FormData(form);
  if (!submission.has('fact') || !submission.has('result')) return;
  const chosenFact = Number(submission.get('fact'));
  const chosenAnswer = Number(submission.get('result'));
  const factOK = chosenFact === item.common.length;
  const answerOK = chosenAnswer === item.answers[round];
  factRun.results.push({factOK,answerOK});
  const container = document.querySelector('#fact-stage');
  const summary = '<h2 class="section-title" id="fact-focus" tabindex="-1">Correção da situação ' + (round + 1) + '</h2>' +
    '<div class="fact-feedback"><p><strong>' + (factOK ? 'Você marcou o fato decisivo.' : 'Revise o fato decisivo.') +
    '</strong> ' + e(item.changed[round]) + '</p><p><strong>' +
    (answerOK ? 'Resposta correta.' : 'Você marcou ' + e(item.options[chosenAnswer])) + '</strong>' +
    (answerOK ? '' : ' A resposta correta é ' + e(item.options[item.answers[round]])) + '</p><p>' +
    e(item.explanation[round]) + '</p></div>';
  if (round === 0) {
    container.innerHTML = summary + '<div class="actions"><button type="button" class="button primary" id="fact-change">Mudar um fato</button></div>';
  } else {
    const comparison = item.changed.map((text,i) =>
      '<div class="fact-column"><h3>Situação ' + (i + 1) + '</h3><p><mark>' + e(text) + '</mark></p><p><strong>' +
      e(item.options[item.answers[i]]) + '</strong></p><p>' + e(item.explanation[i]) + '</p></div>').join('');
    const factTotal = factRun.results.filter(result => result.factOK).length;
    const answerTotal = factRun.results.filter(result => result.answerOK).length;
    container.innerHTML = summary + '<h2 class="section-title">Compare as duas situações</h2>' +
      '<p>' + (item.answers[0] === item.answers[1] ? 'O detalhe mudou, mas a resposta permaneceu a mesma.' : 'O detalhe mudou e levou a outra resposta.') +
      '</p><div class="fact-comparison">' + comparison + '</div><p><strong>' + factTotal + '/2 fatos decisivos · ' +
      answerTotal + '/2 respostas corretas</strong></p>' + inlineLaw(item.refs) +
      '<div class="actions"><a class="button primary" href="#fato/' + item.chapter + '">Escolher outro caso</a>' +
      '<button class="button" type="button" id="fact-repeat">Refazer este caso</button></div>';
  }
  document.querySelector('#fact-focus').focus();
}

function renderFact(route) {
  const item = data.factCases.find(item => item.id === route);
  const chapter = data.factCases.some(item => item.chapter === route) ? route : '';
  renderIndex(item?.chapter || chapter);
  document.title = 'E se o fato mudar? · Direito do Trabalho';
  if (!item) {
    main.innerHTML = header('E se o fato mudar?', 'Prática') + '<section class="panel">' + factCatalog(chapter) +
      (chapter ? '<div class="actions"><a class="button" href="#fato">Ver todos os casos</a></div>' : '') + '</section>';
    return;
  }
  factRun = {item, round:0, order:shuffle(item.options.map((_,i) => i)), results:[]};
  main.innerHTML = header(item.title, 'E se o fato mudar?') + '<section class="panel"><div class="quiz-box" id="fact-stage">' +
    factQuestion() + '</div><div class="actions"><a href="#fato/' + item.chapter + '">Voltar aos casos do capítulo</a></div></section>';
}

main.addEventListener('change', event => {
  if (!event.target.matches('#fact-answer [name="fact"]')) return;
  const form = event.target.form;
  const response = form.querySelector('#fact-response');
  response.hidden = false;
  response.disabled = false;
  form.querySelector('[type="submit"]').hidden = false;
});



function render() {
  const [id, requestedPanel] = location.hash.slice(1).split('/');
  if (id === 'fato') {
    renderFact(requestedPanel);
    return;
  }
  const chapter = chapters.get(id) || ((id && ['metodo','simulado','revisao','casos','gabarito','fontes-oficiais'].includes(id)) ? null : data.chapters[0]);
  renderIndex(chapter?.id);
  if (chapter) {
    const hasVideo = chapter.lesson && requestedPanel === 'video';
    const panel = hasVideo || Object.hasOwn(panels, requestedPanel) ? requestedPanel : 'leitura';
    const content = panel === 'leitura' ? reading(chapter) : panel === 'mapa' ? mentalMap(chapter) :
      panel === 'glossario' ? glossary(chapter) : panel === 'video' ? videoLesson(chapter) :
      '<h2 class="section-title">Questões do capítulo</h2>' +
        '<p class="hint">Escolha o nível. Baixo para conceitos, médio para aplicação e alto para exceções e cálculos.</p>' + difficulty() + '<div class="quiz-box" id="quiz"></div>';
    main.innerHTML = header(chapter.title, chapter.semester + 'º semestre · Capítulo ' + chapter.number, chapter, panel) + '<section class="panel">' + content + '</section>';
    if (panel === 'questoes') start('chapter', chapter, studyLevel);
    document.title = chapter.title + ' · Direito do Trabalho';
    return;
  }

  if (id === 'simulado') {
    main.innerHTML = header('Simulado dos dois semestres', 'Prática') +
      '<section class="panel"><p class="hint">Uma questão por capítulo no nível escolhido, em ordem aleatória. Confira a justificativa após cada resposta.</p>' +
      difficulty() + '<div class="quiz-box" id="quiz"></div></section>';
    start('exam', null, studyLevel);
  } else if (id === 'revisao') {
    const count = progress.mistakes.length;
    main.innerHTML = header('Revisar erros', 'Prática') + '<section class="panel">' +
      (count ? '<p class="hint">' + count + (count === 1 ? ' questão pendente' : ' questões pendentes') +
      '. Ao acertar uma questão, ela sai da revisão.</p><div class="actions"><button class="button primary" id="review">Começar revisão</button></div>' :
      '<p>Aqui aparecem as questões que você errar durante os treinos.</p><a class="button primary" href="#simulado">Fazer simulado</a>') +
      '<div class="quiz-box" id="quiz"></div></section>';
  } else {
    const extra = data.extra[id];
    const nav = '<div class="actions"><a class="button" href="#metodo">Como estudar</a><a class="button" href="#casos">Casos discursivos</a>' +
      '<a class="button" href="#gabarito">Gabarito dos casos</a><a class="button" href="#fontes-oficiais">Fontes oficiais</a></div>';
    main.innerHTML = header(extra.title, 'Apostila de estudo') + '<section class="panel"><div class="prose">' + prose(extra.body) + '</div>' + nav + '</section>';
  }
  document.title = main.querySelector('h1').textContent + ' · Direito do Trabalho';
}

main.addEventListener('submit', event => {
  if (event.target.id === 'fact-answer') {
    event.preventDefault();
    factCorrection(event.target);
    return;
  }
  if (event.target.id !== 'answer') return;
  event.preventDefault();
  checkAnswer(event.target);
});
main.addEventListener('toggle', event => {
  if (!event.target.matches('.map-branch details')) return;
  const allOpen = [...main.querySelectorAll('.map-branch details')].every(branch => branch.open);
  document.querySelector('#map-toggle').textContent = allOpen ? 'Recolher todos os exemplos' : 'Abrir todos os exemplos';
}, true);

main.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button) return;
  if (button.id === 'fact-change') {
    factRun.round = 1;
    document.querySelector('#fact-stage').innerHTML = factQuestion();
    document.querySelector('#fact-focus').focus();
  } else if (button.id === 'fact-repeat') {
    renderFact(factRun.item.id);
    document.querySelector('#fact-focus').focus();
  } else if (button.id === 'map-toggle') {
    const branches = [...main.querySelectorAll('.map-branch details')];
    const expand = branches.some(branch => !branch.open);
    branches.forEach(branch => { branch.open = expand; });
  } else if (button.dataset.level) {
    studyLevel = button.dataset.level;
    main.querySelectorAll('[data-level]').forEach(level => {
      level.setAttribute('aria-pressed', String(level.dataset.level === studyLevel));
    });
    start(session.mode, session.chapter, studyLevel);
  } else if (button.id === 'mark') {
    const { id } = chapters.get(location.hash.slice(1).split('/')[0]) || data.chapters[0];
    const read = !progress.read.includes(id);
    progress.read = read ? [...progress.read, id] : progress.read.filter(item => item !== id);
    button.setAttribute('aria-pressed', String(read));
    button.textContent = read ? '✓ Marcado como lido' : 'Marcar como lido';
    save();
  } else if (button.id === 'next') {
    session.step++;
    renderQuestion(true);
  } else if (button.id === 'review') {
    button.hidden = true;
    start('review', null, null);
    document.querySelector('#question-focus').focus();
  } else if (button.id === 'restart') {
    if (session.mode === 'review' && !progress.mistakes.length) render();
    else {
      start(session.mode, session.chapter, session.level);
      document.querySelector('#question-focus').focus();
    }
  }
});
index.open = !narrow.matches;
narrow.addEventListener('change', () => { index.open = !narrow.matches; });
list.addEventListener('click', event => {
  if (narrow.matches && event.target.closest('a')) index.open = false;
});
window.addEventListener('hashchange', () => {
  render();
  main.focus({preventScroll:true});
  window.scrollTo(0, 0);
});
render();

</script>
