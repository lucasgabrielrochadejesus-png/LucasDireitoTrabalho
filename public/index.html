":"Exemplo. No aquisitivo, houve dez faltas injustificadas e quatro ausências justificadas enquadradas no art. 131. Para a tabela, contam dez faltas, o que dá 24 dias. Com concordância do empregado, 14 + 5 + 5 respeita o limite de três períodos e os mínimos.","refs":[{"law":"CLT","ids":["130","131","134"],"label":"arts. 130, 131, 134","highlights":{"130":{"2":["direct",91],"0":["related",141],"5":["related",81],"3":["direct",95]},"131":{"0":["direct",109],"1":["direct",36],"4":["direct",118],"3":["related",160]},"134":{"1":["direct",240],"0":["related",163],"3":["related",116]}}}]},{"type":"heading","text":"Prazo de comunicação, início e abono"},{"type":"body","text":"A comunicação por escrito antecede o gozo em pelo menos 30 dias. A vedação ao início nos dois dias anteriores a feriado ou repouso semanal precisa ser verificada em cada bloco. Para o abono, conte o prazo de pedido a partir do fim do aquisitivo e calcule até um terço sobre os dias efetivamente adquiridos.","refs":[{"law":"CLT","ids":["134","135","143"],"label":"arts. 134, 135, 143","highlights":{"134":{"3":["direct",116],"0":["related",163],"1":["related",240]},"135":{"0":["direct",173],"3":["related",245]},"143":{"0":["direct",192],"1":["direct",202],"2":["related",262]}}}]},{"type":"example","text":"Exemplo. A pessoa tem 24 dias de direito por causa das faltas. O limite de abono é oito dias, e o pedido deve ser feito até 15 dias antes de terminar o aquisitivo. Para marcar o gozo, verifique a data inicial, a antecedência da comunicação e o calendário de repouso.","refs":[{"law":"CLT","ids":["130","134","135","143"],"label":"arts. 130, 134, 135, 143","highlights":{"130":{"2":["direct",91],"0":["related",141],"5":["related",81]},"134":{"3":["direct",116],"0":["related",163],"1":["related",240]},"135":{"0":["direct",173],"3":["related",245]},"143":{"0":["direct",192],"1":["direct",202],"2":["related",262]}}}]},{"type":"heading","text":"Dobra e pagamento em linhas separadas"},{"type":"body","text":"Anote primeiro as datas de gozo para identificar os dias efetivamente fora do prazo. Em outra linha, compare a data do pagamento com a antecedência de dois dias. A dobra legal é por concessão tardia, com a orientação da Súmula 81 quanto aos dias que ultrapassam o concessivo. A ADPF 501 afastou a dobra automática baseada apenas no atraso do pagamento.","refs":[{"law":"CLT","ids":["137","145"],"label":"arts. 137, 145","highlights":{"137":{"0":["direct",140],"1":["related",179]},"145":{"0":["direct",169],"1":["related",171]}}}]},{"type":"example","text":"Exemplo. Férias começam em 20 de agosto e são pagas no próprio dia. Se todos os dias foram gozados no concessivo, há atraso no pagamento, sem incidência automática da dobra do art. 137. Se oito dias avançam além do período concessivo, são esses oito que entram no cálculo da dobra.","refs":[{"law":"CLT","ids":["137","145"],"label":"arts. 137, 145","highlights":{"137":{"0":["direct",140],"1":["related",179]},"145":{"0":["direct",169],"1":["related",171]}}}]},{"type":"prompt","text":"Teste sem olhar. Uma pessoa teve 16 faltas. Pode dividir suas férias em 14 + 4? E se o empregador pagou tarde, mas concedeu no prazo?"}],"mapTitle":"Férias","citedArticles":["CF · art. 7","CLT · arts. 129, 130, 131, 133, 134, 135, 137, 143, 145"],"glossary":[{"term":"Período aquisitivo","meaning":"Intervalo em que o trabalhador adquire o direito às férias.","example":"Na regra geral, ele se completa após 12 meses de contrato."},{"term":"Período concessivo","meaning":"Prazo para o empregador conceder o descanso depois de adquirido o direito.","example":"Na regra geral, corresponde aos 12 meses seguintes ao aquisitivo."},{"term":"Gozo","meaning":"Os dias em que a pessoa efetivamente usufrui o descanso.","example":"A data de gozo e a data de pagamento são dois marcos diferentes."},{"term":"Fracionamento","meaning":"Divisão do descanso em períodos, com concordância e mínimos legais.","example":"Com 24 dias, a divisão 14 + 5 + 5 respeita os mínimos estudados."},{"term":"Abono pecuniário","meaning":"Conversão em dinheiro de até um terço dos dias a que a pessoa tem direito.","example":"Quem tem 24 dias pode pedir a conversão de até oito, observado o prazo."},{"term":"Terço constitucional","meaning":"Adicional de pelo menos um terço associado à remuneração de férias.","example":"É uma parcela a calcular além da remuneração correspondente ao descanso."},{"term":"Dobra","meaning":"Pagamento em dobro nos casos de concessão após o prazo legal, observados os dias alcançados.","example":"Se dez dias forem gozados fora do prazo, a análise da dobra recai sobre esses dez."}],"lesson":{"title":"Férias na prática","file":"ferias-rafael-continuo.mp4","poster":"ferias-rafael-continuo-capa.jpg"}},{"id":"aviso","number":10,"semester":2,"map":[["Iniciativa","Identifique quem rompeu e como","Identifique quem promove a saída. A redução da jornada do aviso trabalhado é prevista na ruptura promovida pelo empregador."],["Duração","30 dias mais proporcionalidade até 90","Com cinco anos completos, 30 + 15 = 45 dias. A proporcionalidade observa o máximo total de 90 dias."],["Trabalhado","Redução de jornada na dispensa pelo empregador","Na dispensa patronal com aviso urbano de 30 dias, a redução pode ser de duas horas por dia ou, na hipótese legal, sete dias corridos sem trabalhar."],["Indenizado","Projeção no tempo de serviço","A pessoa pode parar de trabalhar hoje e ter data de saída jurídica posterior, com reflexos conforme as datas efetivas e projetadas."],["Novo emprego","Pedido de liberação e prova","A pessoa pede liberação do aviso e comprova novo emprego. Nessa hipótese, pode cessar o dever de pagar o período restante."],["Falta grave","Examine justa causa durante o cumprimento","Improbidade comprovada durante o aviso trabalhado pode mudar a modalidade da ruptura. Examine prova e verbas já adquiridas."]],"questions":[{"id":"aviso-1","chapter":"aviso","level":"B","text":"Qual é o máximo de aviso prévio proporcional previsto pela Lei 12.506?","options":["90 dias","60 dias","120 dias","75 dias","105 dias"],"explanation":"A base é de 30 dias com acréscimo de até 60."},{"id":"aviso-2","chapter":"aviso","level":"B","text":"Qual efeito pode decorrer do aviso indenizado pelo empregador?","options":["Projeção no tempo de serviço","Eliminação automática de férias proporcionais","Conversão em justa causa","Antecipação automática da data de admissão","Exclusão obrigatória de todas as horas extras da remuneração do aviso"],"explanation":"O art. 487, § 1º, integra o período ao tempo de serviço."},{"id":"aviso-3","chapter":"aviso","level":"M","text":"Empregado dispensado com oito anos completos na mesma empresa. Qual o total?","options":["54 dias","48 dias","56 dias","51 dias","57 dias"],"explanation":"30 + 3 × 8 = 54."},{"id":"aviso-4","chapter":"aviso","level":"M","text":"Empregado urbano dispensado com aviso trabalhado de 30 dias pode escolher o quê?","options":["Redução de duas horas diárias ou ausência de sete dias corridos na hipótese ordinária","Redução de um dia sem salário","Receber o equivalente às horas e renunciar à redução como regra","Redução obrigatória de duas horas com desconto proporcional","Ausência de sete dias úteis com perda salarial"],"explanation":"O art. 488 prevê redução com preservação salarial. A Súmula 230 rejeita a mera substituição pelo pagamento."},{"id":"aviso-5","chapter":"aviso","level":"A","text":"Teresa foi dispensada e está cumprindo aviso. Apresentou uma mensagem confirmando entrevista e pediu liberação para começar em outro emprego. A empresa dispensou o restante do trabalho, mas quer deixar de pagar o período só com base nessa mensagem. A exceção da Súmula 276 ficou demonstrada?","options":["Não, falta comprovar o novo emprego","Sim, basta a alegação","Sim, basta ter recebido pagamento de dez dias","Sim, porque o pedido de liberação presume a contratação posterior","Sim, porque a dispensa do cumprimento elimina a necessidade de comprovação do novo emprego"],"explanation":"O pedido de dispensa e a comprovação do novo emprego são os fatos relevantes."},{"id":"aviso-6","chapter":"aviso","level":"A","text":"Leandro está no décimo dia de aviso trabalhado por dispensa patronal. A empresa prova que ele praticou falta grave de improbidade nesse período. Ele já tinha férias adquiridas e dias trabalhados a receber. Qual é o efeito possível da justa causa superveniente?","options":["Perda do restante do aviso e de verbas indenizatórias, preservadas parcelas adquiridas","A falta é juridicamente irrelevante","Devolução automática de todos os salários recebidos","Permanência de todo o aviso e perda somente das férias adquiridas","Perda de todo o saldo salarial anterior e manutenção integral do restante do aviso"],"explanation":"O art. 491 e a Súmula 73 tratam da falta grave no curso do aviso."},{"chapter":"aviso","level":"B","text":"Qual é o prazo-base de aviso proporcional na dispensa imotivada?","options":["30 dias","15 dias","60 dias","21 dias","45 dias"],"explanation":"A lei usa 30 dias como base e acrescenta tempo conforme os anos de serviço.","id":"aviso-7"},{"chapter":"aviso","level":"B","text":"Quantos dias se somam por ano completo na regra proporcional?","options":["Três dias","Um dia","Sete dias","Dois dias","Quatro dias"],"explanation":"A Lei 12.506 prevê acréscimo de três dias por ano, dentro do teto.","id":"aviso-8"},{"chapter":"aviso","level":"B","text":"O que caracteriza aviso trabalhado?","options":["Prestação de serviço durante o período aplicável","Pagamento em substituição a toda prestação","Conversão automática em férias","Pagamento integral em substituição a qualquer trabalho durante o aviso","Extinção no momento da comunicação, sem período de cumprimento"],"explanation":"No aviso trabalhado o contrato está em curso com prestação, observadas as reduções cabíveis.","id":"aviso-9"},{"chapter":"aviso","level":"B","text":"Qual artigo da CLT prevê redução da jornada no aviso trabalhado na ruptura pelo empregador?","options":["Art. 488","Art. 145","Art. 457","Art. 490","Art. 491"],"explanation":"O art. 488 disciplina as alternativas ligadas à redução e ao afastamento.","id":"aviso-10"},{"chapter":"aviso","level":"B","text":"Quando há projeção do aviso indenizado pelo empregador?","options":["Para efeitos legais de integração ao tempo de serviço","Apenas se houver prestação presencial","Apenas se a empresa contratar substituto","Somente para registrar o último dia em que houve prestação","Apenas para efeito de aviso trabalhado na dispensa patronal"],"explanation":"O efeito decorre do art. 487, § 1º, mesmo sem trabalho no período indenizado.","id":"aviso-11"},{"chapter":"aviso","level":"M","text":"Empregado dispensado após quatro anos completos na empresa. Qual duração geral do aviso?","options":["42 dias","34 dias","46 dias","39 dias","45 dias"],"explanation":"Quatro anos acrescentam 12 dias ao prazo-base de 30.","id":"aviso-12"},{"chapter":"aviso","level":"M","text":"Empregado pede demissão. A redução de duas horas diárias do art. 488 vale automaticamente?","options":["Não. A hipótese é ruptura promovida pelo empregador","Sim. Toda comunicação de saída gera redução","Sim, desde que o empregado tenha completado um ano","Sim, somente quando o empregado comprovar novo emprego","Não se houver aviso indenizado, mas sim em qualquer pedido de demissão com trabalho"],"explanation":"O fato decisivo é quem promoveu a rescisão, e não apenas a existência de aviso.","id":"aviso-13"},{"chapter":"aviso","level":"M","text":"No aviso trabalhado de 30 dias por dispensa patronal, o empregado escolhe faltar sete dias corridos na hipótese legal. Perde o salário desses dias?","options":["Não. A opção legal preserva o salário","Sim. São faltas injustificadas","Sim. A única opção remunerada é a redução de duas horas","Sim, salvo com autorização expressa do sindicato","Apenas os primeiros cinco dias são pagos e os dois restantes podem ser descontados"],"explanation":"O art. 488 protege a remuneração ao estabelecer as opções de redução.","id":"aviso-14"},{"chapter":"aviso","level":"M","text":"O empregador indeniza o aviso. Qual data pode ser posterior ao último dia de trabalho?","options":["Data de saída projetada","Data de admissão original","Data de comunicação que já ocorreu","Data de obtenção do primeiro emprego posterior, como marco obrigatório de saída","Data em que a empresa decidiu internamente dispensar, antes da comunicação"],"explanation":"A projeção pode adiar a data jurídica de saída em relação ao último dia trabalhado.","id":"aviso-15"},{"chapter":"aviso","level":"M","text":"O trabalhador dispensado pede liberação e prova novo emprego. O que pode ocorrer com a parte restante?","options":["Dispensa do cumprimento e cessação da obrigação de pagar o restante conforme a Súmula 276","Multa de 40% adicional pelo pedido","Mesmo pedido é considerado demissão pelo empregado em qualquer caso","A liberação mantém o pagamento integral em qualquer hipótese, mesmo com comprovação","Apenas suspender o cumprimento até o fim da experiência no novo emprego"],"explanation":"A exceção envolve pedido de liberação e a prova indicada, sem alterar automaticamente a origem da ruptura.","id":"aviso-16"},{"chapter":"aviso","level":"A","text":"Cláudio foi dispensado sem justa causa depois de 23 anos completos na mesma empresa. O RH calcula 30 dias de base e 69 de acréscimo. O sindicato lembra que o acréscimo tem limite próprio. Qual duração deve ser aplicada?","options":["90 dias","99 dias","120 dias","87 dias, porque o primeiro ano é excluído e não existe outro limite","60 dias, porque o teto do acréscimo substitui o prazo total"],"explanation":"O acréscimo está limitado a 60 dias. O total máximo é 90.","id":"aviso-17"},{"chapter":"aviso","level":"A","text":"Beatriz pede demissão após 12 anos e se desliga sem cumprir aviso. A empresa pretende descontar 66 dias, somando 30 dias e três por ano completo. Sem discutir outras hipóteses de dispensa do cumprimento, qual objeção recai sobre o uso da proporcionalidade no desconto?","options":["A proporcionalidade beneficia o empregado dispensado e não é exigível em favor do empregador","O desconto sempre deve ser de 90 dias","O pedido de demissão torna todo desconto de aviso automaticamente ilícito","A proporcionalidade vale no pedido de demissão, mas fica limitada a 60 dias no total","O desconto de 66 dias é válido sempre que a empregada tenha tomado a iniciativa por escrito"],"explanation":"É preciso distinguir a possibilidade de desconto de aviso no pedido de demissão e a proporcionalidade da Lei 12.506.","id":"aviso-18"},{"chapter":"aviso","level":"A","text":"Patrícia é dispensada com aviso trabalhado urbano de 30 dias. A empresa não reduz a jornada, nem concede os sete dias, mas paga separadamente o equivalente às horas que seriam reduzidas. O empregador alega que o pagamento satisfaz o art. 488. Qual interpretação incide?","options":["A Súmula 230 rejeita substituir a redução pelo simples pagamento","O pagamento sempre torna desnecessário reduzir a jornada","O art. 488 exige trocar todo o aviso por indenização","O pagamento substitui a redução se for feito com o adicional de 50%","A substituição é válida se a empresa registrar as horas durante o aviso"],"explanation":"O objetivo da redução é liberar tempo na jornada. Pagamento isolado não cumpre essa finalidade.","id":"aviso-19"},{"chapter":"aviso","level":"A","text":"Durante o aviso trabalhado, Marcelo aponta uma falta grave patronal comprovada que inviabilizou continuar prestando serviço. A empresa tenta usar o dispositivo que regula falta grave praticada pelo empregado. Qual artigo trata especificamente da falta patronal no curso do aviso?","options":["Art. 490 da CLT","Art. 491 da CLT como regra da falta patronal","Art. 143 da CLT","Art. 488 da CLT, porque a falta altera a jornada do aviso","Art. 487, § 2º, porque qualquer falta no aviso é tratada como desconto patronal"],"explanation":"O art. 490 trata da falta patronal. O art. 491 trata da falta grave do empregado.","id":"aviso-20"},{"chapter":"aviso","level":"A","text":"Eduardo foi dispensado com aviso trabalhado e deixou de comparecer por alguns dias. A empresa atribuiu abandono de emprego e invocou a perda das verbas indenizatórias prevista para falta grave durante o aviso. Qual cuidado específico a Súmula 73 impõe?","options":["O abandono de emprego é ressalvado na regra sumulada sobre perda das verbas indenizatórias","Abandono é sempre tratado de modo idêntico a qualquer falta durante o aviso","Qualquer ausência automaticamente prova abandono","A ressalva se aplica apenas quando a falta alegada é improbidade","A perda das verbas se presume a partir do primeiro dia de ausência, ainda sem apuração"],"explanation":"Examine a ressalva jurisprudencial e os fatos antes de generalizar os efeitos de outra falta grave.","id":"aviso-21"}],"title":"Aviso prévio","body":[{"type":"body","text":"O aviso prévio comunica a ruptura e permite que a outra parte se organize. É típico da ruptura unilateral sem justa causa em contrato por prazo indeterminado. No aviso trabalhado, o contrato segue com prestação de serviço no período aplicável. No indenizado pelo empregador, há pagamento em substituição ao trabalho, e o tempo projeta-se no contrato para efeitos legais (art. 487, § 1º). Essa projeção pode influenciar férias, 13º e a data de saída.","refs":[{"law":"CLT","ids":["487"],"label":"art. 487","highlights":{"487":{"0":["direct",169],"3":["direct",197],"2":["related",112],"4":["related",139]}}}]},{"type":"heading","text":"Duração e redução de jornada"},{"type":"body","text":"A Lei 12.506/2011 prevê 30 dias, acrescidos de três por ano completo de serviço na mesma empresa, até 90 dias no total. Com oito anos completos, 30 + 24 = 54 dias. A proporcionalidade favorece o empregado dispensado. Em pedido de demissão, o empregador pode descontar o aviso não cumprido nas condições do art. 487, § 2º, sem exigir a proporcionalidade em seu favor.","refs":[{"law":"Lei 12.506/2011","ids":["1"],"label":"art. 1","highlights":{"1":{"0":["direct",284],"1":["direct",213]}}},{"law":"CLT","ids":["487"],"label":"art. 487","highlights":{"487":{"4":["direct",139],"0":["related",169],"2":["related",112]}}}]},{"type":"body","text":"Quando o empregador dispensa o empregado urbano com aviso trabalhado, o art. 488 prevê redução de duas horas diárias, sem redução salarial, ou opção por faltar sete dias corridos na hipótese ordinária de aviso de 30 dias. A redução tem finalidade prática de facilitar a busca de trabalho. A simples substituição dessa redução por pagamento das horas correspondentes viola essa finalidade, conforme a Súmula 230 do TST.","refs":[{"law":"CLT","ids":["488"],"label":"art. 488","highlights":{"488":{"0":["direct",207],"1":["direct",376]}}}]},{"type":"heading","text":"Novo emprego e falta grave"},{"type":"body","text":"A Súmula 276 do TST prevê a irrenunciabilidade do aviso pelo empregado. Se ele pede dispensa do cumprimento e comprova novo emprego, pode cessar a obrigação de pagar o período restante. O pedido e a comprovação são fatos diferentes. Se Pedro trabalhou dez dias do aviso de 30 e comprova novo emprego ao pedir liberação, examine a exceção em relação aos 20 restantes."},{"type":"body","text":"A prática de falta grave durante o aviso pode alterar os efeitos da ruptura. Pelo art. 491 e pela Súmula 73 do TST, a justa causa superveniente durante o aviso trabalhado pode fazer perder verbas indenizatórias, com a ressalva jurisprudencial quanto ao abandono de emprego. Examine a prova da conduta e preserve parcelas já adquiridas. Se a falta grave é do empregador no período, o art. 490 disciplina remuneração do prazo e indenização pertinente.","refs":[{"law":"CLT","ids":["491","490"],"label":"arts. 491, 490","highlights":{"491":{"0":["direct",186]},"490":{"0":["direct",264]}}}]},{"type":"heading","text":"Separe duração, forma e efeitos"},{"type":"body","text":"A duração é o número de dias previsto para a hipótese. A forma pode ser trabalhada ou indenizada. A projeção é um efeito legal do período, inclusive quando o empregador o indeniza. Uma pessoa pode parar de prestar serviço hoje e ainda ter uma data de saída projetada. Para a prova, faça uma linha com comunicação, último dia trabalhado e fim projetado.","refs":[{"law":"Lei 12.506/2011","ids":["1"],"label":"art. 1","highlights":{"1":{"0":["direct",284],"1":["direct",213]}}},{"law":"CLT","ids":["487"],"label":"art. 487","highlights":{"487":{"3":["direct",197],"0":["related",169],"2":["related",112]}}}]},{"type":"example","text":"Exemplo. Dispensa de empregado com cinco anos completos na mesma empresa. A duração geral é 30 + 15, ou 45 dias. Se o empregador indeniza, a pessoa deixa de trabalhar, mas o período é integrado ao tempo de serviço. Isso pode produzir reflexos nas parcelas proporcionais conforme as datas.","refs":[{"law":"Lei 12.506/2011","ids":["1"],"label":"art. 1","highlights":{"1":{"0":["direct",284],"1":["direct",213]}}},{"law":"CLT","ids":["487"],"label":"art. 487","highlights":{"487":{"3":["direct",197],"0":["related",169],"2":["related",112]}}}]},{"type":"heading","text":"Iniciativa e alternativas durante o cumprimento"},{"type":"body","text":"A redução do art. 488 está ligada à ruptura promovida pelo empregador. Para o pedido de demissão, confira se houve cumprimento ou dispensa pelo empregador e se cabe desconto. A exceção reconhecida na Súmula 276 considera pedido do empregado acompanhado de prova de novo emprego.","refs":[{"law":"CLT","ids":["487","488"],"label":"arts. 487, 488","highlights":{"487":{"4":["direct",139],"0":["related",169],"3":["related",197]},"488":{"0":["direct",207],"1":["direct",376]}}}]},{"type":"example","text":"Exemplo. A primeira pessoa quer parar de cumprir o aviso porque tem uma proposta verbal. A segunda já obteve novo emprego, comprova a contratação e pede liberação. As duas pediram dispensa, mas apenas uma preenche no enunciado a condição de prova do novo emprego."},{"type":"body","text":"Durante aviso trabalhado o vínculo está em curso. Falta grave de qualquer das partes pode alterar os efeitos do desligamento. Confira a quem se atribui a conduta, qual hipótese legal corresponde e quais parcelas já estavam adquiridas.","refs":[{"law":"CLT","ids":["482","483","490","491"],"label":"arts. 482, 483, 490, 491","highlights":{"482":{"0":["direct",87],"1":["related",22],"8":["related",44],"9":["related",23]},"483":{"0":["direct",101],"2":["related",87],"4":["related",54]},"490":{"0":["direct",264]},"491":{"0":["direct",186]}}}]},{"type":"example","text":"Exemplo. Um gestor descobre falta grave de improbidade durante o cumprimento, documenta o ocorrido e apura a autoria. Isso exige avaliar justa causa superveniente. Se a conduta grave foi da empresa, a análise passa pelo art. 490.","refs":[{"law":"CLT","ids":["482","490","491"],"label":"arts. 482, 490, 491","highlights":{"482":{"1":["direct",22],"0":["related",87]},"490":{"0":["direct",264]},"491":{"0":["direct",186]}}}]},{"type":"prompt","text":"Teste sem olhar. Diferencie pedido de demissão, pedido de liberação do aviso por novo emprego e falta grave praticada durante o aviso."}],"mapTitle":"Aviso prévio","citedArticles":["CLT · arts. 482, 483, 487, 488, 490, 491","Lei 12.506/2011 · art. 1"],"glossary":[{"term":"Aviso trabalhado","meaning":"O contrato continua em curso com prestação de serviço durante o prazo aplicável.","example":"Na dispensa patronal, a regra estudada pode permitir redução da jornada sem perda salarial."},{"term":"Aviso indenizado","meaning":"Pagamento que substitui a prestação durante o período de aviso, na hipótese aplicável.","example":"O empregado dispensado pode parar de trabalhar e ainda ter o período integrado ao tempo de serviço."},{"term":"Projeção","meaning":"Integração do período do aviso indenizado pelo empregador ao tempo de serviço para efeitos legais.","example":"A data jurídica de saída pode ser posterior ao último dia de trabalho."},{"term":"Proporcionalidade do aviso","meaning":"Acréscimo calculado conforme o tempo de serviço, com teto legal.","example":"Com cinco anos completos, a conta estudada é 30 + 15, totalizando 45 dias."},{"term":"Dispensa de cumprimento","meaning":"Liberação da obrigação de trabalhar durante o restante do aviso em situações aplicáveis.","example":"Pedido do empregado acompanhado de prova de novo emprego pode produzir os efeitos da Súmula 276."},{"term":"Justa causa superveniente","meaning":"Falta grave que ocorre depois de o aviso já ter começado.","example":"Uma improbidade comprovada durante o aviso trabalhado pode alterar as consequências da ruptura."}],"lesson":{"title":"Aviso prévio","file":"aviso-rafael-aula.mp4","poster":"aviso-rafael-aula.jpg"}},{"id":"extincao","number":11,"semester":2,"map":[["Sem justa causa","Iniciativa patronal e verbas integrais pertinentes","A empresa dispensa sem atribuir falta grave ao trabalhador. Examine saldo, férias, 13º, aviso e indenização do FGTS conforme a regra geral."],["Justa causa","Falta grave do empregado","Se houver justa causa comprovada, preserve o que já foi adquirido, como férias adquiridas com um terço, e confira as exclusões da modalidade."],["Pedido de demissão","Iniciativa do empregado","Quem sai voluntariamente para outro trabalho, sem falta patronal, pede demissão. Confirme as proporcionais e eventual desconto de aviso."],["Rescisão indireta","Falta grave do empregador","Atrasos salariais reiterados e graves podem fundamentar rescisão indireta. Quando reconhecida, a referência é a dispensa sem justa causa."],["Acordo","Metade do aviso indenizado e multa de 20%","Num acordo, aviso indenizado de R$ 2.800 vira R$ 1.400. Base de R$ 12.000 para a indenização do FGTS gera R$ 2.400."],["Culpa recíproca","Faltas graves dos dois lados","Quando há faltas graves reconhecidas dos dois lados, a Súmula 14 prevê metade do aviso, 13º proporcional e férias proporcionais."]],"questions":[{"id":"extincao-1","chapter":"extincao","level":"B","text":"Qual modalidade decorre de falta grave do empregador?","options":["Rescisão indireta","Pedido de demissão","Culpa recíproca em qualquer caso","Culpa recíproca","Dispensa imotivada por iniciativa do empregador"],"explanation":"A rescisão indireta pressupõe hipótese do art. 483."},{"id":"extincao-2","chapter":"extincao","level":"B","text":"Qual multa do FGTS corresponde ao acordo do art. 484-A, na regra geral?","options":["20%","40%","80%","25%","10%"],"explanation":"A metade da indenização de 40% equivale a 20%. Até 80% é o limite legal de saque, instituto diferente."},{"id":"extincao-3","chapter":"extincao","level":"M","text":"Empregador atrasa reiteradamente salários. Qual medida pode ser discutida em razão do descumprimento grave?","options":["Rescisão indireta","Conversão automática do salário em parcela dobrada","Culpa recíproca sem falta do empregado","Término normal do contrato a termo","Rescisão por acordo, ainda que só o trabalhador manifeste vontade"],"explanation":"O art. 483, d, abrange descumprimento contratual grave, conforme os fatos demonstrados."},{"id":"extincao-4","chapter":"extincao","level":"M","text":"Em dispensa por justa causa, qual parcela já adquirida continua devida?","options":["Férias adquiridas com um terço","Aviso indenizado","Multa de 40% do FGTS","13º salário proporcional a vencer","Indenização rescisória de 20% sobre o FGTS"],"explanation":"A justa causa afeta verbas próprias da modalidade. Direitos já adquiridos, como férias vencidas com um terço, são preservados."},{"id":"extincao-5","chapter":"extincao","level":"A","text":"Camila e sua empregadora encerram o vínculo por acordo legítimo. O aviso indenizado integral corresponderia a R$ 3.000 e a base da indenização rescisória do FGTS é de R$ 10.000. O RH também cita o limite de saque, que não é a alíquota da multa. Quanto se paga nas duas rubricas?","options":["R$ 1.500 de aviso e R$ 2.000 de multa","R$ 3.000 de aviso e R$ 4.000 de multa","R$ 1.500 de aviso e R$ 8.000 de multa","R$ 750 de aviso e R$ 2.000 de multa","R$ 3.000 de aviso e R$ 2.000 de multa"],"explanation":"O aviso indenizado é pago pela metade e a multa corresponde a 20% da base."},{"id":"extincao-6","chapter":"extincao","level":"A","text":"A Justiça reconhece culpa recíproca na ruptura entre Priscila e a empresa. A planilha separa saldo salarial, férias já adquiridas, férias proporcionais, 13º proporcional e aviso. Quais parcelas ficam pela metade conforme a Súmula 14?","options":["Aviso, 13º proporcional e férias proporcionais","Saldo salarial e férias adquiridas","Apenas o FGTS depositado mensalmente","Saldo salarial, aviso e férias adquiridas","Aviso e 13º integral, com férias proporcionais devidas sem redução"],"explanation":"A redução se aplica às parcelas proporcionais indicadas e ao aviso. Saldo e férias adquiridas seguem sua natureza."},{"chapter":"extincao","level":"B","text":"Quem toma a iniciativa da dispensa sem justa causa?","options":["O empregador","O empregado","As duas partes necessariamente","A autoridade trabalhista, independentemente da vontade das partes","O sindicato profissional por meio de convenção coletiva"],"explanation":"A modalidade é iniciativa patronal sem falta grave do trabalhador.","id":"extincao-7"},{"chapter":"extincao","level":"B","text":"Qual artigo lista hipóteses de justa causa do empregado?","options":["Art. 482 da CLT","Art. 483 da CLT","Art. 484-A da CLT","Art. 487 da CLT","Art. 477 da CLT"],"explanation":"O art. 482 trata da justa causa do empregado. O art. 483 trata de falta do empregador.","id":"extincao-8"},{"chapter":"extincao","level":"B","text":"Qual é o limite legal de saque do FGTS no acordo do art. 484-A?","options":["Até 80%","Até 20%","Sempre 100%","Até 60%","Até 50%"],"explanation":"Até 80% é regra de saque. A indenização da modalidade corresponde a 20% da base.","id":"extincao-9"},{"chapter":"extincao","level":"B","text":"O acordo do art. 484-A habilita ao seguro-desemprego?","options":["Não","Sim, automaticamente","Sim, se o aviso tiver sido indenizado","Não, salvo se o trabalhador tiver cumprido o aviso na íntegra","Sim, quando a indenização sobre o FGTS supera 20%"],"explanation":"A própria CLT exclui a habilitação por essa modalidade.","id":"extincao-10"},{"chapter":"extincao","level":"B","text":"O que representa saldo de salário?","options":["Remuneração dos dias já trabalhados","Multa sobre FGTS","Aviso indenizado projetado","Valor de todos os salários futuros até o termo do contrato","Diferença entre a multa rescisória e os depósitos do FGTS"],"explanation":"É pagamento correspondente ao que já foi prestado no mês da saída.","id":"extincao-11"},{"chapter":"extincao","level":"M","text":"Empregada quer sair para aceitar outra proposta e não aponta falta do empregador. Que hipótese consta do enunciado?","options":["Pedido de demissão","Rescisão indireta","Dispensa patronal por justa causa","Extinção por acordo, ainda que a empresa não tenha concordado","Dispensa sem justa causa por iniciativa do novo empregador"],"explanation":"A iniciativa e o motivo identificam pedido de demissão.","id":"extincao-12"},{"chapter":"extincao","level":"M","text":"Quem é dispensado sem justa causa tem qual indenização geral sobre a base do FGTS?","options":["40%","20%","80%","30%","50%"],"explanation":"A Lei 8.036 prevê 40% na dispensa sem justa causa.","id":"extincao-13"},{"chapter":"extincao","level":"M","text":"Uma empresa propõe simular dispensa e exige devolução de parte da multa. Qual enquadramento?","options":["Simulação fraudulenta","Acordo válido pelo simples consentimento","Culpa recíproca automaticamente reconhecida","Culpa recíproca, pois ambos assinaram o documento","Dispensa sem justa causa válida somente pelo registro formal"],"explanation":"O acordo legal do art. 484-A tem efeitos próprios e não depende de simular dispensa.","id":"extincao-14"},{"chapter":"extincao","level":"M","text":"Um trabalhador viola regra geral de segurança aplicável à equipe. Qual classificação inicial deve ser examinada?","options":["Indisciplina, conforme gravidade, prova e demais requisitos","Insubordinação apenas porque existe uma regra geral","Pedido de demissão","Improbidade, por qualquer desrespeito a regra geral","Desídia necessariamente, ainda que seja uma única ocorrência sem negligência"],"explanation":"A distinção usual relaciona indisciplina à regra geral e insubordinação à ordem individual legítima.","id":"extincao-15"},{"chapter":"extincao","level":"M","text":"No acordo, o aviso é trabalhado. A regra “por metade” do art. 484-A aplica-se ao aviso trabalhado como se fosse indenizado?","options":["Não. A previsão específica se refere ao aviso se indenizado","Sim. A lei manda pagar metade de todo trabalho prestado","Sim. Também reduz toda verba adquirida pela metade","Sim, porque metade da remuneração do período é convertida em FGTS","Não, mas toda parcela rescisória proporcional fica reduzida à metade"],"explanation":"O inciso I, a, indica expressamente o aviso prévio se indenizado.","id":"extincao-16"},{"chapter":"extincao","level":"A","text":"Aline e o empregador tentam negociar uma saída, mas não chegam a acordo. Depois, na reclamação, ficam reconhecidas faltas graves de ambos que determinaram a ruptura. O contador equipara as hipóteses porque ambas podem ter multa de 20% do FGTS. Qual diferença de pressupostos permanece?","options":["Culpa recíproca depende das faltas reconhecidas, enquanto o acordo nasce do consentimento bilateral","Ambas precisam das mesmas faltas graves","Acordo só existe se um juiz reconhecer culpa recíproca","A coincidência na multa torna o acordo uma forma de culpa recíproca sempre que as partes divergem","A culpa recíproca pode ser declarada pelo acordo posterior sem prova das faltas"],"explanation":"A coincidência de certos percentuais não iguala os pressupostos das figuras.","id":"extincao-17"},{"chapter":"extincao","level":"A","text":"Mário encerra o contrato de comum acordo. O valor integral do aviso indenizado seria R$ 4.200. A base da indenização do FGTS é R$ 18.000, e a empresa confunde alíquota de indenização com limite de saque. Quais valores correspondem à multa e ao aviso, respectivamente?","options":["R$ 3.600 de multa e R$ 2.100 de aviso","R$ 7.200 de multa e R$ 4.200 de aviso","R$ 14.400 de multa e R$ 2.100 de aviso","R$ 3.600 de multa e R$ 4.200 de aviso","R$ 7.200 de multa e R$ 2.100 de aviso"],"explanation":"A regra aplica 20% à base da multa e metade ao aviso indenizado.","id":"extincao-18"},{"chapter":"extincao","level":"A","text":"Luciana deixa o trabalho depois de atrasos salariais graves e reiterados. A Justiça reconhece rescisão indireta por descumprimento patronal. A empresa sustenta que, por ter sido Luciana quem pediu a ruptura, deve pagar só as parcelas de pedido de demissão. Qual regime de verbas é a referência?","options":["O da dispensa sem justa causa, em regra","O do pedido de demissão, porque foi o empregado que procurou a Justiça","O da justa causa do empregado, porque houve falta grave","O do acordo bilateral, ainda que a empresa não tenha consentido","O da culpa recíproca, porque a iniciativa processual da empregada equivale a falta grave"],"explanation":"O autor da falta é o empregador. A iniciativa processual do trabalhador não converte a modalidade em pedido de demissão.","id":"extincao-19"},{"chapter":"extincao","level":"A","text":"Rodrigo já tinha férias integralmente adquiridas e dias trabalhados a receber quando foi dispensado por justa causa comprovada. A empresa lança a perda do aviso e das férias adquiridas como se ambas dependessem da modalidade. Qual par distingue corretamente as parcelas?","options":["Férias adquiridas com um terço permanecem e aviso indenizado não é devido","Férias adquiridas e aviso são sempre ambos devidos","Férias adquiridas se perdem e o aviso é pago em dobro","Férias adquiridas sem o terço e aviso indenizado de 30 dias","Apenas férias proporcionais com um terço, com perda das adquiridas"],"explanation":"A justa causa altera parcelas rescisórias típicas e preserva direitos já adquiridos.","id":"extincao-20"},{"chapter":"extincao","level":"A","text":"Em processo de Viviane, o juiz reconhece culpa recíproca. A base da multa do FGTS é R$ 8.000 e o aviso integral corresponderia a R$ 2.400. A defesa apresenta uma planilha com os percentuais da dispensa sem justa causa. Quais valores correspondem, respectivamente, à multa e ao aviso pela regra estudada?","options":["R$ 1.600 e R$ 1.200","R$ 3.200 e R$ 2.400","R$ 6.400 e R$ 1.200","R$ 1.600 e R$ 2.400","R$ 3.200 e R$ 1.200"],"explanation":"A multa de culpa recíproca é de 20% e a Súmula 14 reduz o aviso à metade.","id":"extincao-21"}],"title":"Modalidades de extinção do contrato","body":[{"type":"body","text":"Antes de listar verbas, identifique o tipo de contrato, quem iniciou a ruptura, se havia motivo jurídico e se o prazo chegou ao fim. O saldo de salário paga dias já trabalhados. Férias adquiridas com um terço são parcelas de direito já formado, inclusive em justa causa. Férias e 13º proporcionais correspondem a frações do período e dependem da modalidade e da disciplina aplicável."},{"type":"heading","text":"Contrato por prazo indeterminado"},{"type":"bullet","text":"Dispensa sem justa causa. Iniciativa do empregador. Em regra, inclui saldo, férias adquiridas e proporcionais com um terço, 13º proporcional, aviso, multa de 40% do FGTS e saque conforme o regime legal. Seguro-desemprego depende de requisitos próprios.","refs":[{"law":"Lei 8.036/1990","ids":["18"],"label":"art. 18","highlights":{"18":{"1":["direct",332],"0":["related",319],"2":["related",166]}}}]},{"type":"bullet","text":"Justa causa. Falta grave do empregado enquadrada no art. 482, como improbidade, desídia ou insubordinação. No regime geral cobrado nos simulados, preservam-se saldo e férias adquiridas com um terço. Aviso, 13º proporcional, multa e saque rescisório do FGTS ficam excluídos. Para férias proporcionais, estude a regra clássica da Súmula 171 e confira eventual orientação específica da professora sobre decisões que discutem a Convenção 132 da OIT.","refs":[{"law":"CLT","ids":["482"],"label":"art. 482","highlights":{"482":{"0":["direct",87],"1":["direct",22],"5":["direct",49],"8":["direct",44]}}}]},{"type":"bullet","text":"Pedido de demissão. Iniciativa do empregado. Em regra, saldo, férias adquiridas e proporcionais com um terço e 13º proporcional. Pode haver desconto de aviso não cumprido. A modalidade não gera multa do FGTS, autorização de saque rescisório ou seguro-desemprego.","refs":[{"law":"CLT","ids":["487"],"label":"art. 487","highlights":{"487":{"4":["direct",139],"0":["related",169],"2":["related",112]}}}]},{"type":"bullet","text":"Rescisão indireta. Falta grave do empregador, nas hipóteses do art. 483, como descumprimento contratual grave. Quando reconhecida, produz em regra as verbas da dispensa sem justa causa. Atrasos reiterados de salário são um exemplo a analisar conforme a prova.","refs":[{"law":"CLT","ids":["483"],"label":"art. 483","highlights":{"483":{"0":["direct",101],"4":["direct",54],"10":["related",209]}}}]},{"type":"bullet","text":"Acordo do art. 484-A. As duas partes consentem. Metade do aviso se indenizado. A indenização do FGTS cai de 40% para 20%. As demais verbas são integrais, com saque de até 80% nos termos legais e sem seguro-desemprego. Simular dispensa para receber benefício e devolver multa constitui fraude.","refs":[{"law":"CLT","ids":["484-A"],"label":"art. 484-A","highlights":{"484-A":{"0":["direct",154],"1":["direct",15],"2":["direct",35],"3":["direct",140],"4":["direct",53],"5":["direct",291],"6":["direct",127]}}}]},{"type":"bullet","text":"Culpa recíproca. Depende de faltas graves de ambos os lados reconhecidas no caso. A Súmula 14 prevê 50% do aviso, 13º e férias proporcionais. A multa do FGTS é de 20%, observados os requisitos legais. Saldo e férias já adquiridas preservam sua natureza.","refs":[{"law":"CLT","ids":["484"],"label":"art. 484","highlights":{"484":{"0":["direct",210]}}},{"law":"Lei 8.036/1990","ids":["18"],"label":"art. 18","highlights":{"18":{"2":["direct",166],"0":["related",319],"1":["related",332]}}}]},{"type":"heading","text":"Comece pela iniciativa e pelo motivo"},{"type":"body","text":"A mesma saída física da empresa pode decorrer de regimes diversos. Desligamento sem motivação pelo empregador, pedido de demissão e acordo bilateral têm iniciativas diferentes. Justa causa e rescisão indireta exigem falta grave. Culpa recíproca exige fatos graves de ambos os lados e reconhecimento no caso.","refs":[{"law":"CLT","ids":["482","483","484","484-A"],"label":"arts. 482, 483, 484, 484-A","highlights":{"482":{"0":["direct",87],"1":["related",22],"5":["related",49],"8":["related",44]},"483":{"0":["direct",101],"2":["related",87],"4":["related",54]},"484":{"0":["direct",210]},"484-A":{"0":["direct",154],"1":["related",15],"2":["related",35],"3":["related",140],"4":["related",53]}}}]},{"type":"example","text":"Exemplo. Uma empregada pede saída para aceitar outra proposta, depois de receber tudo regularmente. Isso aponta para pedido de demissão. Se ela sai porque sofreu reiterados atrasos salariais graves e pede reconhecimento dessa falta, a figura discutida é rescisão indireta. O fato decisivo é a causa da ruptura.","refs":[{"law":"CLT","ids":["483"],"label":"art. 483","highlights":{"483":{"0":["direct",101],"4":["direct",54],"10":["related",209]}}}]},{"type":"heading","text":"Calcule as verbas por camada"},{"type":"body","text":"Primeiro, registre o que já foi adquirido, como salário de dias trabalhados e férias adquiridas. Depois, apure parcelas proporcionais, aviso e FGTS de acordo com a modalidade. Saldo de FGTS, multa rescisória, possibilidade de saque e seguro-desemprego são itens distintos. Verbos como depositar, pagar e sacar indicam obrigações ou direitos diferentes.","refs":[{"law":"CLT","ids":["477","484-A"],"label":"arts. 477, 484-A","highlights":{"477":{"0":["direct",270],"2":["direct",277],"8":["related",285]},"484-A":{"0":["direct",154],"1":["direct",15],"2":["direct",35],"3":["direct",140],"4":["direct",53],"5":["direct",291],"6":["direct",127]}}},{"law":"Lei 8.036/1990","ids":["15","18"],"label":"arts. 15, 18","highlights":{"15":{"0":["direct",516],"5":["related",170]},"18":{"0":["direct",319],"1":["direct",332],"2":["related",166]}}}]},{"type":"example","text":"Exemplo. Em acordo, suponha R$ 2.800 de aviso indenizado e base de R$ 12.000 para a multa de FGTS. O aviso pago é R$ 1.400 e a multa R$ 2.400. O percentual de saque de até 80% segue outra base e o acordo não habilita o recebimento do seguro-desemprego.","refs":[{"law":"CLT","ids":["484-A"],"label":"art. 484-A","highlights":{"484-A":{"0":["direct",154],"1":["direct",15],"2":["direct",35],"3":["direct",140],"5":["direct",291],"6":["direct",127],"4":["related",53]}}},{"law":"Lei 8.036/1990","ids":["18"],"label":"art. 18","highlights":{"18":{"1":["direct",332],"0":["related",319],"2":["related",166]}}}]},{"type":"heading","text":"Identifique a falta com precisão"},{"type":"body","text":"O art. 482 enumera hipóteses de justa causa. Insubordinação é descumprimento de ordem individual legítima. Indisciplina envolve desrespeito a regra geral. Desídia liga-se a negligência na prestação. O art. 483 trata, entre outros casos, de rigor excessivo, perigo manifesto e descumprimento contratual grave pelo empregador. Examine prova, gravidade, proporcionalidade e efeitos.","refs":[{"law":"CLT","ids":["482","483"],"label":"arts. 482, 483","highlights":{"482":{"0":["direct",87],"5":["direct",49],"8":["direct",44],"1":["related",22]},"483":{"0":["direct",101],"2":["direct",87],"3":["direct",47],"4":["direct",54],"5":["related",113],"10":["related",209]}}}]},{"type":"example","text":"Exemplo. Desobedecer ordem individual legítima e violar uma regra geral de segurança podem dar enquadramentos diferentes. Já humilhar reiteradamente um trabalhador diante de colegas pode apontar falta patronal, conforme os fatos e a prova.","refs":[{"law":"CLT","ids":["482","483"],"label":"arts. 482, 483","highlights":{"482":{"8":["direct",44],"0":["related",87]},"483":{"2":["direct",87],"5":["direct",113],"0":["related",101],"4":["related",54]}}}]},{"type":"prompt","text":"Teste sem olhar. Que fatos distinguem um acordo legal, a culpa recíproca e uma dispensa simulada? Em quais hipóteses aparece multa de 20%?"}],"mapTitle":"Formas de desligamento","citedArticles":["Lei 8.036/1990 · arts. 15, 18","CLT · arts. 477, 482, 483, 484, 484-A, 487"],"glossary":[{"term":"Saldo de salário","meaning":"Valor dos dias já trabalhados no período que ainda não foram pagos.","example":"Calcule o saldo antes de analisar multa, aviso e parcelas proporcionais."},{"term":"Justa causa","meaning":"Ruptura motivada por falta grave atribuída ao empregado e enquadrada na lei.","example":"Uma acusação de improbidade exige prova e análise dos demais requisitos."},{"term":"Rescisão indireta","meaning":"Ruptura que a pessoa empregada pede em razão de falta grave patronal.","example":"Atrasos salariais reiterados podem fundamentar o pedido, conforme as provas."},{"term":"Culpa recíproca","meaning":"Faltas graves dos dois lados que determinam a ruptura e são reconhecidas no caso.","example":"Podem ser reduzidas parcelas como aviso e proporcionais nos termos da regra estudada."},{"term":"Extinção por acordo","meaning":"Ruptura bilateral com efeitos definidos na CLT.","example":"O aviso, se indenizado, é pago pela metade e a indenização rescisória do FGTS segue regra específica."},{"term":"Verbas proporcionais","meaning":"Parcelas que são calculadas em frações do período correspondente.","example":"Distinga férias proporcionais de férias cujo direito já foi adquirido."},{"term":"Desídia","meaning":"Negligência no desempenho das funções, avaliada segundo os fatos e sua gravidade.","example":"Reiteração de faltas leves exige análise de prova, gradação quando cabível e proporcionalidade."}],"lesson":{"title":"Extinção do contrato","file":"extincao-rafael-aula.mp4","poster":"extincao-rafael-aula.jpg"}},{"id":"verbas","number":12,"semester":2,"map":[["Término normal","Contrato chega ao termo ajustado","O contrato de experiência chega ao fim na data pactuada. O simples vencimento do termo, em regra, não gera aviso nem indenização por ruptura antecipada."],["Art. 479","Ruptura patronal antecipada e metade do restante","Dispensa antecipada pelo empregador sem justa causa, na regra geral, com três meses restantes de R$ 2.400: a indenização é R$ 3.600."],["Art. 480","Prejuízo provado com teto","Se o empregado sai nas mesmas condições e o prejuízo demonstrado é de R$ 1.500, o teto de R$ 3.600 não vira dívida automática."],["Art. 481","Cláusula recíproca exercida","Se as partes podem romper antes do termo e a cláusula é exercida, entram os princípios de rescisão do contrato por prazo indeterminado."],["Art. 477","Dez dias para quitação e documentos","Conte dez dias do fim do contrato para pagamento e entrega de documentos. A multa por mora usa o salário como referência, observadas as condições."],["Art. 467","Acréscimo judicial sobre a parte incontroversa","Se ficam sem pagamento R$ 2.600 incontroversos no comparecimento à Justiça, o acréscimo é R$ 1.300. Separe parcelas realmente controvertidas."]],"questions":[{"id":"verbas-1","chapter":"verbas","level":"B","text":"Qual é o prazo geral do art. 477, § 6º?","options":["Dez dias contados do término do contrato","Cinco dias úteis contados da audiência","30 dias contados da comunicação","Dez dias úteis contados da homologação","Dez dias contados da primeira audiência"],"explanation":"O prazo se refere ao pagamento e à entrega dos documentos rescisórios."},{"id":"verbas-2","chapter":"verbas","level":"B","text":"Qual percentual o art. 467 aplica à parte incontroversa na hipótese legal?","options":["50%","40%","20%","25%","80%"],"explanation":"O acréscimo incide sobre verbas rescisórias incontroversas não pagas na oportunidade do comparecimento."},{"id":"verbas-3","chapter":"verbas","level":"M","text":"Contrato a termo com remuneração restante de R$ 12.000. Se o empregador dispensa antes do termo sem justa causa, sem cláusula assecuratória, qual a indenização do art. 479?","options":["R$ 6.000","R$ 12.000","R$ 2.000","R$ 3.000","R$ 9.000"],"explanation":"A indenização legal corresponde à metade da remuneração que seria devida até o termo."},{"id":"verbas-4","chapter":"verbas","level":"M","text":"Há R$ 4.000 incontroversos e R$ 3.000 efetivamente controvertidos. Qual o acréscimo do art. 467 se a parte reconhecida não for paga no momento legal?","options":["R$ 2.000","R$ 3.500","R$ 4.000","R$ 1.500","R$ 5.500"],"explanation":"Aplica-se o percentual de 50% sobre a base incontroversa de R$ 4.000."},{"id":"verbas-5","chapter":"verbas","level":"A","text":"Edson encerra antecipadamente contrato a termo sem cláusula assecuratória. Restavam R$ 12.000 de remuneração e a empresa comprova prejuízo de R$ 8.000. Ela pede os R$ 8.000 na íntegra. Qual limite legal incide nessa hipótese?","options":["R$ 6.000","R$ 8.000","R$ 12.000","R$ 4.000","R$ 10.000"],"explanation":"O art. 480 limita a indenização ao equivalente do art. 479, metade da remuneração restante."},{"id":"verbas-6","chapter":"verbas","level":"A","text":"Jéssica tem contrato a termo com cláusula que faculta a ambas as partes a ruptura antecipada. A empresa exerce expressamente essa cláusula antes da data final, sem justa causa. Jéssica cobra automaticamente metade do tempo restante pelo art. 479. Que regime deve orientar a análise?","options":["Princípios da rescisão de contrato por prazo indeterminado","Indenização do art. 479 em toda hipótese","Regime do estágio","Aplicação cumulativa obrigatória da metade do restante e do regime de prazo indeterminado","Regra do art. 480, porque a cláusula serve apenas ao empregado"],"explanation":"O art. 481 remete ao regime de rescisão do contrato indeterminado se a cláusula recíproca for exercida."},{"chapter":"verbas","level":"B","text":"Qual artigo trata da dispensa patronal antecipada sem justa causa em contrato a termo na hipótese geral?","options":["Art. 479","Art. 480","Art. 488","Art. 481","Art. 484-A"],"explanation":"O art. 479 cuida da iniciativa do empregador. O art. 480 trata da saída antecipada pelo empregado.","id":"verbas-7"},{"chapter":"verbas","level":"B","text":"Qual efeito é típico do término normal do contrato a termo quanto ao aviso?","options":["Em regra, o mero vencimento do termo não gera aviso prévio","Sempre gera 90 dias de aviso","Sempre gera multa do art. 467","Gera pagamento de aviso proporcional somente quando há cláusula nunca exercida","Gera indenização equivalente a metade do prazo já cumprido"],"explanation":"No término normal, o prazo ajustado se completa. Aviso e outras verbas dependem da modalidade.","id":"verbas-8"},{"chapter":"verbas","level":"B","text":"Em que momento o art. 467 exige pagar a parte incontroversa?","options":["No comparecimento à Justiça do Trabalho, na hipótese legal","Sempre no 15º dia do mês seguinte","Ao comunicar a admissão","Em até dois dias antes do término do contrato","Depois do trânsito em julgado, mesmo quanto à parcela admitida desde a audiência"],"explanation":"A obrigação se dá no contexto da controvérsia judicial rescisória.","id":"verbas-9"},{"chapter":"verbas","level":"B","text":"Qual artigo prevê multa pela mora na quitação rescisória na regra trabalhista?","options":["Art. 477, § 8º","Art. 445, parágrafo único","Art. 134, § 3º","Art. 467, sobre comparecimento à Justiça","Art. 479, sobre ruptura antecipada pelo empregador"],"explanation":"O art. 477 disciplina prazo, documentos e multa.","id":"verbas-10"},{"chapter":"verbas","level":"B","text":"Qual fato deve ser demonstrado para indenização do empregador no art. 480?","options":["Prejuízo resultante da saída antecipada do empregado","Existência de férias durante todo o contrato","Aplicação de redução de jornada no aviso","Duração do contrato dentro do máximo de dois anos, sem relação com o dano","Existência de cláusula de prorrogação, ainda que nunca usada"],"explanation":"A saída antecipada pelo empregado não torna automaticamente devida metade de todo o restante.","id":"verbas-11"},{"chapter":"verbas","level":"M","text":"Restam três meses de contrato a R$ 2.400, sem cláusula assecuratória. O empregador dispensa antes do termo sem justa causa. Quanto dá a indenização específica?","options":["R$ 3.600","R$ 7.200","R$ 2.400","R$ 4.800","R$ 1.800"],"explanation":"Três meses equivalem a R$ 7.200 e a metade é R$ 3.600.","id":"verbas-12"},{"chapter":"verbas","level":"M","text":"No comparecimento judicial, a empresa deixa R$ 2.400 incontroversos sem pagar e contesta R$ 1.200. Qual acréscimo do art. 467?","options":["R$ 1.200","R$ 1.800","R$ 2.400","R$ 600","R$ 3.000"],"explanation":"A base é apenas a parte incontroversa de R$ 2.400.","id":"verbas-13"},{"chapter":"verbas","level":"M","text":"A empresa paga fora do prazo legal, sem mora causada pelo empregado. Qual artigo trata diretamente da multa por atraso?","options":["Art. 477","Art. 467 ainda sem litígio","Art. 452-A","Art. 479","Art. 484"],"explanation":"O art. 477 é examinado a partir da quitação e da entrega de documentos. O art. 467 tem fato judicial próprio.","id":"verbas-14"},{"chapter":"verbas","level":"M","text":"O contrato a termo chega à data final ajustada. Há indenização automática do art. 479?","options":["Não. O art. 479 pressupõe ruptura antecipada pelo empregador na hipótese legal","Sim. Todo contrato por prazo determinado exige essa indenização","Sim. O termo final é equiparado à saída antecipada","Não, mas o art. 479 seria devido se o trabalhador tivesse recebido aviso antes da data final","Sim, se o contrato foi prorrogado uma única vez e cumprido até o termo"],"explanation":"Compare a data de encerramento efetiva com o termo pactuado.","id":"verbas-15"},{"chapter":"verbas","level":"M","text":"Um empregado sai antes do termo, sem cláusula assecuratória e sem prejuízo demonstrado. Cabe valor automático pelo art. 480?","options":["Não. É necessária demonstração de prejuízo","Sim. O valor é sempre metade do restante","Sim. O valor é sempre 40% do saldo do FGTS","Sim, mas só no valor de um salário, independentemente do restante","Não, porque o art. 480 nunca pode ser aplicado a saída por iniciativa do empregado"],"explanation":"Metade do restante funciona como teto da indenização, e não como valor automático.","id":"verbas-16"},{"chapter":"verbas","level":"A","text":"Gilberto sai antecipadamente de um contrato a termo sem cláusula assecuratória. Até o fim, receberia R$ 10.000. O empregador demonstra prejuízo de R$ 1.700 e cobra R$ 5.000 alegando que esse é o teto. Qual valor resulta da comparação entre prejuízo e limite?","options":["R$ 1.700","R$ 5.000","R$ 10.000","R$ 3.300, pela diferença entre o teto e o prejuízo","R$ 850, porque o prejuízo comprovado também deve ser dividido pela metade"],"explanation":"O teto é R$ 5.000. O prejuízo comprovado ficou abaixo dele.","id":"verbas-17"},{"chapter":"verbas","level":"A","text":"O contrato a termo de Denise contém cláusula assecuratória recíproca, mas as partes trabalham até o último dia pactuado, sem manifestação de ruptura antecipada. A empresa sustenta que a mera presença da cláusula converte toda saída em rescisão por prazo indeterminado. Qual enquadramento é compatível com o que ocorreu?","options":["Término normal, pois a cláusula não foi exercida","Extinção de prazo indeterminado em qualquer caso","Ruptura antecipada pelo empregado","Rescisão de prazo indeterminado, porque a cláusula foi assinada na admissão","Ruptura antecipada pelo empregador, porque a empresa não prorrogou o ajuste"],"explanation":"O art. 481 exige exercício da cláusula antes do término para aplicar as regras do vínculo indeterminado.","id":"verbas-18"},{"chapter":"verbas","level":"A","text":"Cleiton cobra a multa do art. 477 pelo atraso na quitação. Na situação descrita, a empresa prova que o próprio trabalhador deu causa à mora. Ela não discute o valor das verbas, apenas a penalidade. Qual ressalva específica deve ser examinada?","options":["Exceção do art. 477, § 8º, para mora causada pelo trabalhador","Multa irrevogável de 50% do art. 467 desde a saída","Aviso proporcional em dobro","A entrega posterior de documentos extingue a mora em qualquer hipótese, mesmo sem prova sobre sua causa","A multa permanece devida sempre que a empresa reconhecer os valores principais"],"explanation":"A exceção está expressa na multa do art. 477, e exige prova da mora atribuível ao trabalhador.","id":"verbas-19"},{"chapter":"verbas","level":"A","text":"Sara ganhava R$ 3.200. A empresa atrasou a quitação sem causa imputável a ela e compareceu à Justiça sem pagar R$ 1.800 incontroversos. Outros valores são discutidos. Considerando satisfeitos os demais requisitos, quais valores correspondem à multa do art. 477 e ao acréscimo do art. 467?","options":["R$ 3.200 e R$ 900, respectivamente.","R$ 900 e R$ 900.","R$ 3.200 e R$ 3.200.","R$ 1.800 e R$ 1.600","R$ 3.200 e R$ 1.800"],"explanation":"Um toma o salário como referência. O outro aplica 50% sobre as parcelas incontroversas inadimplidas no momento legal.","id":"verbas-20"},{"chapter":"verbas","level":"A","text":"A empresa pagou no prazo as parcelas que reconhecia dever a Caio. Na audiência, ele pede diferenças, mas a ré contesta efetivamente todos os valores restantes e não há parte admitida e não paga. Qual é a análise da incidência do art. 467 sobre essas diferenças?","options":["Não. A norma exige parte incontroversa não paga na ocasião legal","Sim. Basta existir processo judicial","Sim. Incide sobre o total pedido pelo empregado","O acréscimo incide sobre toda diferença depois reconhecida em sentença, ainda que fosse controvertida na audiência","A mera apresentação de contestação produz o acréscimo sobre o saldo já quitado"],"explanation":"A lide por si só não demonstra o fato gerador do acréscimo.","id":"verbas-21"},{"id":"verbas-22","chapter":"verbas","level":"B","text":"O prazo bienal geral para ajuizar reclamação trabalhista após o fim do contrato conta de qual marco?","options":["Da extinção do contrato.","Da admissão.","Da data da primeira parcela devida.","Da data de assinatura da convenção coletiva.","Da data do trânsito em julgado da reclamação."],"explanation":"A prescrição bienal limita o ajuizamento depois da extinção do vínculo."},{"id":"verbas-23","chapter":"verbas","level":"M","text":"Qual é, em regra, o marco para contar a janela quinquenal de créditos para trás?","options":["A data de ajuizamento da ação.","A data em que o contrato começou.","Sempre a data da extinção do contrato.","Da data de recebimento da notificação pelo empregador.","Da data da primeira audiência, independentemente do protocolo."],"explanation":"O quinquênio limita os créditos alcançáveis e se mede para trás a partir da ação."},{"id":"verbas-24","chapter":"verbas","level":"A","text":"Cristina ajuizou ação pedindo apenas horas extras, extinta sem resolução do mérito. Na nova ação, repete o pedido de horas extras e acrescenta adicional noturno por fatos do mesmo vínculo. A empresa discute prescrição. Que comparação deve ser feita para identificar os efeitos interruptivos?","options":["A identidade dos pedidos. Um pedido distinto não fica automaticamente abrangido.","A interrupção vale para todo pedido de qualquer capítulo da CLT.","A extinção sem mérito impede sempre a interrupção.","A interrupção alcança qualquer parcela ligada ao mesmo contrato, mesmo que não tenha sido pedida antes.","A interrupção só alcança o pedido novo, porque o anterior foi extinto."],"explanation":"O § 3º do art. 11 restringe os efeitos interruptivos aos pedidos idênticos."},{"id":"verbas-25","chapter":"verbas","level":"A","text":"Já na execução, Vagner deixa de cumprir uma determinação judicial que lhe cabia como exequente. A empresa conta o prazo da extinção do vínculo; Vagner conta do ajuizamento da ação. Qual prescrição tem marco específico no descumprimento indicado?","options":["A intercorrente, com prazo de dois anos a partir do descumprimento nos termos do art. 11-A.","A bienal contada do fim do contrato, que recomeça sempre na execução.","A quinquenal contada da admissão.","Prescrição quinquenal que limita créditos do processo de conhecimento.","Prescrição bienal de ajuizamento, contada da data do despacho de liquidação."],"explanation":"O marco da prescrição intercorrente é próprio e ocorre no curso da execução."}],"title":"Rescisão antecipada e pagamento das verbas","body":[{"type":"heading","text":"Contrato com termo final"},{"type":"body","text":"No término normal do contrato a termo, em regra, há saldo, férias proporcionais com um terço e 13º proporcional, com saque do FGTS quando autorizado. A chegada do termo por si só não gera aviso prévio nem multa rescisória de 40%. Se houver ruptura antecipada, identifique a iniciativa e veja se existe cláusula assecuratória de rescisão recíproca."},{"type":"body","text":"Pelo art. 479, se o empregador dispensa o empregado sem justa causa antes do termo nas condições da regra geral, a indenização é de metade da remuneração que o empregado receberia até o final. Pelo art. 480, na saída antecipada pelo empregado, o empregador deve demonstrar os prejuízos e a indenização fica limitada ao equivalente que seria devido pelo art. 479. Se restam quatro meses a R$ 3.000, a remuneração restante é R$ 12.000. Metade equivale a R$ 6.000. Na iniciativa do empregado, R$ 6.000 é o teto do exemplo. Se o prejuízo provado for R$ 2.000, esse é o valor considerado. Se a cláusula assecuratória for exercida, o art. 481 remete às regras de rescisão dos contratos por prazo indeterminado.","refs":[{"law":"CLT","ids":["479","480","481"],"label":"arts. 479, 480, 481","highlights":{"479":{"0":["direct",234],"1":["related",244]},"480":{"0":["direct",195],"1":["direct",187]},"481":{"0":["direct",295]}}}]},{"type":"heading","text":"Compare os arts. 467 e 477","refs":[{"law":"CLT","ids":["467","477"],"label":"arts. 467, 477","highlights":{"467":{"0":["direct",305]},"477":{"8":["direct",285],"0":["related",270],"12":["related",319]}}}]},{"type":"body","text":"O art. 477, § 6º, fixa o prazo geral de dez dias contados do término do contrato para pagar as verbas e entregar os documentos rescisórios. O § 8º prevê multa em favor do empregado em valor equivalente ao salário, ressalvada a mora comprovadamente causada pelo trabalhador.","refs":[{"law":"CLT","ids":["477"],"label":"art. 477","highlights":{"477":{"8":["direct",285],"12":["direct",319],"0":["related",270],"2":["related",277]}}}]},{"type":"body","text":"O art. 467 opera quando existe controvérsia judicial sobre o montante das verbas rescisórias. A parte incontroversa deve ser paga quando o empregador comparece à Justiça do Trabalho, sob acréscimo de 50% sobre essa parte. Exemplo. R$ 4.000 são reconhecidos e ficaram sem pagamento na oportunidade legal. O acréscimo é R$ 2.000. Outros R$ 3.000 efetivamente controvertidos não entram automaticamente nessa conta. A multa por atraso na quitação e o acréscimo processual têm fatos geradores próprios.","refs":[{"law":"CLT","ids":["467"],"label":"art. 467","highlights":{"467":{"0":["direct",305]}}}]},{"type":"heading","text":"Desenhe a saída no contrato a termo"},{"type":"body","text":"Coloque três marcos na linha do tempo: admissão, saída e fim originalmente previsto. Se saída e termo coincidem, examine o término normal. Se a saída é anterior, procure cláusula assecuratória e a parte que tomou a iniciativa. Separe as parcelas normais da eventual indenização específica pela ruptura antecipada.","refs":[{"law":"CLT","ids":["443","479","480","481"],"label":"arts. 443, 479, 480, 481","highlights":{"443":{"1":["direct",306],"0":["related",200],"2":["related",68],"5":["related",30]},"479":{"0":["direct",234],"1":["related",244]},"480":{"0":["direct",195],"1":["direct",187]},"481":{"0":["direct",295]}}}]},{"type":"example","text":"Exemplo. Faltavam três meses a R$ 2.400 para o termo final. Na dispensa antecipada pelo empregador, sem justa causa e sem cláusula assecuratória exercida, a indenização do art. 479 é R$ 3.600. Se a saída foi do empregado, R$ 3.600 é teto. O empregador ainda precisa demonstrar prejuízo.","refs":[{"law":"CLT","ids":["479","480"],"label":"arts. 479, 480","highlights":{"479":{"0":["direct",234],"1":["related",244]},"480":{"0":["direct",195],"1":["direct",187]}}}]},{"type":"body","text":"Se existir cláusula que dê a ambas as partes o direito de romper antes do termo e ela for exercida, entra o art. 481. Ele remete aos princípios que regem a rescisão do contrato indeterminado. A pergunta depende tanto da existência da cláusula quanto de seu exercício.","refs":[{"law":"CLT","ids":["481"],"label":"art. 481","highlights":{"481":{"0":["direct",295]}}}]},{"type":"heading","text":"Dois fatos geradores que podem coexistir"},{"type":"body","text":"Para o art. 477, marque o término do contrato e o cumprimento do prazo para pagar e entregar documentos. Para o art. 467, identifique o que era incontroverso e se foi pago quando o empregador compareceu à Justiça do Trabalho. Um artigo trata da rotina rescisória e o outro do comportamento diante de uma controvérsia judicial.","refs":[{"law":"CLT","ids":["467","477"],"label":"arts. 467, 477","highlights":{"467":{"0":["direct",305]},"477":{"8":["direct",285],"0":["related",270],"12":["related",319]}}}]},{"type":"example","text":"Exemplo. Quitação atrasada sem reclamação judicial pode envolver a multa do art. 477. Se, em outro caso, a empresa comparece à Justiça sem pagar R$ 2.600 incontroversos e discute de boa-fé R$ 1.400 adicionais, o acréscimo de 50% incide sobre R$ 2.600, resultando em R$ 1.300.","refs":[{"law":"CLT","ids":["467","477"],"label":"arts. 467, 477","highlights":{"467":{"0":["direct",305]},"477":{"12":["direct",319],"0":["related",270],"8":["related",285]}}}]},{"type":"example","text":"Exemplo. Um salário mensal é R$ 3.200 e a parte incontroversa não paga na oportunidade judicial é R$ 1.800. A referência da multa do art. 477, § 8º, é o salário. Já o art. 467 calcula 50% de R$ 1.800, ou R$ 900. Verifique os requisitos de cada penalidade separadamente.","refs":[{"law":"CLT","ids":["467","477"],"label":"arts. 467, 477","highlights":{"467":{"0":["direct",305]},"477":{"12":["direct",319],"0":["related",270],"8":["related",285]}}}]},{"type":"heading","text":"Prescrição bienal e quinquenal"},{"type":"body","text":"Prescrição limita a exigência judicial de créditos após a passagem dos prazos aplicáveis. No estudo da regra geral trabalhista, faça duas perguntas. A ação foi ajuizada em até dois anos após a extinção do contrato? E quais créditos cabem na janela de cinco anos anteriores ao ajuizamento? A bienal limita o prazo para propor a ação após o encerramento. A quinquenal limita o alcance temporal dos créditos, inclusive em ações ajuizadas com o contrato ainda ativo.","refs":[{"law":"CF","ids":["7"],"highlights":{"7":{"29":["direct",215],"0":["related",116]}},"label":"art. 7"},{"law":"CLT","ids":["11"],"highlights":{"11":{"0":["direct",206],"3":["related",130],"5":["related",241]}},"label":"art. 11"}]},{"type":"example","text":"Exemplo. O contrato terminou em 30 de junho de 2025 e a ação foi ajuizada em 30 de junho de 2026. Nessa hipótese sem suspensão ou interrupção, ela foi proposta dentro dos dois anos e a janela quinquenal volta, em regra, a 30 de junho de 2021. Contar os cinco anos da rescisão em vez da data da ação muda a resposta.","refs":[{"law":"CF","ids":["7"],"highlights":{"7":{"29":["direct",215],"0":["related",116]}},"label":"art. 7"},{"law":"CLT","ids":["11"],"highlights":{"11":{"0":["direct",206],"5":["related",241]}},"label":"art. 11"}]},{"type":"example","text":"Exemplo. Se o vínculo terminou em 30 de junho de 2023 e a primeira ação só foi ajuizada em 2026, a primeira verificação é o biênio. Na hipótese simples sem causa de suspensão ou interrupção, ele já transcorreu. Não comece a conta pela quantidade de parcelas dos últimos cinco anos.","refs":[{"law":"CF","ids":["7"],"highlights":{"7":{"29":["direct",215],"0":["related",116]}},"label":"art. 7"},{"law":"CLT","ids":["11"],"highlights":{"11":{"0":["direct",206],"5":["related",241]}},"label":"art. 11"}]},{"type":"heading","text":"Interrupção e prescrição durante a execução"},{"type":"body","text":"A prescrição é interrompida pelo ajuizamento da reclamação, nas condições da CLT. Os efeitos alcançam apenas pedidos idênticos, ainda que a ação tenha sido ajuizada em juízo incompetente ou extinta sem resolução do mérito. A CLT também prevê prazo de dois anos para a prescrição intercorrente, com termo inicial quando o exequente deixa de cumprir determinação judicial no curso da execução. Esse instituto tem marco próprio, diverso da prescrição bienal após o fim do contrato.","refs":[{"law":"CLT","ids":["11","11-A"],"highlights":{"11":{"5":["direct",241],"0":["related",206]},"11-A":{"0":["direct",91],"1":["direct",142],"2":["related",119]}},"label":"arts. 11, 11-A"}]},{"type":"example","text":"Exemplo. Uma reclamação anterior pediu somente horas extras. Na análise da interrupção, compare esse pedido com o da nova ação. O pedido de horas extras pode ser idêntico. Um pedido distinto, que não constava da primeira ação, não fica automaticamente coberto.","refs":[{"law":"CLT","ids":["11"],"highlights":{"11":{"5":["direct",241],"0":["related",206]}},"label":"art. 11"}]},{"type":"prompt","text":"Roteiro para um caso. Escreva a modalidade, o fato que a caracteriza, a regra legal e a consequência financeira. Se o enunciado der valores, separe base de cálculo, percentual e resultado."}],"mapTitle":"Verbas rescisórias","citedArticles":["CLT · arts. 11, 11-A, 443, 467, 477, 479, 480, 481","CF · art. 7"],"glossary":[{"term":"Verbas incontroversas","meaning":"Quantias cuja obrigação não está em disputa no processo.","example":"A empresa admite R$ 4.000 e contesta outros R$ 3.000. A parcela incontroversa é de R$ 4.000."},{"term":"Mora","meaning":"Atraso no cumprimento de obrigação exigível.","example":"Na quitação rescisória, a identificação do prazo e de quem deu causa ao atraso importa para a multa."},{"term":"Quitação","meaning":"Pagamento e comprovação do cumprimento de obrigações conforme seu alcance.","example":"Leia quais parcelas o recibo rescisório discrimina e confira os valores."},{"term":"Termo final","meaning":"Data ou marco originalmente previsto para terminar um contrato a prazo.","example":"Se o vínculo chega a esse ponto, diferencie o término normal da ruptura antecipada."},{"term":"Cláusula assecuratória recíproca","meaning":"Previsão que dá às duas partes direito de romper o contrato a termo antes do fim.","example":"O exercício da cláusula aciona a regra própria sobre princípios de rescisão do contrato indeterminado."},{"term":"Teto indenizatório","meaning":"Limite máximo do que pode ser cobrado em determinada hipótese.","example":"Se o teto for R$ 3.600 e o prejuízo provado for R$ 1.500, o teto não se transforma em dívida automática."},{"term":"Acréscimo do art. 467","meaning":"Majoração de 50% sobre a parte rescisória incontroversa não paga na oportunidade legal.","example":"Se ficaram R$ 4.000 incontroversos sem pagamento naquela oportunidade, o acréscimo é de R$ 2.000."},{"term":"Prescrição bienal","meaning":"Prazo geral de dois anos para ajuizar a ação após a extinção do vínculo.","example":"Verifique a data de encerramento antes de calcular a janela dos créditos."},{"term":"Prescrição quinquenal","meaning":"Limitação temporal de cinco anos para os créditos trabalhistas na hipótese geral.","example":"Em regra, volte cinco anos desde o ajuizamento."},{"term":"Prescrição intercorrente","meaning":"Prescrição que pode ocorrer na execução, com marco e prazo próprios na CLT.","example":"O prazo se relaciona ao descumprimento de determinação judicial pelo exequente na execução."}],"lesson":{"title":"Verbas rescisórias","file":"verbas-rafael-aula.mp4","poster":"verbas-rafael-aula.jpg"}},{"id":"fgts","number":13,"semester":2,"title":"Fundo de Garantia do Tempo de Serviço (FGTS)","mapTitle":"FGTS","citedArticles":["CF · art. 7º, III e XXIX","Lei 8.036/1990 · arts. 15, 18, 20 e 20-A a 20-C","CLT · art. 484-A"],"body":[{"type":"heading","text":"O que é o FGTS"},{"type":"body","text":"O Fundo de Garantia do Tempo de Serviço é um direito previsto no art. 7º, III, da Constituição. O empregador deposita valores em uma conta vinculada ao contrato de trabalho. O depósito é obrigação do empregador e não é descontado do salário.","refs":[{"law":"CF","ids":["7"],"label":"art. 7º, III","highlights":{"7":{"3":["direct",44]}},"relevantOnly":true},{"law":"Lei 8.036/1990","ids":["15"],"label":"art. 15, caput","highlights":{"15":{"0":["related",907]}},"relevantOnly":true}]},{"type":"heading","text":"Depósito mensal e base de cálculo"},{"type":"body","text":"Em regra, o depósito é de 8% da remuneração paga ou devida no mês. O décimo terceiro salário também integra a base. No contrato de aprendizagem, a alíquota é de 2%. O depósito mensal vence no dia 20 do mês seguinte, com antecipação para o dia útil anterior quando o vencimento cai em dia não útil.","refs":[{"law":"Lei 8.036/1990","ids":["15"],"label":"art. 15, caput e § 7º","highlights":{"15":{"0":["direct",907],"7":["direct",178]}},"relevantOnly":true}]},{"type":"heading","text":"Exemplo de depósito"},{"type":"example","text":"Com base de cálculo mensal de R$ 2.000, o depósito é de R$ 160 pela regra geral ou de R$ 40 em um contrato de aprendizagem.","refs":[{"law":"Lei 8.036/1990","ids":["15"],"label":"art. 15, caput e § 7º","highlights":{"15":{"0":["direct",907],"7":["direct",178]}},"relevantOnly":true}]},{"type":"heading","text":"FGTS durante afastamentos"},{"type":"body","text":"O depósito continua obrigatório durante a licença por acidente do trabalho e o afastamento para serviço militar obrigatório. Após os primeiros 15 dias de afastamento por incapacidade comum, em regra, não há depósito sobre o período em que o empregado recebe apenas o benefício previdenciário.","refs":[{"law":"Lei 8.036/1990","ids":["15"],"label":"art. 15, § 5º","highlights":{"15":{"0":["related",907],"5":["direct",225]}},"relevantOnly":true}]},{"type":"heading","text":"Multa rescisória e saques anteriores"},{"type":"body","text":"Na dispensa sem justa causa, a multa é de 40% sobre os depósitos referentes àquele contrato, com atualização monetária e juros. Saques anteriores não reduzem a base da multa. Depósitos de outros empregadores ficam fora desse cálculo. Na extinção por acordo, a multa é de 20% e, no saque-rescisão, a movimentação fica limitada a 80% do saldo. Na culpa recíproca ou força maior reconhecida pela Justiça do Trabalho, a multa é de 20%.","refs":[{"law":"Lei 8.036/1990","ids":["18"],"label":"art. 18, §§ 1º e 2º","highlights":{"18":{"0":["related",387],"1":["direct",392],"2":["direct",166]}},"relevantOnly":true},{"law":"CLT","ids":["484-A"],"label":"art. 484-A, I, b, e § 1º","highlights":{"484-A":{"3":["direct",140],"5":["direct",291]}},"relevantOnly":true}]},{"type":"heading","text":"Exemplo da empresa Beta"},{"type":"example","text":"Se a base atualizada da multa do contrato com a Beta for de R$ 5.000 e um saque anterior de R$ 3.000 tiver deixado R$ 2.000 na conta, a multa será de R$ 2.000. A conta é 40% de R$ 5.000. Confira o valor para fins rescisórios, pois o saldo exibido no aplicativo pode ser diferente da base da multa.","refs":[{"law":"Lei 8.036/1990","ids":["18"],"label":"art. 18, § 1º","highlights":{"18":{"1":["direct",392]}},"relevantOnly":true}]},{"type":"heading","text":"Quando o saldo pode ser sacado"},{"type":"body","text":"A Lei 8.036/1990, art. 20, prevê hipóteses como dispensa sem justa causa na modalidade saque-rescisão, término normal de contrato por prazo determinado nessa mesma modalidade, aposentadoria e aquisição de moradia própria, observadas as condições legais. Pedido de demissão e dispensa por justa causa não autorizam saque pelo motivo da rescisão.","refs":[{"law":"Lei 8.036/1990","ids":["20"],"label":"art. 20, I, III, VII e IX","highlights":{"20":{"0":["direct",128],"1":["direct",100],"2":["direct",125],"3":["direct",117]}},"relevantOnly":true},{"law":"Lei 8.036/1990","ids":["20-A"],"label":"art. 20-A, § 2º, II","highlights":{"20-A":{"0":["related",225]}},"relevantOnly":true}]},{"type":"heading","text":"Saque-rescisão e saque-aniversário"},{"type":"body","text":"O saque-rescisão é a modalidade inicial. O saque-aniversário permite sacar anualmente uma parcela do saldo conforme a faixa legal. Na regra geral, quem está no saque-aniversário e é dispensado sem justa causa pode sacar a multa de 40%, mas a demissão não libera o restante do saldo da conta. O retorno ao saque-rescisão produz efeito no primeiro dia do 25º mês seguinte ao pedido, observadas as condições legais e eventuais antecipações contratadas.","refs":[{"law":"Lei 8.036/1990","ids":["20"],"label":"art. 20, XX","highlights":{"20":{"4":["direct",130]}},"relevantOnly":true},{"law":"Lei 8.036/1990","ids":["20-A"],"label":"art. 20-A, § 2º, II","highlights":{"20-A":{"0":["direct",225]}},"relevantOnly":true},{"law":"Lei 8.036/1990","ids":["20-B"],"label":"art. 20-B, caput","highlights":{"20-B":{"0":["direct",115]}},"relevantOnly":true},{"law":"Lei 8.036/1990","ids":["20-C"],"label":"art. 20-C, § 1º, I, e § 2º","highlights":{"20-C":{"0":["direct",170],"1":["direct",105]}},"relevantOnly":true}]},{"type":"heading","text":"Prescrição para cobrar depósitos"},{"type":"body","text":"Em regra, podem ser cobrados os depósitos exigíveis nos cinco anos anteriores ao ajuizamento, respeitado o prazo de dois anos após o fim do contrato para entrar com a ação. Fundamento: art. 7º, XXIX, da Constituição e Súmula 362, I, do TST.","refs":[{"law":"CF","ids":["7"],"label":"art. 7º, XXIX","highlights":{"7":{"29":["direct",283]}},"relevantOnly":true}]}],"map":[["Depósito","8% na regra geral e 2% na aprendizagem","Sobre R$ 2.000, os depósitos são de R$ 160 e R$ 40, respectivamente."],["Afastamentos","Depósito obrigatório na licença por acidente do trabalho","O benefício por incapacidade comum, em regra, não gera depósito após o 15º dia."],["Multa de 40%","Depósitos atualizados do contrato na dispensa sem justa causa","Base de R$ 5.000 e saldo remanescente de R$ 2.000 resultam em multa de R$ 2.000."],["Saque-aniversário","Retirada anual de parte do saldo","A dispensa sem justa causa permite sacar a multa, na regra geral."],["Prescrição","Cinco anos para créditos e dois anos após o fim do contrato para ajuizar","Conte a janela quinquenal a partir do ajuizamento."]],"glossary":[{"term":"Conta vinculada","meaning":"Conta do FGTS associada a um contrato de trabalho.","example":"Dois vínculos com empregadores diferentes geram contas distintas."},{"term":"Valor para fins rescisórios","meaning":"Valor usado para apurar a multa, considerando os depósitos do vínculo e os acréscimos legais.","example":"Um saque anterior pode reduzir o saldo disponível sem reduzir essa base."},{"term":"Saque-aniversário","meaning":"Modalidade que permite o saque anual de uma parcela do FGTS.","example":"Durante sua vigência, a dispensa sem justa causa permite sacar a multa rescisória, na regra geral."}],"questions":[{"id":"fgts-1","chapter":"fgts","level":"B","text":"Quanto o empregador recolhe em um mês com base de R$ 2.500, pela regra geral?","options":["R$ 200","R$ 50","R$ 125","R$ 250","R$ 400"],"explanation":"O depósito mensal corresponde a 8% de R$ 2.500, conforme o art. 15 da Lei 8.036/1990."},{"id":"fgts-2","chapter":"fgts","level":"B","text":"Qual é a alíquota de FGTS no contrato de aprendizagem?","options":["2%","8%","5%","20%","40%"],"explanation":"O art. 15, § 7º, da Lei 8.036/1990 estabelece a alíquota de 2%."},{"id":"fgts-3","chapter":"fgts","level":"M","text":"Em qual afastamento a lei mantém expressamente a obrigação de depositar FGTS?","options":["Licença por acidente do trabalho","Licença sem remuneração por interesse particular","Incapacidade comum após os primeiros 15 dias, em regr
