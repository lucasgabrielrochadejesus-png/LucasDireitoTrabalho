rincipal. O Tema 725 do STF e a ADPF 324 reconheceram a possibilidade de terceirizar a atividade-fim, superando a antiga proibição geral baseada nessa distinção. A organização e a disciplina da equipe cabem à prestadora. A tomadora deve observar, entre outros deveres, condições de saúde e segurança quando o trabalho se realiza em suas dependências ou local convencionado.","refs":[{"law":"Lei 6.019/1974","ids":["4-A","5-A"],"label":"arts. 4-A, 5-A","highlights":{"4-A":{"0":["direct",299],"1":["direct",174],"2":["related",169]},"5-A":{"0":["direct",190],"3":["direct",216],"5":["related",273]}}}]},{"type":"body","text":"Se a prestadora deixa de cumprir obrigações trabalhistas, a tomadora privada responde subsidiariamente pelas obrigações do período da prestação. Subsidiária indica que a dívida é imputada primeiramente à prestadora. Para a Administração Pública, inadimplemento e inversão isolada do ônus da prova são insuficientes. No Tema 1118, o STF exige comprovação da conduta negligente ou do nexo causal nos termos da tese. A inércia após notificação formal idônea é uma hipótese expressa.","refs":[{"law":"Lei 6.019/1974","ids":["5-A"],"label":"art. 5-A","highlights":{"5-A":{"5":["direct",273],"0":["related",190],"3":["related",216]}}}]},{"type":"body","text":"A terceirização pode facilitar o acesso a serviços especializados, mas exige que as responsabilidades de direção, pagamento e segurança fiquem claras. Rotatividade e falhas de segurança são riscos de gestão. Recorrer a intermediário sem estrutura ou simular a relação pode gerar disputa sobre fraude e responsabilidade."},{"type":"heading","text":"Trabalho temporário e contratação direta a termo"},{"type":"body","text":"Trabalho temporário é a contratação por empresa de trabalho temporário registrada que coloca o trabalhador à disposição da tomadora para substituição transitória de pessoal permanente ou demanda complementar. O contrato é escrito. O prazo com a mesma tomadora é de até 180 dias, consecutivos ou não, com prorrogação de até 90 dias se persistirem as condições. Depois de cumpridos os períodos legais, a nova colocação do trabalhador na mesma tomadora exige observar o intervalo de 90 dias previsto na lei. Há direitos legais, como FGTS e remuneração equivalente à de empregados da mesma categoria da tomadora, calculada em base horária.","refs":[{"law":"Lei 6.019/1974","ids":["2","9","10","12"],"label":"arts. 2, 9, 10, 12","highlights":{"2":{"0":["direct",292],"2":["related",191]},"9":{"0":["direct",209],"2":["related",59],"3":["related",37]},"10":{"1":["direct",146],"2":["direct",191],"5":["direct",241],"6":["related",115],"7":["related",263]},"12":{"0":["direct",75],"1":["direct",205],"3":["related",92],"4":["related",30]}}}]},{"type":"body","text":"Uma loja que usa agência para reforçar a equipe no pico sazonal pode estar diante de trabalho temporário. Uma empresa que contrata diretamente para experiência usa o regime a termo da CLT. Uma fábrica que contrata empresa para executar manutenção regularmente terceiriza um serviço. No campo, o consórcio simplificado de produtores rurais permite a produtores pessoas físicas outorgar poderes a um deles para gerir a contratação e prestar serviços aos integrantes. A responsabilidade previdenciária é solidária nos termos do art. 25-A da Lei 8.212/1991.","refs":[{"law":"Lei 8.212/1991","ids":["25-A"],"label":"art. 25-A","highlights":{"25-A":{"0":["direct",371],"3":["direct",143],"1":["related",389],"2":["related",135]}}}]},{"type":"heading","text":"Desenhe as três relações"},{"type":"body","text":"Identifique trabalhador, empresa prestadora e tomadora. Na terceirização típica, a prestadora é empregadora e executa um serviço para a tomadora. No trabalho temporário, a agência contrata a pessoa para colocá-la à disposição da tomadora por causa justificada. Há três partes nos dois casos. Motivo, forma, prazo e posição da contratante permitem distinguir os modelos.","refs":[{"law":"Lei 6.019/1974","ids":["2","4-A","5-A","9","10"],"label":"arts. 2, 4-A, 5-A, 9, 10","highlights":{"2":{"0":["direct",292],"2":["related",191]},"4-A":{"0":["direct",299],"1":["direct",174],"2":["related",169]},"5-A":{"0":["direct",190],"3":["direct",216],"5":["related",273]},"9":{"0":["direct",209],"2":["direct",59],"3":["direct",37],"5":["related",113],"6":["related",207]},"10":{"1":["direct",146],"2":["direct",191],"0":["related",176],"5":["related",241]}}}]},{"type":"example","text":"Exemplo. Um hospital contrata empresa especializada para executar regularmente a limpeza. Já uma loja aciona empresa de trabalho temporário para cobrir a ausência de uma caixa. Se a própria loja admite diretamente em experiência, entra em jogo outro regime, disciplinado pela CLT.","refs":[{"law":"CLT","ids":["443","445"],"label":"arts. 443, 445","highlights":{"443":{"5":["direct",30],"0":["related",200],"2":["related",68]},"445":{"1":["direct",149],"0":["related",138]}}},{"law":"Lei 6.019/1974","ids":["2","4-A"],"label":"arts. 2, 4-A","highlights":{"2":{"0":["direct",292],"2":["related",191]},"4-A":{"0":["direct",299],"1":["direct",174],"2":["related",169]}}}]},{"type":"heading","text":"Responsabilidade e prazos na prática"},{"type":"body","text":"Responsabilidade subsidiária pressupõe uma devedora principal e outra que responde na forma legal. Para tomadora privada, vincule as obrigações ao período em que recebeu o serviço. Para Administração Pública, o mero atraso da prestadora não resolve a questão. No Tema 1118, procure os fatos que demonstram negligência ou nexo causal nos termos da tese, como notificação formal seguida de inércia.","refs":[{"law":"Lei 6.019/1974","ids":["5-A","10"],"label":"arts. 5-A, 10","highlights":{"5-A":{"5":["direct",273],"0":["related",190]},"10":{"7":["direct",263],"0":["related",176]}}}]},{"type":"example","text":"Exemplo. Uma prestadora deixou três meses de salários em aberto, mas o empregado trabalhou para determinada tomadora privada em apenas dois deles. A análise daquela tomadora se concentra nas obrigações do respectivo período de prestação. Se o destinatário for um órgão público, acrescente a análise de fiscalização e prova."},{"type":"body","text":"No temporário, conte os dias com a mesma tomadora e confirme se o motivo original persiste para prorrogar. Um pico previsível sazonal pode compor demanda complementar. O limite de 180 dias mais até 90 não autoriza manter mão de obra temporária indefinidamente quando a necessidade que justificou a contratação já cessou.","refs":[{"law":"Lei 6.019/1974","ids":["2","9","10"],"label":"arts. 2, 9, 10","highlights":{"2":{"0":["direct",292],"2":["direct",191]},"9":{"0":["direct",209],"2":["direct",59],"3":["direct",37],"5":["related",113],"6":["related",207]},"10":{"1":["direct",146],"2":["direct",191],"5":["related",241],"6":["related",115]}}}]},{"type":"example","text":"Exemplo. Uma agência oferece 150 dias de trabalho e prorrogação de 80 dias. Estar abaixo do limite máximo não resolve sozinho a validade. É preciso verificar qual demanda justificou a contratação e se ela ainda existe."},{"type":"prompt","text":"Teste sem olhar. Quem é o empregador em cada uma das três situações? Em qual delas o prazo de 180 + 90 dias é relevante?"}],"mapTitle":"Terceirização e trabalho temporário","citedArticles":["Lei 6.019/1974 · arts. 2, 4-A, 5-A, 9, 10, 12","Lei 8.212/1991 · art. 25-A","CLT · arts. 443, 445"],"glossary":[{"term":"Prestadora","meaning":"Empresa encarregada de executar o serviço contratado e que, na terceirização típica, contrata, remunera e dirige seus empregados.","example":"Uma empresa de limpeza fornece o serviço a um hospital."},{"term":"Tomadora","meaning":"Pessoa ou organização contratante que recebe o serviço.","example":"No exemplo da limpeza terceirizada, o hospital é a tomadora."},{"term":"Atividade-fim","meaning":"Atividade principal da organização.","example":"O Tema 725 do STF reconhece a possibilidade de terceirização inclusive da atividade principal."},{"term":"Responsabilidade subsidiária","meaning":"A prestadora é a devedora principal. A tomadora pode responder pelo débito nas condições legais.","example":"Na contratação privada, examine quais obrigações dizem respeito ao período em que recebeu o serviço."},{"term":"Trabalho temporário","meaning":"Contratação por empresa de trabalho temporário para colocar o trabalhador à disposição de uma tomadora diante de motivo legal específico.","example":"Uma loja usa uma agência para substituir uma profissional afastada."},{"term":"Demanda complementar","meaning":"Necessidade adicional de trabalho que pode justificar o temporário dentro dos critérios legais.","example":"Um pico sazonal de atendimento pode configurar demanda complementar."},{"term":"Inadimplemento","meaning":"Descumprimento de uma obrigação devida.","example":"O atraso salarial da prestadora deve ser separado da análise dos requisitos da responsabilidade da tomadora."}],"lesson":{"title":"Terceirização","file":"terceirizacao-rafael-aula.mp4","poster":"terceirizacao-rafael-aula.jpg"}},{"id":"salario","number":7,"semester":2,"map":[["Salário","Fixo, comissões e gratificações legais","Uma trabalhadora recebe R$ 2.600 fixos e R$ 500 em comissões. As duas parcelas somam R$ 3.100 de salário."],["Remuneração","Salário mais gorjetas","Se a mesma trabalhadora recebe R$ 400 em gorjetas, a remuneração soma R$ 3.500. Confira a base aplicável antes de calcular outras parcelas."],["Utilidades","Investigue a finalidade da vantagem","Uma moradia indispensável para operar equipamento remoto pode ser instrumento de trabalho. Se for contraprestação, analise salário-utilidade."],["Pagamento","Salário mensal até o quinto dia útil","O pagamento de salário mensal no oitavo dia útil do mês seguinte ultrapassa o prazo geral de cinco dias úteis."],["Descontos","Verifique as hipóteses legais","Um adiantamento pode ser deduzido. Compare com tentativa de cobrar perda normal de faturamento dos empregados."],["Gestão","Poderes efetivos e patamar de 40%","Salário efetivo de R$ 5.000 exige referência de R$ 7.000 para a exceção de gestão. Mesmo se atingir esse valor, verifique os poderes reais."]],"questions":[{"id":"salario-1","chapter":"salario","level":"B","text":"O que integra a remuneração além do salário?","options":["Gorjetas recebidas","Faturamento bruto do empregador","Todo reembolso de despesa","Reembolso exato de despesas comprovadas","Vale-transporte fornecido na forma legal"],"explanation":"O art. 457 distingue contraprestação salarial e gorjetas."},{"id":"salario-2","chapter":"salario","level":"B","text":"Qual é o prazo geral de pagamento do salário mensal?","options":["Até o quinto dia útil do mês seguinte","Até o décimo dia corrido de todo mês","Até 30 dias após cada jornada","Quinto dia corrido do mês seguinte","Último dia útil do próprio mês trabalhado, como limite legal geral"],"explanation":"É o prazo do art. 459, § 1º, da CLT."},{"id":"salario-3","chapter":"salario","level":"M","text":"Uma pessoa recebe R$ 2.500 fixos, R$ 500 em comissão e R$ 200 de gorjeta. Qual é o salário e a remuneração no caso?","options":["R$ 3.000 e R$ 3.200","R$ 2.500 e R$ 3.000","R$ 3.200 e R$ 3.200","R$ 2.700 e R$ 3.200","R$ 3.200 e R$ 3.700"],"explanation":"Comissões integram salário. A gorjeta se soma ao salário para definir a remuneração."},{"id":"salario-4","chapter":"salario","level":"M","text":"O trabalhador precisa morar em local remoto para operar o equipamento e a empresa fornece moradia indispensável. Qual o critério?","options":["A moradia pode ser instrumental, sem natureza salarial","Toda moradia é salário-utilidade","Qualquer valor de mercado da moradia exclui salário","A moradia é salário por estar prevista por escrito, ainda que indispensável","A moradia é salário sempre que a empresa for proprietária do imóvel"],"explanation":"A Súmula 367 orienta examinar se a utilidade é indispensável ao trabalho."},{"id":"salario-5","chapter":"salario","level":"A","text":"Renato dirigia um setor com poderes reais de gestão. Seu salário efetivo era R$ 4.000 e no cargo passou a R$ 5.400, já contando a gratificação. A empresa exclui Renato do regime de jornada apenas pela autonomia funcional. Qual requisito econômico deve ser confrontado?","options":["Patamar remuneratório de R$ 5.600","A prova de poderes de gestão, apesar do enunciado","Registro de intermitência","O piso econômico seria R$ 5.400, pois 35% bastam quando há poderes de gestão","O piso econômico seria R$ 6.000, por aplicação do adicional de 50% de hora extra"],"explanation":"R$ 4.000 acrescidos de 40% equivalem a R$ 5.600. Os requisitos remuneratório e funcional são cumulativos."},{"id":"salario-6","chapter":"salario","level":"A","text":"Mônica ganha 45% a mais e tem o cargo formal de gerente. Ela apenas executa rotinas e depende de aprovação do supervisor para decidir escalas, despesas e medidas disciplinares. A empresa invoca o salário e o cargo para afastar o regime de jornada. Qual conclusão cabe?","options":["O patamar salarial sozinho é insuficiente para aplicar o art. 62, II","O adicional sozinho exclui horas extras","O título sozinho exclui horas extras","O percentual supre o requisito de gestão quando a supervisão estiver prevista no organograma","O título basta se a remuneração atingir o patamar, mesmo sem atribuições efetivas"],"explanation":"A função precisa envolver gestão efetiva, além do patamar salarial."},{"chapter":"salario","level":"B","text":"Qual parcela integra o salário segundo o art. 457?","options":["Comissão paga pelo empregador","Gorjeta isoladamente como salário pago pelo empregador","Qualquer reembolso comprovado","Auxílio-alimentação fornecido na forma legal e sem pagamento em dinheiro","Reembolso documentado de despesa feita em serviço"],"explanation":"Comissões integram salário. Gorjetas compõem a remuneração e reembolso tem análise própria.","id":"salario-7"},{"chapter":"salario","level":"B","text":"Qual dispositivo estabelece a disciplina do salário-utilidade?","options":["Art. 458 da CLT","Art. 467 da CLT","Art. 481 da CLT","Art. 462, sobre descontos","Art. 461, sobre equiparação"],"explanation":"O art. 458 disciplina prestações in natura e suas exclusões.","id":"salario-8"},{"chapter":"salario","level":"B","text":"Qual é o adicional mínimo constitucional de horas extras na regra geral?","options":["50%","20%","40%","25%","30%"],"explanation":"A Constituição prevê adicional mínimo de 50%, sem prejuízo de condição mais favorável.","id":"salario-9"},{"chapter":"salario","level":"B","text":"Em que situação a moradia pode ter natureza de utilidade salarial?","options":["Quando é concedida como contraprestação habitual, observadas as regras legais","Sempre que é indispensável ao serviço","Sempre que está situada na empresa","Quando serve exclusivamente para viabilizar a execução de tarefa remota","Quando substitui hospedagem indispensável financiada para execução do serviço"],"explanation":"O motivo do fornecimento e as exclusões legais são decisivos.","id":"salario-10"},{"chapter":"salario","level":"B","text":"O que distingue um prêmio na definição do art. 457, § 4º?","options":["Liberalidade por desempenho superior ao ordinariamente esperado","Comissão pactuada obrigatória sobre cada venda","Adiantamento dado no começo do mês","A obrigação pactuada de pagar percentual sobre cada venda normal","O reembolso de gasto comprovado que o empregado fez em serviço"],"explanation":"A lei usa o desempenho superior como parte da definição de prêmio.","id":"salario-11"},{"chapter":"salario","level":"M","text":"Salário fixo de R$ 3.000, comissão de R$ 600 e gorjetas de R$ 400. Quais os totais?","options":["Salário de R$ 3.600 e remuneração de R$ 4.000","Salário de R$ 4.000 e remuneração de R$ 3.600","Salário de R$ 3.000 e remuneração de R$ 3.600","R$ 3.400 e R$ 4.000","R$ 3.600 e R$ 3.800"],"explanation":"Fixo e comissão somam o salário. Acrescentar gorjetas dá a remuneração.","id":"salario-12"},{"chapter":"salario","level":"M","text":"Um empregador registra como prêmio um percentual previamente pactuado de cada venda normal. O que investigar?","options":["Se a parcela funciona como comissão salarial","Se a folha tem espaço para mudar a rubrica","Se todo percentual é ajuda de custo","Se o percentual é gorjeta só por estar ligado a venda efetuada","Se a parcela é prêmio apenas porque foi paga em épocas de maior movimento"],"explanation":"O rótulo não altera a natureza da contraprestação habitual pactuada sobre vendas.","id":"salario-13"},{"chapter":"salario","level":"M","text":"A empresa se atrasa e paga salário mensal no oitavo dia útil do mês seguinte. Qual prazo examinar?","options":["Quinto dia útil do mês seguinte","Dez dias contados de uma audiência","Dia do próximo gozo de férias","Quinto dia corrido do mês seguinte","Oitavo dia útil, porque o empregador tem tolerância geral de três dias"],"explanation":"O art. 459, § 1º, trata do prazo de salário mensal.","id":"salario-14"},{"chapter":"salario","level":"M","text":"Uma hora normal vale R$ 30. Qual o valor total de uma hora extra com adicional de 50%?","options":["R$ 45","R$ 15","R$ 60","R$ 35","R$ 50"],"explanation":"O adicional é R$ 15. O total soma hora normal e adicional.","id":"salario-15"},{"chapter":"salario","level":"M","text":"A empresa fornece equipamento indispensável para o serviço. Qual análise prevalece no exemplo?","options":["O bem é um instrumento de trabalho","Todo fornecimento habitual vira salário-utilidade","Trata-se de gorjeta cobrada do cliente","Salário-utilidade por ser usado todos os dias na atividade","Gorjeta indireta, por ser fornecido durante a prestação remunerada"],"explanation":"É preciso investigar se o bem viabiliza a execução ou é pago como contraprestação.","id":"salario-16"},{"chapter":"salario","level":"A","text":"Hugo exercia gestão efetiva e recebia R$ 4.850 no cargo, já incluída a gratificação. Seu salário efetivo de referência era R$ 3.500. O empregador arredonda a diferença de R$ 1.350 e afirma que chegou a 40%. Qual é a conclusão correta?","options":["Fica abaixo do patamar de R$ 4.900","Atende porque excede R$ 4.800","Atende porque os poderes reais de gestão tornam suficiente qualquer diferença em relação ao salário efetivo","Fica abaixo porque o mínimo seria de R$ 5.250 com base no adicional de 50%","Atinge o patamar porque se arredonda para cima sempre que a diferença for inferior a R$ 100"],"explanation":"R$ 3.500 × 1,40 resulta em R$ 4.900. Gestão e patamar se examinam separadamente.","id":"salario-17"},{"chapter":"salario","level":"A","text":"Tatiana recebe R$ 7.000 no cargo de gestão, incluindo gratificação, e seu salário efetivo é de R$ 5.000. Ficaram demonstrados poderes de direção. O RH interpreta o parágrafo único como se exigisse valor estritamente superior a 40%. Qual é a leitura econômica correta?","options":["A remuneração atinge o patamar mínimo do dispositivo","A remuneração precisa superar 40% sem incluir o valor exato","O requisito econômico mínimo é 50%","A diferença deve ser de mais de R$ 2.000, sem admitir igualdade quando houver gratificação","O valor pago deve ser comparado com R$ 7.500 porque o adicional aplicável é o de horas extras"],"explanation":"O parágrafo único retira a exceção quando o salário do cargo é inferior ao salário efetivo acrescido de 40%.","id":"salario-18"},{"chapter":"salario","level":"A","text":"No restaurante de Celina, o cliente paga taxa de serviço que a casa distribui aos empregados. Na folha, a empresa lança esses valores sob a rubrica gratificação legal e paga separadamente o salário fixo. Que critério resolve a natureza da parcela distribuída?","options":["Conferir origem e natureza da parcela para enquadrar como gorjeta","Converter automaticamente em salário fixo pela rubrica","Excluir da remuneração por ter passado pela empresa","A rubrica integra o salário em qualquer caso, mesmo quando vem dos clientes","A gorjeta cobrada pelo estabelecimento deixa de compor a remuneração se for paga na folha junto com o salário"],"explanation":"O conceito legal inclui gorjeta cobrada pela empresa e destinada aos empregados.","id":"salario-19"},{"chapter":"salario","level":"A","text":"De R$ 700 descontados da folha de Abel, R$ 500 correspondem a adiantamento comprovado e R$ 200 a uma fração da perda de faturamento. A empresa afirma que o valor pode ser analisado como um único desconto. Qual é a abordagem correta?","options":["O adiantamento tem previsão legal, mas a perda comercial não se torna desconto autorizado","Os dois descontos são automaticamente válidos","A perda comercial autoriza o desconto, mas o adiantamento não","Os R$ 700 são válidos se o total não superar o salário mensal","A prova do adiantamento também autoriza a dedução da perda comercial vinculada ao mesmo mês"],"explanation":"Separe cada desconto e sua causa. O risco empresarial pertence ao empregador.","id":"salario-20"},{"chapter":"salario","level":"A","text":"Camila trabalha em banco, tem poderes de gestão descritos e ganha mais de 40% acima do salário efetivo. A empresa aplica automaticamente a exceção geral. O advogado observa que a categoria e as atribuições podem levar a uma disciplina específica. Qual verificação vem primeiro?","options":["Qual exceção e qual regime de jornada se aplicam à função descrita","Aplicar o art. 62, II, automaticamente a toda confiança bancária","Aplicar a regra de estágio pela confiança do cargo","O patamar de 40% transforma todo cargo de confiança bancária no mesmo enquadramento","Basta o cargo incluir a palavra gerente para aplicar o regime geral da CLT"],"explanation":"O termo cargo de confiança é usado em regimes diferentes. O dispositivo aplicável depende dos fatos e do enquadramento.","id":"salario-21"},{"id":"salario-22","chapter":"salario","level":"B","text":"Quem é o paradigma em uma questão de equiparação salarial?","options":["O empregado usado como referência de comparação.","O sindicato da categoria econômica.","Quem recebeu pagamento mais recente.","Pessoa encarregada de avaliar a produtividade sem integrar a comparação salarial.","Empregado admitido mais recentemente, mesmo que exerça função distinta."],"explanation":"Paradigma é o referencial comparativo. A lei exige que sejam verificados os critérios da equiparação."},{"id":"salario-23","chapter":"salario","level":"M","text":"Há diferença de três anos na empresa e um ano na função. Para a regra geral do art. 461, os dois limites temporais são respeitados?","options":["Sim. Ambos ficam dentro dos respectivos limites.","Não. Na empresa o limite também é de dois anos.","Não. Na função não pode existir nenhuma diferença de tempo.","Sim, pois o único limite legal é de quatro anos na empresa.","Não. O limite na função é de até seis meses."],"explanation":"A diferença para o mesmo empregador deve ser de até quatro anos e na função de até dois."},{"id":"salario-24","chapter":"salario","level":"A","text":"Nara executa as mesmas tarefas de Paula, tem produtividade e técnica equivalentes e atende aos limites temporais. Trabalham para o mesmo empregador, em estabelecimentos distintos. O RH considera a identidade das funções suficiente. Qual condição ainda impede concluir pela equiparação na regra geral do art. 461?","options":["Não. A regra geral também exige o mesmo estabelecimento empresarial.","Sim. O estabelecimento é irrelevante na redação atual.","Sim, desde que o nome do cargo seja diferente.","O requisito territorial está cumprido sempre que as duas unidades pertencem ao mesmo CNPJ ou empregador.","O estabelecimento só importa se houver diferença superior a quatro anos no empregador."],"explanation":"O art. 461 exige o mesmo empregador e o mesmo estabelecimento, além dos demais critérios."}],"title":"Salário, remuneração e jornada","body":[{"type":"body","text":"Salário é a contraprestação paga pelo empregador. Remuneração compreende o salário e as gorjetas (CLT, art. 457). Além da importância fixa, comissões e gratificações legais integram o salário conforme a redação do art. 457. Assim, se uma empregada ganha R$ 2.000 fixos, R$ 400 em comissões e R$ 300 em gorjetas no mês, o salário do exemplo é R$ 2.400 e a remuneração é R$ 2.700. Na prova, confira a base de cálculo específica de cada parcela.","refs":[{"law":"CLT","ids":["457"],"label":"art. 457","highlights":{"457":{"0":["direct",199],"1":["direct",116],"2":["related",338],"3":["related",225]}}}]},{"type":"body","text":"Ajuda de custo, auxílio-alimentação nas condições legais, diárias, prêmios e abonos têm disciplina própria no art. 457, § 2º. Examine a natureza efetiva da parcela. Um prêmio legal pressupõe liberalidade por desempenho superior ao ordinariamente esperado. Dar a uma comissão habitual outro nome não altera automaticamente sua natureza.","refs":[{"law":"CLT","ids":["457"],"label":"art. 457","highlights":{"457":{"2":["direct",338],"4":["direct",248],"1":["related",116]}}}]},{"type":"heading","text":"Salário-utilidade e proteção salarial"},{"type":"body","text":"O art. 458 inclui prestações habituais in natura fornecidas como contraprestação, observadas as exclusões legais. Para estudar moradia e outras utilidades, pergunte por que a vantagem foi fornecida. Moradia indispensável à execução do trabalho pode ter natureza instrumental, conforme a Súmula 367 do TST. Se a moradia for concedida como parte do pagamento pelo serviço, examine a hipótese de salário-utilidade. O salário mensal deve ser pago até o quinto dia útil do mês seguinte (art. 459, § 1º). Descontos são limitados pelo art. 462.","refs":[{"law":"CLT","ids":["458","459","462"],"label":"arts. 458, 459, 462","highlights":{"458":{"0":["direct",335],"1":["related",198],"2":["related",260],"3":["related",138],"11":["related",228]},"459":{"1":["direct",144],"0":["related",201]},"462":{"0":["direct",178],"1":["related",233]}}}]},{"type":"heading","text":"Cargo de confiança e horas extras"},{"type":"body","text":"A exceção do art. 62, II, depende do exercício efetivo de atribuições de gestão e do patamar remuneratório previsto no parágrafo único. Compare o salário do cargo de confiança, incluída a gratificação se houver, com o salário efetivo acrescido de 40%. O título de gerente é insuficiente. Verifique autonomia, poder decisório e capacidade de dirigir a unidade ou setor. Em outros regimes, como o bancário, a expressão cargo de confiança pode ter requisitos e consequências próprios.","refs":[{"law":"CLT","ids":["62"],"label":"art. 62","highlights":{"62":{"2":["direct",182],"4":["direct",361],"0":["related",64]}}}]},{"type":"body","text":"Se o salário efetivo é R$ 3.000, o patamar da regra é R$ 4.200. Uma empregada chamada gerente que recebe R$ 4.300 mas cumpre ordens operacionais sem poderes reais de gestão satisfaz o dado remuneratório do exemplo, mas não o requisito funcional. Quando a jornada é controlada, apure as horas e o adicional aplicável.","refs":[{"law":"CLT","ids":["62"],"label":"art. 62","highlights":{"62":{"2":["direct",182],"4":["direct",361],"0":["related",64]}}}]},{"type":"heading","text":"Como classificar cada parcela"},{"type":"body","text":"Leia a origem e a finalidade. Pagamento devido pelo empregador como contraprestação é salário. Gorjeta é recebida do cliente, diretamente ou por intermédio da cobrança pela empresa, e integra remuneração conforme o art. 457. Reembolso cobre despesa. O nome na folha é um indício a confrontar com a prática.","refs":[{"law":"CLT","ids":["457"],"label":"art. 457","highlights":{"457":{"0":["direct",199],"3":["direct",225],"1":["related",116],"2":["related",338]}}}]},{"type":"example","text":"Exemplo. R$ 2.600 de fixo e R$ 500 de comissão dão R$ 3.100 de salário. Com R$ 400 de gorjetas, a remuneração é R$ 3.500. Se a empresa reembolsa R$ 120 de pedágio efetivamente pago em serviço, a natureza desse reembolso pede análise própria."},{"type":"body","text":"A diferença entre prêmio e comissão aparece na origem do direito. A comissão remunera vendas ou produção conforme fórmula pactuada. A CLT descreve prêmio como liberalidade por desempenho superior ao ordinariamente esperado. Para classificar uma parcela dita “prêmio”, pergunte se existe desempenho extraordinário ou se ela paga cada venda habitual em percentual contratado.","refs":[{"law":"CLT","ids":["457"],"label":"art. 457","highlights":{"457":{"1":["direct",116],"4":["direct",248],"2":["related",338]}}}]},{"type":"heading","text":"Utilidades e descontos na prática"},{"type":"body","text":"Na utilidade, pergunte se o bem é contraprestação ou instrumento necessário. Na dedução de valores, pergunte qual hipótese legal a autoriza e se existe prova. O art. 462 admite descontos em hipóteses como adiantamento e, para dano causado pelo empregado, quando a possibilidade foi acordada ou houve dolo.","refs":[{"law":"CLT","ids":["458","462"],"label":"arts. 458, 462","highlights":{"458":{"0":["direct",335],"1":["related",198],"2":["related",260],"3":["related",138],"11":["related",228]},"462":{"0":["direct",178],"1":["related",233]}}}]},{"type":"example","text":"Exemplo. Um computador entregue para executar tarefas e uma moradia dada como parte do pagamento têm funções diferentes. Se um equipamento se perde por acidente e não há previsão acordada de desconto, a mera perda não autoriza cobrar automaticamente do empregado. Com dano doloso comprovado, a análise jurídica muda.","refs":[{"law":"CLT","ids":["458","462"],"label":"arts. 458, 462","highlights":{"458":{"0":["direct",335],"3":["direct",138],"2":["related",260],"11":["related",228]},"462":{"1":["direct",233],"0":["related",178]}}}]},{"type":"heading","text":"Como conferir a exceção de gestão"},{"type":"body","text":"Faça dois testes separados. Primeiro, veja se a pessoa realmente exerce gestão, com capacidade decisória e direção do setor. Depois, compare a remuneração do cargo com o salário efetivo acrescido de 40%. Mesmo quem possui autonomia pode ficar no regime de jornada se o patamar não for preenchido.","refs":[{"law":"CLT","ids":["62"],"label":"art. 62","highlights":{"62":{"2":["direct",182],"4":["direct",361],"0":["related",64]}}}]},{"type":"example","text":"Exemplo. Com salário efetivo de R$ 5.000, o patamar é R$ 7.000. Uma gestora com poderes amplos e salário de R$ 6.900 fica abaixo da referência. Uma coordenadora com R$ 7.200 e sem poderes reais tem o problema oposto. Em ambas, a exceção exige a presença dos dois requisitos.","refs":[{"law":"CLT","ids":["62"],"label":"art. 62","highlights":{"62":{"2":["direct",182],"4":["direct",361],"0":["related",64]}}}]},{"type":"heading","text":"Equiparação salarial e comparação de funções"},{"type":"body","text":"Equiparação salarial é a comparação entre dois empregados para verificar se, presentes os requisitos legais, devem receber igual salário pela mesma função. A pessoa usada como referência chama-se paradigma. Compare as tarefas reais, o mesmo empregador, o mesmo estabelecimento e o trabalho de igual valor. Igual valor exige igual produtividade e mesma perfeição técnica. A diferença de tempo de serviço para o mesmo empregador deve ser de até quatro anos e a diferença na função, de até dois anos.","refs":[{"law":"CLT","ids":["461"],"highlights":{"461":{"0":["direct",217],"1":["direct",305],"5":["related",235]}},"label":"art. 461"},{"law":"CF","ids":["7"],"highlights":{"7":{"32":["direct",139],"33":["related",127]}},"label":"art. 7"}]},{"type":"example","text":"Exemplo. Uma pessoa tem três anos a menos na empresa que o paradigma e um ano a menos na função. Em relação ao tempo, ela está dentro dos dois limites. Se a diferença na função fosse de três anos, o resultado desse teste mudaria mesmo com a diferença na empresa dentro do limite. Depois verifique tarefas, produtividade, técnica, estabelecimento e demais requisitos.","refs":[{"law":"CLT","ids":["461"],"highlights":{"461":{"0":["direct",217],"1":["direct",305],"5":["related",235]}},"label":"art. 461"}]},{"type":"body","text":"A contemporaneidade importa. A comparação deve envolver empregados contemporâneos na função, sem usar paradigma remoto. Um quadro de carreira ou plano de cargos e salários adotado nos termos legais pode afastar a regra de equiparação. Trabalhador readaptado em nova função por motivo de deficiência física ou mental atestada pelo órgão competente não serve como paradigma. Distinga a comparação pelos requisitos da equiparação da discussão sobre discriminação salarial.","refs":[{"law":"CLT","ids":["461"],"highlights":{"461":{"2":["direct",291],"4":["direct",202],"5":["direct",235],"3":["related",175],"6":["related",268],"7":["related",326]}},"label":"art. 461"}]},{"type":"example","text":"Exemplo. Duas pessoas têm o mesmo cargo no crachá, mas exercem tarefas diferentes. O nome do cargo sozinho é insuficiente. O inverso também merece análise. Se os nomes são diferentes, mas as tarefas são iguais, examine os requisitos em vez de encerrar a comparação pelo rótulo.","refs":[{"law":"CLT","ids":["461"],"highlights":{"461":{"0":["direct",217],"1":["direct",305],"2":["related",291],"5":["related",235]}},"label":"art. 461"}]},{"type":"prompt","text":"Teste sem olhar. Como diferenciar moradia dada para viabilizar o serviço de moradia fornecida como contraprestação?"}],"mapTitle":"Salário e remuneração","citedArticles":["CLT · arts. 62, 457, 458, 459, 461, 462","CF · art. 7"],"glossary":[{"term":"Salário","meaning":"Contraprestação paga pelo empregador em razão do trabalho, conforme a natureza de cada parcela.","example":"Fixo de R$ 2.600 e comissão de R$ 500 somam R$ 3.100 de salário."},{"term":"Remuneração","meaning":"Na distinção estudada, soma do salário com as gorjetas.","example":"Com R$ 3.100 de salário e R$ 400 de gorjetas, a remuneração soma R$ 3.500."},{"term":"Gorjeta","meaning":"Valor entregue pelo cliente ou cobrado pela empresa para distribuir aos empregados, nas hipóteses legais.","example":"A taxa de serviço destinada à equipe pode compor a remuneração."},{"term":"Salário-utilidade","meaning":"Bem ou serviço fornecido em caráter salarial, observadas as condições e exclusões da lei.","example":"Moradia dada como contraprestação exige análise diferente da moradia indispensável à execução do trabalho."},{"term":"Prêmio","meaning":"Liberalidade concedida por desempenho superior ao ordinariamente esperado, conforme a definição legal.","example":"Pagar um percentual pactuado sobre cada venda habitual pode caracterizar comissão, ainda que a folha diga “prêmio”."},{"term":"Adiantamento","meaning":"Pagamento antecipado de parte de uma quantia que seria paga depois.","example":"O desconto do adiantamento tem fundamento próprio na disciplina salarial."},{"term":"Cargo de gestão","meaning":"Função exercida com poderes efetivos de direção. A exceção estudada também exige a verificação do patamar de remuneração.","example":"Receber o título de gerente e continuar sem poder decisório é insuficiente para demonstrar gestão."},{"term":"Paradigma","meaning":"Empregado usado como referência na comparação para equiparação salarial.","example":"Compare as tarefas reais e verifique o tempo na empresa e na função."},{"term":"Equiparação salarial","meaning":"Direito à igualdade salarial quando se verificam os requisitos legais de comparação.","example":"Ter o mesmo nome no crachá não basta se as atividades reais são diferentes."}],"lesson":{"title":"Salário e remuneração","file":"salario-rafael-aula.mp4","poster":"salario-rafael-aula.jpg"}},{"id":"afastamento","number":8,"semester":2,"map":[["Interrupção","Pausa com salário, em regra","Uma ausência legalmente abonada mantém o vínculo e a remuneração, apesar da pausa na prestação. Férias também exemplificam interrupção."],["Suspensão","Pausa sem salário do empregador, em regra","Durante o benefício por incapacidade, depois do período inicial, a prestação e o salário empresarial ficam suspensos em regra. O vínculo permanece."],["Incapacidade","Primeiros 15 dias a cargo da empresa, em regra","Em afastamento de 40 dias, a empresa paga em regra os primeiros 15. O benefício previdenciário pode começar no 16º dia se atendidos os requisitos."],["Licença acidentária","FGTS continua devido","Durante licença acidentária, o INSS pode pagar o benefício enquanto a empresa segue responsável pelo depósito de FGTS."],["Retorno","Garantia mínima de 12 meses após cessar benefício","O benefício acidentário cessa em fevereiro e a dispensa acontece em agosto. Em tese, ainda resta metade da garantia mínima de 12 meses."],["Doença ocupacional","Nexo reconhecido depois pode alterar os requisitos","Se o nexo causal ou concausal de uma doença ocupacional é demonstrado após a dispensa, a garantia deve ser analisada à luz do Tema 125 do TST."]],"questions":[{"id":"afastamento-1","chapter":"afastamento","level":"B","text":"Durante férias regularmente gozadas, qual é a situação do contrato?","options":["Interrupção","Suspensão disciplinar","Extinção","Licença não remunerada","Rescisão contratual por prazo"],"explanation":"Vínculo e remuneração são mantidos sem prestação de serviço."},{"id":"afastamento-2","chapter":"afastamento","level":"B","text":"Qual duração mínima da garantia após cessar benefício acidentário, na regra do art. 118?","options":["12 meses","Seis meses","30 dias","Três meses","Dois anos"],"explanation":"A contagem se inicia com a cessação do benefício."},{"id":"afastamento-3","chapter":"afastamento","level":"M","text":"Durante licença acidentária, a empresa deve depositar FGTS?","options":["Sim, por previsão específica","Apenas nos dias de retorno","Somente se houver acordo coletivo","Sim, mas apenas se houver ACT prevendo os depósitos na licença","Não, salvo se o segurado tiver sofrido dispensa durante a licença"],"explanation":"O art. 15, § 5º, da Lei 8.036 preserva o depósito nessa licença."},{"id":"afastamento-4","chapter":"afastamento","level":"M","text":"O benefício acidentário cessa e a pessoa é dispensada quatro meses depois. Quanto restava em tese de garantia?","options":["Oito meses","Quatro meses","Doze meses adicionais","Dois meses","Seis meses"],"explanation":"A garantia de 12 meses conta da cessação. Quatro já transcorreram."},{"id":"afastamento-5","chapter":"afastamento","level":"A","text":"Diego foi dispensado sem receber benefício acidentário. Meses depois, perícia reconhece que as tarefas no emprego contribuíram como concausa para a doença ocupacional. A defesa destaca que a doença tinha outros fatores e que o afastamento anterior foi curto. É possível analisar a garantia nos termos do Tema 125?","options":["Sim, o nexo causal ou concausal reconhecido posteriormente é decisivo nessa hipótese","Não, o benefício é indispensável sem exceções","Não, concausa sempre exclui o direito","Apenas se a atividade for causa exclusiva e tiver havido afastamento de 15 dias","Apenas se a empresa já tivesse reconhecido o nexo por escrito antes da dispensa"],"explanation":"A tese repetitiva dispensa afastamento superior a 15 dias e benefício nesse cenário."},{"id":"afastamento-6","chapter":"afastamento","level":"A","text":"Larissa cumpre contrato a termo, sofre acidente de trabalho, recebe benefício acidentário e volta antes do fim ajustado. A empresa a desliga dois meses após a cessação, alegando que o prazo determinado impede garantia. Como decidir sobre a natureza do contrato?","options":["Sim, a Súmula 378 contempla contrato a termo","Não, contrato a termo exclui toda estabilidade","Apenas se o contrato durar ao menos dois anos","A garantia se aplica somente se o contrato já tiver sido convertido em indeterminado na data do acidente","O afastamento suspende a contagem do prazo, mas elimina qualquer garantia após a cessação"],"explanation":"O item III da Súmula 378 admite garantia acidentária também nessa modalidade."},{"chapter":"afastamento","level":"B","text":"Qual efeito é comum à suspensão e à interrupção?","options":["Manutenção do vínculo durante a paralisação","Extinção imediata do contrato","Pagamento obrigatório de salário em todos os casos","Manutenção de todos os depósitos e salários em qualquer hipótese","Retorno automático após exatamente 15 dias em ambos os regimes"],"explanation":"As duas figuras preservam o vínculo. Os efeitos salariais e de tempo podem mudar.","id":"afastamento-7"},{"chapter":"afastamento","level":"B","text":"Qual situação exemplifica interrupção?","options":["Ausência legalmente remunerada","Ruptura por pedido de demissão","Suspensão disciplinar","Afastamento com benefício comum após os 15 dias iniciais","Licença sem remuneração concedida por acordo"],"explanation":"Na ausência abonada não há prestação naquele dia, mas o salário é mantido.","id":"afastamento-8"},{"chapter":"afastamento","level":"B","text":"Quem paga, em regra, os primeiros 15 dias consecutivos de afastamento por incapacidade do empregado?","options":["A empresa","O empregado com valores do FGTS","A tomadora pública sempre","O sindicato profissional","O empregador somente em afastamentos com mais de 30 dias"],"explanation":"A Lei 8.213 atribui o salário desse período inicial à empresa.","id":"afastamento-9"},{"chapter":"afastamento","level":"B","text":"Qual benefício é referência na regra típica de estabilidade após acidente?","options":["Benefício acidentário por incapacidade temporária","Seguro-desemprego","Abono de férias","Abono pecuniário de férias","Auxílio-acidente como requisito único e universal"],"explanation":"O art. 118 usa a cessação do benefício acidentário como marco na hipótese típica.","id":"afastamento-10"},{"chapter":"afastamento","level":"B","text":"O que é reintegração nesse contexto?","options":["Retorno ao vínculo quando cabível após dispensa no período protegido","Pagamento de gorjetas atrasadas","Nova experiência após cada licença","Retorno ao vínculo apenas se houver uma nova contratação após a garantia","Pagamento de multa do FGTS sem retorno ao vínculo"],"explanation":"A reintegração visa recompor o vínculo em hipótese de dispensa incompatível com a garantia.","id":"afastamento-11"},{"chapter":"afastamento","level":"M","text":"Uma empregada goza férias e permanece remunerada pela empresa. Qual quadro se forma?","options":["Vínculo mantido, sem trabalho e com remuneração","Vínculo rompido e sem remuneração","Suspensão sem salário durante todo o gozo","Vínculo mantido com trabalho obrigatório e remuneração integral","Vínculo interrompido em definitivo após o primeiro dia do gozo"],"explanation":"A classificação decorre da ausência de trabalho com manutenção do vínculo e remuneração.","id":"afastamento-12"},{"chapter":"afastamento","level":"M","text":"O benefício acidentário cessou há nove meses na data da dispensa. Quanto resta da garantia mínima em tese?","options":["Três meses","Nove meses","Doze meses a partir da dispensa","Dois meses","Seis meses"],"explanation":"O termo inicial é a cessação. Doze menos nove resulta em três.","id":"afastamento-13"},{"chapter":"afastamento","level":"M","text":"Um empregado está em benefício comum por incapacidade há 40 dias. O benefício se confunde com salário devido pela empresa após o período inicial?","options":["Não. São prestações de responsáveis distintos","Sim. O INSS paga salário por conta da empresa","Sim. O período sempre é remunerado em dobro","Sim, porque vínculo mantido exige sempre que o empregador pague o valor integral","São prestações distintas somente nos primeiros 15 dias"],"explanation":"O benefício previdenciário substitui o salário empresarial nas condições legais após o período inicial.","id":"afastamento-14"},{"chapter":"afastamento","level":"M","text":"Durante licença acidentária, o empregador afirma que não deposita FGTS porque o INSS paga benefício. Qual ponto falta?","options":["Há previsão legal específica para os depósitos durante a licença acidentária","Duas fontes de renda sempre configuram pagamento em dobro","O FGTS só é devido se a empresa pagar salário durante toda a licença","O pagamento do benefício transfere ao INSS o depósito do FGTS","O depósito só é devido durante a licença se previsto em contrato individual"],"explanation":"O art. 15, § 5º, mantém o depósito nessa hipótese.","id":"afastamento-15"},{"chapter":"afastamento","level":"M","text":"Uma falta é abonada e o salário do dia é mantido. Como classificar a pausa?","options":["Interrupção","Suspensão por benefício","Cessação a termo","Suspensão disciplinar","Afastamento acidentário previdenciário"],"explanation":"O fato de não trabalhar em dado dia é compatível com interrupção, se os efeitos salariais são preservados.","id":"afastamento-16"},{"chapter":"afastamento","level":"A","text":"César recebeu benefício comum por incapacidade e foi dispensado após voltar. Sem benefício acidentário, afirma que o trabalho agravou a doença. O empregador diz que só importa a classificação inicial do INSS. Que informação diferencia as hipóteses de garantia estudadas?","options":["Natureza acidentária do benefício ou nexo da doença ocupacional conforme a jurisprudência","Número de faltas no período concessivo","Forma de cálculo de gorjeta","O nome do benefício comum exclui toda discussão, ainda que haja prova posterior do nexo","A estabilidade se aplica a toda incapacidade comum se a dispensa ocorrer em menos de 12 meses"],"explanation":"Benefício comum isolado não demonstra a hipótese típica, e pode haver análise de doença ocupacional com nexo.","id":"afastamento-17"},{"chapter":"afastamento","level":"A","text":"A empregada Natália faltou dez dias por motivo de saúde. Após a dispensa, um laudo reconheceu a atividade laboral como concausa da doença. A empresa usa a falta de benefício acidentário e a ausência inferior a 15 dias como obstáculos definitivos. Qual fundamento enfrenta esses dois argumentos?","options":["Tema 125 do TST e garantia do art. 118","Afastamento superior a 15 dias como exigência universal","Art. 467 porque houve dispensa","Súmula 14 do TST, porque concausa equivale a culpa recíproca","Tema 497 do STF, porque todo nexo deve ser aferido antes da dispensa"],"explanation":"O Tema 125 dispensa os requisitos previdenciários clássicos no cenário descrito.","id":"afastamento-18"},{"chapter":"afastamento","level":"A","text":"Bruno é dispensado durante a garantia acidentária. Na data em que a tutela é examinada, o período protegido já terminou. Ele pede retorno imediato e o empregador afirma que o término afasta todo efeito econômico. Qual consequência pode ser discutida?","options":["Indenização substitutiva pelo período de garantia, conforme o caso","Início de novo prazo integral de 12 meses em qualquer caso","Pagamento apenas de adicional noturno","Pagamento de indenização por todos os meses futuros desde a decisão","Reintegração automática com novo período integral de 12 meses, ainda que o prazo anterior tenha terminado"],"explanation":"A medida deve refletir a duração e a finalidade da garantia.","id":"afastamento-19"},{"chapter":"afastamento","level":"A","text":"Sérgio sofre acidente em março. A concessão do benefício ocorre em abril, a cessação em julho e a dispensa em novembro. A empresa conta a garantia da concessão, enquanto Sérgio conta do acidente. Na hipótese típica, qual marco deve ser usado?","options":["Cessação do benefício em julho","Acidente em março","Dispensa em novembro","A concessão do benefício em abril","O primeiro dia de afastamento que gerou os 15 dias pagos pela empresa"],"explanation":"A regra dos 12 meses se vincula ao fim do benefício acidentário.","id":"afastamento-20"},{"chapter":"afastamento","level":"A","text":"Raquel está na etapa previdenciária de licença acidentária. O RH diz que, por não haver pagamento salarial patronal nessa fase, o vínculo se extinguiu e o FGTS deixou de ser devido. Qual alternativa reúne corretamente os três efeitos?","options":["Benefício do INSS, vínculo suspenso em regra e FGTS devido pela empresa","Salário patronal obrigatório por toda a licença e vínculo extinto","Suspensão com cessação de todos os efeitos trabalhistas incondicionalmente","Benefício do INSS, contrato extinto e FGTS devido apenas até o início da licença","Benefício do INSS, contrato interrompido com salário empresarial obrigatório e FGTS facultativo"],"explanation":"A obrigação específica de FGTS subsiste mesmo com suspensão contratual.","id":"afastamento-21"},{"id":"afastamento-22","chapter":"afastamento","level":"B","text":"Qual marco encerra a garantia constitucional estudada da gestante?","options":["Cinco meses após o parto.","Doze meses após a dispensa.","Um ano depois da candidatura.","Seis meses após a confirmação da gravidez.","Cinco meses após a dispensa."],"explanation":"O ADCT usa o parto como marco para calcular o fim da garantia da gestante."},{"id":"afastamento-23","chapter":"afastamento","level":"B","text":"Qual marco encerra a proteção do representante eleito da CIPA, na regra constitucional?","options":["Um ano depois do fim do mandato.","Cinco meses após o registro da candidatura.","No próprio fim do mandato.","Um ano desde a posse, ainda que o mandato não tenha terminado.","Seis meses depois de encerrado o mandato."],"explanation":"A proteção começa no registro da candidatura e se estende até um ano após o fim do mandato."},{"id":"afastamento-24","chapter":"afastamento","level":"M","text":"Após a dispensa sem justa causa, um exame comprova que a gravidez já existia. A empresa ignorava a gravidez. Qual fator importa ao Tema 497?","options":["A anterioridade da gravidez à dispensa.","O aviso escrito da trabalhadora antes da dispensa.","A data em que o empregador tomou ciência.","A data de conclusão do exame, mesmo se a gravidez for posterior à ruptura.","A existência de comunicação ao sindicato até o dia do desligamento."],"explanation":"A ciência do empregador não integra o critério da tese na hipótese estudada."},{"id":"afastamento-25","chapter":"afastamento","level":"M","text":"Uma pessoa é eleita suplente dos empregados na CIPA. Outra é designada pela empresa para representá-la. Qual enquadramento cabe?","options":["O suplente eleito está abrangido pela garantia estudada. A designação patronal, por si, não gera essa mesma garantia.","Os dois têm a proteção apenas se forem titulares.","Nenhum deles pode ter garantia por não ser titular eleito.","A indicação pela empresa dá a mesma garantia se o indicado integrar a comissão por um ano.","O suplente eleito só é abrangido se assumir efetivamente a titularidade."],"explanation":"A proteção se liga à representação eleita dos empregados e alcança o suplente."},{"id":"afastamento-26","chapter":"afastamento","level":"A","text":"Lúcia foi dispensada grávida; Raul foi eleito representante dos empregados na CIPA; e Miriam teve cessado o benefício acidentário. O RH quer usar os mesmos 12 meses contados da dispensa para os três. Para calcular o fim de cada garantia, de quais marcos, respectivamente, é preciso partir?","options":["Parto, fim do mandato e cessação do benefício.","Dispensa, início da gestação e registro de candidatura.","Parto, registro da candidatura e data de admissão.","Confirmação da gravidez, início do mandato e concessão do benefício.","Parto, registro da candidatura e dispensa após o benefício."],"explanation":"A gestante tem proteção até cinco meses após o parto, a eleita até um ano após o fim do mandato e a acidentária, em regra, 12 meses após cessar o benefício."}],"title":"Suspensão, interrupção e estabilidade acidentária","body":[{"type":"body","text":"Suspensão e interrupção preservam o vínculo durante a paralisação. Na interrupção, em regra, o empregado não trabalha, recebe salário e o tempo é contado. Férias e ausências remuneradas do art. 473 são exemplos. Na suspensão, em regra, não há prestação nem salário pago pelo empregador, e a contagem do tempo depende do efeito jurídico examinado. O afastamento com benefício previdenciário por incapacidade após o período inicial e a suspensão disciplinar ilustram a lógica da suspensão.","refs":[{"law":"CLT","ids":["473","476"],"label":"arts. 473, 476","highlights":{"473":{"0":["direct",85],"1":["related",213]},"476":{"0":["direct",144]}}}]},{"type":"heading","text":"Afastamento e depósito de FGTS"},{"type":"body","text":"No afastamento por incapacidade de empregado, em regra, a empresa paga os primeiros 15 dias e, preenchidos os requisitos, a Previdência assume o benefício a partir do 16º. Se o afastamento é acidentário, a Lei 8.036/1990, art. 15, § 5º, mantém o depósito de FGTS durante a licença. O benefício previdenciário e o depósito de FGTS são obrigações diferentes. A pergunta sobre quem paga a renda do trabalhador deve ser resolvida separadamente da pergunta sobre quem deposita FGTS.","refs":[{"law":"Lei 8.213/1991","ids":["60"],"label":"art. 60","highlights":{"60":{"0":["direct",229],"3":["direct",175],"4":["related",297]}}},{"law":"Lei 8.036/1990","ids":["15"],"label":"art. 15","highlights":{"15":{"5":["direct",170],"0":["related",516]}}}]},{"type":"heading","text":"Estabilidade provisória"},{"type":"body","text":"O art. 118 da Lei 8.213/1991 assegura ao segurado acidentado a manutenção do contrato por pelo menos 12 meses após a cessação do benefício acidentário por incapacidade temporária. No roteiro clássico da Súmula 378 do TST, verifique afastamento superior a 15 dias e percepção do benefício acidentário, com ressalva para doença profissional reconhecida após a dispensa quando há nexo causal. O Tema 125 do TST trata da garantia em caso de nexo causal ou concausal de doença ocupacional reconhecido após o fim do contrato, independentemente desses dois requisitos. A Súmula 378 também prevê a garantia em contrato por prazo determinado.","refs":[{"law":"Lei 8.213/1991","ids":["118"],"label":"art. 118","highlights":{"118":{"0":["direct",252]}}}]},{"type":"body","text":"Se um empregado sofre acidente, recebe benefício acidentário por 60 dias e é dispensado quatro meses após o retorno, situe o retorno após a cessação do benefício numa linha do tempo. Ainda restariam cerca de oito meses da garantia nesse exemplo. Dependendo da situação, podem ser discutidas reintegração durante a garantia ou indenização substitutiva pelo período protegido."},{"type":"heading","text":"Faça três perguntas sobre cada fase"},{"type":"body","text":"Pergunte se há trabalho, se o empregador paga salários e se o vínculo permanece. Depois, analise efeitos específicos, como FGTS, férias e estabilidade. A permanência do vínculo é comum à suspensão e à interrupção. Já o dever de pagar e o efeito sobre a contagem do tempo dependem da hipótese.","refs":[{"law":"CLT","ids":["473","476"],"label":"arts. 473, 476","highlights":{"473":{"0":["direct",85],"1":["related",213]},"476":{"0":["direct",144]}}},{"law":"Lei 8.036/1990","ids":["15"],"label":"art. 15","highlights":{"15":{"5":["direct",170],"0":["related",516]}}}]},{"type":"example","text":"Exemplo. Uma falta legalmente abonada impede a prestação sem retirar o salário. No afastamento previdenciário comum, após o período inicial, o benefício substitui o salário pago pela empresa nas condições legais. Na licença acidentária, mesmo quando o INSS paga o benefício, o FGTS é devido.","refs":[{"law":"CLT","ids":["473","476"],"label":"arts. 473, 476","highlights":{"473":{"0":["direct",85],"1":["related",213]},"476":{"0":["direct",144]}}},{"law":"Lei 8.213/1991","ids":["60"],"label":"art. 60","highlights":{"60":{"0":["direct",229],"3":["direct",175],"4":["related",297]}}},{"law":"Lei 8.036/1990","ids":["15"],"label":"art. 15","highlights":{"15":{"5":["direct",170],"0":["related",516]}}}]},{"type":"heading","text":"Estabilidade e efeitos do desligamento"},{"type":"body","text":"Separe o acidente ou doença, o período do benefício, sua cessação e a data da dispensa. O art. 118 fixa garantia mínima de 12 meses após cessar o benefício acidentário. Em doença ocupacional cujo nexo causal ou concausal surge comprovado após a ruptura, consulte o Tema 125 do TST. A prova do nexo muda a análise do requisito previdenciário.","refs":[{"law":"Lei 8.213/1991","ids":["118"],"label":"art. 118","highlights":{"118":{"0":["direct",252]}}}]},{"type":"example","text":"Exemplo. Benefício acidentário cessa em 10 de fevereiro e a dispensa ocorre em 10 de agosto, seis meses depois. Em tese, resta metade do prazo de 12 meses. Durante a garantia, discute-se reintegração. Se o período protegido já terminou, pode caber indenização substitutiva conforme as circunstâncias.","refs":[{"law":"Lei 8.213/1991","ids":["118"],"label":"art. 118","highlights":{"118":{"0":["direct",252]}}}]},{"type":"body","text":"Mantenha separados acidente de trabalho, incapacidade e doença ocupacional. Um acidente é um fato. Benefício depende dos seus requisitos. Garantia de emprego tem fundamento próprio. Um enunciado pode testar apenas o FGTS do afastamento sem perguntar pela estabilidade do retorno.","refs":[{"law":"Lei 8.213/1991","ids":["60","118"],"label":"arts. 60, 118","highlights":{"60":{"0":["direct",229],"3":["direct",175],"4":["related",297]},"118":{"0":["direct",252]}}},{"law":"Lei 8.036/1990","ids":["15"],"label":"art. 15","highlights":{"15":{"5":["direct",170],"0":["related",516]}}}]},{"type":"heading","text":"Estabilidade da gestante"},{"type":"body","text":"O ADCT veda a dispensa arbitrária ou sem justa causa da empregada gestante desde a confirmação da gravidez até cinco meses após o parto. No Tema 497, o STF fixou que, para a proteção na dispensa sem justa causa, o fato relevante é a gravidez ser anterior à dispensa. O conhecimento do empregador não é requisito. A CLT também contempla gravidez ocorrida durante o aviso prévio trabalhado ou indenizado. Garantia de emprego e licença-maternidade são institutos distintos.","refs":[{"law":"ADCT","ids":["10"],"highlights":{"10":{"2":["direct",58],"4":["direct",87],"3":["related",169]}},"label":"art. 10"},{"law":"CLT","ids":["391-A"],"highlights":{"391-A":{"0":["direct",310]}},"label":"art. 391-A"},{"law":"CF","ids":["7"],"highlights":{"7":{"18":["direct",102],"20":["related",99]}},"label":"art. 7"}]},{"type":"example","text":"Exemplo. A pessoa é dispensada sem justa causa e só descobre a gravidez dias depois. Se a gravidez já existia na data juridicamente relevante, o desconhecimento não elimina a garantia. Marque na linha do tempo o início da gravidez, a dispensa com eventual projeção do aviso e o parto.","refs":[{"law":"ADCT","ids":["10"],"highlights":{"10":{"4":["direct",87],"2":["related",58]}},"label":"art. 10"},{"law":"CLT","ids":["391-A"],"highlights":{"391-A":{"0":["direct",310]}},"label":"art. 391-A"}]},{"type":"body","text":"Em questão sobre contrato com prazo, identifique o regime antes da conclusão. Contrato de experiência da CLT, trabalho temporário da Lei 6.019 e contratação por prazo determinado pela Administração Pública são figuras diferentes. No IAC 2, o TST firmou tese de inaplicabilidade da garantia ao trabalho temporário da Lei 6.019. Para o contrato de experiência, consulte a regra do item III da Súmula 244 do TST sobre contrato por tempo determinado. Para o contexto de contratação administrativa examinado pelo STF, confira o Tema 542.","refs":[{"law":"ADCT","ids":["10"],"highlights":{"10":{"4":["direct",87],"2":["related",58]}},"label":"art. 10"},{"law":"CLT","ids":["443"],"highlights":{"443":{"5":["direct",30],"0":["related",200],"2":["related",68]}},"label":"art. 443"},{"law":"Lei 6.019/1974","ids":["2"],"highlights":{"2":{"0":["direct",292],"2":["related",191]}},"label":"art. 2"}]},{"type":"link","text":"STF • Tema 497 e gravidez anterior à dispensa","url":"https://portal.stf.jus.br/processos/listarProcessos.asp?classe=RE&numeroProcesso=629053"},{"type":"link","text":"STF • Tema 542 e contratação pela Administração Pública","url":"https://portal.stf.jus.br/jurisprudenciaRepercussao/tema.asp?num=542"},{"type":"link","text":"TST • IAC 2 e trabalho temporário da Lei 6.019","url":"https://www.tst.jus.br/documents/d/guest/indice-tematico-atualizado-com-capa-01_08_2025-pdf"},{"type":"heading","text":"Garantia do representante eleito da CIPA"},{"type":"body","text":"A Comissão Interna de Prevenção de Acidentes e de Assédio tem representantes do empregador designados e representantes dos empregados eleitos. A garantia constitucional protege o empregado eleito desde o registro da candidatura até um ano após o fim do mandato. O suplente eleito também é protegido, conforme a Súmula 676 do STF e o Tema 284 do TST. A CLT define despedida arbitrária para esse fim e atribui ao empregador a prova do motivo alegado em caso de reclamação.","refs":[{"law":"CLT","ids":["163","164","165"],"highlights":{"163":{"0":["direct",256]},"164":{"1":["direct",218],"2":["direct",201],"0":["related",202],"3":["related",97]},"165":{"0":["direct",205],"1":["direct",292]}},"label":"arts. 163, 164, 165"},{"law":"ADCT","ids":["10"],"highlights":{"10":{"2":["direct",58],"3":["direct",169],"4":["related",87]}},"label":"art. 10"}]},{"type":"example","text":"Exemplo. Ana é eleita suplente da representação dos empregados. Bruno é designado pela empresa para representá-la. A garantia examinada tem como base a eleição para a representação dos empregados. A simples designação de Bruno não gera a mesma proteção.","refs":[{"law":"CLT","ids":["164"],"highlights":{"164":{"1":["direct",218],"2":["direct",201],"0":["related",202]}},"label":"art. 164"},{"law":"ADCT","ids":["10"],"highlights":{"10":{"3":["direct",169],"2":["related",58]}},"label":"art. 10"}]},{"type":"link","text":"TST • Tema 284 e proteção do suplente eleito","url":"https://www.tst.jus.br/documents/d/guest/irr284-2-pdf"},{"type":"heading","text":"Compare os marcos das três garantias"},{"type":"bullet","text":"Gestante. Use a gravidez e o parto como marcos. A proteção vai até cinco meses depois do parto.","refs":[{"law":"ADCT","ids":["10"],"highlights":{"10":{"4":["direct",87],"2":["related",58]}},"label":"art. 10"}]},{"type":"bullet","text":"CIPA. Use o registro da candidatura e o fim do mandato. A garantia do eleito vai até um ano depois do mandato.","refs":[{"law":"ADCT","ids":["10"],"highlights":{"10":{"3":["direct",169],"2":["related",58]}},"label":"art. 10"}]},{"type":"bullet","text":"Acidentária. Na hipótese típica, use a cessação do benefício acidentário como termo inicial dos 12 meses. Em doença ocupacional reconhecida depois, confira a exceção explicada neste capítulo.","refs":[{"law":"Lei 8.213/1991","ids":["118"],"highlights":{"118":{"0":["direct",252]}},"label":"art. 118"}]},{"type":"prompt","text":"Teste sem olhar. No afastamento acidentário, continuaram o vínculo, o salário empresarial, o FGTS e a proteção após o benefício? Em que fase muda cada resposta?"}],"mapTitle":"Contrato durante o afastamento","citedArticles":["CLT · arts. 163, 164, 165, 391-A, 443, 473, 476","Lei 8.213/1991 · arts. 60, 118","Lei 8.036/1990 · art. 15","ADCT · art. 10","CF · art. 7","Lei 6.019/1974 · art. 2"],"glossary":[{"term":"Interrupção do contrato","meaning":"Pausa da prestação durante a qual, em regra, remuneração e vínculo são mantidos.","example":"Uma ausência legalmente abonada exemplifica interrupção."},{"term":"Suspensão do contrato","meaning":"Pausa com vínculo preservado em que, em regra, cessam trabalho e salário empresarial no período.","example":"Pode ocorrer durante a etapa previdenciária de um afastamento por incapacidade."},{"term":"Benefício acidentário","meaning":"Benefício previdenciário relacionado a acidente de trabalho ou situação legalmente equiparada, nos termos aplicáveis.","example":"Na situação típica estudada, a cessação do benefício marca o início da garantia de emprego."},{"term":"FGTS","meaning":"Fundo de Garantia do Tempo de Serviço. Os depósitos seguem regras próprias.","example":"Na licença acidentária, o depósito pode continuar enquanto o benefício é pago pelo INSS."},{"term":"Nexo causal","meaning":"Ligação entre a atividade laboral e o dano ou doença.","example":"Um laudo pode ajudar a demonstrar a relação entre a atividade e a doença."},{"term":"Concausa","meaning":"Fator que contribui para o resultado junto com outras causas.","example":"A atividade pode agravar uma condição existente. A contribuição e o nexo precisam ser demonstrados."},{"term":"Reintegração","meaning":"Retorno ao vínculo após desligamento incompatível com a proteção aplicável, quando cabível.","example":"Na estabilidade acidentária, pode ser discutida se ainda está em curso o período protegido."},{"term":"Garantia provisória de emprego","meaning":"Proteção contra determinadas dispensas durante um período definido.","example":"A estabilidade gestante, a acidentária e a do eleito da CIPA têm marcos diferentes."},{"term":"CIPA","meaning":"Comissão Interna de Prevenção de Acidentes e de Assédio.","example":"A garantia estudada se liga à representação eleita dos empregados e alcança o suplente eleito."}],"lesson":{"title":"Suspensão e interrupção","file":"afastamento-rafael-aula.mp4","poster":"afastamento-rafael-aula.jpg"}},{"id":"ferias","number":9,"semester":2,"map":[["Aquisição","Em regra, após 12 meses","A admissão em 1º de março inicia o período aquisitivo. Em regra, o direito se completa no fim de fevereiro do ano seguinte."],["Faltas","Use as faixas do art. 130","Dez faltas injustificadas e quatro ausências legais justificadas contam como dez faltas para a tabela. O resultado é 24 dias."],["Concessão","Nos 12 meses seguintes","Adquirido o direito, marque a data final do período concessivo. O começo de cada bloco também deve respeitar a regra de feriado e repouso."],["Fracionamento","Até três períodos com mínimos de 14 e 5 dias","Com 24 dias e concordância do empregado, 14 + 5 + 5 funciona. Com 18 dias, 14 + 4 fica abaixo do mínimo do segundo bloco."],["Abono","Até um terço conforme pedido","Com 24 dias adquiridos, é possível converter até oito em abono. O pedido deve anteceder em pelo menos 15 dias o fim do aquisitivo."],["Atrasos","Dobra pelo gozo tardio e prazo próprio para pagar","Com oito dias gozados após o concessivo, esses oito entram na dobra. Pagamento tardio com todo o gozo no prazo tem consequência diferente."]],"questions":[{"id":"ferias-1","chapter":"ferias","level":"B","text":"Qual é o prazo geral do período concessivo após adquirir o direito?","options":["12 meses","Seis meses","30 dias","18 meses","24 meses"],"explanation":"No ciclo usual, os 12 meses seguintes ao aquisitivo são destinados à concessão."},{"id":"ferias-2","chapter":"ferias","level":"B","text":"Quantos dias de férias correspondem a 16 faltas injustificadas no período?","options":["18 dias","16 dias","14 dias","24 dias","30 dias"],"explanation":"A faixa de 15 a 23 faltas do art. 130 dá 18 dias."},{"id":"ferias-3","chapter":"ferias","level":"M","text":"Com concordância do empregado, qual fracionamento de 30 dias observa os mínimos legais?","options":["14 + 8 + 8","12 + 10 + 8","20 + 7 + 3","16 + 10 + 4","13 + 9 + 8"],"explanation":"Um período deve ter pelo menos 14 dias e cada um dos demais cinco dias ou mais."},{"id":"ferias-4","chapter":"ferias","level":"M","text":"O repouso semanal cai no domingo e o feriado cai na quarta-feira. Considerando somente a vedação dos dois dias anteriores e as cinco datas indicadas nas alternativas, em qual dia daquela semana as férias podem começar?","options":["Quinta-feira","Sexta-feira","Sábado","Segunda-feira","Terça-feira"],"explanation":"Segunda e terça antecedem o feriado de quarta. Sexta e sábado antecedem o repouso de domingo. Entre as alternativas, quinta-feira está fora dessas vedações."},{"id":"ferias-5","chapter":"ferias","level":"A","text":"Valéria tinha 30 dias de férias. Vinte foram gozados até o último dia do período concessivo e dez foram gozados depois dele. A empresa também pagou a remuneração no primeiro dia de gozo. Sem outra causa de dobra, quantos dias ficam sujeitos à dobra do art. 137?","options":["Dez dias","Trinta dias","Nenhum dia","Vinte dias, porque esse é o bloco em que o pagamento deveria ter sido adiantado","Dois dias, porque a antecedência do pagamento é o único limite relevante"],"explanation":"A concessão tardia alcança dez dias. O atraso no pagamento isoladamente não estende a dobra, conforme a ADPF 501."},{"id":"ferias-6","chapter":"ferias","level":"A","text":"Tatiane teve 18 dias de férias após a aplicação da faixa de faltas. Ela pediu, 20 dias antes do término do aquisitivo, a conversão do maior número de dias admitido. A empresa sugere usar um terço de 30 dias porque esse é o período padrão. Qual solução respeita a regra?","options":["Converter seis dias, com pedido realizado no prazo","Converter dez dias porque o teto é fixo","Converter seis dias somente se pedir após o aquisitivo","Converter quatro dias porque a falta de 12 dias reduz o abono na mesma proporção","Converter seis dias somente se o pedido for reapresentado nos 15 primeiros dias do concessivo"],"explanation":"O limite é um terço dos dias a que tem direito e o pedido deve anteceder em pelo menos 15 dias o fim do aquisitivo."},{"chapter":"ferias","level":"B","text":"Em regra, quanto dura o período aquisitivo de férias?","options":["12 meses","30 dias","Seis meses","24 meses","18 meses"],"explanation":"O aquisitivo costuma durar os primeiros 12 meses. Depois começa o concessivo.","id":"ferias-7"},{"chapter":"ferias","level":"B","text":"Qual adicional mínimo acompanha a remuneração de férias?","options":["Um terço","Um quarto","Metade","Um quinto","Dois terços"],"explanation":"A Constituição assegura pelo menos um terço a mais que o salário normal.","id":"ferias-8"},{"chapter":"ferias","level":"B","text":"Qual é a antecedência geral mínima para comunicação escrita de férias?","options":["30 dias","Dois dias","15 dias","Cinco dias","45 dias"],"explanation":"O art. 135 trata da comunicação. Os outros números aparecem em regras diferentes.","id":"ferias-9"},{"chapter":"ferias","level":"B","text":"Qual é o prazo legal para pagar antes do início das férias?","options":["Até dois dias antes","Até o próprio início sem restrição","Até 30 dias depois do fim","Até cinco dias antes","Até o fim do mês de início do gozo"],"explanation":"O art. 145 exige antecipação do pagamento.","id":"ferias-10"},{"chapter":"ferias","level":"B","text":"O que é abono pecuniário de férias?","options":["Conversão de até um terço dos dias a que o empregado tem direito em dinheiro","Dobra de todos os dias pagos tarde","Autorização para vender todo o descanso","Conversão compulsória de metade do descanso por iniciativa do empregador","Pagamento extra de um terço sem converter nenhum dia de férias"],"explanation":"O art. 143 preserva a maior parte do período de gozo.","id":"ferias-11"},{"chapter":"ferias","level":"M","text":"Um empregado tem oito faltas injustificadas no aquisitivo. Quantos dias de férias daí resultam?","options":["24 dias","22 dias","30 dias","18 dias","12 dias"],"explanation":"Oito faltas caem na faixa de 6 a 14, com 24 dias.","id":"ferias-12"},{"chapter":"ferias","level":"M","text":"Com 25 faltas injustificadas no período, qual é o número de dias?","options":["12 dias","18 dias","Cinco dias","24 dias","30 dias"],"explanation":"A faixa de 24 a 32 faltas corresponde a 12 dias.","id":"ferias-13"},{"chapter":"ferias","level":"M","text":"A empresa pretende conceder 24 dias em três períodos com concordância. Qual divisão é válida quanto aos mínimos?","options":["14 + 5 + 5","12 + 6 + 6","15 + 6 + 3","14 + 6 + 4","13 + 6 + 5"],"explanation":"Um período deve ter pelo menos 14 dias e cada restante, pelo menos cinco.","id":"ferias-14"},{"chapter":"ferias","level":"M","text":"Uma pessoa goza férias no prazo e recebe o pagamento no próprio início. A dobra do art. 137 é automática?","options":["Não. Pagamento tardio isolado não gera automaticamente a dobra","Sim. Todo atraso de pagamento gera dobra","Sim, mas apenas se o fracionamento for em três blocos","Sim, porque o início do gozo é o marco que gera automaticamente a dobra por pagamento","Não, porque o art. 145 permite pagar em qualquer dia do gozo"],"explanation":"O art. 145 impõe prazo de pagamento e a ADPF 501 afastou a antiga extensão automática da dobra.","id":"ferias-15"},{"chapter":"ferias","level":"M","text":"Há feriado na quinta-feira e o repouso semanal ocorre no domingo. Entre os cinco dias indicados nas alternativas, em qual deles as férias podem começar, considerando apenas a vedação dos dois dias anteriores?","options":["Segunda-feira","Terça-feira","Quarta-feira","Sexta-feira","Sábado"],"explanation":"Terça e quarta antecedem o feriado. Sexta e sábado antecedem o repouso semanal. Entre as alternativas, segunda-feira é permitida.","id":"ferias-16"},{"chapter":"ferias","level":"A","text":"Alberto completou o aquisitivo em 31/01/2026 e tinha 24 dias de férias. O concessivo terminou em 31/01/2027. Dos 24 dias efetivamente gozados, 15 caíram em janeiro e nove em fevereiro de 2027. O pagamento foi tempestivo. Quantos dias entram na dobra por concessão tardia?","options":["Nove dias","24 dias","15 dias","Sete dias, descontando a antecedência exigida para pagamento","Nenhum, porque o pagamento tempestivo sana a concessão tardia"],"explanation":"A dobra alcança os dias de gozo que ultrapassaram o limite do concessivo.","id":"ferias-17"},{"chapter":"ferias","level":"A","text":"Mirela teve 14 faltas injustificadas e cinco ausências justificadas que se enquadram no art. 131. O RH soma as 19 ausências e quer fixar o abono com base no resultado. Quantos dias de férias ela tem e qual é o maior número de dias que pode converter?","options":["24 dias de férias e até oito dias de abono","18 dias de férias e até seis dias de abono","24 dias de férias e até dez dias de abono","30 dias de férias e até dez dias de abono","18 dias de férias e até oito dias de abono"],"explanation":"Conte somente 14 faltas. Um terço de 24 corresponde a oito.","id":"ferias-18"},{"chapter":"ferias","level":"A","text":"Júlio tem 18 dias de férias depois de 23 faltas injustificadas. Ele concorda em fracionar e a empresa estuda duas propostas de gozo, sem abono. É possível dividir esses 18 dias em dois blocos respeitando ambos os mínimos legais?","options":["Não. O mínimo combinado é 19 dias para dois blocos","Sim, 14 + 4 respeita o mínimo","Sim, 9 + 9 respeita o mínimo","Sim, 13 + 5 é válido porque só um bloco precisa alcançar cinco dias","Sim, 15 + 3 é válido se Júlio concordar expressamente"],"explanation":"Um dos blocos precisa de 14 dias e o outro de pelo menos cinco.","id":"ferias-19"},{"chapter":"ferias","level":"A","text":"Na mesma etapa aquisitiva, Débora recebeu benefício previdenciário por doença em três períodos que somam sete meses. Entre os afastamentos ela trabalhou regularmente. O RH quer contar apenas o maior afastamento contínuo. Qual regra deve ser aplicada ao direito às férias desse período?","options":["Art. 133 da CLT, que prevê perda do direito nessa hipótese legal","Art. 130 apenas, contando cada mês como uma falta","Art. 479, que converte a ausência em indenização","Art. 133 da CLT, mas somente se os sete meses forem consecutivos","Art. 134 da CLT, para apenas adiar o período concessivo pelo número de meses do benefício"],"explanation":"O art. 133 trata de benefícios recebidos por mais de seis meses, mesmo descontínuos, no aquisitivo.","id":"ferias-20"},{"chapter":"ferias","level":"A","text":"Bernardo tem direito a 30 dias e pede converter dez em abono faltando dez dias para encerrar o aquisitivo. A empresa reconhece que dez é um terço, mas discute se o pedido foi feito a tempo. Qual requisito de prazo não foi observado?","options":["Antecedência de pelo menos 15 dias antes do fim do aquisitivo","O máximo seria de apenas cinco dias","O pedido depende de ser feito no fim do concessivo","Apresentar o pedido 30 dias antes do início do gozo, independentemente do aquisitivo","Apresentar o pedido nos primeiros 15 dias do período concessivo"],"explanation":"O cálculo dos dias está dentro de um terço, mas a antecedência é insuficiente.","id":"ferias-21"}],"title":"Férias e proteção do trabalhador","body":[{"type":"body","text":"A Constituição garante férias anuais remuneradas com pelo menos um terço a mais que o salário normal (art. 7º, XVII). Após os primeiros 12 meses, em regra, completa-se o período aquisitivo. Nos 12 meses seguintes ocorre o período concessivo. Exemplo. Admissão em 1º de março de 2025. Período aquisitivo até 28 de fevereiro de 2026 e concessivo de 1º de março de 2026 a 28 de fevereiro de 2027.","refs":[{"law":"CF","ids":["7"],"label":"art. 7","highlights":{"7":{"17":["direct",98],"0":["related",116]}}},{"law":"CLT","ids":["129","134"],"label":"arts. 129, 134","highlights":{"129":{"0":["direct",110]},"134":{"0":["direct",163],"1":["related",240],"3":["related",116]}}}]},{"type":"heading","text":"Faltas e perda do direito"},{"type":"body","text":"O art. 130 usa faixas de faltas injustificadas no período aquisitivo. De 0 a 5 faltas, 30 dias corridos. De 6 a 14, 24 dias. De 15 a 23, 18 dias. De 24 a 32, 12 dias. Acima de 32, perde-se o direito às férias daquele período. As faltas não são deduzidas uma a uma. Com 16 faltas injustificadas, por exemplo, a faixa é de 18 dias. Ausências enquadradas no art. 131 ficam fora dessa contagem. O art. 133 traz outras hipóteses de perda, como percepção de benefício previdenciário por acidente ou doença por mais de seis meses, ainda que descontínuos, no período aquisitivo.","refs":[{"law":"CLT","ids":["130","131","133"],"label":"arts. 130, 131, 133","highlights":{"130":{"0":["direct",141],"1":["direct",92],"2":["direct",91],"3":["direct",95],"4":["direct",100],"5":["related",81],"6":["related",87]},"131":{"0":["direct",109],"1":["related",36],"3":["related",160],"4":["related",118]},"133":{"0":["direct",84],"4":["direct",147],"6":["related",163]}}}]},{"type":"heading","text":"Concessão fracionamento e abono"},{"type":"body","text":"Por regra, o empregador define a época, observado o período concessivo. Deve comunicar por escrito com pelo menos 30 dias. Com concordância do empregado, as férias podem ser divididas em até três períodos. Um deve ter ao menos 14 dias corridos e os demais ao menos cinco cada. Uma divisão 14 + 8 + 8 é possível para 30 dias, satisfeitas as demais condições. As férias não podem começar nos dois dias anteriores a feriado ou repouso semanal remunerado. Com descanso no domingo, sexta e sábado estão vedados. O empregado pode pedir a conversão de até um terço do período em abono pecuniário até 15 dias antes de terminar o período aquisitivo (art. 143).","refs":[{"law":"CLT","ids":["134","135","143"],"label":"arts. 134, 135, 143","highlights":{"134":{"0":["direct",163],"1":["direct",240],"3":["direct",116]},"135":{"0":["direct",173],"3":["related",245]},"143":{"0":["direct",192],"1":["direct",202],"2":["related",262]}}}]},{"type":"heading","text":"Concessão tardia e pagamento tardio"},{"type":"body","text":"O pagamento deve ocorrer até dois dias antes do início do gozo (art. 145). Se parte do descanso ocorrer depois do período concessivo, os dias gozados fora do prazo são remunerados em dobro, conforme o art. 137 e a Súmula 81 do TST. Se 20 dias forem gozados no prazo e 10 após o limite, somente os 10 entram na dobra. Já o atraso apenas no pagamento, com gozo no prazo, não gera automaticamente essa dobra. O STF invalidou a Súmula 450 na ADPF 501.","refs":[{"law":"CLT","ids":["145","137"],"label":"arts. 145, 137","highlights":{"145":{"0":["direct",169],"1":["related",171]},"137":{"0":["direct",140],"1":["related",179]}}}]},{"type":"heading","text":"Três datas resolvem boa parte das questões"},{"type":"body","text":"Escreva o início e o fim do período aquisitivo, o fim do concessivo e o início efetivo de cada bloco de gozo. Depois, conte faltas injustificadas dentro do aquisitivo, aplique a faixa legal e verifique as faltas excluídas. Férias são um direito ao descanso remunerado e produzem efeitos no tempo de serviço.","refs":[{"law":"CLT","ids":["129","130","131","134"],"label":"arts. 129, 130, 131, 134","highlights":{"129":{"0":["direct",110]},"130":{"0":["direct",141],"1":["direct",92],"2":["direct",91],"3":["direct",95],"4":["direct",100],"6":["direct",87],"5":["related",81]},"131":{"0":["direct",109],"1":["related",36],"3":["related",160],"4":["related",118]},"134":{"0":["direct",163],"1":["related",240],"3":["related",116]}}}]},{"type":"example","text
