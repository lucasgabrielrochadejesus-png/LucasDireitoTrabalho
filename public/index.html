pela Lei nº 6.449, de 14/10/1977)","§ 2º Havendo concordata na falência, será facultado aos contratantes tornar sem efeito a rescisão do contrato de trabalho e conseqüente indenização, desde que o empregador pague, no mínimo, a metade dos salários que seriam devidos ao empregado durante o interregno."],"450":["Art. 450. Ao empregado chamado a ocupar, em comissão, interinamente, ou em substituição eventual ou temporária, cargo diverso do que exercer na empresa, serão garantidas a contagem do tempo naquele serviço, bem como volta ao cargo anterior."],"453":["Art. 453. No tempo de serviço do empregado, quando readmitido, serão computados os períodos, ainda que não contínuos, em que tiver trabalhado anteriormente na empresa, salvo se houver sido despedido por falta grave, recebido indenização legal ou se aposentado espontaneamente. (“Caput” do artigo com redação dada pela Lei nº 6.204, de 29/4/1975)","§ 1º (Declarado inconstitucional, em controle concentrado, pelo Supremo Tribunal Federal, pela ADIN N.º 1.770-4, publicada no DO de 20/10/2006)","§ 2º (Declarado inconstitucional, em controle concentrado, pelo Supremo Tribunal Federal, pela ADIN N.º 1.721-3, publicada no DO de 20/10/2006)"],"454":["Art. 454. Na vigência do contrato de trabalho, as invenções do empregado, quando decorrentes de sua contribuição pessoal e da instalação ou equipamento fornecidos pelo empregador, serão de propriedade comum, em partes iguais, salvo se o contrato de trabalho tiver por objeto, implícita ou explicitamente, pesquisa científica.","Parágrafo único. Ao empregador caberá a exploração do invento, ficando obrigado a promovê-la no prazo de um ano da data da concessão da patente, sob pena de reverter em favor do empregado a plena propriedade desse invento. (Vide Lei nº 9.279, de 14/5/1996)"],"455":["Art. 455. Nos contratos de subempreitada responderá o subempreiteiro pelas obrigações derivadas do contrato de trabalho que celebrar, cabendo, todavia, aos empregados, o direito de reclamação contra o empreiteiro principal pelo inadimplemento daquelas obrigações por parte do primeiro.","Parágrafo único. Ao empreiteiro principal fica ressalvada, nos termos da lei civil, ação regressiva contra o subempreiteiro e a retenção de importâncias a este devidas, para a garantia das obrigações previstas neste artigo."],"456":["Art. 456. A prova do contrato individual do trabalho será feita pelas anotações constantes da Carteira de Trabalho e Previdência Social ou por instrumento escrito e suprida por todos os meios permitidos em direito. (Expressão “carteira profissional” substituída por “Carteira de Trabalho e Previdência Social” pelo Decreto-Lei nº 926, de 10/10/1969)","Parágrafo único. À falta de prova ou inexistindo cláusula expressa a tal respeito, entender-se-á que o empregado se obrigou a todo e qualquer serviço compatível com a sua condição pessoal."],"456-A":["Art. 456-A. Cabe ao empregador definir o padrão de vestimenta no meio ambiente laboral, sendo lícita a inclusão no uniforme de logomarcas da própria empresa ou de empresas parceiras e de outros itens de identificação relacionados à atividade desempenhada.","Parágrafo único. A higienização do uniforme é de responsabilidade do trabalhador, salvo nas hipóteses em que forem necessários procedimentos ou produtos diferentes dos utilizados para a higienização das vestimentas de uso comum. (Artigo acrescido pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)"],"10":["Art. 10. Qualquer alteração na estrutura jurídica da empresa não afetará os direitos adquiridos por seus empregados."],"10-A":["Art. 10-A. O sócio retirante responde subsidiariamente pelas obrigações trabalhistas da sociedade relativas ao período em que figurou como sócio, somente em ações ajuizadas até dois anos depois de averbada a modificação do contrato, observada a seguinte ordem de preferência:","I - a empresa devedora;","II - os sócios atuais; e","III - os sócios retirantes.","Parágrafo único. O sócio retirante responderá solidariamente com os demais quando ficar comprovada fraude na alteração societária decorrente da modificação do contrato. (Artigo acrescido pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)"],"11":["Art. 11. A pretensão quanto a créditos resultantes das relações de trabalho prescreve em cinco anos para os trabalhadores urbanos e rurais, até o limite de dois anos após a extinção do contrato de trabalho. (“Caput” do artigo com redação dada pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","I - (Inciso acrescido pela Lei nº 9.658, de 5/6/1998, e revogado pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","II - (Inciso acrescido pela Lei nº 9.658, de 5/6/1998, e revogado pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 1º O disposto neste artigo não se aplica às ações que tenham por objeto anotações para fins de prova junto à Previdência Social. (Parágrafo acrescido pela Lei nº 9.658, de 5/6/1998)","§ 2º Tratando-se de pretensão que envolva pedido de prestações sucessivas decorrente de alteração ou descumprimento do pactuado, a prescrição é total, exceto quando o direito à parcela esteja também assegurado por preceito de lei. (Parágrafo acrescido pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 3º A interrupção da prescrição somente ocorrerá pelo ajuizamento de reclamação trabalhista, mesmo que em juízo incompetente, ainda que venha a ser extinta sem resolução do mérito, produzindo efeitos apenas em relação aos pedidos idênticos. (Parágrafo acrescido pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)"],"11-A":["Art. 11-A. Ocorre a prescrição intercorrente no processo do trabalho no prazo de dois anos.","§ 1º A fluência do prazo prescricional intercorrente inicia-se quando o exequente deixa de cumprir determinação judicial no curso da execução.","§ 2º A declaração da prescrição intercorrente pode ser requerida ou declarada de ofício em qualquer grau de jurisdição. (Artigo acrescido pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)"],"59-A":["Art. 59-A. Em exceção ao disposto no art. 59 desta Consolidação, é facultado às partes, mediante acordo individual escrito, convenção coletiva ou acordo coletivo de trabalho, estabelecer horário de trabalho de doze horas seguidas por trinta e seis horas ininterruptas de descanso, observados ou indenizados os intervalos para repouso e alimentação.","Parágrafo único. A remuneração mensal pactuada pelo horário previsto no caput deste artigo abrange os pagamentos devidos pelo descanso semanal remunerado e pelo descanso em feriados, e serão considerados compensados os feriados e as prorrogações de trabalho noturno, quando houver, de que tratam o art. 70 e o § 5º do art. 73 desta Consolidação. (Artigo acrescido pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)"],"59-B":["Art. 59-B. O não atendimento das exigências legais para compensação de jornada, inclusive quando estabelecida mediante acordo tácito, não implica a repetição do pagamento das horas excedentes à jornada normal diária se não ultrapassada a duração máxima semanal, sendo devido apenas o respectivo adicional.","Parágrafo único. A prestação de horas extras habituais não descaracteriza o acordo de compensação de jornada e o banco de horas. (Artigo acrescido pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)"],"66":["Art. 66. Entre 2 (duas) jornadas de trabalho haverá um período mínimo de 11 (onze) horas consecutivas para descanso."],"67":["Art. 67. Será assegurado a todo empregado um descanso semanal de 24 (vinte e quatro) horas consecutivas, o qual, salvo motivo de conveniência pública ou necessidade imperiosa do serviço, deverá coincidir com o domingo, no todo ou em parte.","Parágrafo único. Nos serviços que exijam trabalho aos domingos, com exceção quanto aos elencos teatrais, será estabelecida escala de revezamento, mensalmente organizada e constando do quadro sujeito à fiscalização."],"71":["Art. 71. Em qualquer trabalho contínuo, cuja duração exceda de 6 (seis) horas, é obrigatória a concessão de um intervalo para repouso ou alimentação, o qual será, no mínimo, de 1 (uma) hora e, salvo acordo escrito ou contrato coletivo em contrário, não poderá exceder de 2 (duas) horas.","§ 1º Não excedendo de 6 (seis) horas o trabalho, será, entretanto, obrigatório um intervalo de 15 (quinze) minutos quando a duração ultrapassar 4 (quatro) horas.","§ 2º Os intervalos de descanso não serão computados na duração do trabalho.","§ 3º O limite mínimo de 1 (uma) hora para repouso ou refeição poderá ser reduzido por ato do Ministro do Trabalho, Indústria e Comércio, quando ouvida o Serviço de Alimentação de Previdência Social, se verificar que o estabelecimento atende integralmente às exigências concernentes à organização dos refeitórios, e quando os respectivos empregados não estiverem sob regime de trabalho prorrogado a horas suplementares.","§ 4º A não concessão ou a concessão parcial do intervalo intrajornada mínimo, para repouso e alimentação, a empregados urbanos e rurais, implica o pagamento, de natureza indenizatória, apenas do período suprimido, com acréscimo de 50% (cinquenta por cento) sobre o valor da remuneração da hora normal de trabalho. (Parágrafo acrescido pela Lei nº 8.923, de 27/7/1994, com redação dada pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 5º O intervalo expresso no caput poderá ser reduzido e/ou fracionado, e aquele estabelecido no § 1º poderá ser fracionado, quando compreendidos entre o término da primeira hora trabalhada e o início da última hora trabalhada, desde que previsto em convenção ou acordo coletivo de trabalho, ante a natureza do serviço e em virtude das condições especiais de trabalho a que são submetidos estritamente os motoristas, cobradores, fiscalização de campo e afins nos serviços de operação de veículos rodoviários, empregados no setor de transporte coletivo de passageiros, mantida a remuneração e concedidos intervalos para descanso menores ao final de cada viagem. (Parágrafo acrescido pela Lei nº 12.619, de 30/4/2012, com redação dada pela Lei nº 13.103, de 2/3/2015, publicada no DOU de 3/3/2015, em vigor 45 dias após a publicação)"],"73":["Art. 73. Salvo nos casos de revezamento semanal ou quinzenal, o trabalho noturno terá remuneração superior à do diurno e, para esse efeito, sua remuneração terá um acréscimo de 20% (vinte por cento), pelo menos, sobre a hora diurna. (“Caput” do artigo com redação dada pelo Decreto-Lei nº 9.666, de 28/8/1946) (Vide art. 7º, XVI, da Constituição Federal de 1988)","§ 1º A hora do trabalho noturno será computada como de 52 (cinqüenta e dois) minutos e 30 (trinta) segundos. (Parágrafo com redação dada pelo Decreto-Lei nº 9.666, de 28/8/1946)","§ 2º Considera-se noturno, para os efeitos deste artigo, o trabalho executado entre as 22 (vinte duas) horas de um dia e as 5 (cinco) horas do dia seguinte. (Parágrafo com redação dada pelo Decreto-Lei nº 9.666, de 28/8/1946) (Vide art. 7º da Lei nº 5.889, de 8/6/1973)","§ 3º O acréscimo, a que se refere o presente artigo, em se tratando de empresas que não mantêm, pela natureza de suas atividades, trabalho noturno habitual, será feito, tendo em vista os quantitativos pagos por trabalhos diurnos de natureza semelhante. Em relação às empresas cujo trabalho noturno decorra da natureza de suas atividades, o aumento será calculado sobre o salário mínimo geral vigente na região, não sendo devido quando exceder desse limite, já acrescido da percentagem. (Parágrafo acrescido pelo Decreto-Lei nº 9.666, de 28/8/1946)","§ 4º Nos horários mistos, assim entendidos os que abrangem períodos diurnos e noturnos, aplica-se às horas de trabalho noturno o disposto neste artigo e seus parágrafos. (Primitivo § 3º renumerado e com redação dada pelo Decreto-Lei nº 9.666, de 28/8/1946)","§ 5º Às prorrogações do trabalho noturno aplica-se o disposto neste capítulo. (Primitivo § 4º renumerado e com redação dada pelo Decreto-Lei nº 9.666, de 28/8/1946)"],"74":["Art. 74. O horário de trabalho será anotado em registro de empregados. (“Caput” do artigo com redação dada pela Lei nº 13.874, de 20/9/2019)","§ 1º (Revogado pela Lei nº 13.874, de 20/9/2019)","§ 2º Para os estabelecimentos com mais de 20 (vinte) trabalhadores será obrigatória a anotação da hora de entrada e de saída, em registro manual, mecânico ou eletrônico, conforme instruções expedidas pela Secretaria Especial de Previdência e Trabalho do Ministério da Economia, permitida a pré-assinalação do período de repouso. (Parágrafo com redação dada pela Lei nº 13.874, de 20/9/2019)","§ 3º Se o trabalho for executado fora do estabelecimento, o horário dos empregados constará do registro manual, mecânico ou eletrônico em seu poder, sem prejuízo do que dispõe o caput deste artigo. (Parágrafo com redação dada pela Lei nº 13.874, de 20/9/2019)","§ 4º Fica permitida a utilização de registro de ponto por exceção à jornada regular de trabalho, mediante acordo individual escrito, convenção coletiva ou acordo coletivo de trabalho. (Parágrafo acrescido pela Lei nº 13.874, de 20/9/2019)"],"75-A":["Art. 75-A. A prestação de serviços pelo empregado em regime de teletrabalho observará o disposto neste Capítulo. (Artigo acrescido pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)"],"75-B":["Art. 75-B. Considera-se teletrabalho ou trabalho remoto a prestação de serviços fora das dependências do empregador, de maneira preponderante ou não, com a utilização de tecnologias de informação e de comunicação, que, por sua natureza, não configure trabalho externo. (“Caput” do artigo acrescido pela Lei nº 13.467, de 13/7/2017, e com nova redação dada pela Medida Provisória nº 1.108, de 25/3/2022, convertida na Lei nº 14.442, de 2/9/2022)","§ 1º O comparecimento, ainda que de modo habitual, às dependências do empregador para a realização de atividades específicas que exijam a presença do empregado no estabelecimento não descaracteriza o regime de teletrabalho ou trabalho remoto. (Parágrafo único acrescido pela Lei nº 13.467, de 13/7/2017, transformado em § 1º e com nova redação dada pela Medida Provisória nº 1.108, de 25/3/2022, convertida na Lei nº 14.442, de 2/9/2022)","§ 2º O empregado submetido ao regime de teletrabalho ou trabalho remoto poderá prestar serviços por jornada ou por produção ou tarefa. (Parágrafo acrescido pela Medida Provisória nº 1.108, de 25/3/2022, convertida na Lei nº 14.442, de 2/9/2022)","§ 3º Na hipótese da prestação de serviços em regime de teletrabalho ou trabalho remoto por produção ou tarefa, não se aplicará o disposto no Capítulo II do Título II desta Consolidação. (Parágrafo acrescido pela Medida Provisória nº 1.108, de 25/3/2022, convertida na Lei nº 14.442, de 2/9/2022)","§ 4º O regime de teletrabalho ou trabalho remoto não se confunde nem se equipara à ocupação de operador de telemarketing ou de teleatendimento. (Parágrafo acrescido pela Medida Provisória nº 1.108, de 25/3/2022, convertida na Lei nº 14.442, de 2/9/2022)","§ 5º O tempo de uso de equipamentos tecnológicos e de infraestrutura necessária, bem como de softwares, de ferramentas digitais ou de aplicações de internet utilizados para o teletrabalho, fora da jornada de trabalho normal do empregado não constitui tempo à disposição ou regime de prontidão ou de sobreaviso, exceto se houver previsão em acordo individual ou em acordo ou convenção coletiva de trabalho. (Parágrafo acrescido pela Medida Provisória nº 1.108, de 25/3/2022, convertida na Lei nº 14.442, de 2/9/2022)","§ 6º Fica permitida a adoção do regime de teletrabalho ou trabalho remoto para estagiários e aprendizes. (Parágrafo acrescido pela Medida Provisória nº 1.108, de 25/3/2022, convertida na Lei nº 14.442, de 2/9/2022)","§ 7º Aos empregados em regime de teletrabalho aplicam-se as disposições previstas na legislação local e nas convenções e nos acordos coletivos de trabalho relativas à base territorial do estabelecimento de lotação do empregado. (Parágrafo acrescido pela Medida Provisória nº 1.108, de 25/3/2022, convertida na Lei nº 14.442, de 2/9/2022)","§ 8º Ao contrato de trabalho do empregado admitido no Brasil que optar pela realização de teletrabalho fora do território nacional aplica-se a legislação brasileira, excetuadas as disposições constantes da Lei nº 7.064, de 6 de dezembro de 1982, salvo disposição em contrário estipulada entre as partes. (Parágrafo acrescido pela Medida Provisória nº 1.108, de 25/3/2022, convertida na Lei nº 14.442, de 2/9/2022)","§ 9º Acordo individual poderá dispor sobre os horários e os meios de comunicação entre empregado e empregador, desde que assegurados os repousos legais. (Parágrafo acrescido pela Medida Provisória nº 1.108, de 25/3/2022, convertida na Lei nº 14.442, de 2/9/2022)"],"75-C":["Art. 75-C. A prestação de serviços na modalidade de teletrabalho deverá constar expressamente do instrumento de contrato individual de trabalho. (“Caput” do artigo acrescido pela Lei nº 13.467, de 13/7/2017, e com nova redação dada pela Medida Provisória nº 1.108, de 25/3/2022, convertida na Lei nº 14.442, de 2/9/2022)","§ 1º Poderá ser realizada a alteração entre regime presencial e de teletrabalho desde que haja mútuo acordo entre as partes, registrado em aditivo contratual. (Parágrafo acrescido pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 2º Poderá ser realizada a alteração do regime de teletrabalho para o presencial por determinação do empregador, garantido prazo de transição mínimo de quinze dias, com correspondente registro em aditivo contratual. (Parágrafo acrescido pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 3º O empregador não será responsável pelas despesas resultantes do retorno ao trabalho presencial, na hipótese de o empregado optar pela realização do teletrabalho ou trabalho remoto fora da localidade prevista no contrato, salvo disposição em contrário estipulada entre as partes. (Parágrafo acrescido pela Medida Provisória nº 1.108, de 25/3/2022, convertida na Lei nº 14.442, de 2/9/2022)"],"75-D":["Art. 75-D. As disposições relativas à responsabilidade pela aquisição, manutenção ou fornecimento dos equipamentos tecnológicos e da infraestrutura necessária e adequada à prestação do trabalho remoto, bem como ao reembolso de despesas arcadas pelo empregado, serão previstas em contrato escrito.","Parágrafo único. As utilidades mencionadas no caput deste artigo não integram a remuneração do empregado. (Artigo acrescido pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)"],"75-E":["Art. 75-E. O empregador deverá instruir os empregados, de maneira expressa e ostensiva, quanto às precauções a tomar a fim de evitar doenças e acidentes de trabalho.","Parágrafo único. O empregado deverá assinar termo de responsabilidade comprometendo-se a seguir as instruções fornecidas pelo empregador. (Artigo acrescido pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)"],"75-F":["Art. 75-F. Os empregadores deverão dar prioridade aos empregados com deficiência e aos empregados com filhos ou criança sob guarda judicial até 4 (quatro) anos de idade na alocação em vagas para atividades que possam ser efetuadas por meio do teletrabalho ou trabalho remoto. (Artigo acrescido pela Medida Provisória nº 1.108, de 25/3/2022, convertida e com redação dada pela Lei nº 14.442, de 2/9/2022)"],"163":["Art. 163. Será obrigatória a constituição de Comissão Interna de Prevenção de Acidentes e de Assédio (Cipa), em conformidade com instruções expedidas pelo Ministério do Trabalho e Previdência, nos estabelecimentos ou nos locais de obra nelas especificadas. (“Caput” do artigo com redação dada pela Lei nº 14.457, de 21/9/2022)","Parágrafo único. O Ministério do Trabalho regulamentará as atribuições, a composição e o funcionamento das CIPAs. (Parágrafo único acrescido pelo Decreto-Lei nº 229, de 28/2/1967, com redação dada pela Lei nº 6.514, de 22/12/1977)"],"164":["Art. 164. Cada CIPA será composta de representantes da empresa e dos empregados, de acordo com os critérios que vierem a ser adotados na regulamentação de que trata o parágrafo único do artigo anterior. (“Caput” do artigo com redação dada pela Lei nº 6.514, de 22/12/1977)","§ 1º Os representantes dos empregadores, titulares e suplentes, serão por eles designados. (Parágrafo único transformado em § 1º pelo Decreto-Lei nº 229, de 28/2/1967, com redação dada pela Lei nº 6.514, de 22/12/1977)","§ 2º Os representantes dos empregados, titulares e suplentes, serão eleitos em escrutínio secreto, do qual participem, independentemente de filiação sindical, exclusivamente os empregados interessados. (Parágrafo acrescido pelo Decreto-Lei nº 229, de 28/2/1967, com redação dada pela Lei nº 6.514, de 22/12/1977)","§ 3º O mandato dos membros eleitos da CIPA terá a duração de 1 (um) ano, permitida uma reeleição. (Parágrafo acrescido pela Lei nº 6.514, de 22/12/1977)","§ 4º O disposto no parágrafo anterior não se aplicará ao membro suplente que, durante o seu mandato, tenha participado de menos da metade do número de reuniões da CIPA. (Parágrafo acrescido pela Lei nº 6.514, de 22/12/1977)","§ 5º O empregador designará, anualmente, dentre os seus representantes, o Presidente da CIPA e os empregados elegerão, dentre eles, o Vice-Presidente. (Parágrafo acrescido pela Lei nº 6.514, de 22/12/1977)"],"165":["Art. 165. Os titulares da representação dos empregados nas CIPAs não poderão sofrer despedida arbitrária, entendendo-se como tal a que não se fundar em motivo disciplinar, técnico, econômico ou financeiro. (“Caput” do artigo com redação dada pela Lei nº 6.514, de 22/12/1977) (Vide art. 10, II, “a”, do ADCT)","Parágrafo único. Ocorrendo a despedida, caberá ao empregador, em caso de reclamação à Justiça do Trabalho, comprovar a existência de qualquer dos motivos mencionados neste artigo, sob pena de ser condenado a reintegrar o empregado. (Parágrafo único acrescido pela Lei nº 6.514, de 22/12/1977)"],"391-A":["Art. 391-A. A confirmação do estado de gravidez advindo no curso do contrato de trabalho, ainda que durante o prazo do aviso prévio trabalhado ou indenizado, garante à empregada gestante a estabilidade provisória prevista na alínea b do inciso II do art. 10 do Ato das Disposições Constitucionais Transitórias. (“Caput” do artigo acrescido pela Lei nº 12.812, de 16/5/2013)","Parágrafo único. O disposto no caput deste artigo aplica-se ao empregado adotante ao qual tenha sido concedida guarda provisória para fins de adoção. (Parágrafo único acrescido pela Lei nº 13.509, de 22/11/2017) (Vide Lei nº 15.371, de 31/3/2026)"],"461":["Art. 461. Sendo idêntica a função, a todo trabalho de igual valor, prestado ao mesmo empregador, no mesmo estabelecimento empresarial, corresponderá igual salário, sem distinção de sexo, etnia, nacionalidade ou idade. (“Caput” do artigo com redação dada pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 1º Trabalho de igual valor, para os fins deste Capítulo, será o que for feito com igual produtividade e com a mesma perfeição técnica, entre pessoas cuja diferença de tempo de serviço para o mesmo empregador não seja superior a quatro anos e a diferença de tempo na função não seja superior a dois anos. (Parágrafo com redação dada pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 2º Os dispositivos deste artigo não prevalecerão quando o empregador tiver pessoal organizado em quadro de carreira ou adotar, por meio de norma interna da empresa ou de negociação coletiva, plano de cargos e salários, dispensada qualquer forma de homologação ou registro em órgão público. (Parágrafo com redação dada pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 3º No caso do § 2º deste artigo, as promoções poderão ser feitas por merecimento e por antiguidade, ou por apenas um destes critérios, dentro de cada categoria profissional. (Parágrafo acrescido pela Lei nº 1.723, de 8/11/1952, com redação dada pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 4º O trabalhador readaptado em nova função, por motivo de deficiência física ou mental atestada pelo órgão competente da Previdência Social, não servirá de paradigma para fins de equiparação salarial. (Parágrafo acrescido pela Lei nº 5.798, de 31/8/1972)","§ 5º A equiparação salarial só será possível entre empregados contemporâneos no cargo ou na função, ficando vedada a indicação de paradigmas remotos, ainda que o paradigma contemporâneo tenha obtido a vantagem em ação judicial própria. (Parágrafo acrescido pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 6º Na hipótese de discriminação por motivo de sexo, raça, etnia, origem ou idade, o pagamento das diferenças salariais devidas ao empregado discriminado não afasta seu direito de ação de indenização por danos morais, consideradas as especificidades do caso concreto. (Parágrafo acrescido pela Lei nº 13.467, de 13/7/2017, e com nova redação dada pela Lei nº 14.611, de 3/7/2023)","§ 7º Sem prejuízo do disposto no § 6º, no caso de infração ao previsto neste artigo, a multa de que trata o art. 510 desta Consolidação corresponderá a 10 (dez) vezes o valor do novo salário devido pelo empregador ao empregado discriminado, elevada ao dobro, no caso de reincidência, sem prejuízo das demais cominações legais. (Parágrafo acrescido pela Lei nº 14.611, de 3/7/2023)"]}},"CF":{"url":"https://www2.camara.leg.br/legin/fed/consti/1988/constituicao-1988-5-outubro-1988-322142-normaatualizada-pl.html","articles":{"1":["Art. 1º A República Federativa do Brasil, formada pela união indissolúvel dos Estados e Municípios e do Distrito Federal, constitui-se em Estado democrático de direito e tem como fundamentos:","I - a soberania;","II - a cidadania;","III - a dignidade da pessoa humana;","IV - os valores sociais do trabalho e da livre iniciativa;","V - o pluralismo político.","Parágrafo único. Todo o poder emana do povo, que o exerce por meio de representantes eleitos ou diretamente, nos termos desta Constituição."],"6":["Art. 6º São direitos sociais a educação, a saúde, a alimentação, o trabalho, a moradia, o transporte, o lazer, a segurança, a previdência social, a proteção à maternidade e à infância, a assistência aos desamparados, na forma desta Constituição. (Artigo com redação dada pela Emenda Constitucional nº 90, de 2015)","Parágrafo único. Todo brasileiro em situação de vulnerabilidade social terá direito a uma renda básica familiar, garantida pelo poder público em programa permanente de transferência de renda, cujas normas e requisitos de acesso serão determinados em lei, observada a legislação fiscal e orçamentária. (Parágrafo único acrescido pela Emenda Constitucional nº 114, de 2021)"],"7":["Art. 7º São direitos dos trabalhadores urbanos e rurais, além de outros que visem à melhoria de sua condição social:","I - relação de emprego protegida contra despedida arbitrária ou sem justa causa, nos termos de lei complementar, que preverá indenização compensatória, dentre outros direitos;","II - seguro-desemprego, em caso de desemprego involuntário;","III - fundo de garantia do tempo de serviço;","IV - salário mínimo, fixado em lei, nacionalmente unificado, capaz de atender às suas necessidades vitais básicas e às de sua família com moradia, alimentação, educação, saúde, lazer, vestuário, higiene, transporte e previdência social, com reajustes periódicos que lhe preservem o poder aquisitivo, sendo vedada sua vinculação para qualquer fim;","V - piso salarial proporcional à extensão e à complexidade do trabalho;","VI - irredutibilidade do salário, salvo o disposto em convenção ou acordo coletivo;","VII - garantia de salário, nunca inferior ao mínimo, para os que percebem remuneração variável;","VIII - décimo terceiro salário com base na remuneração integral ou no valor da aposentadoria;","IX - remuneração do trabalho noturno superior à do diurno;","X - proteção do salário na forma da lei, constituindo crime sua retenção dolosa;","XI - participação nos lucros, ou resultados, desvinculada da remuneração, e, excepcionalmente, participação na gestão da empresa, conforme definido em lei;","XII - salário-família pago em razão do dependente do trabalhador de baixa renda nos termos da lei; (Inciso com redação dada pela Emenda Constitucional nº 20, de 1998)","XIII - duração do trabalho normal não superior a 8 (oito) horas diárias e 40 (quarenta) horas semanais, facultada a compensação de horários e a redução da jornada, mediante acordo ou convenção coletiva de trabalho; (Inciso com redação dada pela Emenda Constitucional nº 141, de 2026) (Vide art. 6º da Emenda Constitucional nº 141, de 2026)","XIV - jornada de seis horas para o trabalho realizado em turnos ininterruptos de revezamento, salvo negociação coletiva;","XV - repouso semanal remunerado, preferencialmente aos domingos; (Vide Emenda Constitucional nº 141, de 2026)","XVI - remuneração do serviço extraordinário superior, no mínimo, em cinqüenta por cento à do normal;","XVII - gozo de férias anuais remuneradas com, pelo menos, um terço a mais do que o salário normal;","XVIII - licença à gestante, sem prejuízo do emprego e do salário, com a duração de cento e vinte dias;","XIX - licença-paternidade, nos termos fixados em lei;","XX - proteção do mercado de trabalho da mulher, mediante incentivos específicos, nos termos da lei;","XXI - aviso prévio proporcional ao tempo de serviço, sendo no mínimo de trinta dias, nos termos da lei;","XXII - redução dos riscos inerentes ao trabalho, por meio de normas de saúde, higiene e segurança;","XXIII - adicional de remuneração para as atividades penosas, insalubres ou perigosas, na forma da lei;","XXIV - aposentadoria;","XXV - assistência gratuita aos filhos e dependentes desde o nascimento até 5 (cinco) anos de idade em creches e pré-escolas; (Inciso com redação dada pela Emenda Constitucional nº 53, de 2006)","XXVI - reconhecimento das convenções e acordos coletivos de trabalho;","XXVII - proteção em face da automação, na forma da lei;","XXVIII - seguro contra acidentes de trabalho, a cargo do empregador, sem excluir a indenização a que este está obrigado, quando incorrer em dolo ou culpa;","XXIX - ação, quanto aos créditos resultantes das relações de trabalho, com prazo prescricional de cinco anos para os trabalhadores urbanos e rurais, até o limite de dois anos após a extinção do contrato de trabalho; (Inciso com redação dada pela Emenda Constitucional nº 28, de 2000)","a) (Alínea revogada pela Emenda Constitucional nº 28, de 2000)","b) (Alínea revogada pela Emenda Constitucional nº 28, de 2000)","XXX - proibição de diferença de salários, de exercício de funções e de critério de admissão por motivo de sexo, idade, cor ou estado civil;","XXXI - proibição de qualquer discriminação no tocante a salário e critérios de admissão do trabalhador portador de deficiência;","XXXII - proibição de distinção entre trabalho manual, técnico e intelectual ou entre os profissionais respectivos;","XXXIII - proibição de trabalho noturno, perigoso ou insalubre a menores de dezoito e de qualquer trabalho a menores de dezesseis anos, salvo na condição de aprendiz, a partir de quatorze anos; (Inciso com redação dada pela Emenda Constitucional nº 20, de 1998)","XXXIV - igualdade de direitos entre o trabalhador com vínculo empregatício permanente e o trabalhador avulso.","§ 1º São assegurados à categoria dos trabalhadores domésticos os direitos previstos nos incisos IV, VI, VII, VIII, X, XIII, XV, XVI, XVII, XVIII, XIX, XXI, XXII, XXIV, XXVI, XXX, XXXI e XXXIII e, atendidas as condições estabelecidas em lei e observada a simplificação do cumprimento das obrigações tributárias, principais e acessórias, decorrentes da relação de trabalho e suas peculiaridades, os previstos nos incisos I, II, III, IX, XII, XXV e XXVIII, bem como a sua integração à previdência social. (Parágrafo único com redação dada pela Emenda Constitucional nº 72, de 2013, e transformado em § 1º pela Emenda Constitucional nº 141, de 2026)","§ 2º Excepcionalmente, convenção ou acordo coletivo de trabalho poderão, inclusive para os trabalhadores sujeitos a regimes diferenciados de trabalho estabelecidos em lei ou norma regulamentadora, estabelecer regime compensatório que assegure, na média, 2 (dois) dias de repouso semanal remunerado dentro do mês-calendário, garantido o gozo de pelo menos 1 (um) dos dias dentro do período máximo de 1 (uma) semana de trabalho. (Parágrafo acrescido pela Emenda Constitucional nº 141, de 2026)","§ 3º Lei poderá dispor sobre hipóteses e condições em que a duração do trabalho e os dias de repouso semanal remunerado poderão observar regimes diferenciados, respeitados os limites previstos nos incisos XIII, XIV e XV do caput deste artigo. (Parágrafo acrescido pela Emenda Constitucional nº 141, de 2026)"],"8":["Art. 8º É livre a associação profissional ou sindical, observado o seguinte:","I - a lei não poderá exigir autorização do Estado para a fundação de sindicato, ressalvado o registro no órgão competente, vedadas ao poder público a interferência e a intervenção na organização sindical;","II - é vedada a criação de mais de uma organização sindical, em qualquer grau, representativa de categoria profissional ou econômica, na mesma base territorial, que será definida pelos trabalhadores ou empregadores interessados, não podendo ser inferior à área de um Município;","III - ao sindicato cabe a defesa dos direitos e interesses coletivos ou individuais da categoria, inclusive em questões judiciais ou administrativas;","IV - a assembléia geral fixará a contribuição que, em se tratando de categoria profissional, será descontada em folha, para custeio do sistema confederativo da representação sindical respectiva, independentemente da contribuição prevista em lei;","V - ninguém será obrigado a filiar-se ou a manter-se filiado a sindicato;","VI - é obrigatória a participação dos sindicatos nas negociações coletivas de trabalho;","VII - o aposentado filiado tem direito a votar e ser votado nas organizações sindicais;","VIII - é vedada a dispensa do empregado sindicalizado a partir do registro da candidatura a cargo de direção ou representação sindical e, se eleito, ainda que suplente, até um ano após o final do mandato, salvo se cometer falta grave nos termos da lei.","Parágrafo único. As disposições deste artigo aplicam-se à organização de sindicatos rurais e de colônias de pescadores, atendidas as condições que a lei estabelecer."],"37":["Art. 37. A administração pública direta e indireta de qualquer dos Poderes da União, dos Estados, do Distrito Federal e dos Municípios obedecerá aos princípios de legalidade, impessoalidade, moralidade, publicidade e eficiência e, também, ao seguinte: (“Caput” do artigo com redação dada pela Emenda Constitucional nº 19, de 1998)","I - os cargos, empregos e funções públicas são acessíveis aos brasileiros que preencham os requisitos estabelecidos em lei, assim como aos estrangeiros, na forma da lei; (Inciso com redação dada pela Emenda Constitucional nº 19, de 1998)","II - a investidura em cargo ou emprego público depende de aprovação prévia em concurso público de provas ou de provas e títulos, de acordo com a natureza e a complexidade do cargo ou emprego, na forma prevista em lei, ressalvadas as nomeações para cargo em comissão declarado em lei de livre nomeação e exoneração; (Inciso com redação dada pela Emenda Constitucional nº 19, de 1998)","III - o prazo de validade do concurso público será de até dois anos, prorrogável uma vez, por igual período;","IV - durante o prazo improrrogável previsto no edital de convocação, aquele aprovado em concurso público de provas ou de provas e títulos será convocado com prioridade sobre novos concursados para assumir cargo ou emprego, na carreira;","V - as funções de confiança, exercidas exclusivamente por servidores ocupantes de cargo efetivo, e os cargos em comissão, a serem preenchidos por servidores de carreira nos casos, condições e percentuais mínimos previstos em lei, destinam-se apenas às atribuições de direção, chefia e assessoramento; (Inciso com redação dada pela Emenda Constitucional nº 19, de 1998)","VI - é garantido ao servidor público civil o direito à livre associação sindical;","VII - o direito de greve será exercido nos termos e nos limites definidos em lei específica; (Inciso com redação dada pela Emenda Constitucional nº 19, de 1998)","VIII - a lei reservará percentual dos cargos e empregos públicos para as pessoas portadoras de deficiência e definirá os critérios de sua admissão;","IX - a lei estabelecerá os casos de contratação por tempo determinado para atender a necessidade temporária de excepcional interesse público;","X - a remuneração dos servidores públicos e o subsídio de que trata o § 4º do art. 39 somente poderão ser fixados ou alterados por lei específica, observada a iniciativa privativa em cada caso, assegurada revisão geral anual, sempre na mesma data e sem distinção de índices; (Inciso com redação dada pela Emenda Constitucional nº 19, de 1998)","XI - a remuneração e o subsídio dos ocupantes de cargos, funções e empregos públicos da administração direta, autárquica e fundacional, dos membros de qualquer dos Poderes da União, dos Estados, do Distrito Federal e dos Municípios, dos detentores de mandato eletivo e dos demais agentes políticos e os proventos, pensões ou outra espécie remuneratória, percebidos cumulativamente ou não, incluídas as vantagens pessoais ou de qualquer outra natureza, não poderão exceder o subsídio mensal, em espécie, dos Ministros do Supremo Tribunal Federal, aplicando-se como limite, nos Municípios, o subsídio do Prefeito, e nos Estados e no Distrito Federal, o subsídio mensal do Governador no âmbito do Poder Executivo, o subsídio dos Deputados Estaduais e Distritais no âmbito do Poder Legislativo e o subsídio dos Desembargadores do Tribunal de Justiça, limitado a noventa inteiros e vinte e cinco centésimos por cento do subsídio mensal, em espécie, dos Ministros do Supremo Tribunal Federal, no âmbito do Poder Judiciário, aplicável este limite aos membros do Ministério Público, aos Procuradores e aos Defensores Públicos; (Inciso com redação dada pela Emenda Constitucional nº 41, de 2003)","XII - os vencimentos dos cargos do Poder Legislativo e do Poder Judiciário não poderão ser superiores aos pagos pelo Poder Executivo;","XIII - é vedada a vinculação ou equiparação de quaisquer espécies remuneratórias para o efeito de remuneração de pessoal do serviço público; (Inciso com redação dada pela Emenda Constitucional nº 19, de 1998)","XIV - os acréscimos pecuniários percebidos por servidor público não serão computados nem acumulados para fins de concessão de acréscimos ulteriores; (Inciso com redação dada pela Emenda Constitucional nº 19, de 1998)","XV - o subsídio e os vencimentos dos ocupantes de cargos e empregos públicos são irredutíveis, ressalvado o disposto nos incisos XI e XIV deste artigo e nos arts. 39, § 4º, 150, II, 153, III, e 153, § 2º, I; (Inciso com redação dada pela Emenda Constitucional nº 19, de 1998)","XVI - é vedada a acumulação remunerada de cargos públicos, exceto, quando houver compatibilidade de horários, observado em qualquer caso o disposto no inciso XI: (“Caput” do inciso com redação dada pela Emenda Constitucional nº 19, de 1998)","a) a de dois cargos de professor;","b) a de um cargo de professor com outro de qualquer natureza; (Alínea com redação dada pela Emenda Constitucional nº 138, de 2025)","c) a de dois cargos ou empregos privativos de profissionais de saúde, com profissões regulamentadas; (Alínea com redação dada pela Emenda Constitucional nº 34, de 2001)","XVII - a proibição de acumular estende-se a empregos e funções e abrange autarquias, fundações, empresas públicas, sociedades de economia mista, suas subsidiárias, e sociedades controladas, direta ou indiretamente, pelo poder público; (Inciso com redação dada pela Emenda Constitucional nº 19, de 1998)","XVIII - a administração fazendária e seus servidores fiscais terão, dentro de suas áreas de competência e jurisdição, precedência sobre os demais setores administrativos, na forma da lei;","XIX - somente por lei específica poderá ser criada autarquia e autorizada a instituição de empresa pública, de sociedade de economia mista e de fundação, cabendo à lei complementar, neste último caso, definir as áreas de sua atuação; (Inciso com redação dada pela Emenda Constitucional nº 19, de 1998)","XX - depende de autorização legislativa, em cada caso, a criação de subsidiárias das entidades mencionadas no inciso anterior, assim como a participação de qualquer delas em empresa privada;","XXI - ressalvados os casos especificados na legislação, as obras, serviços, compras e alienações serão contratados mediante processo de licitação pública que assegure igualdade de condições a todos os concorrentes, com cláusulas que estabeleçam obrigações de pagamento, mantidas as condições efetivas da proposta, nos termos da lei, o qual somente permitirá as exigências de qualificação técnica e econômica indispensáveis à garantia do cumprimento das obrigações.","XXII - as administrações tributárias da União, dos Estados, do Distrito Federal e dos Municípios, atividades essenciais ao funcionamento do Estado, exercidas por servidores de carreiras específicas, terão recursos prioritários para a realização de suas atividades e atuarão de forma integrada, inclusive com o compartilhamento de cadastros e de informações fiscais, na forma da lei ou convênio. (Inciso acrescido pela Emenda Constitucional nº 42, de 2003)","§ 1º A publicidade dos atos, programas, obras, serviços e campanhas dos órgãos públicos deverá ter caráter educativo, informativo ou de orientação social, dela não podendo constar nomes, símbolos ou imagens que caracterizem promoção pessoal de autoridades ou servidores públicos.","§ 2º A não-observância do disposto nos incisos II e III implicará a nulidade do ato e a punição da autoridade responsável, nos termos da lei.","§ 3º A lei disciplinará as formas de participação do usuário na administração pública direta e indireta, regulando especialmente:","I - as reclamações relativas à prestação dos serviços públicos em geral, asseguradas a manutenção de serviços de atendimento ao usuário e a avaliação periódica, externa e interna, da qualidade dos serviços;","II - o acesso dos usuários a registros administrativos e a informações sobre atos de governo, observado o disposto no art. 5º, X e XXXIII;","III - a disciplina da representação contra o exercício negligente ou abusivo de cargo, emprego ou função na administração pública. (Parágrafo com redação dada pela Emenda Constitucional nº 19, de 1998)","§ 4º Os atos de improbidade administrativa importarão a suspensão dos direitos políticos, a perda da função pública, a indisponibilidade dos bens e o ressarcimento ao erário, na forma e gradação previstas em lei, sem prejuízo da ação penal cabível.","§ 5º A lei estabelecerá os prazos de prescrição para ilícitos praticados por qualquer agente, servidor ou não, que causem prejuízos ao erário, ressalvadas as respectivas ações de ressarcimento.","§ 6º As pessoas jurídicas de direito público e as de direito privado prestadoras de serviços públicos responderão pelos danos que seus agentes, nessa qualidade, causarem a terceiros, assegurado o direito de regresso contra o responsável nos casos de dolo ou culpa.","§ 7º A lei disporá sobre os requisitos e as restrições ao ocupante de cargo ou emprego da administração direta e indireta que possibilite o acesso a informações privilegiadas. (Parágrafo acrescido pela Emenda Constitucional nº 19, de 1998)","§ 8º A autonomia gerencial, orçamentária e financeira dos órgãos e entidades da administração direta e indireta poderá ser ampliada mediante contrato, a ser firmado entre seus administradores e o poder público, que tenha por objeto a fixação de metas de desempenho para o órgão ou entidade, cabendo à lei dispor sobre:","I - o prazo de duração do contrato;","II - os controles e critérios de avaliação de desempenho, direitos, obrigações e responsabilidade dos dirigentes;","III - a remuneração do pessoal. (Parágrafo acrescido pela Emenda Constitucional nº 19, de 1998)","§ 9º O disposto no inciso XI aplica-se às empresas públicas e às sociedades de economia mista, e suas subsidiárias, que receberem recursos da União, dos Estados, do Distrito Federal ou dos Municípios para pagamento de despesas de pessoal ou de custeio em geral. (Parágrafo acrescido pela Emenda Constitucional nº 19, de 1998)","§ 10. É vedada a percepção simultânea de proventos de aposentadoria decorrentes do art. 40 ou dos arts. 42 e 142 com a remuneração de cargo, emprego ou função pública, ressalvados os cargos acumuláveis na forma desta Constituição, os cargos eletivos e os cargos em comissão declarados em lei de livre nomeação e exoneração. (Parágrafo acrescido pela Emenda Constitucional nº 20, de 1998)","§ 11. Não serão computadas, para efeito dos limites remuneratórios de que trata o inciso XI do caput deste artigo, as parcelas de caráter indenizatório expressamente previstas em lei ordinária, aprovada pelo Congresso Nacional, de caráter nacional, aplicada a todos os Poderes e órgãos constitucionalmente autônomos. (Parágrafo acrescido pela Emenda Constitucional nº 47, de 2005, e com redação dada pela Emenda Constitucional nº 135, de 2024)","§ 12. Para os fins do disposto no inciso XI do caput deste artigo, fica facultado aos Estados e ao Distrito Federal fixar, em seu âmbito, mediante emenda às respectivas Constituições e Lei Orgânica, como limite único, o subsídio mensal dos Desembargadores do respectivo Tribunal de Justiça, limitado a noventa inteiros e vinte e cinco centésimos por cento do subsídio mensal dos Ministros do Supremo Tribunal Federal, não se aplicando o disposto neste parágrafo aos subsídios dos Deputados Estaduais e Distritais e dos Vereadores. (Parágrafo acrescido pela Emenda Constitucional nº 47, de 2005)","§ 13. O servidor público titular de cargo efetivo poderá ser readaptado para exercício de cargo cujas atribuições e responsabilidades sejam compatíveis com a limitação que tenha sofrido em sua capacidade física ou mental, enquanto permanecer nesta condição, desde que possua a habilitação e o nível de escolaridade exigidos para o cargo de destino, mantida a remuneração do cargo de origem. (Parágrafo acrescido pela Emenda Constitucional nº 103, de 2019)","§ 14. A aposentadoria concedida com a utilização de tempo de contribuição decorrente de cargo, emprego ou função pública, inclusive do Regime Geral de Previdência Social, acarretará o rompimento do vínculo que gerou o referido tempo de contribuição. (Parágrafo acrescido pela Emenda Constitucional nº 103, de 2019)","§ 15. É vedada a complementação de aposentadorias de servidores públicos e de pensões por morte a seus dependentes que não seja decorrente do disposto nos §§ 14 a 16 do art. 40 ou que não seja prevista em lei que extinga regime próprio de previdência social. (Parágrafo acrescido pela Emenda Constitucional nº 103, de 2019)","§ 16. Os órgãos e entidades da administração pública, individual ou conjuntamente, devem realizar avaliação das políticas públicas, inclusive com divulgação do objeto a ser avaliado e dos resultados alcançados, na forma da lei. (Parágrafo acrescido pela Emenda Constitucional nº 109, de 2021)","§ 17. (Vide Emenda Constitucional nº 132, de 2023)","§ 18. (Vide Emenda Constitucional nº 132, de 2023)"],"114":["Art. 114. Compete à Justiça do Trabalho processar e julgar: (“Caput” do artigo com redação dada pela Emenda Constitucional nº 45, de 2004)","I - as ações oriundas da relação de trabalho, abrangidos os entes de direito público externo e da administração pública direta e indireta da União, dos Estados, do Distrito Federal e dos Municípios; (Inciso acrescido pela Emenda Constitucional nº 45, de 2004)","II - as ações que envolvam exercício do direito de greve; (Inciso acrescido pela Emenda Constitucional nº 45, de 2004)","III - as ações sobre representação sindical, entre sindicatos, entre sindicatos e trabalhadores, e entre sindicatos e empregadores; (Inciso acrescido pela Emenda Constitucional nº 45, de 2004)","IV - os mandados de segurança, habeas corpus e habeas data, quando o ato questionado envolver matéria sujeita à sua jurisdição; (Inciso acrescido pela Emenda Constitucional nº 45, de 2004)","V - os conflitos de competência entre órgãos com jurisdição trabalhista, ressalvado o disposto no art. 102, I, o; (Inciso acrescido pela Emenda Constitucional nº 45, de 2004)","VI - as ações de indenização por dano moral ou patrimonial, decorrentes da relação de trabalho; (Inciso acrescido pela Emenda Constitucional nº 45, de 2004)","VII - as ações relativas às penalidades administrativas impostas aos empregadores pelos órgãos de fiscalização das relações de trabalho; (Inciso acrescido pela Emenda Constitucional nº 45, de 2004)","VIII - a execução, de ofício, das contribuições sociais previstas no art. 195, I, a, e II, e seus acréscimos legais, decorrentes das sentenças que proferir; (Inciso acrescido pela Emenda Constitucional nº 45, de 2004)","IX - outras controvérsias decorrentes da relação de trabalho, na forma da lei. (Inciso acrescido pela Emenda Constitucional nº 45, de 2004)","§ 1º Frustrada a negociação coletiva, as partes poderão eleger árbitros.","§ 2º Recusando-se qualquer das partes à negociação coletiva ou à arbitragem, é facultado às mesmas, de comum acordo, ajuizar dissídio coletivo de natureza econômica, podendo a Justiça do Trabalho decidir o conflito, respeitadas as disposições mínimas legais de proteção ao trabalho, bem como as convencionadas anteriormente. (Parágrafo com redação dada pela Emenda Constitucional nº 45, de 2004)","§ 3º Em caso de greve em atividade essencial, com possibilidade de lesão do interesse público, o Ministério Público do Trabalho poderá ajuizar dissídio coletivo, competindo à Justiça do Trabalho decidir o conflito. (Parágrafo acrescido pela Emenda Constitucional nº 20, de 1998, e com nova redação dada pela Emenda Constitucional nº 45, de 2004)"]}},"LINDB":{"url":"https://www2.camara.leg.br/legin/fed/declei/1940-1949/decreto-lei-4657-4-setembro-1942-414605-normaatualizada-pe.html","articles":{"4":["Art. 4º Quando a lei for omissa, o juiz decidirá o caso de acordo com a analogia, os costumes e os princípios gerais de direito."],"5":["Art. 5º Na aplicação da lei, o juiz atenderá aos fins sociais a que ela se dirige e às exigências do bem comum."]}},"LC 150/2015":{"url":"https://www2.camara.leg.br/legin/fed/leicom/2015/leicomplementar-150-1-junho-2015-780907-normaatualizada-pl.html","articles":{"1":["Art. 1º Ao empregado doméstico, assim considerado aquele que presta serviços de forma contínua, subordinada, onerosa e pessoal e de finalidade não lucrativa à pessoa ou à família, no âmbito residencial destas, por mais de 2 (dois) dias por semana, aplica-se o disposto nesta Lei.","Parágrafo único. É vedada a contratação de menor de 18 (dezoito) anos para desempenho de trabalho doméstico, de acordo com a Convenção nº 182, de 1999, da Organização Internacional do Trabalho (OIT) e com o Decreto nº 6.481, de 12 de junho de 2008."]}},"Lei 5.889/1973":{"url":"https://www2.camara.leg.br/legin/fed/lei/1970-1979/lei-5889-8-junho-1973-357971-normaatualizada-pl.html","articles":{"2":["Art. 2º Empregado rural é toda pessoa física que, em propriedade rural ou prédio rústico, presta serviços de natureza não eventual a empregador rural, sob a dependência deste e mediante salário."],"3":["Art. 3º Considera-se empregador rural, para os efeitos desta Lei, a pessoa física ou jurídica, proprietário ou não, que explore atividade agro-econômica, em caráter permanente ou temporário, diretamente ou através de prepostos e com auxílio de empregados.","§ 1º Inclui-se na atividade econômica referida no caput deste artigo, além da exploração industrial em estabelecimento agrário não compreendido na Consolidação das Leis do Trabalho - CLT, aprovada pelo Decreto-Lei nº 5.452, de 1º de maio de 1943, a exploração do turismo rural ancilar à exploração agroeconômica. (Parágrafo com redação dada pela Lei nº 13.171, de 21/10/2015)","§ 2º Sempre que uma ou mais empresas, embora tendo cada uma delas personalidade jurídica própria, estiverem sob direção, controle ou administração de outra, ou ainda quando, mesmo guardando cada uma sua autonomia, integrem grupo econômico ou financeiro rural, serão responsáveis solidariamente nas obrigações decorrentes da relação de emprego."],"14":["Art. 14. Expirado normalmente o contrato, a empresa pagará ao safrista, a título de indenização do tempo de serviço, importância correspondente a 1/12 (um doze avos) do salário mensal, por mês de serviço ou fração superior a 14 (quatorze) dias.","Parágrafo único. Considera-se contrato de safra o que tenha sua duração dependente de variações estacionais da atividade agrária."],"14-A":["Art. 14-A. O produtor rural pessoa física poderá realizar contratação de trabalhador rural por pequeno prazo para o exercício de atividades de natureza temporária.","§ 1º A contratação de trabalhador rural por pequeno prazo que, dentro do período de 1 (um) ano, superar 2 (dois) meses fica convertida em contrato de trabalho por prazo indeterminado, observando- se os termos da legislação aplicável.","§ 2º A filiação e a inscrição do trabalhador de que trata este artigo na Previdência Social decorrem, automaticamente, da sua inclusão pelo empregador na Guia de Recolhimento do Fundo de Garantia do Tempo de Serviço e Informações à Previdência Social - GFIP, cabendo à Previdência Social instituir mecanismo que permita a sua identificação.","§ 3º O contrato de trabalho por pequeno prazo deverá ser formalizado mediante a inclusão do trabalhador na GFIP, na forma do disposto no § 2º deste artigo, e:","I - mediante a anotação na Carteira de Trabalho e Previdência Social e em Livro ou Ficha de Registro de Empregados; ou","II - mediante contrato escrito, em 2 (duas) vias, uma para cada parte, onde conste, no mínimo:","a) expressa autorização em acordo coletivo ou convenção coletiva;","b) identificação do produtor rural e do imóvel rural onde o trabalho será realizado e indicação da respectiva matrícula;","c) identificação do trabalhador, com indicação do respectivo Número de Inscrição do Trabalhador - NIT.","§ 4º A contratação de trabalhador rural por pequeno prazo só poderá ser realizada por produtor rural pessoa física, proprietário ou não, que explore diretamente atividade agroeconômica.","§ 5º A contribuição do segurado trabalhador rural contratado para prestar serviço na forma deste artigo é de 8% (oito por cento) sobre o respectivo salário-de-contribuição definido no inciso I do caput do art. 28 da Lei nº 8.212, de 24 de julho de 1991.","§ 6º A não inclusão do trabalhador na GFIP pressupõe a inexistência de contratação na forma deste artigo, sem prejuízo de comprovação, por qualquer meio admitido em direito, da existência de relação jurídica diversa.","§ 7º Compete ao empregador fazer o recolhimento das contribuições previdenciárias nos termos da legislação vigente, cabendo à Previdência Social e à Receita Federal do Brasil instituir mecanismos que facilitem o acesso do trabalhador e da entidade sindical que o representa às informações sobre as contribuições recolhidas.","§ 8º São assegurados ao trabalhador rural contratado por pequeno prazo, além de remuneração equivalente à do trabalhador rural permanente, os demais direitos de natureza trabalhista.","§ 9º Todas as parcelas devidas ao trabalhador de que trata este artigo serão calculadas dia a dia e pagas diretamente a ele mediante recibo.","§ 10. O Fundo de Garantia do Tempo de Serviço - FGTS deverá ser recolhido e poderá ser levantado nos termos da Lei nº 8.036, de 11 de maio de 1990. (Artigo acrescido pela Lei nº 11.718, de 20/6/2008)"]}},"Lei 11.788/2008":{"url":"https://www2.camara.leg.br/legin/fed/lei/2008/lei-11788-25-setembro-2008-581200-normaatualizada-pl.html","articles":{"1":["Art. 1º Estágio é ato educativo escolar supervisionado, desenvolvido no ambiente de trabalho, que visa à preparação para o trabalho produtivo de educandos que estejam freqüentando o ensino regular em instituições de educação superior, de educação profissional, de ensino médio, da educação especial e dos anos finais do ensino fundamental, na modalidade profissional da educação de jovens e adultos.","§ 1º O estágio faz parte do projeto pedagógico do curso, além de integrar o itinerário formativo do educando.","§ 2º O estágio visa ao aprendizado de competências próprias da atividade profissional e à contextualização curricular, objetivando o desenvolvimento do educando para a vida cidadã e para o trabalho."],"3":["Art. 3º O estágio, tanto na hipótese do § 1º do art. 2º desta Lei quanto na prevista no § 2º do mesmo dispositivo, não cria vínculo empregatício de qualquer natureza, observados os seguintes requisitos:","I - matrícula e freqüência regular do educando em curso de educação superior, de educação profissional, de ensino médio, da educação especial e nos anos finais do ensino fundamental, na modalidade profissional da educação de jovens e adultos e atestados pela instituição de ensino;","II - celebração de termo de compromisso entre o educando, a parte concedente do estágio e a instituição de ensino;","III - compatibilidade entre as atividades desenvolvidas no estágio e aquelas previstas no termo de compromisso.","§ 1º O estágio, como ato educativo escolar supervisionado, deverá ter acompanhamento efetivo pelo professor orientador da instituição de ensino e por supervisor da parte concedente, comprovado por vistos nos relatórios referidos no inciso IV do caput do art. 7º desta Lei e por menção de aprovação final.","§ 2º O descumprimento de qualquer dos incisos deste artigo ou de qualquer obrigação contida no termo de compromisso caracteriza vínculo de emprego do educando com a parte concedente do estágio para todos os fins da legislação trabalhista e previdenciária."],"12":["Art. 12. O estagiário poderá receber bolsa ou outra forma de contraprestação que venha a ser acordada, sendo compulsória a sua concessão, bem como a do auxílio-transporte, na hipótese de estágio não obrigatório.","§ 1º A eventual concessão de benefícios relacionados a transporte, alimentação e saúde, entre outros, não caracteriza vínculo empregatício.","§ 2º Poderá o educando inscrever-se e contribuir como segurado facultativo do Regime Geral de Previdência Social."],"15":["Art. 15. A manutenção de estagiários em desconformidade com esta Lei caracteriza vínculo de emprego do educando com a parte concedente do estágio para todos os fins da legislação trabalhista e previdenciária.","§ 1º A instituição privada ou pública que reincidir na irregularidade de que trata este artigo ficará impedida de receber estagiários por 2 (dois) anos, contados da data da decisão definitiva do processo administrativo correspondente.","§ 2º A penalidade de que trata o § 1º deste artigo limita-se à filial ou agência em que for cometida a irregularidade."]}},"Lei 6.019/1974":{"url":"https://www2.camara.leg.br/legin/fed/lei/1970-1979/lei-6019-3-janeiro-1974-357401-normaatualizada-pl.html","articles":{"2":["Art. 2º Trabalho temporário é aquele prestado por pessoa física contratada por uma empresa de trabalho temporário que a coloca à disposição de uma empresa tomadora de serviços, para atender à necessidade de substituição transitória de pessoal permanente ou à demanda complementar de serviços. (“Caput” do artigo com redação dada pela Lei nº 13.429, de 31/3/2017)","§ 1º É proibida a contratação de trabalho temporário para a substituição de trabalhadores em greve, salvo nos casos previstos em lei. (Parágrafo acrescido pela Lei nº 13.429, de 31/3/2017)","§ 2º Considera-se complementar a demanda de serviços que seja oriunda de fatores imprevisíveis ou, quando decorrente de fatores previsíveis, tenha natureza intermitente, periódica ou sazonal. (Parágrafo acrescido pela Lei nº 13.429, de 31/3/2017)"],"4-A":["Art. 4º-A. Considera-se prestação de serviços a terceiros a transferência feita pela contratante da execução de quaisquer de suas atividades, inclusive sua atividade principal, à pessoa jurídica de direito privado prestadora de serviços que possua capacidade econômica compatível com a sua execução. (“Caput” do artigo acrescido pela Lei nº 13.429, de 31/3/2017, com redação dada pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 1º A empresa prestadora de serviços contrata, remunera e dirige o trabalho realizado por seus trabalhadores, ou subcontrata outras empresas para realização desses serviços. (Parágrafo acrescido pela Lei nº 13.429, de 31/3/2017)","§ 2º Não se configura vínculo empregatício entre os trabalhadores, ou sócios das empresas prestadoras de serviços, qualquer que seja o seu ramo, e a empresa contratante. (Parágrafo acrescido pela Lei nº 13.429, de 31/3/2017)"],"5-A":["Art. 5º-A. Contratante é a pessoa física ou jurídica que celebra contrato com empresa de prestação de serviços relacionados a quaisquer de suas atividades, inclusive sua atividade principal. (“Caput” do artigo acrescido pela Lei nº 13.429, de 31/3/2017, com redação dada pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 1º É vedada à contratante a utilização dos trabalhadores em atividades distintas daquelas que foram objeto do contrato com a empresa prestadora de serviços. (Parágrafo acrescido pela Lei nº 13.429, de 31/3/2017)","§ 2º Os serviços contratados poderão ser executados nas instalações físicas da empresa contratante ou em outro local, de comum acordo entre as partes. (Parágrafo acrescido pela Lei nº 13.429, de 31/3/2017)","§ 3º É responsabilidade da contratante garantir as condições de segurança, higiene e salubridade dos trabalhadores, quando o trabalho for realizado em suas dependências ou local previamente convencionado em contrato. (Parágrafo acrescido pela Lei nº 13.429, de 31/3/2017)","§ 4º A contratante poderá estender ao trabalhador da empresa de prestação de serviços o mesmo atendimento médico, ambulatorial e de refeição destinado aos seus empregados, existente nas dependências da contratante, ou local por ela designado. (Parágrafo acrescido pela Lei nº 13.429, de 31/3/2017)","§ 5º A empresa contratante é subsidiariamente responsável pelas obrigações trabalhistas referentes ao período em que ocorrer a prestação de serviços, e o recolhimento das contribuições previdenciárias observará o disposto no art. 31 da Lei nº 8.212, de 24 de julho de 1991. (Parágrafo acrescido pela Lei nº 13.429, de 31/3/2017)"],"9":["Art. 9º O contrato celebrado pela empresa de trabalho temporário e a tomadora de serviços será por escrito, ficará à disposição da autoridade fiscalizadora no estabelecimento da tomadora de serviços e conterá: (“Caput” do artigo com redação dada pela Lei nº 13.429, de 31/3/2017)","I - qualificação das partes; (Inciso acrescido pela Lei nº 13.429, de 31/3/2017)","II - motivo justificador da demanda de trabalho temporário; (Inciso acrescido pela Lei nº 13.429, de 31/3/2017)","III - prazo da prestação de serviços; (Inciso acrescido pela Lei nº 13.429, de 31/3/2017)","IV - valor da prestação de serviços; (Inciso acrescido pela Lei nº 13.429, de 31/3/2017)","V - disposições sobre a segurança e a saúde do trabalhador, independentemente do local de realização do trabalho. (Inciso acrescido pela Lei nº 13.429, de 31/3/2017)","§ 1º É responsabilidade da empresa contratante garantir as condições de segurança, higiene e salubridade dos trabalhadores, quando o trabalho for realizado em suas dependências ou em local por ela designado. (Parágrafo acrescido pela Lei nº 13.429, de 31/3/2017)","§ 2º A contratante estenderá ao trabalhador da empresa de trabalho temporário o mesmo atendimento médico, ambulatorial e de refeição destinado aos seus empregados, existente nas dependências da contratante, ou local por ela designado. (Parágrafo acrescido pela Lei nº 13.429, de 31/3/2017)","§ 3º O contrato de trabalho temporário pode versar sobre o desenvolvimento de atividades-meio e atividades-fim a serem executadas na empresa tomadora de serviços. (Parágrafo acrescido pela Lei nº 13.429, de 31/3/2017)"],"10":["Art. 10. Qualquer que seja o ramo da empresa tomadora de serviços, não existe vínculo de emprego entre ela e os trabalhadores contratados pelas empresas de trabalho temporário. (“Caput” do artigo com redação dada pela Lei nº 13.429, de 31/3/2017)","§ 1º O contrato de trabalho temporário, com relação ao mesmo empregador, não poderá exceder ao prazo de cento e oitenta dias, consecutivos ou não. (Parágrafo acrescido pela Lei nº 13.429, de 31/3/2017)","§ 2º O contrato poderá ser prorrogado por até noventa dias, consecutivos ou não, além do prazo estabelecido no § 1º deste artigo, quando comprovada a manutenção das condições que o ensejaram. (Parágrafo acrescido pela Lei nº 13.429, de 31/3/2017)","§ 3º (VETADO na Lei nº 13.429, de 31/3/2017)","§ 4º Não se aplica ao trabalhador temporário, contratado pela tomadora de serviços, o contrato de experiência previsto no parágrafo único do art. 445 da Consolidação das Leis do Trabalho (CLT), aprovada pelo Decreto-Lei nº 5.452, de 1º de maio de 1943. (Parágrafo acrescido pela Lei nº 13.429, de 31/3/2017)","§ 5º O trabalhador temporário que cumprir o período estipulado nos §§ 1º e 2º deste artigo somente poderá ser colocado à disposição da mesma tomadora de serviços em novo contrato temporário, após noventa dias do término do contrato anterior. (Parágrafo acrescido pela Lei nº 13.429, de 31/3/2017)","§ 6º A contratação anterior ao prazo previsto no § 5º deste artigo caracteriza vínculo empregatício com a tomadora. (Parágrafo acrescido pela Lei nº 13.429, de 31/3/2017)","§ 7º A contratante é subsidiariamente responsável pelas obrigações trabalhistas referentes ao período em que ocorrer o trabalho temporário, e o recolhimento das contribuições previdenciárias observará o disposto no art. 31 da Lei nº 8.212, de 24 de julho de 1991. (Parágrafo acrescido pela Lei nº 13.429, de 31/3/2017)"],"12":["Art. 12. Ficam assegurados ao trabalhador temporário os seguintes direitos:","a) remuneração equivalente à percebida pelos empregados de mesma categoria da empresa tomadora ou cliente calculados à base horária, garantida, em qualquer hipótese, a percepção do salário-mínimo regional;","b) jornada de oito horas, remuneradas as horas extraordinárias não excedentes de duas, com acréscimo de 20% (vinte por cento);","c) férias proporcionais, nos termos do artigo 25 da Lei nº 5.107, de 13 de setembro de 1966;","d) repouso semanal remunerado;","e) adicional por trabalho noturno;","f) indenização por dispensa sem justa causa ou término normal do contrato, correspondente a 1/12 (um doze avos) do pagamento recebido;","g) seguro contra acidente do trabalho;","h) proteção previdenciária nos termos do disposto na Lei Orgânica da Previdência Social, com as alterações introduzidas pela Lei nº 5.890, de 8 de junho de 1973 (Art. 5º, Item III, letra \"c\" do Decreto nº 72.771, de 6 de setembro de 1973).","§ 1º Registrar-se-á na Carteira de Trabalho e Previdência Social do trabalhador sua condição de temporário.","§ 2º A empresa tomadora ou cliente é obrigada a comunicar à empresa de trabalho temporário a ocorrência de todo acidente cuja vítima seja um assalariado posto à sua disposição, considerando-se local de trabalho, para efeito da legislação específica, tanto aquele onde se efetua a prestação do trabalho, quanto a sede da empresa de trabalho temporário.","§ 3º (VETADO na Lei nº 13.429, de 31/3/2017)"],"11":["Art. 11. O contrato de trabalho celebrado entre empresa de trabalho temporário e cada um dos assalariados colocados à disposição de uma empresa tomadora ou cliente será, obrigatoriamente, escrito e dele deverão constar, expressamente, os direitos conferidos aos trabalhadores por esta Lei.","Parágrafo único. Será nula de pleno direito qualquer cláusula de reserva, proibindo a contratação do trabalhador pela empresa tomadora ou cliente ao fim do prazo em que tenha sido colocado à sua disposição pela empresa de trabalho temporário."]}},"Lei 8.036/1990":{"url":"https://www2.camara.leg.br/legin/fed/lei/1990/lei-8036-11-maio-1990-365155-normaatualizada-pl.html","articles":{"15":["Art. 15. Para os fins previstos nesta Lei, todos os empregadores ficam obrigados a depositar, até o vigésimo dia de cada mês, em conta vinculada, a importância correspondente a 8% (oito por cento) da remuneração paga ou devida, no mês anterior, a cada trabalhador, incluídas na remuneração as parcelas de que tratam os arts. 457 e 458 da Consolidação das Leis do Trabalho (CLT), aprovada pelo Decreto-Lei nº 5.452, de 1º de maio de 1943, e a Gratificação de Natal de que trata a Lei nº 4.090, de 13 de julho de 1962. (“Caput” do artigo com redação dada pela Medida Provisória nº 1.107, de 17/3/2022, convertida na Lei nº 14.438, de 24/8/2022, produzindo efeitos a partir da data de início da arrecadação por meio da prestação dos serviços digitais de geração de guias, a que se refere o inciso II do “caput” do art. 17 da Lei nº 8.036, de 11/5/1990, para fatos geradores ocorridos a partir da referida data)","§ 1º Entende-se por empregador a pessoa física ou a pessoa jurídica de direito privado ou de direito público, da administração pública direta, indireta ou fundacional de qualquer dos Poderes, da União, dos Estados, do Distrito Federal e dos Municípios, que admitir trabalhadores a seu serviço, bem assim aquele que, regido por legislação especial, encontrar-se nessa condição ou figurar como fornecedor ou tomador de mão-de-obra, independente da responsabilidade solidária e/ou subsidiária a que eventualmente venha obrigar-se.","§ 2º Considera-se trabalhador toda pessoa física que prestar serviços a empregador, a locador ou tomador de mão-de-obra, excluídos os eventuais, os autônomos e os servidores públicos civis e militares sujeitos a regime jurídico próprio.","§ 3º Os trabalhadores domésticos poderão ter acesso ao regime do FGTS, na forma que vier a ser prevista em lei.","§ 4º Considera-se remuneração as retiradas de diretores não empregados, quando haja deliberação da empresa, garantindo-lhes os direitos decorrentes do contrato de trabalho de que trata o art. 16. (Parágrafo acrescido pela Lei nº 9.711, de 20/11/1998)","§ 5º O depósito de que trata o caput deste artigo é obrigatório nos casos de afastamento para prestação do serviço militar obrigatório e licença por acidente do trabalho. (Parágrafo acrescido pela Lei nº 9.711, de 20/11/1998)","§ 6º Não se incluem na remuneração, para os fins desta Lei, as parcelas elencadas no § 9º do art. 28 da Lei nº 8.212, de 24 de julho de 1991. (Parágrafo acrescido pela Lei nº 9.711, de 20/11/1998)","§ 7º Os contratos de aprendizagem terão a alíquota a que se refere o caput deste artigo reduzida para 2% (dois por cento). (Parágrafo acrescido pela Lei nº 10.097, de 19/12/2000)"],"18":["Art. 18. Ocorrendo rescisão do contrato de trabalho, por parte do empregador, ficará este obrigado a depositar na conta vinculada do trabalhador no FGTS os valores relativos aos depósitos referentes ao mês da rescisão e ao imediatamente anterior, que ainda não houver sido recolhido, sem prejuízo das cominações legais. (“Caput” do artigo com redação dada pela Lei nº 9.491, de 9/9/1997)","§ 1º Na hipótese de despedida pelo empregador sem justa causa, depositará este, na conta vinculada do trabalhador no FGTS, importância igual a quarenta por cento do montante de todos os depósitos realizados na conta vinculada durante a vigência do contrato de trabalho, atualizados monetariamente e acrescidos dos respectivos juros. (Parágrafo com redação dada pela Lei nº 9.491, de 9/9/1997)","§ 2º Quando ocorrer despedida por culpa recíproca ou força maior, reconhecida pela Justiça do Trabalho, o percentual de que trata o § 1º será de 20 (vinte) por cento.","§ 3º As importâncias de que trata este artigo deverão constar da documentação comprobatória do recolhimento dos valores devidos a título de rescisão do contrato de trabalho, observado o disposto no art. 477 da CLT, eximindo o empregador, exclusivamente, quanto aos valores discriminados. (Parágrafo com redação dada pela Lei nº 9.491, de 9/9/1997)"],"20":["Inciso I (síntese) — Permite a movimentação na dispensa sem justa causa, inclusive indireta, por culpa recíproca ou força maior.","Inciso III (síntese) — Permite a movimentação na concessão da aposentadoria pela Previdência Social.","Inciso VII (síntese) — Permite usar o saldo no pagamento total ou parcial da moradia própria, observadas as condições legais.","Inciso IX (síntese) — Permite a movimentação no término normal do contrato a prazo, inclusive do trabalho temporário.","Inciso XX (síntese) — Permite a retirada anual, no mês de aniversário do trabalhador, conforme a sistemática do saque-aniversário."],"20-A":["§ 2º, II (síntese) — Durante o saque-aniversário, o trabalhador não pode movimentar o saldo pelos motivos de desligamento indicados no dispositivo, entre eles a dispensa sem justa causa e o término normal do contrato a prazo."],"20-B":["Caput (síntese) — A modalidade inicial é o saque-rescisão. O titular pode optar pela mudança, conforme o art. 20-C."],"20-C":["§ 1º, I (síntese) — A alteração para saque-rescisão produz efeito no primeiro dia do 25º mês seguinte ao pedido, desde que não haja cessão ou alienação de saques futuros.","§ 2º (síntese) — A dispensa sem justa causa durante o saque-aniversário permite sacar a multa rescisória."]}},"Lei 8.213/1991":{"url":"https://www2.camara.leg.br/legin/fed/lei/1991/lei-8213-24-julho-1991-363650-normaatualizada-pl.html","articles":{"60":["Art. 60. O auxílio-doença será devido ao segurado empregado a contar do décimo sexto dia do afastamento da atividade, e, no caso dos demais segurados, a contar da data do início da incapacidade e enquanto ele permanecer incapaz.. (“Caput” do artigo com redação dada pela Lei nº 9.876, de 26/11/1999)","§ 1º Quando requerido por segurado afastado da atividade por mais de 30 (trinta) dias, o auxílio-doença será devido a contar da data da entrada do requerimento.","§ 2º (Revogado pela Lei n° 9.032, de 28/4/1995)","§ 3º Durante os primeiros quinze dias consecutivos ao do afastamento da atividade por motivo de doença, incumbirá à empresa pagar ao segurado empregado o seu salário integral. (Parágrafo com redação dada pela Lei nº 9.876, de 26/11/1999)","§ 4º A empresa que dispuser de serviço médico, próprio ou em convênio, terá a seu cargo o exame médico e o abono das faltas correspondentes ao período referido no § 3°, somente devendo encaminhar o segurado à perícia médica da Previdência Social quando a incapacidade ultrapassar 15 (quinze) dias.","§ 5º (Parágrafo acrescido pela Lei nº 13.135, de 17/6/2015, e revogado pela Medida Provisória nº 871, de 18/1/2019, convertida na Lei nº 13.846, de 18/6/2019)","§ 6º O segurado que durante o gozo do auxílio-doença vier a exercer atividade que lhe garanta subsistência poderá ter o benefício cancelado a partir do retorno à atividade. (Parágrafo acrescido pela Lei nº 13.135, de 17/6/2015)","§ 7º Na hipótese do § 6º, caso o segurado, durante o gozo do auxílio-doença, venha a exercer atividade diversa daquela que gerou o benefício, deverá ser verificada a incapacidade para cada uma das atividades exercidas. (Parágrafo acrescido pela Lei nº 13.135, de 17/6/2015)","§ 8º Sempre que possível, o ato de concessão ou de reativação de auxílio-doença, judicial ou administrativo, deverá fixar o prazo estimado para a duração do benefício. (Parágrafo acrescido pela Medida Provisória nº 767, de 6/1/2017, convertida na Lei nº 13.457, de 26/6/2017)","§ 9º Na ausência de fixação do prazo de que trata o § 8º deste artigo, o benefício cessará após o prazo de cento e vinte dias, contado da data de concessão ou de reativação do auxílio-doença, exceto se o segurado requerer a sua prorrogação perante o INSS, na forma do regulamento, observado o disposto no art. 62 desta Lei. (Parágrafo acrescido pela Medida Provisória nº 767, de 6/1/2017, convertida e com redação dada pela Lei nº 13.457, de 26/6/2017)","§ 10. O segurado em gozo de auxílio-doença, concedido judicial ou administrativamente, poderá ser convocado a qualquer momento para avaliação das condições que ensejaram sua concessão ou manutenção, observado o disposto no art. 101 desta Lei. (Parágrafo acrescido pela Medida Provisória nº 767, de 6/1/2017, convertida na Lei nº 13.457, de 26/6/2017)","§ 11. O segurado que não concordar com o resultado da avaliação da qual dispõe o § 10 deste artigo poderá apresentar, no prazo máximo de trinta dias, recurso da decisão da administração perante o Conselho de Recursos do Seguro Social, cuja análise médica pericial, se necessária, será feita pelo assistente técnico médico da junta de recursos do seguro social, perito diverso daquele que indeferiu o benefício. (Parágrafo acrescido pela Lei nº 13.457, de 26/6/2017)","§ 11-A. O exame médico-pericial para o auxílio-doença previsto no caput e no §10, a cargo da Previdência Social, poderá ser realizado com o uso de tecnologia de telemedicina ou por análise documental, conforme as situações e os requisitos estabelecidos em regulamento. (Parágrafo acrescido pela Lei nº 14.724, de 14/11/2023, e com redação dada pela Lei nº 15.265, de 21/11/2025)","§ 11-B. (Parágrafo acrescido pela Medida Provisória nº 1.303, de 11/6/2025, com prazo de vigência encerrado em 8/10/2025, conforme Ato Declaratório nº 67, de 14/10/2025, publicado no DOU de 15/10/2025)","§ 11-C. (Parágrafo acrescido pela Medida Provisória nº 1.303, de 11/6/2025, com prazo de vigência encerrado em 8/10/2025, conforme Ato Declaratório nº 67, de 14/10/2025, publicado no DOU de 15/10/2025)","§ 11-D. (Parágrafo acrescido pela Medida Provisória nº 1.303, de 11/6/2025, com prazo de vigência encerrado em 8/10/2025, conforme Ato Declaratório nº 67, de 14/10/2025, publicado no DOU de 15/10/2025)","§ 11-E. (Parágrafo acrescido pela Medida Provisória nº 1.303, de 11/6/2025, com prazo de vigência encerrado em 8/10/2025, conforme Ato Declaratório nº 67, de 14/10/2025, publicado no DOU de 15/10/2025)","§ 11-F. A duração do benefício de auxílio por incapacidade temporária concedido por análise documental não poderá exceder ao prazo de 30 (trinta) dias. (Parágrafo acrescido pela Lei nº 15.265, de 21/11/2025)","§ 11-G. Os benefícios com duração superior ao prazo de que trata o § 11-F estarão sujeitos à realização de perícia presencial ou com o uso de telemedicina. (Parágrafo acrescido pela Lei nº 15.265, de 21/11/2025)","§ 11-H. A duração máxima do benefício de auxílio por incapacidade temporária por análise documental poderá ser diferenciada entre as categorias de segurados do RGPS, observado o prazo de duração de 30 (trinta) dias a que se refere o § 11-F. (Parágrafo acrescido pela Lei nº 15.265, de 21/11/2025)","§ 11-I. O prazo de duração previsto no § 11-F poderá ser excepcionalizado por ato do Poder Executivo federal, de forma justificada e por prazo determinado. (Parágrafo acrescido pela Lei nº 15.265, de 21/11/2025)","§ 12 (Parágrafo acrescido pela Medi
