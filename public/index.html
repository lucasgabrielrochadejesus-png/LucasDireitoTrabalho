a","Suspensão disciplinar","Intervalo entre vínculos"],"explanation":"O art. 15, § 5º, mantém o depósito durante licença por acidente do trabalho e serviço militar obrigatório."},{"id":"fgts-4","chapter":"fgts","level":"M","text":"A base atualizada da multa na empresa Beta é de R$ 5.000 e o saldo depois de saque anterior é de R$ 2.000. Qual é a multa na dispensa sem justa causa?","options":["R$ 2.000","R$ 800","R$ 1.200","R$ 1.000","R$ 3.000"],"explanation":"Aplique 40% à base de R$ 5.000. Saques anteriores não diminuem a base da multa."},{"id":"fgts-5","chapter":"fgts","level":"A","text":"Uma empregada optou pelo saque-aniversário e foi dispensada sem justa causa. Pela regra geral, o que a dispensa permite retirar?","options":["A multa rescisória","Todo o saldo e a multa","80% do saldo e a multa","Somente os depósitos do último mês","Somente metade da multa"],"explanation":"A opção pelo saque-aniversário preserva o saque da multa e impede a retirada do saldo pelo motivo da dispensa."},{"id":"fgts-6","chapter":"fgts","level":"A","text":"No saque-rescisão, o empregado e a empresa encerram o vínculo por acordo na forma do art. 484-A da CLT. Qual regra se aplica ao FGTS?","options":["Multa de 20% e movimentação de até 80% do saldo","Multa de 40% e movimentação integral","Multa de 20% e movimentação integral","Multa de 40% e movimentação de até 80%","Multa de 20% com bloqueio integral do saldo"],"explanation":"O art. 484-A, I, b, reduz a multa pela metade, e o § 1º limita a movimentação a 80%."},{"id":"fgts-7","chapter":"fgts","level":"B","text":"Quem deve fazer o depósito do FGTS?","options":["O empregador","O empregado","O sindicato","O INSS","O banco"],"explanation":"O empregador deposita em conta vinculada, conforme o art. 15 da Lei 8.036/1990."},{"id":"fgts-8","chapter":"fgts","level":"B","text":"Em qual conta são realizados os depósitos do FGTS?","options":["Em conta vinculada ao contrato de trabalho","Na conta bancária usada para receber o salário","Em conta do sindicato","Em conta individual do INSS","Em conta de livre movimentação da empresa"],"explanation":"O art. 15 determina o depósito em conta vinculada."},{"id":"fgts-9","chapter":"fgts","level":"B","text":"Qual verba integra expressamente a base do FGTS segundo o art. 15?","options":["Décimo terceiro salário","Multa rescisória do FGTS","Seguro-desemprego","Saque-aniversário","Saldo de contrato anterior"],"explanation":"O art. 15 inclui a gratificação natalina na base de cálculo."},{"id":"fgts-10","chapter":"fgts","level":"B","text":"Qual o dia de vencimento mensal do FGTS, pela regra geral, quando for dia útil?","options":["Dia 20 do mês seguinte","Dia 7 do mês seguinte","Dia 10 do mês seguinte","Último dia do mês trabalhado","Dia 30 do mês seguinte"],"explanation":"O art. 15 fixa o vencimento no dia 20 do mês seguinte."},{"id":"fgts-11","chapter":"fgts","level":"B","text":"Qual modalidade de saque se aplica inicialmente ao trabalhador?","options":["Saque-rescisão","Saque-aniversário","Saque por aposentadoria","Saque por aquisição de moradia","Saque por acordo"],"explanation":"O art. 20-B prevê o saque-rescisão como modalidade inicial."},{"id":"fgts-12","chapter":"fgts","level":"M","text":"Uma empresa tem um aprendiz e um empregado na alíquota geral, ambos com base mensal de R$ 1.800. Quanto deposita ao todo?","options":["R$ 180","R$ 144","R$ 36","R$ 216","R$ 288"],"explanation":"São R$ 36 pela alíquota de 2% e R$ 144 pela alíquota de 8%."},{"id":"fgts-13","chapter":"fgts","level":"M","text":"O dia 20 do mês seguinte cai em um domingo e a sexta anterior é dia útil. Quando vence o depósito mensal?","options":["Na sexta-feira anterior","No domingo","Na segunda-feira seguinte","No sábado anterior","No último dia útil do mês seguinte"],"explanation":"Quando o dia 20 cai em dia não útil, o vencimento é antecipado ao dia útil imediatamente anterior."},{"id":"fgts-14","chapter":"fgts","level":"M","text":"No saque-rescisão, o contrato de experiência acaba na data prevista. Qual efeito esse término produz sobre o FGTS?","options":["Autoriza o saque do saldo do vínculo, sem multa de 40% pelo término normal","Autoriza apenas o saque de multa de 40%","Autoriza o saque de até 80% e multa de 20%","Impede o saque até a próxima admissão","Autoriza apenas o saque dos depósitos do mês final"],"explanation":"O término normal de contrato a prazo autoriza o saque na forma do art. 20, IX. A multa de 40% é própria da dispensa sem justa causa pelo empregador."},{"id":"fgts-15","chapter":"fgts","level":"M","text":"Um empregado pede demissão e está no saque-rescisão. O que o pedido de demissão autoriza por si só?","options":["Nenhum saque por esse motivo","Saque integral com multa de 40%","Saque integral sem multa","Saque de até 80% e multa de 20%","Saque obrigatório dos depósitos do último ano"],"explanation":"O art. 20 não prevê pedido de demissão como hipótese de movimentação por rescisão."},{"id":"fgts-16","chapter":"fgts","level":"M","text":"A Justiça do Trabalho reconhece culpa recíproca. A base da multa é de R$ 10.000. Qual o valor da multa?","options":["R$ 2.000","R$ 4.000","R$ 1.000","R$ 8.000","R$ 0"],"explanation":"O art. 18, § 2º, fixa 20% quando a Justiça do Trabalho reconhece culpa recíproca."},{"id":"fgts-17","chapter":"fgts","level":"A","text":"Uma trabalhadora tem R$ 9.000 de base rescisória no vínculo com a empresa atual e R$ 4.000 em conta de um contrato anterior. Foi dispensada sem justa causa pela empresa atual. Quanto ela recebe de multa desse empregador?","options":["R$ 3.600","R$ 5.200","R$ 1.600","R$ 2.600","R$ 1.800"],"explanation":"A multa de 40% incide sobre os R$ 9.000 da base rescisória do contrato encerrado."},{"id":"fgts-18","chapter":"fgts","level":"A","text":"O contrato acabou em 15/03/2025 e a ação foi ajuizada em 15/02/2027. Sem causas de suspensão ou interrupção, a partir de quando são exigíveis, em regra, os depósitos inadimplidos?","options":["15/02/2022","15/03/2020","15/03/2023","15/02/2025","15/03/2025"],"explanation":"A ação foi ajuizada dentro dos dois anos após o término. Os cinco anos são contados para trás a partir do ajuizamento."},{"id":"fgts-19","chapter":"fgts","level":"A","text":"Um empregado pede o retorno ao saque-rescisão em março de 2026 e não tem antecipação contratada. Em que data o retorno passa a valer pela regra do art. 20-C?","options":["1º de abril de 2028","1º de março de 2028","1º de março de 2027","1º de abril de 2027","No próprio dia do pedido"],"explanation":"Abril de 2026 é o primeiro mês seguinte ao pedido. Abril de 2028 é o 25º."},{"id":"fgts-20","chapter":"fgts","level":"A","text":"Uma aprendiz fica afastada por licença decorrente de acidente do trabalho. Qual regra combina corretamente o afastamento e o tipo de contrato?","options":["O depósito segue obrigatório e a alíquota é de 2%","O depósito é suspenso a partir do 16º dia","O depósito é obrigatório e passa para 8%","O depósito só volta quando a aprendiz retorna","O depósito depende de dispensa sem justa causa"],"explanation":"O art. 15, § 5º, mantém a obrigação no afastamento acidentário, e o § 7º fixa a alíquota da aprendizagem em 2%."},{"id":"fgts-21","chapter":"fgts","level":"A","text":"A empresa dispensa empregado sem justa causa e ainda deve o FGTS do mês anterior e do mês da rescisão. Qual providência se soma à multa, conforme o art. 18?","options":["Depositar os valores pendentes dos dois meses na conta vinculada","Pagar os dois meses diretamente ao empregado como salário","Depositar somente o mês anterior","Depositar somente o mês da rescisão","Considerar os dois depósitos substituídos pela multa"],"explanation":"O art. 18, caput, exige o recolhimento do mês da rescisão e do mês imediatamente anterior quando ainda pendente."}]}],"extra":{"metodo":{"title":"Como estudar para a prova","body":[{"type":"heading","text":"Um bloco de 45 minutos"},{"type":"number","text":"Leia com propósito por 15 minutos. Identifique o conceito, os requisitos, a exceção e o efeito jurídico. Marque o artigo de referência e acompanhe o exemplo."},{"type":"number","text":"Feche o material por 10 minutos. Explique o tema em voz alta, como se ensinasse a alguém. Depois escreva de memória uma regra e uma exceção. Use as perguntas no fim dos capítulos."},{"type":"number","text":"Resolva um caso por 15 minutos. Use quatro passos. Identifique o instituto, destaque o fato decisivo, cite a regra e conclua. Nas objetivas, justifique por que as duas alternativas mais parecidas dão resultados diferentes."},{"type":"number","text":"Corrija por cinco minutos. Registre o erro em uma frase e crie uma pergunta curta para repeti-lo. Use as categorias conceito, requisito, prazo, exceção e cálculo. Se a resposta saiu certa por chute, registre como dúvida."},{"type":"heading","text":"Um roteiro flexível de seis sessões"},{"type":"bullet","text":"Sessão 1. Princípios, interpretação e relação de emprego. Treine a identificação dos elementos do vínculo a partir de fatos."},{"type":"bullet","text":"Sessão 2. Contrato, regimes especiais e terceirização. Compare jornada parcial e intermitente, contratação a termo e trabalho temporário."},{"type":"bullet","text":"Sessão 3. Salário, jornada, suspensão e estabilidade. Faça um caso de cargo de confiança e uma linha do tempo de afastamento acidentário."},{"type":"bullet","text":"Sessão 4. Férias e aviso prévio. Treine faixas de faltas, fracionamento, dobra, novo emprego e projeção."},{"type":"bullet","text":"Sessão 5. Extinção e verbas. Monte de memória uma tabela com motivo, iniciativa, aviso, férias, 13º e FGTS."},{"type":"bullet","text":"Sessão 6. Resolva os casos mistos sem consulta. Corrija, identifique os dois erros mais frequentes e refaça as questões correspondentes mudando um fato."},{"type":"heading","text":"Revisão espaçada e prioridades"},{"type":"body","text":"Após uma sessão, tente responder às perguntas novamente no dia seguinte e, se houver tempo, após três e sete dias. Use esses intervalos como sugestão. Se a prova estiver próxima, faça duas rodadas em horários diferentes e priorize os erros. Na preparação para a prova, merecem atenção as faixas de faltas e a dobra parcial de férias, a rescisão indireta, o art. 480, o novo emprego e a justa causa durante o aviso, a multa do art. 467 e o requisito funcional do cargo de confiança.","refs":[{"law":"CLT","ids":["480","467","62"],"label":"arts. 480, 467, 62","highlights":{"480":{"0":["direct",195],"1":["direct",187]},"467":{"0":["direct",305]},"62":{"2":["direct",182],"4":["direct",361],"0":["related",64]}}}]},{"type":"body","text":"Exemplo de registro. “Errei porque tratei o limite do art. 480 como indenização automática. Qual é o valor devido se o teto é R$ 6.000 e o prejuízo comprovado é R$ 2.000?” Domínio significa explicar o resultado e dizer qual fato mudaria a resposta.","refs":[{"law":"CLT","ids":["480"],"label":"art. 480","highlights":{"480":{"0":["direct",195],"1":["direct",187]}}}]},{"type":"link","text":"Roediger e Karpicke • Recuperação ativa","url":"https://journals.sagepub.com/doi/abs/10.1111/j.1467-9280.2006.01693.x"},{"type":"link","text":"Cepeda e colaboradores • Prática espaçada","url":"https://laplab.ucsd.edu/articles/Cepeda%20et%20al%202008_psychsci.pdf"}]},"casos":{"title":"Casos para resolver sem consulta","body":[{"type":"number","text":"Uma família contrata uma cuidadora três dias por semana para atender um idoso em casa. Ela trabalha pessoalmente, recebe pagamento e segue as orientações da família. Qual é o enquadramento? O que mudaria se ela prestasse os mesmos serviços para o negócio da família?"},{"type":"number","text":"Uma fábrica contrata diretamente um operador em experiência por 30 dias. Renova duas vezes, sempre por 30 dias. O prazo total é de 90 dias. O contrato continua a termo? E se a fábrica usasse uma agência registrada para atender demanda complementar sazonal?"},{"type":"number","text":"Uma prestadora deixa salários em aberto. Compare a responsabilidade de uma tomadora privada com a de um órgão público que recebeu notificação formal e permaneceu inerte."},{"type":"number","text":"Uma trabalhadora recebe R$ 2.000 fixos, R$ 400 em comissões e R$ 300 em gorjetas. Calcule salário e remuneração. A empresa passa a chamá-la de gerente e a pagar o patamar de 40%, mas a chefia mantém todas as decisões com o supervisor. Como examinar o art. 62?","refs":[{"law":"CLT","ids":["62"],"label":"art. 62","highlights":{"62":{"2":["direct",182],"4":["direct",361],"0":["related",64]}}}]},{"type":"number","text":"Um empregado teve 16 faltas injustificadas no período aquisitivo. Quantos dias de férias terá? Pode dividir em 14 + 4? Em outro caso, 20 dias foram gozados no prazo e dez depois. Sobre quantos dias incide a dobra?"},{"type":"number","text":"Uma empregada dispensada tem oito anos completos na empresa. Quantos dias de aviso a lei prevê? Em um segundo caso, um empregado pede liberação do aviso trabalhado por novo emprego e entrega comprovante. Qual efeito pode ocorrer sobre o período restante?"},{"type":"number","text":"João ficou afastado por acidente de trabalho e recebeu benefício acidentário. Foi dispensado quatro meses depois da cessação do benefício. A empresa precisava depositar FGTS durante a licença? Qual período de garantia ainda restava em tese?"},{"type":"number","text":"Restavam quatro meses de um contrato a termo, com remuneração de R$ 3.000 por mês. Sem cláusula assecuratória, compare a dispensa antecipada pelo empregador com a saída pelo empregado se a empresa comprovar prejuízo de R$ 2.000."},{"type":"number","text":"O empregador deixa passar o prazo geral de quitação e mais tarde comparece à Justiça sem pagar R$ 4.000 incontroversos. Outros R$ 3.000 seguem controvertidos. Qual fato aciona cada artigo? Quanto é o acréscimo do art. 467?","refs":[{"law":"CLT","ids":["467","477"],"label":"arts. 467, 477","highlights":{"467":{"0":["direct",305]},"477":{"8":["direct",285],"0":["related",270],"12":["related",319]}}}]},{"type":"number","text":"A trabalhadora sofre atrasos salariais repetidos. A empresa propõe simular dispensa sem justa causa e pede devolução de parte da multa do FGTS. Diferencie rescisão indireta, acordo legal e simulação."}]},"gabarito":{"title":"Gabarito comentado","body":[{"type":"number","text":"Emprego doméstico, porque há prestação pessoal, contínua, subordinada e remunerada por mais de dois dias semanais a família sem finalidade lucrativa. Se o serviço integrar o negócio da família, aplique os critérios do regime correspondente à atividade econômica."},{"type":"number","text":"A segunda prorrogação converte o contrato em indeterminado (art. 451), embora o total respeite 90 dias. A agência pode configurar trabalho temporário da Lei 6.019 se houver motivo legal e demais requisitos. A agência contrata o trabalhador e a fábrica é a tomadora.","refs":[{"law":"CLT","ids":["451"],"label":"art. 451","highlights":{"451":{"0":["direct",161]}}}]},{"type":"number","text":"A tomadora privada pode responder subsidiariamente pelas obrigações do período da prestação. No caso público, a responsabilidade não é automática. A inércia após notificação formal idônea do descumprimento é hipótese de negligência descrita no Tema 1118 do STF."},{"type":"number","text":"Salário de R$ 2.400 e remuneração de R$ 2.700. Examine os poderes reais de gestão e a remuneração. Ainda que o patamar salarial seja preenchido, o cenário descrito não mostra poderes efetivos de gestão."},{"type":"number","text":"São 18 dias. O período de quatro dias fica abaixo do mínimo de cinco no fracionamento. No segundo caso, a dobra alcança os dez dias gozados fora do concessivo. Pagamento tardio isolado tem disciplina diferente."},{"type":"number","text":"São 54 dias (30 + 3 × 8). Se o empregado pediu dispensa de cumprir e comprovou novo emprego, pode cessar a obrigação de pagar o restante do aviso, conforme a Súmula 276."},{"type":"number","text":"O FGTS é devido durante a licença acidentária. A garantia legal é de pelo menos 12 meses após a cessação do benefício. No exemplo, restariam cerca de oito meses."},{"type":"number","text":"Pelo art. 479, o empregador deve indenização de R$ 6.000 na hipótese dada. Pelo art. 480, a indenização é limitada aos prejuízos demonstrados e ao teto de R$ 6.000. Com prejuízo comprovado de R$ 2.000, a resposta é R$ 2.000.","refs":[{"law":"CLT","ids":["479","480"],"label":"arts. 479, 480","highlights":{"479":{"0":["direct",234],"1":["related",244]},"480":{"0":["direct",195],"1":["direct",187]}}}]},{"type":"number","text":"A perda do prazo de pagamento e entrega de documentos é tratada pelo art. 477, observada a exceção de mora causada pelo trabalhador. O não pagamento da parte incontroversa no comparecimento à Justiça aciona o art. 467. O acréscimo é 50% de R$ 4.000, ou R$ 2.000.","refs":[{"law":"CLT","ids":["477","467"],"label":"arts. 477, 467","highlights":{"477":{"8":["direct",285],"12":["direct",319],"0":["related",270]},"467":{"0":["direct",305]}}}]},{"type":"number","text":"A rescisão indireta exige falta grave do empregador. Atrasos reiterados podem caracterizar descumprimento grave conforme a prova. O acordo do art. 484-A exige consentimento e prevê multa de 20% do FGTS. A dispensa simulada com devolução de valor é fraude.","refs":[{"law":"CLT","ids":["483","484-A"],"label":"arts. 483, 484-A","highlights":{"483":{"0":["direct",101],"4":["direct",54],"10":["related",209]},"484-A":{"0":["direct",154],"1":["direct",15],"2":["direct",35],"3":["direct",140],"4":["direct",53],"5":["direct",291],"6":["direct",127]}}}]}]},"fontes-oficiais":{"title":"Fontes para consultar durante a revisão","body":[{"type":"body","text":"O primeiro semestre segue os tópicos do caderno. As questões e correções de “Intensivo de estudos” orientam o segundo semestre e as prioridades de treino. Use as fontes abaixo para ler a redação dos artigos e conferir as teses."},{"type":"heading","text":"Textos legais"},{"type":"link","text":"Constituição Federal • Arts. 1º, 6º a 8º, 37 e 114","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"type":"link","text":"CLT • Consolidação das Leis do Trabalho","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"type":"link","text":"LINDB • Interpretação e integração","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del4657compilado.htm"},{"type":"link","text":"Lei 6.019/1974 • Trabalho temporário e terceirização","url":"https://www.planalto.gov.br/ccivil_03/leis/l6019.htm"},{"type":"link","text":"Lei 5.889/1973 • Trabalho rural","url":"https://www.planalto.gov.br/ccivil_03/leis/l5889.htm"},{"type":"link","text":"Lei 8.212/1991 • Consórcio de produtores rurais","url":"https://www.planalto.gov.br/ccivil_03/leis/l8212cons.htm"},{"type":"link","text":"LC 150/2015 • Trabalho doméstico","url":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp150.htm"},{"type":"link","text":"Lei 11.788/2008 • Estágio","url":"https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2008/lei/l11788.htm"},{"type":"link","text":"Lei 12.506/2011 • Aviso prévio proporcional","url":"https://www.planalto.gov.br/ccivil_03/_ato2011-2014/2011/lei/l12506.htm"},{"type":"link","text":"Lei 8.036/1990 • FGTS","url":"https://www.planalto.gov.br/ccivil_03/leis/l8036consol.htm"},{"type":"link","text":"Lei 8.213/1991 • Benefícios previdenciários e garantia acidentária","url":"https://www.planalto.gov.br/ccivil_03/leis/l8213cons.htm"},{"type":"heading","text":"Decisões e enunciados"},{"type":"link","text":"STF • Tema 725 sobre terceirização","url":"https://portal.stf.jus.br/jurisprudenciarepercussao/verandamentoprocesso.asp?classeprocesso=re&incidente=4952236&numeroprocesso=958252&numerotema=725"},{"type":"link","text":"STF • Tema 1118 sobre responsabilidade da Administração Pública","url":"https://portal.stf.jus.br/processos/detalhe.asp?incidente=6048634"},{"type":"link","text":"STF • Tema 1046 sobre negociação coletiva","url":"https://portal.stf.jus.br/jurisprudenciaRepercussao/verAndamentoProcesso.asp?classeProcesso=RE&incidente=5415427&numeroProcesso=1121633&numeroTema=1046"},{"type":"link","text":"STF • ADPF 501 sobre pagamento tardio das férias","url":"https://portal.stf.jus.br/noticias/verNoticiaDetalhe.asp?idConteudo=492245&tip=UN"},{"type":"link","text":"TST • Súmulas e orientações jurisprudenciais","url":"https://www.tst.jus.br/documents/d/guest/livrointernet-12-pdf"},{"type":"link","text":"TST • Tema 125 sobre doença ocupacional e estabilidade","url":"https://www.tst.jus.br/documents/10157/0/IRR125.pdf"}]}},"laws":{"CLT":{"url":"https://www2.camara.leg.br/legin/fed/declei/1940-1949/decreto-lei-5452-1-maio-1943-415500-normaatualizada-pe.html","articles":{"2":["Art. 2º Considera-se empregador a empresa individual ou coletiva, que, assumindo os riscos de atividade econômica, admite, assalaria e dirige a prestação pessoal de serviços.","§ 1º Equiparam-se ao empregador, para os efeitos exclusivos da relação de emprego, os profissionais liberais, as instituições de beneficência, as associações recreativas ou outras instituições sem fins lucrativos, que admitirem trabalhadores como empregados.","§ 2º Sempre que uma ou mais empresas, tendo, embora, cada uma delas, personalidade jurídica própria, estiverem sob a direção, controle ou administração de outra, ou ainda quando, mesmo guardando cada uma sua autonomia, integrem grupo econômico, serão responsáveis solidariamente pelas obrigações decorrentes da relação de emprego. (Parágrafo com redação dada pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 3º Não caracteriza grupo econômico a mera identidade de sócios, sendo necessárias, para a configuração do grupo, a demonstração do interesse integrado, a efetiva comunhão de interesses e a atuação conjunta das empresas dele integrantes. (Parágrafo acrescido pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)"],"3":["Art. 3º Considera-se empregado toda pessoa física que prestar serviços de natureza não eventual a empregador, sob a dependência deste e mediante salário.","Parágrafo único. Não haverá distinções relativas à espécie de emprego e à condição de trabalhador, nem entre o trabalho intelectual, técnico e manual. (Vide art. 7º, XXXII, da Constituição Federal de 1988)"],"6":["Art. 6º Não se distingue entre o trabalho realizado no estabelecimento do empregador, o executado no domicílio do empregado e o realizado a distância, desde que estejam caracterizados os pressupostos da relação de emprego. (“Caput” do artigo com redação dada pela Lei nº 12.551, de 15/12/2011)","Parágrafo único. Os meios telemáticos e informatizados de comando, controle e supervisão se equiparam, para fins de subordinação jurídica, aos meios pessoais e diretos de comando, controle e supervisão do trabalho alheio. (Parágrafo único acrescido pela Lei nº 12.551, de 15/12/2011)"],"8":["Art. 8º As autoridades administrativas e a Justiça do Trabalho, na falta de disposições legais ou contratuais, decidirão conforme o caso, pela jurisprudência, por analogia, por eqüidade e outros princípios e normas gerais de direito, principalmente do direito do trabalho, e, ainda, de acordo com os usos e costumes, o direito comparado, mas sempre de maneira que nenhum interesse de classe ou particular prevaleça sobre o interesse público.","§ 1º O direito comum será fonte subsidiária do direito do trabalho. (Parágrafo único transformado em § 1º e com redação dada pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 2º Súmulas e outros enunciados de jurisprudência editados pelo Tribunal Superior do Trabalho e pelos Tribunais Regionais do Trabalho não poderão restringir direitos legalmente previstos nem criar obrigações que não estejam previstas em lei. (Parágrafo acrescido pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 3º No exame de convenção coletiva ou acordo coletivo de trabalho, a Justiça do Trabalho analisará exclusivamente a conformidade dos elementos essenciais do negócio jurídico, respeitado o disposto no art. 104 da Lei nº 10.406, de 10 de janeiro de 2002 (Código Civil), e balizará sua atuação pelo princípio da intervenção mínima na autonomia da vontade coletiva. (Parágrafo acrescido pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)"],"9":["Art. 9º Serão nulos de pleno direito os atos praticados com o objetivo de desvirtuar, impedir ou fraudar a aplicação dos preceitos contidos na presente Consolidação."],"58-A":["Art. 58-A. Considera-se trabalho em regime de tempo parcial aquele cuja duração não exceda a trinta horas semanais, sem a possibilidade de horas suplementares semanais, ou, ainda, aquele cuja duração não exceda a vinte e seis horas semanais, com a possibilidade de acréscimo de até seis horas suplementares semanais. (“Caput” do artigo acrescido pela Medida Provisória nº 2.164-41, de 24/8/2001, com redação dada pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 1º O salário a ser pago aos empregados sob o regime de tempo parcial será proporcional à sua jornada, em relação aos empregados que cumprem, nas mesmas funções, tempo integral. (Parágrafo acrescido pela Medida Provisória nº 2.164-41, de 24/8/2001)","§ 2º Para os atuais empregados, a adoção do regime de tempo parcial será feita mediante opção manifestada perante a empresa, na forma prevista em instrumento decorrente de negociação coletiva. (Parágrafo acrescido pela Medida Provisória nº 2.164-41, de 24/8/2001)","§ 3º As horas suplementares à duração do trabalho semanal normal serão pagas com o acréscimo de 50% (cinquenta por cento) sobre o salário-hora normal. (Parágrafo acrescido pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 4º Na hipótese de o contrato de trabalho em regime de tempo parcial ser estabelecido em número inferior a vinte e seis horas semanais, as horas suplementares a este quantitativo serão consideradas horas extras para fins do pagamento estipulado no § 3º, estando também limitadas a seis horas suplementares semanais. (Parágrafo acrescido pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 5º As horas suplementares da jornada de trabalho normal poderão ser compensadas diretamente até a semana imediatamente posterior à da sua execução, devendo ser feita a sua quitação na folha de pagamento do mês subsequente, caso não sejam compensadas. (Parágrafo acrescido pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 6º É facultado ao empregado contratado sob regime de tempo parcial converter um terço do período de férias a que tiver direito em abono pecuniário. (Parágrafo acrescido pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 7º As férias do regime de tempo parcial são regidas pelo disposto no art. 130 desta Consolidação. (Parágrafo acrescido pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)"],"59":["Art. 59. A duração diária do trabalho poderá ser acrescida de horas extras, em número não excedente de duas, por acordo individual, convenção coletiva ou acordo coletivo de trabalho. (“Caput” do artigo com redação dada pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 1º A remuneração da hora extra será, pelo menos, 50% (cinquenta por cento) superior à da hora normal. (Parágrafo com redação dada pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 2º Poderá ser dispensado o acréscimo de salário se, por força de acordo ou convenção coletiva de trabalho, o excesso de horas em um dia for compensado pela correspondente diminuição em outro dia, de maneira que não exceda, no período máximo de um ano, à soma das jornadas semanais de trabalho previstas, nem seja ultrapassado o limite máximo de dez horas diárias. (Parágrafo com redação dada pela Medida Provisória nº 2.164-41, de 24/8/2001)","§ 3º Na hipótese de rescisão do contrato de trabalho sem que tenha havido a compensação integral da jornada extraordinária, na forma dos §§ 2º e 5º deste artigo, o trabalhador terá direito ao pagamento das horas extras não compensadas, calculadas sobre o valor da remuneração na data da rescisão. (Parágrafo acrescido pela Lei nº 9.601, de 21/1/1998, com redação dada pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 4º (Parágrafo acrescido pela Medida Provisória nº 2.164-41, de 24/8/2001, e revogado pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 5º O banco de horas de que trata o § 2º deste artigo poderá ser pactuado por acordo individual escrito, desde que a compensação ocorra no período máximo de seis meses. (Parágrafo acrescido pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 6º É lícito o regime de compensação de jornada estabelecido por acordo individual, tácito ou escrito, para a compensação no mesmo mês. (Parágrafo acrescido pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)"],"62":["Art. 62. Não são abrangidos pelo regime previsto neste capítulo: (“Caput” do artigo com redação dada pela Lei nº 8.966, de 27/12/1994)","I - os empregados que exercem atividade externa incompatível com a fixação de horário de trabalho, devendo tal condição ser anotada na Carteira de Trabalho e Previdência Social e no registro de empregados; (Inciso acrescido pela Lei nº 8.966, de 27/12/1994)","II - os gerentes, assim considerados os exercentes de cargos de gestão, aos quais se equiparam, para efeito do disposto neste artigo, os diretores e chefes de departamento ou filial; (Inciso acrescido pela Lei nº 8.966, de 27/12/1994)","III - os empregados em regime de teletrabalho que prestam serviço por produção ou tarefa. (Inciso acrescido pela Lei nº 13.467, de 13/7/2017, e com nova redação dada pela Medida Provisória nº 1.108, de 25/3/2022, convertida na Lei nº 14.442, de 2/9/2022)","Parágrafo único. O regime previsto neste capítulo será aplicável aos empregados mencionados no inciso II deste artigo, quando o salário do cargo de confiança, compreendendo a gratificação de função, se houver, for inferior ao valor do respectivo salário efetivo acrescido de 40% (quarenta por cento). (Parágrafo único acrescido pela Lei nº 8.966, de 27/12/1994)"],"129":["Art. 129. Todo empregado terá direito anualmente ao gozo de um período de férias, sem prejuízo da remuneração. (Artigo com redação dada pelo Decreto-Lei nº 1.535, de 13/4/1977) (Vide art. 7º, XVII, da Constituição Federal de 1988)"],"130":["Art. 130. Após cada período de 12 (doze) meses de vigência do contrato de trabalho, o empregado terá direito a férias, na seguinte proporção: (“Caput” do artigo com redação dada pelo Decreto-Lei nº 1.535, de 13/4/1977)","I - 30 (trinta) dias corridos, quando não houver faltado ao serviço mais de 5 (cinco) vezes; (Inciso acrescido pelo Decreto-Lei nº 1.535, de 13/4/1977)","II - 24 (vinte e quatro) dias corridos, quando houver tido 6 (seis) a 14 (quatorze) faltas; (Inciso acrescido pelo Decreto-Lei nº 1.535, de 13/4/1977)","III - 18 (dezoito) dias corridos, quando houver tido de 15 (quinze) a 23 (vinte e três) faltas; (Inciso acrescido pelo Decreto-Lei nº 1.535, de 13/4/1977)","IV - 12 (doze) dias corridos, quando houver tido de 24 (vinte e quatro) a 32 (trinta e duas) faltas. (Inciso acrescido pelo Decreto-Lei nº 1.535, de 13/4/1977)","§ 1º É vedado descontar, do período de férias, as faltas do empregado ao serviço. (Parágrafo acrescido pelo Decreto-Lei nº 1.535, de 13/4/1977)","§ 2º O período das férias será computado, para todos os efeitos, como tempo de serviço. (Parágrafo acrescido pelo Decreto-Lei nº 1.535, de 13/4/1977)"],"131":["Art. 131. Não será considerada falta ao serviço, para os efeitos do artigo anterior, a ausência do empregado: (“Caput” do artigo com redação dada pelo Decreto-Lei nº 1.535, de 13/4/1977)","I - nos casos referidos no art. 473; (Inciso acrescido pelo Decreto-Lei nº 1.535, de 13/4/1977)","II - durante o licenciamento compulsório da empregada por motivo de maternidade ou aborto, observados os requisitos para percepção do salário-maternidade custeado pela Previdência Social. (Inciso acrescido pelo Decreto-Lei nº 1.535, de 13/4/1977, com redação dada pela Lei nº 8.921, de 25/7/1994) (Vide Lei nº 15.371, de 31/3/2026)","III - por motivo de acidente do trabalho ou enfermidade atestada pelo Instituto Nacional do Seguro Social (INSS), excetuada a hipótese do inciso IV do art. 133; (Inciso acrescido pelo Decreto-Lei nº 1.535, de 13/4/1977, com redação dada pela Lei nº 8.726, de 5/11/1993)","IV - justificada pela empresa entendendo-se como tal a que não tiver determinado o desconto do correspondente salário; (Inciso acrescido pelo Decreto-Lei nº 1.535, de 13/4/1977)","V - durante a suspensão preventiva para responder a inquérito administrativo ou de prisão preventiva, quando for impronunciado ou absolvido; e (Inciso acrescido pelo Decreto-Lei nº 1.535, de 13/4/1977)","VI - nos dias em que não tenha havido serviço salvo na hipótese do inciso III do art. 133. (Inciso acrescido pelo Decreto-Lei nº 1.535, de 13/4/1977)"],"133":["Art. 133. Não terá direito a férias o empregado que, no curso do período aquisitivo: (“Caput” do artigo com redação dada pelo Decreto-Lei nº 1.535, de 13/4/1977)","I - deixar o emprego e não for readmitido dentro dos 60 (sessenta) dias subseqüentes à sua saída; (Inciso acrescido pelo Decreto-Lei nº 1.535, de 13/4/1977)","II - permanecer em gozo de licença, com percepção de salários, por mais de 30 (trinta) dias; (Inciso acrescido pelo Decreto-Lei nº 1.535, de 13/4/1977)","III - deixar de trabalhar, com percepção do salário, por mais de 30 (trinta) dias, em virtude de paralisação parcial ou total dos serviços da empresa; e (Inciso acrescido pelo Decreto-Lei nº 1.535, de 13/4/1977)","IV - tiver percebido da Previdência Social prestações de acidente de trabalho ou de auxílio-doença por mais de 6 (seis) meses, embora descontínuos. (Inciso acrescido pelo Decreto-Lei nº 1.535, de 13/4/1977)","§ 1º A interrupção da prestação de serviços deverá ser anotada na Carteira de Trabalho e Previdência Social. (Parágrafo único transformado em § 1º, com redação dada pelo Decreto-Lei nº 1.535, de 13/4/1977)","§ 2º Iniciar-se-á o decurso de novo período aquisitivo quando o empregado, após o implemento de qualquer das condições previstas neste artigo, retornar ao serviço. (Parágrafo acrescido pelo Decreto-Lei nº 1.535, de 13/4/1977)","§ 3º Para os fins previstos no inciso III deste artigo, a empresa comunicará ao órgão local do Ministério do Trabalho, com antecedência mínima de quinze dias, as datas de início e fim da paralisação total ou parcial dos serviços da empresa, e, em igual prazo, comunicará, nos mesmos termos, ao sindicato representativo da categoria profissional, bem como afixará aviso nos respectivos locais de trabalho. (Parágrafo acrescido pela Lei nº 9.016, de 30/3/1995)","§ 4º (VETADO na Lei nº 9.016, de 30/3/1995)"],"134":["Art. 134. As férias serão concedidas por ato do empregador, em um só período, nos 12 (doze) meses subseqüentes à data em que o empregado tiver adquirido o direito. (“Caput” do artigo com redação dada pelo Decreto-Lei nº 1.535, de 13/4/1977)","§ 1º Desde que haja concordância do empregado, as férias poderão ser usufruídas em até três períodos, sendo que um deles não poderá ser inferior a quatorze dias corridos e os demais não poderão ser inferiores a cinco dias corridos, cada um. (Parágrafo acrescido pelo Decreto-Lei nº 1.535, de 13/4/1977, com redação dada pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 2º (Parágrafo acrescido pelo Decreto-Lei nº 1.535, de 13/4/1977, e revogado pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 3º É vedado o início das férias no período de dois dias que antecede feriado ou dia de repouso semanal remunerado. (Parágrafo acrescido pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 4º (Vide Lei nº 15.371, de 31/3/2026)","§ 5º (Vide Lei nº 15.371, de 31/3/2026)"],"135":["Art. 135. A concessão das férias será participada, por escrito, ao empregado, com antecedência de, no mínimo, 30 (trinta) dias. Dessa participação o interessado dará recibo. (“Caput” do artigo com redação dada pela Lei nº 7.414, de 9/12/1985)","§ 1º O empregado não poderá entrar no gozo das férias sem que apresente ao empregador sua Carteira de Trabalho e Previdência Social, para que nela seja anotada a respectiva concessão. (Parágrafo acrescido pelo Decreto-Lei nº 1.535, de 13/4/1977)","§ 2º A concessão das férias será, igualmente, anotada no livro ou nas fichas de registro dos empregados. (Parágrafo acrescido pelo Decreto-Lei nº 1.535, de 13/4/1977)","§ 3º Nos casos em que o empregado possua a CTPS em meio digital, a anotação será feita nos sistemas a que se refere o § 7º do art. 29 desta Consolidação, na forma do regulamento, dispensadas as anotações de que tratam os §§ 1º e 2º deste artigo. (Parágrafo acrescido pela Lei nº 13.874, de 20/9/2019)"],"137":["Art. 137. Sempre que as férias forem concedidas após o prazo de que trata o art. 134, o empregador pagará em dobro a respectiva remuneração. (“Caput” do artigo com redação dada pelo Decreto-Lei nº 1.535, de 13/4/1977)","§ 1º Vencido o mencionado prazo sem que o empregador tenha concedido as férias, o empregado poderá ajuizar reclamação pedindo a fixação, por sentença, da época de gozo das mesmas. (Parágrafo acrescido pelo Decreto-Lei nº 1.535, de 13/4/1977)","§ 2º A sentença cominará pena diária de 5% (cinco por cento) do salário mínimo da região, devida ao empregado até que seja cumprida. (Parágrafo acrescido pelo Decreto-Lei nº 1.535, de 13/4/1977)","§ 3º Cópia da decisão judicial transitada em julgado será remetida ao órgão local do Ministério do Trabalho, para fins de aplicação da multa de caráter administrativo. (Parágrafo acrescido pelo Decreto-Lei nº 1.535, de 13/4/1977)"],"143":["Art. 143. É facultado ao empregado converter 1/3 (um terço) do período de férias a que tiver direito em abono pecuniário, no valor da remuneração que lhe seria devida nos dias correspondentes. (“Caput” do artigo com redação dada pelo Decreto-Lei nº 1.535, de 13/4/1977)","§ 1º O abono de férias deverá ser requerido até 15 (quinze) dias antes do término do período aquisitivo. (Parágrafo único transformado em § 1º e com redação dada pelo Decreto-Lei nº 1.535, de 13/4/1977)","§ 2º Tratando-se de férias coletivas, a conversão a que se refere este artigo deverá ser objeto de acordo coletivo entre o empregador e o sindicato representativo da respectiva categoria profissional, independendo de requerimento individual a concessão do abono. (Parágrafo acrescido pelo Decreto-Lei nº 1.535, de 13/4/1977)","§ 3º (Parágrafo acrescido pela Medida Provisória nº 2.164-41, de 24/8/2001, e revogado pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)"],"145":["Art. 145. O pagamento da remuneração das férias e, se for o caso, o do abono referido no art.143 serão efetuados até 2 (dois) dias antes do início do respectivo período. (“Caput” do artigo com redação dada pelo Decreto-Lei nº 1.535, de 13/4/1977)","Parágrafo único. O empregado dará quitação do pagamento, com indicação do início e do termo das férias. (Parágrafo único acrescido pelo Decreto-Lei nº 1.535, de 13/4/1977)"],"442":["Art. 442. Contrato individual de trabalho é o acordo tácito ou expresso, correspondente à relação de emprego.","§ 1º Qualquer que seja o ramo de atividade da sociedade cooperativa, não existe vínculo empregatício entre ela e seus associados, nem entre estes e os tomadores de serviços daquela. (Parágrafo único acrescido pela Lei nº 8.949, de 9/12/1994, transformado em § 1º pela Lei nº 14.647, de 4/8/2023)","§ 2º Não existe vínculo empregatício entre entidades religiosas de qualquer denominação ou natureza ou instituições de ensino vocacional e ministros de confissão religiosa, membros de instituto de vida consagrada, de congregação ou de ordem religiosa, ou quaisquer outros que a eles se equiparem, ainda que se dediquem parcial ou integralmente a atividades ligadas à administração da entidade ou instituição a que estejam vinculados ou estejam em formação ou treinamento. (Parágrafo acrescido pela Lei nº 14.647, de 4/8/2023)","§ 3º O disposto no § 2º não se aplica em caso de desvirtuamento da finalidade religiosa e voluntária. (Parágrafo acrescido pela Lei nº 14.647, de 4/8/2023)"],"442-B":["Art. 442-B. A contratação do autônomo, cumpridas por este todas as formalidades legais, com ou sem exclusividade, de forma contínua ou não, afasta a qualidade de empregado prevista no art. 3º desta Consolidação. (Artigo acrescido pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)"],"443":["Art. 443. O contrato individual de trabalho poderá ser acordado tácita ou expressamente, verbalmente ou por escrito, por prazo determinado ou indeterminado, ou para prestação de trabalho intermitente. (“Caput” do artigo com redação dada pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 1º Considera-se como de prazo determinado o contrato de trabalho cuja vigência dependa de termo prefixado ou da execução de serviços especificados ou ainda da realização de certo acontecimento suscetível de previsão aproximada. (Parágrafo único transformado em § 1º pelo Decreto-Lei nº 229, de 28/2/1967)","§ 2º O contrato por prazo determinado só será válido em se tratando:","a) de serviço cuja natureza ou transitoriedade justifique a predeterminação do prazo;","b) de atividades empresariais de caráter transitório;","c) de contrato de experiência. (Parágrafo acrescido pelo Decreto-Lei nº 229, de 28/2/1967)","§ 3º Considera-se como intermitente o contrato de trabalho no qual a prestação de serviços, com subordinação, não é contínua, ocorrendo com alternância de períodos de prestação de serviços e de inatividade, determinados em horas, dias ou meses, independentemente do tipo de atividade do empregado e do empregador, exceto para os aeronautas, regidos por legislação própria. (Parágrafo acrescido pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)"],"444":["Art. 444. As relações contratuais de trabalho podem ser objeto de livre estipulação das partes interessadas em tudo quanto não contravenha às disposições de proteção ao trabalho, aos contratos coletivos que lhes sejam aplicáveis e às decisões das autoridades competentes.","Parágrafo único. A livre estipulação a que se refere o caput deste artigo aplica-se às hipóteses previstas no art. 611-A desta Consolidação, com a mesma eficácia legal e preponderância sobre os instrumentos coletivos, no caso de empregado portador de diploma de nível superior e que perceba salário mensal igual ou superior a duas vezes o limite máximo dos benefícios do Regime Geral de Previdência Social. (Parágrafo único acrescido pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)"],"445":["Art. 445. O contrato de trabalho por prazo determinado não poderá ser estipulado por mais de 2 (dois) anos, observada a regra do art. 451. (“Caput” do artigo com redação dada pelo Decreto-Lei nº 229, de 28/2/1967)","Parágrafo único. O contrato de experiência não poderá exceder de 90 (noventa) dias. (Parágrafo único acrescido pelo Decreto-Lei nº 229, de 28/2/1967)"],"451":["Art. 451. O contrato de trabalho por prazo determinado que, tácita ou expressamente, for prorrogado mais de uma vez, passará a vigorar sem determinação de prazo."],"452":["Art. 452. Considera-se por prazo indeterminado todo contrato que suceder, dentro de 6 (seis) meses, a outro contrato por prazo determinado, salvo se a expiração deste dependeu da execução de serviços especializados ou da realização de certos acontecimentos."],"452-A":["Art. 452-A. O contrato de trabalho intermitente deve ser celebrado por escrito e deve conter especificamente o valor da hora de trabalho, que não pode ser inferior ao valor horário do salário mínimo ou àquele devido aos demais empregados do estabelecimento que exerçam a mesma função em contrato intermitente ou não.","§ 1º O empregador convocará, por qualquer meio de comunicação eficaz, para a prestação de serviços, informando qual será a jornada, com, pelo menos, três dias corridos de antecedência.","§ 2º Recebida a convocação, o empregado terá o prazo de um dia útil para responder ao chamado, presumindo-se, no silêncio, a recusa.","§ 3º A recusa da oferta não descaracteriza a subordinação para fins do contrato de trabalho intermitente.","§ 4º Aceita a oferta para o comparecimento ao trabalho, a parte que descumprir, sem justo motivo, pagará à outra parte, no prazo de trinta dias, multa de 50% (cinquenta por cento) da remuneração que seria devida, permitida a compensação em igual prazo.","§ 5º O período de inatividade não será considerado tempo à disposição do empregador, podendo o trabalhador prestar serviços a outros contratantes.","§ 6º Ao final de cada período de prestação de serviço, o empregado receberá o pagamento imediato das seguintes parcelas:","I - remuneração;","II - férias proporcionais com acréscimo de um terço;","III - décimo terceiro salário proporcional;","IV - repouso semanal remunerado; e","V - adicionais legais.","§ 7º O recibo de pagamento deverá conter a discriminação dos valores pagos relativos a cada uma das parcelas referidas no § 6º deste artigo.","§ 8º O empregador efetuará o recolhimento da contribuição previdenciária e o depósito do Fundo de Garantia do Tempo de Serviço, na forma da lei, com base nos valores pagos no período mensal e fornecerá ao empregado comprovante do cumprimento dessas obrigações.","§ 9º A cada doze meses, o empregado adquire direito a usufruir, nos doze meses subsequentes, um mês de férias, período no qual não poderá ser convocado para prestar serviços pelo mesmo empregador. (Artigo acrescido pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)"],"457":["Art. 457. Compreendem-se na remuneração do empregado, para todos os efeitos legais, além do salário devido e pago diretamente pelo empregador como contraprestação do serviço, as gorjetas que receber. (“Caput” do artigo com redação dada pela Lei nº 1.999, de 1/10/1953)","§ 1º Integram o salário a importância fixa estipulada, as gratificações legais e as comissões pagas pelo empregador. (Parágrafo com redação dada pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 2º As importâncias, ainda que habituais, pagas a título de ajuda de custo, auxílio-alimentação, vedado seu pagamento em dinheiro, diárias para viagem, prêmios e abonos não integram a remuneração do empregado, não se incorporam ao contrato de trabalho e não constituem base de incidência de qualquer encargo trabalhista e previdenciário. (Parágrafo com redação dada pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 3º Considera-se gorjeta não só a importância espontaneamente dada pelo cliente ao empregado, como também o valor cobrado pela empresa, como serviço ou adicional, a qualquer título, e destinado à distribuição aos empregados. (Parágrafo com redação dada pela Lei nº 13.419, de 13/3/2017, publicada no DOU de 14/3/2017, em vigor 60 dias após a publicação)","§ 4º Consideram-se prêmios as liberalidades concedidas pelo empregador em forma de bens, serviços ou valor em dinheiro a empregado ou a grupo de empregados, em razão de desempenho superior ao ordinariamente esperado no exercício de suas atividades. (Parágrafo acrescido pela Lei nº 13.419, de 13/3/2017, com redação dada pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 5º (Parágrafo acrescido pela Lei nº 13.419, de 13/3/2017, e revogado pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 6º (Parágrafo acrescido pela Lei nº 13.419, de 13/3/2017, e revogado pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 7º (Parágrafo acrescido pela Lei nº 13.419, de 13/3/2017, e revogado pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 8º (Parágrafo acrescido pela Lei nº 13.419, de 13/3/2017, e revogado pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 9º (Parágrafo acrescido pela Lei nº 13.419, de 13/3/2017, e revogado pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 10. (Parágrafo acrescido pela Lei nº 13.419, de 13/3/2017, e revogado pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 11. (Parágrafo acrescido pela Lei nº 13.419, de 13/3/2017, e revogado pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)"],"458":["Art. 458. Além do pagamento em dinheiro, compreende-se no salário, para todos os efeitos legais, a alimentação, habitação, vestuário ou outras prestações in natura que a empresa, por força do contrato ou do costume, fornecer habitualmente ao empregado. Em caso algum será permitido o pagamento com bebidas alcoólicas ou drogas nocivas. (“Caput” do artigo com redação dada pelo Decreto-Lei nº 229, de 28/2/1967)","§ 1º Os valores atribuídos às prestações in natura deverão ser justos e razoáveis, não podendo exceder, em cada caso, os dos percentuais das parcelas componentes do salário mínimo (artigos 81 e 82). (Parágrafo acrescido pelo Decreto-Lei nº 229, de 28/2/1967)","§ 2º Para os efeitos previstos neste artigo, não serão consideradas como salário as seguintes utilidades concedidas pelo empregador: (Parágrafo único transformado em § 2º pelo Decreto-Lei nº 229, de 28/2/1967, com redação dada pela Lei nº 10.243, de 19/6/2001)","I - vestuários, equipamentos e outros acessórios fornecidos aos empregados e utilizados no local de trabalho, para a prestação do serviço; (Inciso acrescido pela Lei nº 10.243, de 19/6/2001)","II - educação, em estabelecimento de ensino próprio ou de terceiros, compreendendo os valores relativos a matrícula, mensalidade, anuidade, livros e material didático; (Inciso acrescido pela Lei nº 10.243, de 19/6/2001)","III - transporte destinado ao deslocamento para o trabalho e retorno, em percurso servido ou não por transporte público; (Inciso acrescido pela Lei nº 10.243, de 19/6/2001)","IV - assistência médica, hospitalar e odontológica, prestada diretamente ou mediante seguro-saúde; (Inciso acrescido pela Lei nº 10.243, de 19/6/2001)","V - seguros de vida e de acidentes pessoais; (Inciso acrescido pela Lei nº 10.243, de 19/6/2001)","VI - previdência privada; (Inciso acrescido pela Lei nº 10.243, de 19/6/2001)","VII - (VETADO na Lei nº 10.243, de 19/6/2001)","VIII - o valor correspondente ao vale-cultura. (Inciso acrescido pela Lei nº 12.761, de 27/12/2012)","§ 3º A habitação e a alimentação fornecidas como salário-utilidade deverão atender aos fins a que se destinam e não poderão exceder, respectivamente, a 25% (vinte e cinco por cento) e 20% (vinte por cento) do salário-contratual. (Parágrafo acrescido pela Lei nº 8.860, de 24/3/1994)","§ 4º Tratando-se de habitação coletiva, o valor do salário-utilidade a ela correspondente será obtido mediante a divisão do justo valor da habitação pelo número de co-ocupantes, vedada, em qualquer hipótese, a utilização da mesma unidade residencial por mais de uma família. (Parágrafo acrescido pela Lei nº 8.860, de 24/3/1994)","§ 5º O valor relativo à assistência prestada por serviço médico ou odontológico, próprio ou não, inclusive o reembolso de despesas com medicamentos, óculos, aparelhos ortopédicos, próteses, órteses, despesas médico-hospitalares e outras similares, mesmo quando concedido em diferentes modalidades de planos e coberturas, não integram o salário do empregado para qualquer efeito nem o salário de contribuição, para efeitos do previsto na alínea q do § 9º do art. 28 da Lei nº 8.212, de 24 de julho de 1991. (Parágrafo acrescido pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)"],"459":["Art. 459. O pagamento do salário, qualquer que seja a modalidade do trabalho, não deve ser estipulado por período superior a 1 (um) mês, salvo no que concerne a comissões, percentagens e gratificações.","§ 1º Quando o pagamento houver sido estipulado por mês, deverá ser efetuado, o mais tardar, até o quinto dia útil do mês subseqüente ao vencido. (Parágrafo com redação dada pela Lei nº 7.855, de 24/10/1989)"],"462":["Art. 462. Ao empregador é vedado efetuar qualquer desconto nos salários do empregado, salvo quando este resultar de adiantamentos, de dispositivos de lei ou de contrato coletivo.","§ 1º Em caso de dano causado pelo empregado, o desconto será lícito, desde que esta possibilidade tenha sido acordada ou na ocorrência de dolo do empregado. (Parágrafo único transformado em § 1º pelo Decreto-Lei nº 229, de 28/2/1967)","§ 2º É vedado à empresa que mantiver armazém para venda de mercadorias aos empregados ou serviços destinados a proporcionar-lhes prestações in natura exercer qualquer coação ou induzimento no sentido de que os empregados se utilizem do armazém ou dos serviços. (Parágrafo acrescido pelo Decreto-Lei nº 229, de 28/2/1967)","§ 3º Sempre que não for possível o acesso dos empregados a armazéns ou serviços não mantidos pela empresa, é lícito à autoridade competente determinar a adoção de medidas adequadas, visando a que as mercadorias sejam vendidas e os serviços prestados a preços razoáveis, sem intuito de lucro e sempre em benefício dos empregados. (Parágrafo acrescido pelo Decreto-Lei nº 229, de 28/2/1967)","§ 4º Observado o disposto neste Capítulo, é vedado às empresas limitar, por qualquer forma, a liberdade dos empregados de dispor do seu salário. (Parágrafo acrescido pelo Decreto-Lei nº 229, de 28/2/1967)"],"467":["Art. 467. Em caso de rescisão de contrato de trabalho, havendo controvérsia sobre o montante das verbas rescisórias, o empregador é obrigado a pagar ao trabalhador, à data do comparecimento à Justiça do Trabalho, a parte incontroversa dessas verbas, sob pena de pagá-las acrescidas de cinqüenta por cento. (“Caput” do artigo com redação dada pela Lei nº 10.272, de 5/9/2001)","Parágrafo único. O disposto no caput não se aplica à União, aos Estados, ao Distrito Federal, aos Municípios e às suas autarquias e fundações públicas. (Parágrafo único acrescido pela Medida Provisória nº 2.180-35, de 24/8/2001)"],"468":["Art. 468. Nos contratos individuais de trabalho só é lícita a alteração das respectivas condições por mútuo consentimento, ainda assim, desde que não resultem, direta ou indiretamente, prejuízos ao empregado, sob pena de nulidade da cláusula infringente desta garantia.","§1º Não se considera alteração unilateral a determinação do empregador para que o respectivo empregado reverta ao cargo efetivo, anteriormente ocupado, deixando o exercício de função de confiança. (Parágrafo único transformado em § 1º pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 2º A alteração de que trata o § 1º deste artigo, com ou sem justo motivo, não assegura ao empregado o direito à manutenção do pagamento da gratificação correspondente, que não será incorporada, independentemente do tempo de exercício da respectiva função. (Parágrafo acrescido pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)"],"473":["Art. 473. O empregado poderá deixar de comparecer ao serviço sem prejuízo do salário: (“Caput” do artigo com redação dada pelo Decreto-Lei nº 229, de 28/2/1967)","I - até 2 (dois) dias consecutivos, em caso de falecimento do cônjuge, ascendente, descendente, irmão ou pessoa que, declarada em sua Carteira de Trabalho e Previdência Social , viva sob sua dependência econômica; (Inciso acrescido pelo Decreto-Lei nº 229, de 28/2/1967; expressão “carteira profissional” substituída por “Carteira de Trabalho e Previdência Social” pelo Decreto-Lei nº 926, de 10/10/1969)","II - até 3 (três) dias consecutivos, em virtude de casamento; (Inciso acrescido pelo Decreto-Lei nº 229, de 28/2/1967)","III - por 5 (cinco) dias consecutivos, em caso de nascimento de filho, de adoção ou de guarda compartilhada; (Inciso acrescido pelo Decreto-Lei nº 229, de 28/2/1967, e com nova redação dada pela Lei nº 14.457, de 21/9/2022) (Vide § 1º do art. 10 do ADCT) (Vide Lei nº 15.371, de 31/3/2026)","IV - por um dia, em cada 12 (doze) meses de trabalho, em caso de doação voluntária de sangue devidamente comprovada; (Inciso acrescido pelo Decreto-Lei nº 229, de 28/2/1967)","V - até 2 (dois) dias consecutivos ou não, para o fim de se alistar eleitor, nos termos da lei respectiva; (Inciso acrescido pelo Decreto-Lei nº 229, de 28/2/1967)","VI - no período de tempo em que tiver de cumprir as exigências do Serviço Militar referidas na letra \"c\" do art. 65 da Lei nº 4.375, de 17 de agosto de 1964 (Lei do Serviço Militar); (Inciso acrescido pelo Decreto-Lei nº 757, de 12/8/1969)","VII - nos dias em que estiver comprovadamente realizando provas de exame vestibular para ingresso em estabelecimento de ensino superior; (Inciso acrescido pela Lei nº 9.471, de 14/7/1997)","VIII - pelo tempo que se fizer necessário, quando tiver que comparecer a juízo; (Inciso acrescido pela Lei nº 9.853, de 27/10/1999)","IX - pelo tempo que se fizer necessário, quando, na qualidade de representante de entidade sindical, estiver participando de reunião oficial de organismo internacional do qual o Brasil seja membro; (Inciso acrescido pela Lei nº 11.304, de 11/5/2006)","X - pelo tempo necessário para acompanhar sua esposa ou companheira em até 6 (seis) consultas médicas, ou em exames complementares, durante o período de gravidez; (Inciso acrescido pela Lei nº 13.257, de 8/3/2016, e com nova redação dada pela Lei nº 14.457, de 21/9/2022)","XI - por 1 (um) dia por ano para acompanhar filho de até 6 (seis) anos em consulta médica; (Inciso acrescido pela Lei nº 13.257, de 8/3/2016)","XII - até 3 (três) dias, em cada 12 (doze) meses de trabalho, em caso de realização de exames preventivos de câncer devidamente comprovada. (Inciso acrescido pela Lei nº 13.767, de 18/12/2018)","§ 1º O prazo a que se refere o inciso III do caput deste artigo será contado a partir da data de nascimento do filho. (Parágrafo único acrescido pela Medida Provisória nº 1.116, de 4/5/2022, convertida na Lei nº 14.457, de 21/9/2022, transformado em § 1º pela Lei nº 15.156, de 1º/7/2025) (Vide Lei nº 15.371, de 31/3/2026)","§ 2º Na hipótese de nascimento ou de adoção de criança com deficiência permanente decorrente de síndrome congênita associada à infecção pelo vírus Zika, o prazo a que se refere o inciso III do caput deste artigo será ampliado para 20 (vinte) dias. (Parágrafo acrescido pela Lei nº 15.156, de 1º/7/2025)","§ 3º O empregador informará o empregado sobre a possibilidade de deixar de comparecer ao serviço para a realização de exames preventivos do papilomavírus humano (HPV) e de câncer, nos termos do inciso XII do caput deste artigo. (Parágrafo acrescido pela Lei nº 15.377, de 2/4/2026)"],"476":["Art. 476. Em caso de seguro-doença ou auxílio-enfermidade, o empregado é considerado em licença não remunerada, durante o prazo desse benefício."],"477":["Art. 477. Na extinção do contrato de trabalho, o empregador deverá proceder à anotação na Carteira de Trabalho e Previdência Social, comunicar a dispensa aos órgãos competentes e realizar o pagamento das verbas rescisórias no prazo e na forma estabelecidos neste artigo. (“Caput” do artigo com redação dada pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 1º (Parágrafo acrescido pela Lei nº 5.562, de 12/12/1968, e revogado pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 2º O instrumento de rescisão ou recibo de quitação, qualquer que seja a causa ou forma de dissolução do contrato, deve ter especificada a natureza de cada parcela paga ao empregado e discriminado o seu valor, sendo válida a quitação, apenas, relativamente às mesmas parcelas. (Parágrafo acrescido pela Lei nº 5.562, de 12/12/1968, com redação dada pela Lei nº 5.584, de 26/6/1970)","§ 3º (Parágrafo acrescido pela Lei nº 5.562, de 12/12/1968, e revogado pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 4º O pagamento a que fizer jus o empregado será efetuado: (Parágrafo acrescido pelo Decreto-Lei nº 766, de 15/8/1969, com redação dada pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","I - em dinheiro, depósito bancário ou cheque visado, conforme acordem as partes; ou (Inciso acrescido pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","II - em dinheiro ou depósito bancário quando o empregado for analfabeto. (Inciso acrescido pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 5º Qualquer compensação no pagamento de que trata o parágrafo anterior não poderá exceder o equivalente a um mês de remuneração do empregado. (Parágrafo acrescido pelo Decreto-Lei nº 766, de 15/8/1969, com redação dada pela Lei nº 5.584, de 26/6/1970)","§ 6º A entrega ao empregado de documentos que comprovem a comunicação da extinção contratual aos órgãos competentes bem como o pagamento dos valores constantes do instrumento de rescisão ou recibo de quitação deverão ser efetuados até dez dias contados a partir do término do contrato. (Parágrafo acrescido pela Lei nº 7.855, de 24/10/1989, com redação dada pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","a) (Alinea acrescida pela Lei nº 7.855, de 24/10/1989, e revogada pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","b) (Alinea acrescida pela Lei nº 7.855, de 24/10/1989, e revogada pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 7º (Parágrafo acrescido pela Lei nº 7.855, de 24/10/1989, e revogado pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","§ 8º A inobservância do disposto no § 6º deste artigo sujeitará o infrator à multa de 160 BTN, por trabalhador, bem assim ao pagamento da multa a favor do empregado, em valor equivalente ao seu salário, devidamente corrigido pelo índice de variação do BTN, salvo quando, comprovadamente, o trabalhador der causa à mora. (Parágrafo acrescido pela Lei nº 7.855, de 24/10/1989)","§ 9º (VETADO na Lei nº 7.855, de 24/10/1989)","§ 10º A anotação da extinção do contrato na Carteira de Trabalho e Previdência Social é documento hábil para requerer o benefício do seguro-desemprego e a movimentação da conta vinculada no Fundo de Garantia do Tempo de Serviço, nas hipóteses legais, desde que a comunicação prevista no caput deste artigo tenha sido realizada. (Parágrafo acrescido pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)"],"479":["Art. 479. Nos contratos que tenham termo estipulado, o empregador que, sem justa causa, despedir o empregado, será obrigado a pagar-lhe, a título de indenização, e por metade, a remuneração a que teria direito até o termo do contrato.","Parágrafo único. Para a execução do que dispõe o presente artigo, o cálculo da parte variável ou incerta dos salários será feito de acordo com o prescrito para o cálculo da indenização referente à rescisão dos contratos por prazo indeterminado."],"480":["Art. 480. Havendo termo estipulado, o empregado não se poderá desligar do contrato, sem justa causa, sob pena de ser obrigado a indenizar o empregador dos prejuízos que desse fato lhe resultarem.","§ 1º A indenização, porém, não poderá exceder àquela a que teria direito o empregado em idênticas condições. (Parágrafo único transformado em § 1º pelo Decreto-Lei nº 6.353, de 20/3/1944)","§ 2º (Parágrafo acrescido pelo Decreto-Lei nº 6.353, de 20/3/1944, e revogado pela Lei nº 6.533, de 24/5/1978)"],"481":["Art. 481. Aos contratos por prazo determinado, que contiverem cláusula assecuratória do direito recíproco de rescisão antes de expirado o termo ajustado, aplicam-se, caso seja exercido tal direito por qualquer das partes, os princípios que regem a rescisão dos contratos por prazo indeterminado."],"482":["Art. 482. Constituem justa causa para rescisão do contrato de trabalho pelo empregador:","a) ato de improbidade;","b) incontinência de conduta ou mau procedimento;","c) negociação habitual por conta própria ou alheia sem permissão do empregador, e quando constituir ato de concorrência à empresa para a qual trabalha o empregado, ou for prejudicial ao serviço;","d) condenação criminal do empregado, passada em julgado, caso não tenha havido suspensão da execução da pena;","e) desídia no desempenho das respectivas funções;","f) embriaguez habitual ou em serviço;","g) violação de segredo da empresa;","h) ato de indisciplina ou de insubordinação;","i) abandono de emprego;","j) ato lesivo da honra ou da boa fama praticado no serviço contra qualquer pessoa, ou ofensas físicas, nas mesmas condições, salvo em caso de legítima-defesa, própria ou de outrem;","k) ato lesivo da honra ou da boa fama ou ofensas físicas praticadas contra o empregador e superiores hierárquicos, salvo em caso de legítima-defesa, própria ou de outrem;","l) prática constante de jogos de azar;","m) perda da habilitação ou dos requisitos estabelecidos em lei para o exercício da profissão, em decorrência de conduta dolosa do empregado. (Alínea acrescida pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)","Parágrafo único. Constitui igualmente justa causa para dispensa de empregado, a prática, devidamente comprovada em inquérito administrativo, de atos atentatórios à segurança nacional. (Parágrafo único acrescido pelo Decreto-Lei nº 3, de 27/1/1966)"],"483":["Art. 483. O empregado poderá considerar rescindido o contrato e pleitear a devida indenização quando:","a) forem exigidos serviços superiores às suas forças, defesos por lei, contrário aos bons costumes, ou alheios ao contrato;","b) for tratado pelo empregador ou por seus superiores hierárquicos com rigor excessivo;","c) correr perigo manifesto de mal considerável;","d) não cumprir o empregador as obrigações do contrato;","e) praticar o empregador ou seus prepostos, contra ele ou pessoas de sua família, ato lesivo da honra e boa fama;","f) o empregador ou seus prepostos ofenderem-no fisicamente, salvo em caso de legítima defesa, própria ou de outrem;","g) o empregador reduzir o seu trabalho, sendo este por peça ou tarefa, de forma a afetar sensivelmente a importância dos salários.","§ 1º O empregado poderá suspender a prestação dos serviços ou rescindir o contrato, quando tiver de desempenhar obrigações legais, incompatíveis com a continuação do serviço.","§ 2º No caso de morte do empregador constituído em empresa individual, é facultado ao empregado rescindir o contrato de trabalho.","§ 3º Nas hipóteses das letras d e g, poderá o empregado pleitear a rescisão de seu contrato de trabalho e o pagamento das respectivas indenizações, permanecendo ou não no serviço até final decisão do processo. (Parágrafo acrescido pela Lei nº 4.825, de 5/11/1965)"],"484":["Art. 484. Havendo culpa recíproca no ato que determinou a rescisão do contrato de trabalho, o tribunal de trabalho reduzirá a indenização à que seria devida em caso de culpa exclusiva do empregador, por metade."],"484-A":["Art. 484-A. O contrato de trabalho poderá ser extinto por acordo entre empregado e empregador, caso em que serão devidas as seguintes verbas trabalhistas:","I - por metade:","a) o aviso prévio, se indenizado; e","b) a indenização sobre o saldo do Fundo de Garantia do Tempo de Serviço, prevista no § 1º do art. 18 da Lei nº 8.036, de 11 de maio de 1990;","II - na integralidade, as demais verbas trabalhistas.","§ 1º A extinção do contrato prevista no caput deste artigo permite a movimentação da conta vinculada do trabalhador no Fundo de Garantia do Tempo de Serviço na forma do inciso I-A do art. 20 da Lei nº 8.036, de 11 de maio de 1990, limitada até 80% (oitenta por cento) do valor dos depósitos.","§ 2º A extinção do contrato por acordo prevista no caput deste artigo não autoriza o ingresso no Programa de Seguro-Desemprego. (Artigo acrescido pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)"],"487":["Art. 487. Não havendo prazo estipulado, a parte que, sem justo motivo, quiser rescindir o contrato, deverá avisar a outra da sua resolução, com a antecedência mínima de:","I - oito dias, se o pagamento for efetuado por semana ou tempo inferior; (Inciso com redação dada pela Lei nº 1.530, de 26/12/1951) (Vide art. 7º, XXI, da Constituição Federal de 1988)","II - trinta dias aos que perceberem por quinzena ou mês, ou que tenham mais de doze meses de serviço na empresa. (Inciso com redação dada pela Lei nº 1.530, de 26/12/1951)","§ 1º A falta do aviso prévio por parte do empregador dá ao empregado o direito aos salários correspondentes ao prazo do aviso, garantida, sempre, a integração desse período no seu tempo de serviço.","§ 2º A falta de aviso prévio por parte do empregado, dá ao empregador direito de descontar os salários correspondentes ao prazo respectivo.","§ 3º Em se tratando de salário pago na base de tarefa, o cálculo, para os efeitos dos parágrafos anteriores, será feito de acordo com a média dos últimos doze meses de serviço.","§ 4º É devido o aviso prévio na despedida indireta. (Parágrafo acrescido pela Lei nº 7.108, de 5/7/1983)","§ 5º O valor das horas extraordinárias habituais integra o aviso prévio indenizado. (Parágrafo acrescido pela Lei nº 10.218, de 11/4/2001)","§ 6º O reajustamento salarial coletivo, determinado no curso do aviso prévio, beneficia o empregado pré-avisado da despedida, mesmo que tenha recebido antecipadamente os salários correspondentes ao período do aviso, que integra seu tempo de serviço para todos os efeitos legais. (Parágrafo acrescido pela Lei nº 10.218, de 11/4/2001)"],"488":["Art. 488. O horário normal de trabalho do empregado, durante o prazo do aviso, e se a rescisão tiver sido promovida pelo empregador, será reduzido de 2 (duas) horas diárias, sem prejuízo do salário integral.","Parágrafo único. É facultado ao empregado trabalhar sem a redução das 2 (duas) horas diárias previstas neste artigo, caso em que poderá faltar ao serviço, sem prejuízo do salário integral, por 1 (um) dia, na hipótese do inciso I, e por 7 (sete) dias corridos, na hipótese do inciso II do art. 487 desta Consolidação. (Parágrafo único acrescido pela Lei nº 7.093, de 25/4/1983)"],"490":["Art. 490. O empregado que, durante o prazo do aviso prévio dado ao empregado, praticar ato que justifique a rescisão imediata do contrato, sujeita-se ao pagamento da remuneração correspondente ao prazo do referido aviso, sem prejuízo da indenização que for devida."],"491":["Art. 491. O empregado que, durante o prazo do aviso prévio, cometer qualquer das faltas consideradas pela lei como justa para a rescisão, perde o direito ao restante do respectivo prazo."],"611-A":["Art. 611-A. A convenção coletiva e o acordo coletivo de trabalho têm prevalência sobre a lei quando, entre outros, dispuserem sobre:","I - pacto quanto à jornada de trabalho, observados os limites constitucionais;","II - banco de horas anual;","III - intervalo intrajornada, respeitado o limite mínimo de trinta minutos para jornadas superiores a seis horas;","IV - adesão ao Programa Seguro-Emprego (PSE), de que trata a Lei nº 13.189, de 19 de novembro de 2015;","V - plano de cargos, salários e funções compatíveis com a condição pessoal do empregado, bem como identificação dos cargos que se enquadram como funções de confiança;","VI - regulamento empresarial;","VII - representante dos trabalhadores no local de trabalho;","VIII - teletrabalho, regime de sobreaviso, e trabalho intermitente;","IX - remuneração por produtividade, incluídas as gorjetas percebidas pelo empregado, e remuneração por desempenho individual;","X - modalidade de registro de jornada de trabalho;","XI - troca do dia de feriado;","XII - enquadramento do grau de insalubridade;","XIII - prorrogação de jornada em ambientes insalubres, sem licença prévia das autoridades competentes do Ministério do Trabalho;","XIV - prêmios de incentivo em bens ou serviços, eventualmente concedidos em programas de incentivo;","XV - participação nos lucros ou resultados da empresa.","§ 1º No exame da convenção coletiva ou do acordo coletivo de trabalho, a Justiça do Trabalho observará o disposto no § 3º do art. 8º desta Consolidação.","§ 2º A inexistência de expressa indicação de contrapartidas recíprocas em convenção coletiva ou acordo coletivo de trabalho não ensejará sua nulidade por não caracterizar um vício do negócio jurídico.","§ 3º Se for pactuada cláusula que reduza o salário ou a jornada, a convenção coletiva ou o acordo coletivo de trabalho deverão prever a proteção dos empregados contra dispensa imotivada durante o prazo de vigência do instrumento coletivo.","§ 4º Na hipótese de procedência de ação anulatória de cláusula de convenção coletiva ou de acordo coletivo de trabalho, quando houver a cláusula compensatória, esta deverá ser igualmente anulada, sem repetição do indébito.","§ 5º Os sindicatos subscritores de convenção coletiva ou de acordo coletivo de trabalho deverão participar, como litisconsortes necessários, em ação individual ou coletiva, que tenha como objeto a anulação de cláusulas desses instrumentos. (Artigo acrescido pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)"],"611-B":["Art. 611-B. Constituem objeto ilícito de convenção coletiva ou de acordo coletivo de trabalho, exclusivamente, a supressão ou a redução dos seguintes direitos:","I - normas de identificação profissional, inclusive as anotações na Carteira de Trabalho e Previdência Social;","II - seguro-desemprego, em caso de desemprego involuntário;","III - valor dos depósitos mensais e da indenização rescisória do Fundo de Garantia do Tempo de Serviço (FGTS);","IV - salário mínimo;","V - valor nominal do décimo terceiro salário;","VI - remuneração do trabalho noturno superior à do diurno;","VII - proteção do salário na forma da lei, constituindo crime sua retenção dolosa;","VIII - salário-família;","IX - repouso semanal remunerado;","X - remuneração do serviço extraordinário superior, no mínimo, em 50% (cinquenta por cento) à do normal;","XI - número de dias de férias devidas ao empregado;","XII - gozo de férias anuais remuneradas com, pelo menos, um terço a mais do que o salário normal;","XIII - licença-maternidade com a duração mínima de cento e vinte dias;","XIV - licença-paternidade nos termos fixados em lei;","XV - proteção do mercado de trabalho da mulher, mediante incentivos específicos, nos termos da lei;","XVI - aviso prévio proporcional ao tempo de serviço, sendo no mínimo de trinta dias, nos termos da lei;","XVII - normas de saúde, higiene e segurança do trabalho previstas em lei ou em normas regulamentadoras do Ministério do Trabalho;","XVIII - adicional de remuneração para as atividades penosas, insalubres ou perigosas;","XIX - aposentadoria;","XX - seguro contra acidentes de trabalho, a cargo do empregador;","XXI - ação, quanto aos créditos resultantes das relações de trabalho, com prazo prescricional de cinco anos para os trabalhadores urbanos e rurais, até o limite de dois anos após a extinção do contrato de trabalho;","XXII - proibição de qualquer discriminação no tocante a salário e critérios de admissão do trabalhador com deficiência;","XXIII - proibição de trabalho noturno, perigoso ou insalubre a menores de dezoito anos e de qualquer trabalho a menores de dezesseis anos, salvo na condição de aprendiz, a partir de quatorze anos;","XXIV - medidas de proteção legal de crianças e adolescentes;","XXV - igualdade de direitos entre o trabalhador com vínculo empregatício permanente e o trabalhador avulso;","XXVI - liberdade de associação profissional ou sindical do trabalhador, inclusive o direito de não sofrer, sem sua expressa e prévia anuência, qualquer cobrança ou desconto salarial estabelecidos em convenção coletiva ou acordo coletivo de trabalho;","XXVII - direito de greve, competindo aos trabalhadores decidir sobre a oportunidade de exercê-lo e sobre os interesses que devam por meio dele defender;","XXVIII - definição legal sobre os serviços ou atividades essenciais e disposições legais sobre o atendimento das necessidades inadiáveis da comunidade em caso de greve;","XXIX - tributos e outros créditos de terceiros;","XXX - as disposições previstas nos arts. 373-A, 390, 392, 392-A, 394, 394-A, 395, 396 e 400 desta Consolidação.","Parágrafo único. Regras sobre duração do trabalho e intervalos não são consideradas como normas de saúde, higiene e segurança do trabalho para os fins do disposto neste artigo. (Artigo acrescido pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)"],"620":["Art. 620. As condições estabelecidas em acordo coletivo de trabalho sempre prevalecerão sobre as estipuladas em convenção coletiva de trabalho. (Artigo com redação dada pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)"],"442-A":["Art. 442-A. Para fins de contratação, o empregador não exigirá do candidato a emprego comprovação de experiência prévia por tempo superior a 6 (seis) meses no mesmo tipo de atividade. (Artigo acrescido pela Lei nº 11.644, de 10/3/2008)"],"446":["Art. 446. (Revogado pela Lei nº 7.855, de 24/10/1989)"],"447":["Art. 447. Na falta de acordo ou prova sobre condição essencial ao contrato verbal, esta se presume existente, como se a tivessem estatuído os interessados, na conformidade dos preceitos jurídicos adequados à sua legitimidade."],"448":["Art. 448. A mudança na propriedade ou na estrutura jurídica da empresa não afetará os contratos de trabalho dos respectivos empregados."],"448-A":["Art. 448-A. Caracterizada a sucessão empresarial ou de empregadores prevista nos arts. 10 e 448 desta Consolidação, as obrigações trabalhistas, inclusive as contraídas à época em que os empregados trabalhavam para a empresa sucedida, são de responsabilidade do sucessor.","Parágrafo único. A empresa sucedida responderá solidariamente com a sucessora quando ficar comprovada fraude na transferência. (Artigo acrescido pela Lei nº 13.467, de 13/7/2017, publicada no DOU de 14/7/2017, em vigor 120 dias após a publicação)"],"449":["Art. 449. Os direitos oriundos da existência do contrato de trabalho subsistirão em caso de falência, concordata ou dissolução da empresa.","§ 1º Na falência, constituirão créditos privilegiados a totalidade dos salários devidos ao empregado e a totalidade das indenizações a que tiver direito. (Parágrafo com redação dada
