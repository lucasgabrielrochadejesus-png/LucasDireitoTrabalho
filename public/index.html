g":"Conjunto de empresas que atende aos requisitos de integração empresarial previstos na CLT.","example":"Sócio em comum, sem evidência de atuação conjunta, é insuficiente para provar o grupo."},{"term":"Responsabilidade solidária","meaning":"Cada corresponsável pode responder pelo total da obrigação na hipótese legal.","example":"Uma vez caracterizado o grupo econômico trabalhista, as integrantes respondem solidariamente pelas obrigações trabalhistas."},{"term":"Sucessão de empregadores","meaning":"Transferência que, pelas circunstâncias, caracteriza mudança do empregador com os efeitos legais da sucessão.","example":"A sucessora pode responder por dívidas trabalhistas do período anterior à transferência."}],"lesson":{"title":"Vínculo de emprego","file":"vinculo-rafael-aula.mp4","poster":"vinculo-rafael-aula.jpg"}},{"id":"contrato","number":4,"semester":1,"map":[["Forma","Tácita, verbal ou escrita conforme o regime","Uma pessoa começa a trabalhar sob ordens e mediante salário sem assinar instrumento. Em um contrato comum, os fatos podem demonstrar ajuste tácito."],["Duração","Indeterminado é a regra","Quando o trabalho tem caráter permanente e não existe motivo válido para estipular um fim, a regra é o prazo indeterminado."],["A termo","Hipótese legal, teto e prorrogação","Compare experiência de 45 + 45 dias com 30 + 30 + 30. As duas somam 90 dias, mas a segunda tem duas prorrogações."],["Tempo parcial","30 h sem extras ou 26 h com até 6 extras","Quatro horas por dia, de segunda a sexta, somam 20 horas semanais. A carga pode ser reduzida e ainda ter prestação regular."],["Intermitente","Convocação e alternância com inatividade","Recebida a convocação, o trabalhador tem um dia útil para responder. O silêncio presume recusa e a recusa não descaracteriza a subordinação."],["Alteração","Consentimento e ausência de prejuízo","Um formulário assinado pelo empregado não sana uma alteração contratual que o prejudique, como a retirada de uma vantagem sem fundamento aplicável."]],"questions":[{"id":"contrato-1","chapter":"contrato","level":"B","text":"Qual é a duração máxima do contrato de experiência?","options":["90 dias","180 dias","Dois anos","120 dias","60 dias"],"explanation":"A experiência é espécie de contrato a termo com teto específico no art. 445."},{"id":"contrato-2","chapter":"contrato","level":"B","text":"Que forma o contrato intermitente deve ter?","options":["Escrita","Apenas verbal","Apenas tácita","Tácita, se a convocação for registrada","Verbal, desde que confirmada por testemunha"],"explanation":"O art. 452-A exige contrato escrito e indicação específica do valor da hora."},{"id":"contrato-3","chapter":"contrato","level":"M","text":"Um contrato de experiência foi pactuado por 30 dias e prorrogado duas vezes por 30. Qual o efeito?","options":["Converte-se em indeterminado pela segunda prorrogação","Permanece a termo porque o total é de 90 dias","Anula-se desde o primeiro dia, independentemente da prorrogação","Permanece válido se o empregado assinou todas as prorrogações","Transforma-se em temporário da Lei 6.019 por chegar a 90 dias"],"explanation":"No art. 451, mais de uma prorrogação implica conversão mesmo se o total estiver dentro de 90 dias."},{"id":"contrato-4","chapter":"contrato","level":"M","text":"Uma empregada é contratada em regime parcial de 26 horas semanais. Qual é o limite semanal de horas suplementares desse regime?","options":["Seis horas","Duas horas","Nenhuma","Oito horas","Quatro horas"],"explanation":"O art. 58-A prevê até 26 horas com até seis suplementares. A modalidade de até 30 horas não admite suplementares."},{"id":"contrato-5","chapter":"contrato","level":"A","text":"A loja convoca Débora, empregada intermitente, com três dias corridos de antecedência. A mensagem indica a jornada e foi recebida. Passa um dia útil sem resposta e a loja registra falta injustificada. Qual é o efeito jurídico do silêncio?","options":["Presume-se recusa, que por si não descaracteriza a subordinação","O silêncio constitui aceitação automática","A empresa pode descontar o período de inatividade como falta","Presume-se aceitação se a mensagem tiver confirmação de leitura","Presume-se recusa e o contrato se converte em prestação autônoma"],"explanation":"O prazo de resposta é um dia útil. O art. 452-A presume recusa no silêncio."},{"id":"contrato-6","chapter":"contrato","level":"A","text":"Pedro conclui um serviço especializado de instalação e três meses depois é contratado a termo pelo mesmo empregador para outro projeto. O RH afirma que a distância inferior a seis meses resolve o enquadramento. O que conferir antes de concluir?","options":["Verificar a exceção do art. 452 antes de concluir pela conversão","Aplicar a conversão em todos os casos inferiores a seis meses","Aplicar automaticamente a regra do trabalho temporário","Se o segundo projeto dura mais que o primeiro, único critério de exceção","Se houve anuência escrita, que elimina a regra de sucessão mesmo sem motivo legal"],"explanation":"A sucessão em menos de seis meses tem ressalvas ligadas à execução de serviços especializados ou à realização de certos acontecimentos."},{"chapter":"contrato","level":"B","text":"Qual é o prazo geral máximo do contrato a termo comum da CLT?","options":["Dois anos","Seis meses","Noventa dias","Um ano","Três anos"],"explanation":"Dois anos é o limite geral. A experiência tem máximo próprio de 90 dias.","id":"contrato-7"},{"chapter":"contrato","level":"B","text":"Qual regra caracteriza a alteração contratual válida em geral?","options":["Consentimento e ausência de prejuízo","Somente assinatura do empregado","Comunicação unilateral em qualquer hipótese","Anuência do trabalhador mesmo com prejuízo indireto","Ausência de prejuízo suficiente em qualquer alteração unilateral"],"explanation":"O art. 468 exige consentimento mútuo e ausência de prejuízo direto ou indireto.","id":"contrato-8"},{"chapter":"contrato","level":"B","text":"Qual carga cabe no tempo parcial sem horas suplementares?","options":["Até 30 horas semanais","Até 42 horas semanais","Sempre 26 horas semanais","Até 32 horas semanais","Até 28 horas com suplementares livres"],"explanation":"O art. 58-A contempla até 30 horas sem suplementares ou até 26 com suplementares.","id":"contrato-9"},{"chapter":"contrato","level":"B","text":"Intermitência é alternância entre quais períodos?","options":["Prestação de serviço e inatividade","Experiência e estabilidade","Estágio e férias coletivas","Convocação aceita e contrato suspenso por benefício previdenciário","Trabalho em jornada parcial e férias fracionadas"],"explanation":"É uma forma de prestação subordinada não contínua em contrato próprio.","id":"contrato-10"},{"chapter":"contrato","level":"B","text":"Qual é a antecedência mínima da convocação no intermitente?","options":["Três dias corridos","Três dias úteis","Um dia útil","Dois dias corridos","Um dia corrido"],"explanation":"O prazo de três dias corridos é da convocação. Um dia útil é o prazo de resposta.","id":"contrato-11"},{"chapter":"contrato","level":"M","text":"A empresa prorroga experiência de 45 dias uma vez por mais 45 dias. Quais limites foram respeitados?","options":["Uma prorrogação e 90 dias totais","Duas prorrogações e 90 dias totais","Uma prorrogação e teto de 180 dias","Duas prorrogações dentro da margem de 90 dias","Prazo total de 45 dias porque a prorrogação não é computada"],"explanation":"O exemplo respeita tanto o número de prorrogações quanto o máximo da experiência.","id":"contrato-12"},{"chapter":"contrato","level":"M","text":"Uma empregada tem jornada parcial fixa de 30 horas e faz cinco suplementares na semana. O regime escolhido permite isso?","options":["Não. A modalidade de até 30 horas veda suplementares","Sim. As duas modalidades admitem seis extras","Sim. Qualquer trabalho parcial admite cinco extras","Sim, se houver acordo escrito, mesmo com jornada contratual de 30 horas","Depende apenas de o total ficar abaixo de 44 horas"],"explanation":"O ramo que admite suplementares tem jornada de até 26 horas.","id":"contrato-13"},{"chapter":"contrato","level":"M","text":"Um empregado começa a trabalhar sob vínculo sem assinar instrumento escrito, em regime comum. A ausência de papel impede o contrato?","options":["Não. Em regra há possibilidade de contrato tácito ou verbal","Sim. Todo contrato de emprego exige forma escrita","Sim. A única exceção é o trabalho temporário","Somente o registro na CTPS cria vínculo nessa hipótese","O contrato existe a partir do primeiro documento, ainda que o trabalho já tivesse começado"],"explanation":"A CLT reconhece formas tácitas e verbais, ressalvados regimes com escrita obrigatória.","id":"contrato-14"},{"chapter":"contrato","level":"M","text":"Um empregador reduz uma vantagem contratual e obtém assinatura do empregado, com prejuízo comprovado. A assinatura basta?","options":["Não. O art. 468 também exige ausência de prejuízo","Sim. A assinatura torna qualquer alteração lícita","Sim. A comunicação por escrito é o único requisito","Basta anuência tácita por mais de 30 dias, ainda que prejudicial","A assinatura sana prejuízo indireto, mas não o direto"],"explanation":"O consentimento precisa coexistir com a ausência de prejuízo, observadas as regras aplicáveis.","id":"contrato-15"},{"chapter":"contrato","level":"M","text":"Qual regime descreve pessoa que trabalha regularmente cinco dias por semana, quatro horas por dia?","options":["Tempo parcial de 20 horas semanais","Intermitente pela simples jornada reduzida","Experiência de 20 dias","Jornada integral com banco de horas de quatro horas diárias","Contrato a termo com duração máxima de 20 semanas"],"explanation":"A carga reduzida e regular aponta para tempo parcial. Intermitência envolve convocações e períodos de inatividade.","id":"contrato-16"},{"chapter":"contrato","level":"A","text":"O contrato de experiência de Ana foi firmado por 70 dias para avaliar adaptação. Antes do vencimento, a empresa registra uma única prorrogação de 25 dias, aceita por ela. O RH invoca o limite geral de dois anos dos contratos a termo. Qual obstáculo subsiste?","options":["O total de 95 dias supera o teto da experiência","Uma única prorrogação sempre autoriza até dois anos","A segunda prorrogação é o único problema","A prorrogação seria inválida apenas se fosse tácita","A soma pode chegar a 95 dias se a natureza do serviço também for transitória"],"explanation":"A lei impõe dois limites separados: duração total e quantidade de prorrogações.","id":"contrato-17"},{"chapter":"contrato","level":"A","text":"Daniel recebe regularmente uma convocação intermitente para o fim de semana. Dentro do prazo, recusa porque tem compromisso, embora já tenha aceitado outras convocações. A empresa registra desligamento por abandono. O que o dispositivo diz sobre a recusa?","options":["Não. A recusa é prevista e não descaracteriza a subordinação","Sim. Recusa equivale a pedido de demissão","Sim. Recusa inicia contrato de experiência","O vínculo só permanece se Daniel justificar doença ou força maior","A recusa válida só preserva a subordinação quando feita pelo silêncio"],"explanation":"O art. 452-A, § 3º, preserva a caracterização do regime apesar da recusa.","id":"contrato-18"},{"chapter":"contrato","level":"A","text":"Rita aceita convocação intermitente para um evento por R$ 600. Sem justo motivo, a contratante cancela o comparecimento já aceito. A empresa alega que a consequência legal só valeria se Rita faltasse. Qual regra examinar?","options":["Multa de 50% da remuneração que seria devida, nas condições legais","Multa de 40% sobre todo FGTS da vida laboral","Somente multa se quem descumprir for o empregado","Indenização de R$ 600 devida em qualquer cancelamento, mesmo justificado","Multa de 50% só se havia prestação em curso, e não uma convocação aceita"],"explanation":"O § 4º se refere à parte que descumpre, com prazo e possibilidade de compensação previstos.","id":"contrato-19"},{"chapter":"contrato","level":"A","text":"O contrato intermitente escrito de Raul fixa R$ 12 por hora. O valor supera o mínimo horário, mas a empresa paga R$ 15 aos demais empregados da mesma função no estabelecimento. A empresa defende o cálculo pelo mínimo nacional. Qual referência falta verificar?","options":["A referência legal da hora da mesma função, além do mínimo","Somente o piso do salário mínimo por hora","Somente o valor do último período de trabalho","A média das horas pagas em qualquer unidade da empresa, ainda que sejam funções diferentes","O valor da função só se aplica se todos os comparados também forem intermitentes"],"explanation":"O art. 452-A exige atenção às referências legais para o valor horário.","id":"contrato-20"},{"chapter":"contrato","level":"A","text":"Na inatividade entre duas convocações de sua empregadora intermitente, Nina aceita trabalho para outra empresa. Ela recusa nova oferta da primeira dentro do prazo e não aceitou convocações simultâneas. Qual leitura cabe?","options":["Não. A inatividade não é tempo à disposição e admite serviço a outros contratantes","Sim. Intermitência exige exclusividade","Sim. O primeiro empregador deve pagar toda inatividade","A inatividade permite trabalhar para terceiros apenas se o primeiro empregador pagar o período","O novo serviço converte automaticamente o primeiro contrato em prazo determinado"],"explanation":"O § 5º do art. 452-A disciplina justamente a inatividade e o trabalho para outros contratantes.","id":"contrato-21"},{"id":"contrato-22","chapter":"contrato","level":"B","text":"Qual é o intervalo geral entre duas jornadas de trabalho?","options":["11 horas consecutivas.","24 horas consecutivas.","15 minutos.","Oito horas consecutivas.","Doze horas consecutivas."],"explanation":"O art. 66 regula o descanso entre jornadas. A pausa intrajornada e o repouso semanal têm regras próprias."},{"id":"contrato-23","chapter":"contrato","level":"B","text":"No trabalho urbano regido pela regra geral da CLT, qual par descreve o período e a duração da hora noturna?","options":["Das 22h às 5h, com hora de 52 minutos e 30 segundos.","Das 21h às 6h, com hora de 60 minutos.","Das 22h às 5h, com hora de 45 minutos.","Das 22h às 6h, com hora de 52 minutos e 30 segundos.","Das 21h às 5h, com hora de 60 minutos."],"explanation":"O art. 73 define o período noturno urbano e a duração ficta da hora."},{"id":"contrato-24","chapter":"contrato","level":"B","text":"Qual modalidade de teletrabalho é mencionada na exclusão do art. 62, III, da CLT?","options":["A prestação por produção ou tarefa.","Todo trabalho feito fora da sede.","Somente o teletrabalho por jornada com ponto.","O trabalho exclusivamente remoto com jornada registrada.","O regime híbrido por jornada, independentemente do ajuste."],"explanation":"Trabalho remoto não dispensa automaticamente as regras de duração do trabalho."},{"id":"contrato-25","chapter":"contrato","level":"M","text":"A empregada trabalha cinco horas em jornada contínua. Qual intervalo mínimo geral se aplica?","options":["15 minutos.","Uma hora.","11 horas.","Dez minutos.","Trinta minutos."],"explanation":"A regra de 15 minutos se aplica quando a jornada passa de quatro horas e não excede seis."},{"id":"contrato-26","chapter":"contrato","level":"M","text":"A empresa e a pessoa empregada querem banco de horas com compensação em cinco meses pela via individual. Em qual forma?","options":["Acordo individual escrito.","Ajuste tácito individual, como na compensação no mesmo mês.","Uma anotação unilateral substitui o acordo.","Ajuste individual verbal, desde que a compensação ocorra no semestre.","Comunicação escrita unilateral com prazo de cinco meses."],"explanation":"A forma individual escrita atende à hipótese de compensação em até seis meses."},{"id":"contrato-27","chapter":"contrato","level":"M","text":"Uma pessoa trabalha em feriado, dentro da regra geral da Lei 605, e não recebe outro dia de folga. Qual é a regra de remuneração?","options":["Pagamento em dobro do feriado trabalhado.","Pagamento simples, sem examinar a compensação.","Apenas acréscimo de 20%.","Pagamento simples mais 50% em todo feriado.","Pagamento em dobro somente se também for o repouso semanal."],"explanation":"O art. 9º estabelece a dobra quando não é concedido outro dia de folga, ressalvados regimes próprios."},{"id":"contrato-28","chapter":"contrato","level":"M","text":"A regra do caso garante uma hora intrajornada, mas a pessoa gozou apenas 20 minutos. Qual tempo é devido na disciplina atual do § 4º do art. 71?","options":["40 minutos, acrescidos de 50%, com natureza indenizatória.","Uma hora inteira em todos os casos.","20 minutos, sem adicional.","40 minutos, acrescidos de 20%, com natureza salarial.","Uma hora acrescida de 50%, com natureza indenizatória, mesmo que parte tenha sido gozada."],"explanation":"A redação atual manda pagar apenas o período suprimido."},{"id":"contrato-29","chapter":"contrato","level":"A","text":"Paula trabalha em uma indústria que organiza horas do mês com ajuste individual escrito e lança saldos em banco de acerto anual. Não há ACT nem CCT sobre o banco. A empresa diz que o documento individual basta porque as primeiras compensações ocorrem antes de seis meses. Analise o prazo do banco proposto.","options":["O banco anual requer instrumento coletivo.","O ajuste individual escrito vale para qualquer prazo.","O banco anual só pode ser pactuado tacitamente.","O acordo individual basta se houver alguma compensação antes do sexto mês, mesmo com acerto em 12 meses.","O caráter anual pode ser mantido se o saldo for conferido por escrito a cada mês, sem instrumento coletivo."],"explanation":"O ajuste individual escrito tem teto de seis meses. Para banco anual, examine a via coletiva."},{"id":"contrato-30","chapter":"contrato","level":"A","text":"Felipe trabalha em atividade urbana das 22h às 5h. Para esta conta, considere todo o período trabalhado, sem intervalo, com hora diurna de R$ 20 e adicional no mínimo legal. A empresa registra sete horas comuns e calcula o acréscimo por hora. Qual combinação está correta?","options":["Oito horas noturnas e R$ 4 de adicional por hora.","Sete horas noturnas e R$ 4 de adicional por hora.","Oito horas noturnas e R$ 20 de adicional por hora.","Sete horas noturnas e R$ 24 de adicional por hora.","Oito horas noturnas e R$ 24 de adicional por hora, além do valor da hora base."],"explanation":"420 minutos divididos por 52,5 dão oito horas noturnas. O adicional de 20% sobre R$ 20 é R$ 4."},{"id":"contrato-31","chapter":"contrato","level":"A","text":"Luciana alterna dois dias presenciais com três dias em casa. O aditivo chama o regime de teletrabalho por tarefa, mas o supervisor fixa entradas, saídas e horários de disponibilidade, com registros conferidos. A empresa invoca o art. 62, III, só pelo rótulo do aditivo. Como analisar?","options":["Conferir o modo efetivo de prestação e controle. O local remoto é insuficiente para essa exclusão.","Aplicar a exceção a toda atividade remota.","Ignorar os registros de jornada sempre que a prestação for híbrida.","A denominação produção ou tarefa prevalece sobre o controle desde que conste de aditivo escrito.","A presença habitual na sede elimina todo teletrabalho, o que dispensa examinar a forma efetiva de prestação."],"explanation":"A exclusão legal distingue produção ou tarefa da prestação por jornada."}],"title":"Contrato de trabalho e regimes de jornada","body":[{"type":"body","text":"Os arts. 442 a 456 da CLT tratam do contrato individual. Ele pode ser acordado de forma tácita ou expressa, verbal ou escrita, ressalvadas as formas exigidas por lei. Registro do vínculo e anotações na CTPS são deveres do empregador. Do ponto de vista didático, o contrato é bilateral, oneroso e de execução sucessiva. Ele combina a vontade das partes com regras legais e coletivas que integram a relação.","refs":[{"law":"CLT","ids":["442","442-B","443","444","445","451","452","452-A","442-A","446","447","448","448-A","449","450","453","454","455","456"],"label":"arts. 442 a 456","highlights":{"442":{"0":["direct",109]},"442-B":{"0":["related",211]},"443":{"0":["direct",200],"1":["related",306]},"444":{"0":["related",271]},"445":{"0":["related",138],"1":["related",149]},"451":{"0":["related",161]},"452":{"0":["related",257]},"452-A":{"0":["related",316]}}}]},{"type":"heading","text":"Conteúdo e alteração"},{"type":"body","text":"Função, salário, jornada e local ajudam a definir o conteúdo. Normas legais, instrumentos coletivos e regulamentos também podem gerar deveres. Termo é evento futuro certo. Condição é evento futuro incerto, como atingir uma meta para receber determinada parcela conforme os critérios pactuados. Encargo é um ônus vinculado a determinada estipulação. Alteração contratual exige, como regra, consentimento e ausência de prejuízo direto ou indireto (art. 468). A cláusula de não concorrência pós-contratual requer análise específica, inclusive de limites de prazo, atividade, eventual território e compensação. Durante o vínculo, concorrência habitual ou prejudicial pode configurar falta grave nos termos do art. 482, c.","refs":[{"law":"CLT","ids":["468","482"],"label":"arts. 468, 482","highlights":{"468":{"0":["direct",269]},"482":{"3":["direct",194],"0":["related",87]}}}]},{"type":"heading","text":"Duração e forma de prestação"},{"type":"body","text":"O prazo indeterminado é a regra. O prazo determinado da CLT é admitido para serviço cuja natureza ou transitoriedade justifique o termo, atividade empresarial transitória ou experiência. Limite geral de dois anos. Na experiência, limite de 90 dias. Em ambos, mais de uma prorrogação converte o contrato em indeterminado. Contratos a termo sucessivos dentro de seis meses também podem se converter, ressalvadas as exceções do art. 452. Um contrato de experiência de 45 + 45 dias respeita o teto e a regra de uma prorrogação.","refs":[{"law":"CLT","ids":["443","445","451","452"],"label":"arts. 443, 445, 451, 452","highlights":{"443":{"0":["direct",200],"2":["direct",68],"3":["direct",85],"4":["direct",53],"5":["direct",30],"1":["related",306]},"445":{"0":["direct",138],"1":["direct",149]},"451":{"0":["direct",161]},"452":{"0":["direct",257]}}}]},{"type":"body","text":"Nas aulas, a regra geral estudada foi de 8 horas diárias e 44 semanais, ressalvados regimes aplicáveis. Identifique a data dos fatos para aplicar a transição constitucional explicada a seguir. Em regra, podem ser acrescidas até duas horas extras por dia, com adicional mínimo de 50%. O tempo parcial admite até 30 horas semanais sem extras, ou até 26 horas com até seis suplementares por semana (art. 58-A).","refs":[{"law":"CF","ids":["7"],"label":"art. 7","highlights":{"7":{"13":["direct",214],"16":["direct",100],"15":["related",64]}}},{"law":"CLT","ids":["59","58-A"],"label":"arts. 59, 58-A","highlights":{"59":{"0":["direct",182],"1":["direct",103],"2":["related",365]},"58-A":{"0":["direct",316],"3":["related",150],"4":["related",316]}}}]},{"type":"prompt","text":"Atualização em 19/11/2026. A EC 141/2026 prevê um teto de 42 horas semanais e dois repousos semanais remunerados a partir de 16/12/2026, com passagem a 40 horas após o período transitório, sem redução salarial. As ADIs 8041 e 8042 tratam da implementação. Em questão de prova, separe a regra clássica do calendário de transição e observe a data do enunciado.","refs":[{"law":"EC 141/2026","ids":["2","6"],"label":"arts. 2, 6","highlights":{"2":{"0":["direct",289],"1":["related",120]},"6":{"0":["direct",143],"1":["direct",146],"2":["direct",151]}}}]},{"type":"link","text":"EC 141/2026 • Jornada e transição","url":"https://normas.leg.br/?urn=urn%3Alex%3Abr%3Afederal%3Aemenda.constitucional%3A2026-10-16%3B141"},{"type":"link","text":"STF • Andamento da ADI 8041","url":"https://portal.stf.jus.br/processos/detalhe.asp?incidente=7740896"},{"type":"body","text":"No intermitente há vínculo subordinado e alternância de prestação e inatividade. O contrato é escrito. A hora respeita o salário mínimo horário e a referência legal da mesma função no estabelecimento. A convocação informa a jornada com três dias corridos de antecedência e o empregado tem um dia útil para responder. A recusa é permitida. Ao fim da prestação são pagas as parcelas do art. 452-A, incluindo férias proporcionais com um terço, 13º proporcional e repouso semanal remunerado.","refs":[{"law":"CLT","ids":["452-A"],"label":"art. 452-A","highlights":{"452-A":{"0":["direct",316],"1":["direct",184],"2":["direct",132],"3":["direct",105],"6":["direct",120],"7":["direct",16],"8":["direct",52],"9":["direct",43],"10":["direct",34],"11":["direct",22],"5":["related",146],"12":["related",140]}}}]},{"type":"heading","text":"Como montar a linha do tempo"},{"type":"body","text":"No contrato a termo, escreva data inicial, data final, motivo e cada prorrogação. A experiência é uma hipótese de prazo determinado, com teto de 90 dias. O prazo determinado comum tem teto de dois anos e a segunda prorrogação pode convertê-lo em indeterminado. Confira ainda o intervalo inferior a seis meses entre contratos sucessivos e as ressalvas para serviços especializados ou acontecimentos determinados.","refs":[{"law":"CLT","ids":["443","445","451","452"],"label":"arts. 443, 445, 451, 452","highlights":{"443":{"1":["direct",306],"2":["direct",68],"5":["direct",30],"0":["related",200],"3":["related",85],"4":["related",53]},"445":{"0":["direct",138],"1":["direct",149]},"451":{"0":["direct",161]},"452":{"0":["direct",257]}}}]},{"type":"example","text":"Exemplo. Experiência de 30 + 60 dias combina uma prorrogação e total de 90. Em 30 + 30 + 30, o total é igual, mas o segundo acréscimo altera o enquadramento. Já 60 + 60 tem uma só prorrogação, porém supera o teto. As duas verificações são independentes.","refs":[{"law":"CLT","ids":["445","451"],"label":"arts. 445, 451","highlights":{"445":{"1":["direct",149],"0":["related",138]},"451":{"0":["direct",161]}}}]},{"type":"heading","text":"Compare as formas de organizar o trabalho"},{"type":"body","text":"Tempo parcial descreve a carga semanal. Prazo determinado descreve a duração do vínculo. Intermitência descreve alternância entre períodos de trabalho e inatividade. Para resolver a questão, descubra primeiro que dimensão o enunciado está alterando. O contrato parcial pode ter prestação regular e um número reduzido de horas por semana. O intermitente depende de convocação e tem regras próprias para aceitação e pagamento por período de prestação.","refs":[{"law":"CLT","ids":["58-A","443","452-A"],"label":"arts. 58-A, 443, 452-A","highlights":{"58-A":{"0":["direct",316],"3":["related",150],"4":["related",316]},"443":{"1":["direct",306],"6":["direct",372],"0":["related",200]},"452-A":{"1":["direct",184],"2":["direct",132],"6":["direct",120],"7":["direct",16],"8":["direct",52],"9":["direct",43],"10":["direct",34],"11":["direct",22],"0":["related",316],"3":["related",105],"5":["related",146]}}}]},{"type":"example","text":"Exemplo. Uma pessoa trabalha regularmente de segunda a sexta, quatro horas por dia. Essa rotina indica 20 horas semanais, compatíveis com o tempo parcial. Já outra só trabalha nos períodos para os quais é convocada em contrato escrito e pode recusar a oferta, conforme a lógica do intermitente.","refs":[{"law":"CLT","ids":["58-A","452-A"],"label":"arts. 58-A, 452-A","highlights":{"58-A":{"0":["direct",316],"3":["related",150],"4":["related",316]},"452-A":{"0":["direct",316],"1":["direct",184],"3":["direct",105],"5":["direct",146],"2":["related",132]}}}]},{"type":"heading","text":"Mudanças durante o vínculo"},{"type":"body","text":"Distingua ajuste operacional dentro da função de verdadeira alteração contratual. Mudanças relevantes no salário, no local ou nas atribuições exigem análise de prejuízo e das normas aplicáveis. O art. 468 contém a regra geral de consentimento e ausência de prejuízo. Consentir com uma condição prejudicial, no caso comum, não sana a irregularidade.","refs":[{"law":"CLT","ids":["468"],"label":"art. 468","highlights":{"468":{"0":["direct",269]}}}]},{"type":"example","text":"Exemplo. Uma empresa e uma empregada concordam em mudar a distribuição das tarefas sem reduzir salário ou retirar vantagem. Em outro caso, a empresa exige que a pessoa assine redução contratual prejudicial. O simples formulário assinado não resolve a segunda hipótese.","refs":[{"law":"CLT","ids":["468"],"label":"art. 468","highlights":{"468":{"0":["direct",269]}}},{"law":"CF","ids":["7"],"label":"art. 7","highlights":{"7":{"6":["direct",83],"26":["related",69]}}}]},{"type":"heading","text":"Horas extras, compensação e banco de horas"},{"type":"body","text":"Na regra geral da CLT, a jornada diária pode ser acrescida de até duas horas extras, com adicional mínimo de 50%, observadas as hipóteses legais e normas aplicáveis. Compensar significa trabalhar mais em um dia e reduzir ou deixar de trabalhar em outro, conforme o ajuste. Banco de horas é um regime de compensação em que se registram créditos e débitos até o prazo de acerto.","refs":[{"law":"CLT","ids":["59"],"highlights":{"59":{"0":["direct",182],"1":["direct",103],"2":["direct",365],"5":["related",169],"6":["related",136]}},"label":"art. 59"},{"law":"CF","ids":["7"],"highlights":{"7":{"16":["direct",100],"13":["related",214]}},"label":"art. 7"}]},{"type":"body","text":"Para escolher a forma de ajuste, marque o prazo. Para compensação no mesmo mês, a CLT admite acordo individual tácito ou escrito. Banco de horas com compensação em até seis meses exige acordo individual escrito. Banco de horas anual depende de negociação coletiva. Na rescisão, horas extras positivas ainda não compensadas são pagas com base na remuneração na data da rescisão.","refs":[{"law":"CLT","ids":["59","611-A"],"highlights":{"59":{"2":["direct",365],"3":["direct",296],"5":["direct",169],"6":["direct",136],"0":["related",182],"1":["related",103]},"611-A":{"2":["direct",26],"0":["related",132]}},"label":"arts. 59, 611-A"}]},{"type":"example","text":"Exemplo. Uma pessoa registra oito horas a compensar. Se o ajuste individual escrito prevê acerto em quatro meses, o prazo está dentro do limite de seis meses da via individual. Se o empregador pretende apurar o saldo apenas em 12 meses, procure o instrumento coletivo. Se o contrato acabou com saldo positivo de extras sem compensação, confira o pagamento dessas horas.","refs":[{"law":"CLT","ids":["59","611-A"],"highlights":{"59":{"2":["direct",365],"3":["direct",296],"5":["direct",169],"6":["related",136]},"611-A":{"2":["direct",26],"0":["related",132]}},"label":"arts. 59, 611-A"}]},{"type":"body","text":"A escala 12 por 36 é um regime específico. A CLT admite sua instituição por acordo individual escrito, convenção coletiva ou acordo coletivo, com 36 horas ininterruptas de descanso após 12 de trabalho e tratamento próprio de intervalos, repousos, feriados e prorrogação noturna. A prestação habitual de horas extras, por si só, não descaracteriza o acordo de compensação ou o banco de horas segundo o art. 59-B.","refs":[{"law":"CLT","ids":["59-A","59-B"],"highlights":{"59-A":{"0":["direct",348],"1":["direct",345]},"59-B":{"1":["direct",128],"0":["related",305]}},"label":"arts. 59-A, 59-B"}]},{"type":"heading","text":"Intervalo dentro e entre jornadas"},{"type":"body","text":"Intrajornada é a pausa dentro da jornada. Na regra geral, quem trabalha por mais de quatro e até seis horas tem 15 minutos. Acima de seis horas, o intervalo é de pelo menos uma hora. Negociação coletiva pode disciplinar a pausa, respeitando o mínimo de 30 minutos para jornada superior a seis horas. A pausa intrajornada, em regra, não é computada na duração do trabalho.","refs":[{"law":"CLT","ids":["71","611-A"],"highlights":{"71":{"0":["direct",286],"1":["direct",161],"2":["direct",75],"4":["related",313]},"611-A":{"3":["direct",113],"0":["related",132]}},"label":"arts. 71, 611-A"}]},{"type":"example","text":"Exemplo. Uma pessoa trabalha oito horas e deveria ter uma hora de intervalo. Se recebeu só 20 minutos, faltaram 40. Na disciplina atual do art. 71, § 4º, paga-se o período suprimido com acréscimo de 50%, com natureza indenizatória. Para um enunciado histórico, observe a data dos fatos e a redação em vigor.","refs":[{"law":"CLT","ids":["71"],"highlights":{"71":{"4":["direct",313],"0":["related",286],"1":["related",161]}},"label":"art. 71"}]},{"type":"body","text":"Interjornada é o descanso entre o fim de um turno e o início do próximo. A regra geral exige 11 horas consecutivas. Saindo às 22 horas e voltando às 7 horas, a pessoa descansa nove horas. Faltaram duas para o mínimo geral. Na prova, separe esse intervalo da pausa para refeição e do repouso semanal.","refs":[{"law":"CLT","ids":["66","71","67"],"highlights":{"66":{"0":["direct",116]},"71":{"0":["direct",286],"1":["direct",161],"2":["related",75]},"67":{"0":["direct",239]}},"label":"arts. 66, 71, 67"}]},{"type":"heading","text":"Repouso semanal remunerado e feriados"},{"type":"body","text":"Repouso semanal remunerado, ou RSR, é o descanso remunerado da semana. Na disciplina clássica, são 24 horas consecutivas, de preferência aos domingos. A EC 141/2026 prevê dois repousos semanais remunerados com regra de transição. Use a data do enunciado e a nota de atualização deste capítulo. A falta injustificada pode afetar a remuneração do repouso nas condições da Lei 605. A questão da remuneração é distinta do descanso em si.","refs":[{"law":"CLT","ids":["67"],"highlights":{"67":{"0":["direct",239],"1":["related",214]}},"label":"art. 67"},{"law":"CF","ids":["7"],"highlights":{"7":{"15":["direct",64],"38":["related",426]}},"label":"art. 7"},{"law":"Lei 605/1949","ids":["1","6"],"highlights":{"1":{"0":["direct",250]},"6":{"0":["direct",185],"1":["related",30],"7":["related",49]}},"label":"arts. 1, 6"},{"law":"EC 141/2026","ids":["6"],"highlights":{"6":{"0":["direct",143],"1":["direct",146],"2":["direct",151]}},"label":"art. 6"}]},{"type":"example","text":"Exemplo. Uma pessoa trabalha em feriado e a hipótese exige aplicar a Lei 605. A primeira pergunta é se a empresa concedeu outro dia de folga. Sem essa compensação, a regra geral da lei é a remuneração em dobro do feriado trabalhado. Para escala 12 por 36, confira a disciplina específica antes de responder.","refs":[{"law":"Lei 605/1949","ids":["9"],"highlights":{"9":{"0":["direct",245]}},"label":"art. 9"},{"law":"CLT","ids":["59-A"],"highlights":{"59-A":{"1":["direct",345],"0":["related",348]}},"label":"art. 59-A"}]},{"type":"body","text":"Para o mensalista nas hipóteses da Lei 605, a remuneração dos dias de repouso pode já estar compreendida no salário. Para quem recebe por dia ou hora, a lei traz critérios próprios. Identifique a forma de remuneração antes de somar um valor de repouso ao salário do mês.","refs":[{"law":"Lei 605/1949","ids":["7"],"highlights":{"7":{"1":["direct",143],"2":["direct",132],"6":["direct",284],"0":["related",55],"5":["related",209]}},"label":"art. 7"}]},{"type":"heading","text":"Trabalho noturno urbano"},{"type":"body","text":"Na regra urbana da CLT, o trabalho entre 22 horas e 5 horas tem adicional mínimo de 20%. Cada hora noturna é computada como 52 minutos e 30 segundos. Horário misto exige identificar quais trechos são noturnos. Se houver prorrogação depois das 5 horas, confira a disciplina legal e jurisprudencial do caso. As regras urbanas não devem ser transpostas automaticamente para regimes especiais, como o rural.","refs":[{"law":"CLT","ids":["73"],"highlights":{"73":{"0":["direct",232],"1":["direct",108],"2":["direct",156],"4":["direct",256],"5":["related",164]}},"label":"art. 73"},{"law":"CF","ids":["7"],"highlights":{"7":{"9":["direct",58],"16":["related",100]}},"label":"art. 7"}]},{"type":"example","text":"Exemplo. Das 22 horas às 5 horas decorrem sete horas no relógio. Sem intervalo e para este cálculo ilustrativo, 420 minutos divididos por 52,5 correspondem a oito horas noturnas legais. Se a hora diurna vale R$ 20, o adicional mínimo de 20% é R$ 4 por hora noturna, sem confundir esse adicional com o valor total da hora.","refs":[{"law":"CLT","ids":["73"],"highlights":{"73":{"0":["direct",232],"1":["direct",108],"2":["direct",156],"4":["related",256]}},"label":"art. 73"}]},{"type":"heading","text":"Teletrabalho e controle de jornada"},{"type":"body","text":"Teletrabalho é a prestação fora das dependências do empregador, de maneira preponderante ou não, com tecnologias de informação e comunicação, quando não se configura trabalho externo pela natureza da atividade. Comparecimentos para atividades específicas podem ser compatíveis com o regime. A CLT separa prestação por jornada de prestação por produção ou tarefa. A exclusão do regime de duração do trabalho alcança o teletrabalhador por produção ou tarefa nos termos do art. 62, III.","refs":[{"law":"CLT","ids":["75-B","62"],"highlights":{"75-B":{"0":["direct",268],"1":["direct",437],"2":["direct",134],"3":["direct",185],"4":["related",143],"9":["related",152]},"62":{"3":["direct",89],"0":["related",64],"1":["related",205]}},"label":"arts. 75-B, 62"}]},{"type":"example","text":"Exemplo. Uma analista trabalha de casa, tem horário fixo e registra entrada e saída. O local remoto, por si só, não resolve as horas extras. Examine o contrato, o controle efetivo e se a prestação é por jornada, produção ou tarefa. O comando por meios telemáticos também pode caracterizar subordinação.","refs":[{"law":"CLT","ids":["6","62","75-B"],"highlights":{"6":{"1":["direct",283],"0":["related",222]},"62":{"3":["direct",89],"0":["related",64]},"75-B":{"2":["direct",134],"3":["direct",185],"0":["related",268]}},"label":"arts. 6, 62, 75-B"}]},{"type":"body","text":"O teletrabalho deve constar expressamente do contrato. A mudança do presencial para o remoto depende de acordo mútuo com registro em aditivo. O retorno ao presencial por determinação patronal exige transição mínima de 15 dias e aditivo. Equipamentos, infraestrutura e reembolso devem ser tratados por escrito. O empregador também deve orientar sobre precauções de saúde e segurança.","refs":[{"law":"CLT","ids":["75-C","75-D","75-E"],"highlights":{"75-C":{"0":["direct",144],"1":["direct",158],"2":["direct",216],"3":["related",283]},"75-D":{"0":["direct",296],"1":["related",105]},"75-E":{"0":["direct",165],"1":["related",137]}},"label":"arts. 75-C, 75-D, 75-E"}]},{"type":"prompt","text":"Teste sem olhar. Um contrato de 30 + 30 + 30 dias respeita o teto da experiência. O que acontece com a segunda prorrogação?"}],"mapTitle":"Contrato de trabalho","citedArticles":["CLT · arts. 6, 58-A, 59, 59-A, 59-B, 62, 66, 67, 71, 73, 75-B, 75-C, 75-D, 75-E, 442 a 456, 468, 482, 611-A","CF · art. 7","EC 141/2026 · arts. 2, 6","Lei 605/1949 · arts. 1, 6, 7, 9"],"glossary":[{"term":"Contrato tácito","meaning":"Ajuste demonstrado pelo comportamento das partes.","example":"Alguém começa a trabalhar sob ordens e recebe salário, embora as partes não tenham assinado um instrumento."},{"term":"Prazo indeterminado","meaning":"O vínculo começa sem uma data ou acontecimento previsto para terminar.","example":"É a regra geral do contrato de emprego."},{"term":"Contrato a termo","meaning":"Contrato cujo fim é previsto por data, serviço especificado ou acontecimento nas condições legais.","example":"Na experiência, a duração máxima é de 90 dias."},{"term":"Prorrogação","meaning":"Extensão do prazo de um contrato que continua em curso.","example":"Compare 45 + 45 dias com 30 + 30 + 30. O número de prorrogações é diferente."},{"term":"Tempo parcial","meaning":"Regime definido por carga semanal reduzida, com regras próprias para horas suplementares.","example":"Quatro horas por dia de segunda a sexta somam 20 horas semanais."},{"term":"Intermitente","meaning":"Contrato subordinado que alterna períodos de prestação e de inatividade, com convocação.","example":"A pessoa recebe uma convocação e pode recusá-la conforme o regime."},{"term":"Alteração contratual lesiva","meaning":"Mudança que causa prejuízo direto ou indireto ao empregado.","example":"A assinatura de um formulário não resolve, por si só, a retirada prejudicial de uma vantagem."},{"term":"Compensação de jornada","meaning":"Redistribuição das horas de trabalho conforme um ajuste válido.","example":"Trabalhar mais em um dia e reduzir a jornada em outro é um exemplo."},{"term":"Banco de horas","meaning":"Regime de compensação com registro de créditos e débitos de horas e prazo para acerto.","example":"Na via individual escrita, confira o limite de seis meses."},{"term":"Intrajornada","meaning":"Pausa dentro da mesma jornada.","example":"A pausa para refeição durante um turno é um intervalo intrajornada."},{"term":"Interjornada","meaning":"Descanso entre o fim de um turno e o início de outro.","example":"Se a pessoa sai às 22h e retorna às 7h, o intervalo foi de nove horas."},{"term":"Repouso semanal remunerado","meaning":"Descanso remunerado da semana, também chamado de RSR ou DSR.","example":"O descanso semanal tem disciplina própria e difere do intervalo entre dois dias de trabalho."},{"term":"Hora noturna reduzida","meaning":"Critério que conta uma hora legal de trabalho noturno urbano em 52 minutos e 30 segundos.","example":"Na regra urbana, sete horas no relógio entre 22h e 5h equivalem a oito horas noturnas legais, se trabalhadas integralmente."},{"term":"Teletrabalho","meaning":"Trabalho fora das dependências do empregador, com uso de tecnologia, nos termos da CLT.","example":"O trabalho remoto pode ser por jornada, produção ou tarefa."}],"lesson":{"title":"Contrato de trabalho","file":"contrato-rafael-aula.mp4","poster":"contrato-rafael-aula.jpg"}},{"id":"regimes","number":5,"semester":1,"map":[["Doméstico","Mais de dois dias por semana e finalidade residencial sem lucro","Uma cuidadora trabalha pessoalmente, sob orientação, quatro dias por semana na casa da família. Se o serviço beneficiar um negócio familiar, reavalie a finalidade."],["Rural","Exploração agroeconômica e vínculo","Uma propriedade em perímetro urbano explora produção agrícola para venda. O endereço sozinho não define o enquadramento rural."],["Estágio","Finalidade educativa e supervisão","Uma estagiária tem termo assinado, mas cobre um posto fixo sem supervisão nem atividades ligadas ao curso. A finalidade educativa pode estar comprometida."],["Autônomo","Organiza a execução e assume riscos próprios","Uma representante comercial negocia como organizar seu trabalho. Se passa a receber ordens operacionais e sanções como empregada, examine os fatos do vínculo."],["Emprego público","CLT com requisitos constitucionais","Empregado de empresa pública pode ser celetista com ingresso por concurso. Compare com o ocupante de cargo regido por estatuto."],["Hipersuficiente","Diploma superior e dois tetos do RGPS","Diploma superior e salário de pelo menos dois tetos do RGPS são requisitos cumulativos para a hipótese de negociação individual da CLT."]],"questions":[{"id":"regimes-1","chapter":"regimes","level":"B","text":"Qual frequência atende ao critério legal do emprego doméstico?","options":["Mais de dois dias por semana","Uma vez por mês","Exatamente dois dias por semana","Mais de um dia por semana","Pelo menos cinco dias por semana"],"explanation":"A frequência é um dos requisitos, ao lado de pessoalidade, onerosidade, subordinação e finalidade residencial sem lucro."},{"id":"regimes-2","chapter":"regimes","level":"B","text":"Quando bolsa e auxílio-transporte são obrigatórios no estágio?","options":["No estágio não obrigatório","Em nenhuma modalidade","Apenas se a instituição de ensino for pública","Sempre que a jornada superar quatro horas diárias","Somente se houver previsão em CCT da concedente"],"explanation":"A Lei 11.788/2008 estabelece a obrigatoriedade nessa modalidade."},{"id":"regimes-3","chapter":"regimes","level":"M","text":"Um caseiro trabalha subordinado em sítio residencial de lazer, sem exploração econômica. Qual fato aponta para o regime doméstico?","options":["Finalidade residencial sem lucro","Solo rural isoladamente","Título de caseiro isoladamente","O registro da propriedade como empresa agrícola","O cultivo para comercialização em escala permanente"],"explanation":"O local sozinho não define o regime. Examine finalidade, frequência e demais requisitos."},{"id":"regimes-4","chapter":"regimes","level":"M","text":"Uma cooperativa de produtores opera imóvel em perímetro urbano com exploração agroeconômica. Que elemento importa ao enquadramento rural?","options":["A atividade econômica efetiva, além dos requisitos legais","Somente o endereço urbano","Apenas se há máquinas agrícolas","O tamanho da propriedade medido em hectares, independentemente do uso","A natureza exclusivamente familiar de qualquer trabalho prestado no imóvel"],"explanation":"A caracterização de propriedade rural ou prédio rústico considera a destinação e a exploração econômica."},{"id":"regimes-5","chapter":"regimes","level":"A","text":"João foi contratado por produtor rural pessoa física pelo regime de pequeno prazo. Trabalhou por um mês em março e novamente por 45 dias no segundo semestre do mesmo ano. O produtor sustenta que cada contratação foi inferior a dois meses, examinada separadamente. Qual é a consequência?","options":["Conversão para prazo indeterminado","Conversão em estágio","Prorrogação automática até 270 dias","Os períodos descontínuos não podem ser somados, mesmo no mesmo ano","O excesso transforma todo o período exclusivamente em trabalho temporário da Lei 6.019"],"explanation":"O art. 14-A da Lei 5.889 prevê a conversão quando a contratação excede esse limite."},{"id":"regimes-6","chapter":"regimes","level":"A","text":"Carla recebe salário de duas vezes o teto do RGPS e tem dez anos de experiência técnica, mas ainda está cursando graduação. A empresa quer usar o regime específico do art. 444, parágrafo único, para ajuste individual sobre matéria do art. 611-A. Qual é o obstáculo?","options":["Falta o requisito cumulativo do diploma superior","Sim, o patamar salarial basta","Sim, se o cargo se chamar gerente","Experiência comprovada substitui diploma desde que o salário alcance exatamente dois tetos","O diploma só seria exigido se o salário ultrapassasse dois tetos, e Carla recebe exatamente esse valor"],"explanation":"A hipótese legal exige diploma de nível superior e o patamar remuneratório."},{"chapter":"regimes","level":"B","text":"Qual é a finalidade central do estágio?","options":["Formação por ato educativo supervisionado","Substituir pessoal fixo a qualquer custo","Garantir mão de obra sem supervisão","Treinamento exclusivamente produtivo sem acompanhamento escolar","Período probatório para seleção de empregados"],"explanation":"A Lei 11.788 define estágio como ato educativo escolar supervisionado.","id":"regimes-7"},{"chapter":"regimes","level":"B","text":"Qual regime rege, em regra, o emprego público celetista?","options":["CLT, com exigências constitucionais","Estatuto de servidor em qualquer caso","Lei exclusiva de terceirização","Regime estatutário por força da origem pública do empregador","Regime civil de prestação de serviços, sem exigências constitucionais de ingresso"],"explanation":"Emprego público tem regime celetista e regras constitucionais, como concurso em regra.","id":"regimes-8"},{"chapter":"regimes","level":"B","text":"Qual fato conecta o contrato de safra à atividade rural?","options":["Variações estacionais da atividade agrária","Somente o nome da propriedade","Rotina urbana sem relação agrícola","O porte econômico do empregador rural","A existência de contrato autônomo por obra certa"],"explanation":"A duração do contrato de safra depende das variações sazonais da atividade.","id":"regimes-9"},{"chapter":"regimes","level":"B","text":"O que diferencia parceria rural genuína de simples salário?","options":["Partilha de resultados e riscos","Recebimento de ordens em ponto fixo por si só","Pagamento mensal fixo obrigatório em todo caso","Frequentar a propriedade em toda época de plantio","Negociar um valor mensal fixo por ordens cumpridas"],"explanation":"A parceria pressupõe divisão dos resultados e riscos conforme sua disciplina.","id":"regimes-10"},{"chapter":"regimes","level":"B","text":"Quem costuma intermediar trabalho avulso portuário na hipótese legal?","options":["OGMO","Instituição de ensino","Agência de estágios","Sindicato econômico da empresa tomadora, por definição","Agência privada de trabalho temporário, por definição"],"explanation":"O OGMO é o órgão gestor da mão de obra portuária nas hipóteses legais.","id":"regimes-11"},{"chapter":"regimes","level":"M","text":"Uma cuidadora trabalha exatamente dois dias por semana para família. Preenche o requisito de frequência da LC 150?","options":["Não. A lei exige mais de dois dias por semana","Sim. Dois dias já excedem o limite","Sim. Só o pagamento define o regime","Sim, desde que ambos os dias sejam consecutivos","Sim, se a jornada diária for integral, ainda que sejam somente dois dias"],"explanation":"Exatamente dois dias não atendem ao critério de frequência do emprego doméstico.","id":"regimes-12"},{"chapter":"regimes","level":"M","text":"Um estágio não obrigatório prevê bolsa, mas nenhum auxílio-transporte. Qual artigo estabelece diretamente a obrigatoriedade dessas duas parcelas?","options":["Art. 12 da Lei 11.788","Art. 479 da CLT","Art. 18 da Lei do FGTS","Art. 3º da Lei 11.788, sobre requisitos do estágio","Art. 15 da Lei 11.788, sobre consequências da desconformidade"],"explanation":"Bolsa e auxílio-transporte são compulsórios no estágio não obrigatório.","id":"regimes-13"},{"chapter":"regimes","level":"M","text":"Aluno não está matriculado e é contratado como estagiário. Qual elemento falta?","options":["Requisito escolar de matrícula e frequência","Assinatura de convenção coletiva","Prazo de experiência obrigatório","Registro do estágio como contrato de experiência","Intermediação por operador de mão de obra"],"explanation":"Matrícula e frequência regular são requisitos legais do estágio.","id":"regimes-14"},{"chapter":"regimes","level":"M","text":"Produtor rural pessoa física quer contratar por pequeno prazo para atividade temporária. Qual lei disciplina a figura?","options":["Lei 5.889/1973, art. 14-A","Lei 12.506/2011, art. 1º","CLT, art. 467","Lei 6.019/1974, art. 10","Lei 5.889/1973, art. 14, como se fosse apenas contrato de safra"],"explanation":"A lei rural prevê regime específico para atividade temporária contratada por produtor rural pessoa física.","id":"regimes-15"},{"chapter":"regimes","level":"M","text":"Uma cozinheira faz marmitas vendidas pelo negócio familiar quatro dias por semana. O local ser uma casa resolve enquadramento doméstico?","options":["Não. É preciso examinar a finalidade econômica da atividade","Sim. Qualquer atividade dentro de casa é doméstica","Sim. A função de cozinheira define o regime sozinha","Sim, porque a residência define o regime mesmo quando os produtos são vendidos","Não, porque cozinhar por mais de dois dias sempre caracteriza emprego urbano comum, qualquer que seja a finalidade"],"explanation":"A finalidade residencial sem lucro integra o conceito legal.","id":"regimes-16"},{"chapter":"regimes","level":"A","text":"Gabriel cursa contabilidade e tem termo assinado com uma empresa privada. Após o primeiro mês, passa a operar sozinho um caixa permanente, sem acompanhamento escolar e sem atividades previstas no plano. Continua recebendo bolsa. Qual consequência deve ser examinada?","options":["Descaracterização do estágio e reconhecimento de vínculo nas condições legais","Termo escrito impede qualquer reenquadramento","A única consequência possível é estender o prazo","A bolsa e o termo garantem regularidade enquanto a matrícula permanecer ativa","Pode haver infração educacional, mas a falta de supervisão e de compatibilidade nunca repercute no vínculo"],"explanation":"Compatibilidade das atividades e supervisão efetiva são requisitos, além da escrita.","id":"regimes-17"},{"chapter":"regimes","level":"A","text":"A Agrovale é sociedade limitada produtora rural. Sua gerente Elisa quer contratar pessoas por 40 dias pela modalidade de pequeno prazo do art. 14-A. O sócio controlador é pessoa física e o serviço é temporário. Qual requisito impede aplicar a modalidade à sociedade?","options":["A hipótese legal refere-se ao produtor rural pessoa física","O contrato sempre serve a qualquer empresa rural","A única exigência é duração de um mês","A pessoa jurídica pode usar a modalidade se houver sócio controlador pessoa física","A pessoa jurídica pode usar a modalidade se o período for inferior a dois meses"],"explanation":"O tipo específico não se aplica indistintamente a todo empregador rural.","id":"regimes-18"},{"chapter":"regimes","level":"A","text":"Mateus assina parceria para colher café, mas recebe valor mensal que independe da safra, cumpre escala pessoalmente e executa ordens do gestor. O dono arca sozinho com perdas e fica com a produção. Como resolver a classificação?","options":["Investigar requisitos do emprego e confrontar o rótulo com a prática","Reconhecer parceria só pelo nome","Concluir que todo pagamento fixo é estágio","Reconhecer parceria porque a remuneração fixa elimina a necessidade de partilhar riscos","Tratar a existência de ordens como dado irrelevante sempre que houver contrato escrito de parceria"],"explanation":"A ausência real de partilha e os indícios de subordinação permitem discutir reenquadramento.","id":"regimes-19"},{"chapter":"regimes","level":"A","text":"Sofia tem diploma superior e salário de 2,2 vezes o teto do RGPS. Um parecer compara o requisito remuneratório da negociação do art. 444 da CLT com o da disciplina de jornada do art. 8º da EC 141, considerando o regime e a vigência em cada caso. O que distingue os patamares?","options":["O segundo patamar é de 2,5 tetos e tem finalidade distinta","Os dois dispositivos exigem exatamente dois tetos","O diploma substitui o patamar de 2,5 tetos","O patamar da EC é inferior ao da CLT porque disciplina somente jornada","Os dois patamares são 2,5 tetos; dois tetos valem apenas para teletrabalho"],"explanation":"A regra de negociação individual da CLT e a regra constitucional de jornada têm requisitos diferentes. Observe a vigência.","id":"regimes-20"},{"chapter":"regimes","level":"A","text":"A Fazenda Ipê contrata Lucas pessoalmente para a colheita, sob ordens e com salário. O encerramento acompanha o ciclo agrário, sem que ele participe dos riscos nem dos resultados. O empregador afirma que a curta duração exclui vínculo. Qual classificação deve ser examinada?","options":["Não. Pode haver emprego rural a termo pelo regime de safra","Sim. Vínculo rural exige pelo menos um ano","Sim. Safra é por definição parceria autônoma","A duração ligada à colheita torna todo trabalhador eventual, ainda que haja prestação subordinada na safra","O pagamento de salário é incompatível com contrato rural a termo"],"explanation":"O fim associado ao ciclo agrário pode justificar contrato de safra, sem afastar os requisitos do emprego.","id":"regimes-21"}],"title":"Trabalhadores e regimes especiais","body":[{"type":"heading","text":"Doméstico rural e emprego público"},{"type":"body","text":"Doméstico é quem presta serviços contínuos, subordinados, onerosos e pessoais por mais de dois dias por semana a pessoa ou família, no âmbito residencial e sem finalidade lucrativa (LC 150/2015, art. 1º). Uma cuidadora que trabalha três dias por semana na casa de uma família pode atender à regra. Se trabalha para a atividade econômica da família, examine outro enquadramento.","refs":[{"law":"LC 150/2015","ids":["1"],"label":"art. 1","highlights":{"1":{"0":["direct",279],"1":["related",248]}}}]},{"type":"body","text":"Empregado rural presta serviços não eventuais, sob dependência e mediante salário, a empregador rural, em propriedade rural ou prédio rústico (Lei 5.889/1973). Examine a exploração agroeconômica efetiva. A localização dentro ou fora do perímetro urbano, isoladamente, é insuficiente. Um sítio para lazer da família e uma fazenda que vende a produção podem dar enquadramentos diferentes. Na atividade rural aparecem empregados permanentes e safristas, cujo prazo depende das variações estacionais da atividade agrária. O produtor rural pessoa física pode contratar por pequeno prazo para atividade temporária, observando o art. 14-A, inclusive o limite de dois meses em um ano para manter o tipo especial.","refs":[{"law":"Lei 5.889/1973","ids":["2","3","14","14-A"],"label":"arts. 2, 3, 14, 14-A","highlights":{"2":{"0":["direct",194]},"3":{"0":["direct",255],"1":["related",312]},"14":{"1":["direct",129],"0":["related",244]},"14-A":{"0":["direct",163],"1":["direct",233],"9":["related",185],"13":["related",182]}}}]},{"type":"body","text":"Emprego público é regido pela CLT e sujeito a exigências constitucionais como concurso, em regra. Cargo público estatutário é regido pelo estatuto aplicável. No campo, verifique se há cooperação familiar, parceria com divisão de riscos ou trabalho remunerado e subordinado. No trabalho de migrante, a autorização para trabalhar depende da situação migratória. CPF, CTPS e registro migratório, quando aplicável, integram a documentação. A política migratória prevê igualdade de tratamento e oportunidades e respeito às obrigações trabalhistas (Lei 13.445/2017).","refs":[{"law":"CF","ids":["37"],"label":"art. 37","highlights":{"37":{"2":["direct",314],"0":["related",251],"1":["related",169],"3":["related",108]}}}]},{"type":"heading","text":"Estágio autonomia e negociação individual"},{"type":"body","text":"Estágio é ato educativo supervisionado com matrícula, termo assinado pela instituição de ensino, concedente e estudante, atividades compatíveis e acompanhamento. Pode ser obrigatório ou não obrigatório. No segundo, bolsa e auxílio-transporte são obrigatórios. O descumprimento dos requisitos pode caracterizar vínculo, observadas as particularidades da Administração Pública.","refs":[{"law":"Lei 11.788/2008","ids":["1","3","12","15"],"label":"arts. 1, 3, 12, 15","highlights":{"1":{"0":["direct",399],"1":["related",109],"2":["related",198]},"3":{"1":["direct",281],"2":["direct",114],"3":["direct",111],"4":["direct",304],"5":["direct",255],"0":["related",202]},"12":{"0":["direct",211],"1":["related",139]},"15":{"0":["direct",208],"1":["related",234]}}}]},{"type":"body","text":"Na empreitada, a obrigação é executar uma obra ou entregar um resultado com autonomia. Observe quem dirige o modo de execução e assume seus riscos. O representante comercial autônomo intermedeia negócios e está sujeito a registro no CORE (Lei 4.886/1965). O eventual atua em necessidade episódica. O avulso presta serviços a vários tomadores com intermediação legal, por OGMO no porto ou sindicato nas hipóteses legais, e tem igualdade constitucional de direitos com o empregado permanente. No trabalho rural, parceria genuína envolve partilha de resultados e riscos. A integração agroindustrial segue a Lei 13.288/2016. Se o caso descreve pessoalidade, salário e direção do trabalho, reexamine a classificação."},{"type":"body","text":"O empregado com diploma superior e salário igual ou superior a duas vezes o teto do RGPS pode negociar individualmente nas hipóteses do art. 444, parágrafo único, observados os limites legais. É o chamado hipersuficiente. A hipótese de negociação individual do art. 444 tem finalidade distinta do regime de jornada do art. 8º da EC 141/2026, que usa patamar próprio de duas vezes e meia o teto do RGPS e deve ser lido com as regras de vigência e transição. Cargo de confiança, por sua vez, envolve poderes de gestão e requisitos de remuneração para exclusão do regime de jornada. Veja a seção de horas extras.","refs":[{"law":"CLT","ids":["444","62"],"label":"arts. 444, 62","highlights":{"444":{"1":["direct",535],"0":["related",271]},"62":{"2":["direct",182],"4":["direct",361],"0":["related",64]}}},{"law":"EC 141/2026","ids":["8"],"label":"art. 8","highlights":{"8":{"0":["direct",413],"1":["direct",40],"2":["related",196],"3":["related",107]}}}]},{"type":"heading","text":"Use os fatos para classificar o trabalho"},{"type":"body","text":"No doméstico, a atividade beneficia a pessoa ou a família no âmbito residencial e sem fins lucrativos. A LC 150 exige mais de dois dias semanais, além dos demais requisitos. No rural, o foco é a exploração agroeconômica do empregador e a prestação na propriedade rural ou prédio rústico. O nome da tarefa pode ser o mesmo em regimes diferentes.","refs":[{"law":"LC 150/2015","ids":["1"],"label":"art. 1","highlights":{"1":{"0":["direct",279],"1":["related",248]}}},{"law":"Lei 5.889/1973","ids":["2","3"],"label":"arts. 2, 3","highlights":{"2":{"0":["direct",194]},"3":{"0":["direct",255],"1":["related",312]}}}]},{"type":"example","text":"Exemplo. A cozinheira que faz refeições na casa de uma família quatro vezes na semana pode ser doméstica. Se prepara as refeições vendidas regularmente pelo negócio familiar, a finalidade econômica muda a análise. Um trabalhador que cuida de produção agrícola comercial no perímetro urbano pode ser rural conforme os demais fatos."},{"type":"heading","text":"Safra, pequeno prazo e estágio"},{"type":"body","text":"O contrato de safra acompanha variações estacionais da atividade agrária. O trabalho rural por pequeno prazo exige contratação por produtor rural pessoa física para atividade temporária e tem regra de conversão acima de dois meses em um ano. Em ambos, o fato de trabalhar no campo não basta para escolher a figura jurídica.","refs":[{"law":"Lei 5.889/1973","ids":["14","14-A"],"label":"arts. 14, 14-A","highlights":{"14":{"1":["direct",129],"0":["related",244]},"14-A":{"0":["direct",163],"1":["direct",233],"9":["related",185],"13":["related",182]}}}]},{"type":"example","text":"Exemplo. Uma equipe colhe uma cultura durante a fase sazonal, com fim ligado ao ciclo da safra. Já um produtor pessoa física contrata mão de obra temporária por curtos períodos para serviços isolados. Identifique a finalidade, a duração e o contratante antes de aplicar a regra."},{"type":"body","text":"No estágio, a pergunta é se o trabalho atende ao programa educativo: matrícula, termo de compromisso, compatibilidade das tarefas e supervisão efetiva. A bolsa obrigatória no estágio não obrigatório é uma obrigação própria desse regime. A ausência dos requisitos legais pode gerar vínculo com concedente privado.","refs":[{"law":"Lei 11.788/2008","ids":["1","3","12","15"],"label":"arts. 1, 3, 12, 15","highlights":{"1":{"0":["direct",399],"1":["related",109],"2":["related",198]},"3":{"1":["direct",281],"2":["direct",114],"3":["direct",111],"4":["direct",304],"5":["direct",255],"0":["related",202]},"12":{"0":["direct",211],"1":["related",139]},"15":{"0":["direct",208],"1":["related",234]}}}]},{"type":"example","text":"Exemplo. Uma estudante atua em uma clínica nas atividades previstas no termo e recebe acompanhamento do orientador e do supervisor. Se passa a cobrir sozinha um posto permanente, sem supervisão e em tarefas incompatíveis com o curso, há indícios de descaracterização do estágio."},{"type":"prompt","text":"Teste sem olhar. Como diferenciar o safrista, o trabalhador rural eventual e o parceiro rural? Qual fato mudaria seu enquadramento?"}],"mapTitle":"Regimes especiais","citedArticles":["LC 150/2015 · art. 1","Lei 5.889/1973 · arts. 2, 3, 14, 14-A","CF · art. 37","Lei 11.788/2008 · arts. 1, 3, 12, 15","CLT · arts. 62, 444","EC 141/2026 · art. 8"],"glossary":[{"term":"Emprego doméstico","meaning":"Trabalho pessoal, subordinado, remunerado e contínuo para pessoa ou família no âmbito residencial sem finalidade lucrativa, por mais de dois dias por semana.","example":"Uma cuidadora que trabalha quatro dias na residência familiar pode se enquadrar, presentes os demais requisitos."},{"term":"Exploração agroeconômica","meaning":"Uso de uma atividade rural com finalidade econômica.","example":"Um sítio que produz e vende alimentos apresenta situação diferente de uma propriedade usada somente para lazer familiar."},{"term":"Contrato de safra","meaning":"Contrato rural cuja duração é ligada a variações estacionais da atividade agrária.","example":"O fim da colheita pode delimitar a duração do contrato conforme o caso."},{"term":"Estágio","meaning":"Ato educativo supervisionado que exige requisitos escolares e atividades compatíveis com a formação.","example":"Cobrir um posto fixo sem supervisão nem ligação com o curso coloca a finalidade educativa em dúvida."},{"term":"OGMO","meaning":"Órgão Gestor de Mão de Obra, que organiza a intermediação de trabalho avulso portuário nas hipóteses legais.","example":"O trabalho avulso portuário pode envolver diferentes tomadores por meio dessa intermediação."},{"term":"Celetista","meaning":"Pessoa cujo vínculo de emprego é regido pela CLT.","example":"Uma empresa pública pode contratar empregado celetista, respeitado o concurso quando exigido."},{"term":"Hipersuficiente","meaning":"Nome usado para o empregado que reúne diploma superior e patamar salarial próprio para a hipótese de negociação individual do art. 444 da CLT.","example":"Ter salário elevado sem diploma superior não preenche os dois requisitos cumulativos."}],"lesson":{"title":"Regimes especiais","file":"regimes-rafael-aula.mp4","poster":"regimes-rafael-aula.jpg"}},{"id":"terceirizacao","number":6,"semester":1,"map":[["Prestadora","Contrata, paga e dirige","Um hospital contrata uma empresa de limpeza. A prestadora admite, remunera e dirige quem executa o serviço."],["Tomadora","Usa o serviço e tem deveres de segurança","O hospital recebe o serviço em suas dependências e deve observar deveres relativos às condições de segurança do local de trabalho."],["Tomadora privada","Responsabilidade subsidiária","Se a prestadora não paga salários, ela é a devedora principal. A tomadora privada pode responder subsidiariamente pelo período em que recebeu a prestação."],["Administração pública","Requisitos do Tema 1118","Compare dois casos de atraso salarial: no segundo, o órgão público recebeu notificação idônea e ficou inerte. Esse fato interessa à análise de negligência."],["Temporário","Substituição transitória ou demanda complementar","Uma loja usa agência registrada para substituir uma caixa afastada ou para atender um pico complementar sazonal. Identifique o motivo da contratação."],["Prazo temporário","180 dias e até 90 de extensão","Uma prorrogação de 60 dias pode caber dentro do limite, mas exige que permaneçam as condições que justificaram o temporário."]],"questions":[{"id":"terceirizacao-1","chapter":"terceirizacao","level":"B","text":"Quem contrata e remunera o trabalhador na terceirização regular?","options":["A prestadora","A tomadora em todos os casos","O sindicato","A tomadora, se o serviço ocorrer em suas dependências","A empresa que fornece apenas os equipamentos à prestadora"],"explanation":"A empresa prestadora contrata, remunera e dirige sua equipe."},{"id":"terceirizacao-2","chapter":"terceirizacao","level":"B","text":"Qual limite básico com a mesma tomadora no trabalho temporário?","options":["180 dias, com até 90 adicionais se persistirem as condições","90 dias sem prorrogação","Dois anos em qualquer caso","120 dias, prorrogáveis por até 90","180 dias, prorrogáveis automaticamente por mais 180"],"explanation":"O art. 10 da Lei 6.019 estabelece 180 dias e a possível prorrogação de até 90."},{"id":"terceirizacao-3","chapter":"terceirizacao","level":"M","text":"Uma loja usa agência registrada para substituir, por três meses, pessoal permanente afastado. Qual regime se ajusta aos fatos?","options":["Trabalho temporário","Experiência direta com a loja","Estágio obrigatório","Contrato intermitente diretamente com a loja","Contrato de experiência diretamente com a agência para avaliação do empregado pela loja"],"explanation":"O motivo legal é a substituição transitória e a contratação se dá por empresa de trabalho temporário."},{"id":"terceirizacao-4","chapter":"terceirizacao","level":"M","text":"A prestadora opera parte central da produção. Isso torna a terceirização ilícita por si?","options":["A atividade principal pode ser terceirizada","Somente limpeza pode ser terceirizada","A atividade principal sempre gera emprego com a tomadora","A atividade principal pode ser terceirizada somente por 180 dias","A atividade principal exige vínculo direto se o serviço ocorrer nas dependências da tomadora"],"explanation":"A Lei 6.019 e o Tema 725 admitem terceirização inclusive da atividade principal."},{"id":"terceirizacao-5","chapter":"terceirizacao","level":"A","text":"João é empregado de prestadora de limpeza em um órgão público. O sindicato envia notificação formal, identifica os salários vencidos e comprova o recebimento; o órgão segue inerte. A prestadora alega crise financeira. Qual circunstância é relevante para a negligência nos termos do Tema 1118?","options":["A inércia após notificação é hipótese de negligência","Somente o inadimplemento basta em qualquer caso","O ente público sempre é responsável solidário","A responsabilidade decorre de o sindicato ter escrito, mesmo se o órgão provar que não recebeu a comunicação","O nexo se presume pelo local de trabalho, tornando a notificação irrelevante"],"explanation":"A responsabilidade pública exige a demonstração prevista na tese. A notificação e a inércia subsequente fazem diferença."},{"id":"terceirizacao-6","chapter":"terceirizacao","level":"A","text":"Fernanda trabalhou dois meses na unidade da tomadora privada Alfa e o restante na Beta. A prestadora deixou em aberto salários apenas daqueles dois meses. Fernanda cobra de ambas como se fossem empregadoras diretas. Como enquadrar a responsabilidade quanto às dívidas do período na Alfa?","options":["A prestadora é devedora principal e a tomadora responde subsidiariamente pelo período da prestação","O trabalhador cobra somente da tomadora","O local da prestação sempre converte a tomadora em empregadora","Alfa é devedora principal porque recebeu Fernanda no período, e a prestadora só responde subsidiariamente","Alfa e Beta respondem solidariamente por todo o contrato, ainda que Beta não tenha recebido os serviços no período discutido"],"explanation":"A responsabilidade subsidiária prevista na Lei 6.019 não substitui a obrigação primária da prestadora."},{"chapter":"terceirizacao","level":"B","text":"Quantas posições aparecem no esquema típico de terceirização?","options":["Trabalhador, prestadora e tomadora","Trabalhador e sindicato apenas","Apenas prestadora e juiz","Trabalhador, tomadora e Ministério do Trabalho como parte contratante","Dois empregadores diretos e um empregado, necessariamente"],"explanation":"As três posições ajudam a identificar quem emprega, quem presta e quem recebe o serviço.","id":"terceirizacao-7"},{"chapter":"terceirizacao","level":"B","text":"Qual é um motivo legal para trabalho temporário?","options":["Substituição transitória de pessoal permanente","Dispensa de todos os requisitos de admissão","Apenas testar todos os candidatos da empresa","Preenchimento de vaga efetiva por tempo indefinido","Avaliação inicial para eventual ingresso no quadro permanente, sem demanda complementar"],"explanation":"A Lei 6.019 admite substituição transitória e demanda complementar.","id":"terceirizacao-8"},{"chapter":"terceirizacao","level":"B","text":"Qual forma deve ter o contrato entre agência temporária e tomadora?","options":["Escrita","Sempre verbal","Tácita sem indicação do motivo","Verbal, se houver registro das horas","Escrita apenas se o prazo superar 180 dias"],"explanation":"O art. 9º exige contrato escrito e dados como motivo e prazo.","id":"terceirizacao-9"},{"chapter":"terceirizacao","level":"B","text":"Na terceirização privada regular, qual empresa é devedora principal das verbas do empregado?","options":["Prestadora empregadora","Tomadora sempre em primeiro lugar","Empresa sem vínculo com o serviço","Tomadora se o serviço estiver ligado à atividade principal","Agência intermediária mesmo quando não é empregadora nem prestadora"],"explanation":"A prestadora é empregadora. A tomadora pode responder de modo subsidiário.","id":"terceirizacao-10"},{"chapter":"terceirizacao","level":"B","text":"Qual regime combina contratação direta e teste inicial de adaptação ao emprego?","options":["Contrato de experiência","Trabalho temporário via agência","Terceirização permanente","Contrato intermitente por tarefa","Contrato temporário da Lei 6.019 sem motivo de substituição ou demanda"],"explanation":"A experiência é contrato a termo da CLT entre empregador e empregado.","id":"terceirizacao-11"},{"chapter":"terceirizacao","level":"M","text":"Uma empresa contrata agência para cobrir demanda previsível sazonal. A previsibilidade por si impede trabalho temporário?","options":["Não. A demanda complementar pode decorrer de fator sazonal","Sim. Somente fatos imprevisíveis se enquadram","Sim. Picos sazonais sempre geram experiência","Não, mas somente se também houver substituição de pessoal permanente","Sim, salvo se o pico previsível ocorrer em setor que não seja a atividade principal"],"explanation":"A Lei 6.019 contempla fatores previsíveis de natureza intermitente, periódica ou sazonal.","id":"terceirizacao-12"},{"chapter":"terceirizacao","level":"M","text":"Uma tomadora privada recebe equipe por três meses. Em princípio, sua responsabilidade subsidiária se vincula a qual período?","options":["Ao período em que recebeu a prestação","Ao contrato de emprego inteiro em qualquer caso","Apenas ao último dia da prestação","A toda duração do vínculo com a prestadora, mesmo em outras tomadoras","Aos dias em que a tomadora efetuou pagamento à prestadora"],"explanation":"A obrigação subsidiária segue o período da prestação na forma da lei.","id":"terceirizacao-13"},{"chapter":"terceirizacao","level":"M","text":"A agência temporária alega contra o empregado a proibição de ser contratado pela tomadora ao fim do vínculo. Qual é a regra legal?","options":["Cláusula de reserva que proíbe essa contratação é nula","A proibição é necessária ao regime temporário","Vale sempre por dois anos","A cláusula pode valer se a tomadora assinar o contrato junto com o trabalhador","A reserva vale por 90 dias após o fim do contrato, mesmo quando impede efetivação"],"explanation":"O parágrafo único do art. 11 da Lei 6.019 declara nula a cláusula de reserva.","id":"terceirizacao-14"},{"chapter":"terceirizacao","level":"M","text":"A equipe terceirizada trabalha na sede da tomadora. Quem tem dever legal de garantir condições de segurança nas dependências?","options":["A contratante nos termos do art. 5º-A, sem eliminar deveres da empregadora","Apenas o trabalhador em todos os casos","Apenas o sindicato","O dever da tomadora existe apenas se houver cláusula contratual específica","A tomadora tem dever apenas se também assinar a carteira do trabalhador"],"explanation":"O local de trabalho aciona o dever expresso da contratante relativo a segurança, higiene e salubridade.","id":"terceirizacao-15"},{"chapter":"terceirizacao","level":"M","text":"No caso de serviço contínuo de manutenção por empresa especializada, qual fato afasta a classificação automática de trabalho temporário?","options":["O contrato envolve execução de serviço pela prestadora e não colocação para motivo transitório descrito","A manutenção só pode ser feita por empregado próprio","Serviço contínuo é sinônimo de experiência a termo","O serviço é especializado, critério que basta para enquadrá-lo como temporário","O contrato não prevê término imediato, o que prova vínculo direto com a tomadora"],"explanation":"Compare estrutura contratual, motivo e se há colocação de trabalhador à disposição nos termos da lei.","id":"terceirizacao-16"},{"chapter":"terceirizacao","level":"A","text":"A agência colocou Bianca na tomadora por demanda complementar sazonal. Após 170 dias, os pedidos voltaram ao volume normal, mas a loja pretende prorrogar por 60 dias para preencher vaga permanente. O total ficaria abaixo de 270. Qual requisito ainda falta?","options":["A extensão exige manutenção das condições que justificaram a contratação","Apenas exceder 270 dias impediria a extensão","A agência tem direito automático a 90 dias extras","Basta que a prorrogação seja escrita antes dos 180 dias, mesmo desaparecido o motivo","A demanda complementar pode ser substituída por vaga permanente sem mudar a modalidade, desde que o total seja inferior a 270 dias"],"explanation":"Estar abaixo do teto não supre a persistência da causa temporária.","id":"terceirizacao-17"},{"chapter":"terceirizacao","level":"A","text":"Depois de cumprir os períodos legais, Diego é novamente colocado pela mesma agência perante a mesma tomadora 45 dias após o fim do primeiro contrato. O novo aumento de demanda é real e foi documentado. Qual questão temporal deve ser examinada?","options":["Intervalo legal de 90 dias e consequência do descumprimento","Prazo de experiência de 45 dias","Apenas o número de horas do novo trabalho","A demanda nova dispensa a espera mínima perante a mesma tomadora","O intervalo de 90 dias só se aplica se o motivo da segunda contratação for idêntico"],"explanation":"O art. 10 prevê intervalo para nova colocação perante a mesma tomadora e efeito para contratação anterior ao prazo.","id":"terceirizacao-18"},{"chapter":"terceirizacao","level":"A","text":"Marta cobra verbas de uma prestadora insolvente e do município tomador. Não há prova de notificação, conduta negligente nem nexo causal. A decisão sustenta a condenação do município exclusivamente na inversão do ônus da prova. Qual é o problema à luz do Tema 1118?","options":["Não. A tese exige comprovação na forma nela estabelecida","Sim. Inversão isolada basta","Sim. A Administração é sempre garantidora solidária da dívida","A ausência de prova pode ser suprida pela insolvência, quando a prestação ocorreu em prédio público","A inversão basta se a prestadora passou mais de um mês sem pagar salários"],"explanation":"A tese rejeita responsabilização sustentada exclusivamente na premissa de inversão do ônus da prova.","id":"terceirizacao-19"},{"chapter":"terceirizacao","level":"A","text":"A loja contrata Laura diretamente por 45 dias para avaliar sua adaptação, registra a relação e chama o documento de trabalho temporário. Não há agência nem substituição transitória ou demanda complementar. Qual enquadramento deve prevalecer segundo os fatos?","options":["Regime a termo da CLT, se presentes seus requisitos, pois a contratação foi direta para experiência","Lei 6.019 sempre que houver termo final","Terceirização por atividade principal","O registro como temporário é suficiente porque 45 dias estão abaixo do teto da Lei 6.019","A contratação direta transforma automaticamente o vínculo em intermitente, mesmo sem convocações"],"explanation":"O temporário da Lei 6.019 exige empresa de trabalho temporário e um motivo legal específico.","id":"terceirizacao-20"},{"chapter":"terceirizacao","level":"A","text":"A fábrica contrata uma prestadora para a linha principal. Vítor também alega que gerentes da fábrica lhe davam ordens individuais e escolhiam quem podia substituí-lo. A defesa cita apenas a licitude da terceirização da atividade-fim. Como organizar a análise?","options":["Separar a licitude da atividade terceirizada da apuração concreta da fraude","Concluir pela fraude apenas por ser atividade-fim","Descartar toda fraude apenas porque a atividade-fim pode ser terceirizada","A possibilidade de terceirizar a atividade principal impede examinar ordens diretas em qualquer caso","A existência de ordens alegadas torna a terceirização ilícita automaticamente, mesmo sem exame de prova"],"explanation":"O Tema 725 resolve a possibilidade da terceirização da atividade-fim. Uma alegação fundada em outros fatos exige exame próprio.","id":"terceirizacao-21"}],"title":"Terceirização e trabalho temporário","body":[{"type":"heading","text":"Terceirização de serviços"},{"type":"body","text":"A tomadora contrata uma prestadora, que contrata, remunera e dirige seus trabalhadores. A Lei 6.019/1974 permite transferir a execução de atividades, inclusive a p
