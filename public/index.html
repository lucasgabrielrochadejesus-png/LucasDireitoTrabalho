<style>

.top-links{display:flex;gap:18px;flex-wrap:wrap}

.top-end{display:flex;align-items:center;justify-content:flex-end;gap:20px;margin-inline-start:auto}

.layout{max-width:1450px;margin:auto;padding:28px clamp(15px,4vw,55px) 54px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;align-items:start}
aside{background:linear-gradient(155deg,#142540,#0e192d 72%);color:#eef4ff;border:1px solid #243958;border-radius:var(--r);padding:16px;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;scrollbar-color:#546988 #142540;box-shadow:0 8px 22px #101d3517}

.group{margin:16px 0 6px;padding:0 8px;font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:#c1cee3}
.nav-item{display:flex;gap:10px;align-items:baseline;border-radius:8px;padding:8px;text-decoration:none;color:#edf4ff;font-size:.92rem;line-height:1.38}
.nav-item:hover{background:#203552;color:#fff}
.nav-item[aria-current="page"]{background:#253d61;color:#fff;font-weight:700;box-shadow:inset 3px 0 #daba79}
.nav-number{font-size:.8rem;color:#a6b9d7;min-width:17px;font-variant-numeric:tabular-nums}
.nav-item[aria-current="page"] .nav-number{color:#f1d39f}
.progress{margin:12px 0 0;padding:10px 8px 0;border-top:1px solid #304561;color:#d3def0;font-size:.85rem}
progress{display:block;width:100%;height:7px;margin-top:6px;accent-color:#e6c58b;color-scheme:dark}
main{min-width:0}
.hero{background:linear-gradient(115deg,#142341,#1b365d);color:white;padding:clamp(22px,4vw,44px);border-radius:var(--r) var(--r) 0 0;position:relative;overflow:hidden}

.eyebrow{color:#d5e5ff;font-size:.83rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;margin:0 0 7px}

.tabs a{color:var(--muted)}
.tabs a:hover,.tabs a[aria-current="page"]{background:var(--pale);color:#153d95}
.panel{background:var(--paper);border:1px solid var(--line);padding:clamp(17px,4vw,38px);border-radius:0 0 var(--r) var(--r);min-height:300px}
.prose{max-width:760px}
.prose h2{font-size:1.43rem;line-height:1.26;margin:1.45em 0 .55em}
.prose p{margin:0 0 1em}
.prose ul,.prose ol{padding-left:1.5em}
.prose li{margin:.5em 0}
.callout{margin:26px 0 8px;padding:15px 18px;background:#eff5ff;border-inline-start:4px solid var(--blue);border-radius:0 8px 8px 0}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px}
.button,.level{border:1px solid var(--line);background:white;color:var(--ink)}
.button:hover,.level:hover{background:#f1f5fb}
.primary,.level[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:white}
.primary:hover,.level[aria-pressed="true"]:hover{background:#123b94}
.button:disabled{opacity:.55;cursor:default}
.chapter-nav{display:flex;justify-content:space-between;gap:12px;margin-top:20px;border-top:1px solid var(--line);padding-top:15px}
.chapter-nav a{font-weight:650}
.section-title{font-size:1.48rem;line-height:1.25;margin:0 0 10px}
.hint{color:var(--muted);margin:0 0 18px}
.map-toolbar{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.map-toolbar .section-title,.map-toolbar .hint{margin:0}
.map-toolbar .hint{margin-top:4px}
.map{--core:clamp(128px,16vw,174px);--channel:16px;--row-gap:14px;position:relative;isolation:isolate;display:grid;grid-template-columns:minmax(0,1fr) var(--core) minmax(0,1fr);gap:var(--row-gap) 0;padding:20px;border:1px solid var(--line);border-radius:13px;background:#f7faff radial-gradient(#d8e2f1 1px,transparent 1px) 0 0/14px 14px}
.map::before{content:"";position:absolute;z-index:-1;left:50%;top:8%;bottom:8%;width:2px;background:#92a5bf;transform:translateX(-50%)}
.map-root{grid-column:2;grid-row:1/4;align-self:center;position:relative;z-index:2;margin:0 8px;padding:16px 9px;border:1px solid #3e5b86;border-radius:12px;background:var(--navy);color:#fff;text-align:center;font-weight:750;line-height:1.3;box-shadow:0 4px 15px #1b315334}
.map-root::before{content:"§";display:block;margin-bottom:5px;color:#c6d9fa;font:1.45rem/1 Georgia,serif}
.map-branches{display:contents}
.map-branch{--accent:#1d5d9d;--tint:#eaf3ff;position:relative;align-self:center;grid-column:1;margin-right:var(--channel);min-width:0;list-style:none}
.map-branch:nth-child(n+4){grid-column:3;margin-right:0;margin-left:var(--channel)}
.map-branch:nth-child(3n+1){grid-row:1}
.map-branch:nth-child(3n+2){grid-row:2}
.map-branch:nth-child(3n){grid-row:3}
.map-branch:nth-child(2){--accent:#16715e;--tint:#e7f8f0}
.map-branch:nth-child(3){--accent:#70509e;--tint:#f3edff}
.map-branch:nth-child(4){--accent:#aa462d;--tint:#fff0ea}
.map-branch:nth-child(5){--accent:#9a590d;--tint:#fff4dd}
.map-branch:nth-child(6){--accent:#9c3b69;--tint:#feeff6}
.map-branch::before{content:"";position:absolute;z-index:-1;top:50%;left:100%;width:calc(var(--core) / 2 + var(--channel));border-top:2px solid var(--accent)}
.map-branch:nth-child(n+4)::before{left:auto;right:100%}
.map-branch details{height:100%;border:1px solid color-mix(in srgb,var(--accent) 35%,white);border-top:3px solid var(--accent);border-radius:10px;background:#fff;box-shadow:0 2px 6px #1423410d}
.map-branch summary{position:relative;display:block;list-style:none;padding:11px 31px 11px 11px;background:var(--tint);border-radius:7px;color:var(--ink);line-height:1.4}
.map-branch summary::-webkit-details-marker{display:none}
.map-affordance{position:absolute;right:8px;top:10px;display:grid;place-items:center;width:19px;height:19px;border-radius:50%;background:white;color:var(--accent);font-weight:750}
.map-branch details[open] summary{border-radius:7px 7px 0 0}
.map-affordance::before{content:"+"}
.map-branch details[open] .map-affordance::before{content:"−"}
.map-branch summary strong{display:block;margin-bottom:3px;color:var(--accent)}
.map-case{margin:0;padding:12px 11px;font-size:.94rem;line-height:1.5}
.map-case strong{display:block;color:var(--accent);margin-bottom:2px}
@media(max-width:880px){
  .map{display:flex;flex-direction:column;gap:11px;padding:14px}
  .map::before{left:24px;top:40px;bottom:38px;transform:none}
  .map-root{align-self:flex-start;margin:0;padding:9px 13px;text-align:left}
  .map-root::before{display:inline;margin:0 6px 0 0;font-size:1.14rem}
  .map .map-branch{align-self:stretch;margin:0 0 0 25px}
  .map .map-branch::before{left:auto;right:100%;width:15px}
}
.example{margin:1em 0;padding:14px 16px;background:#f2f6ff;border-left:3px solid #6586cc;border-radius:0 8px 8px 0}
.example strong{color:#173f8a}
.example p{margin:.28em 0 0}
.law{border:1px solid var(--line);border-radius:9px;margin:-.45em 0 1.15em;background:#fafcff}
.law summary{padding:8px 12px;color:#17458d;font-size:.91rem}
.law summary span{display:inline;margin-left:.6em;color:var(--muted)}
.law-copy{padding:0 13px 13px;max-width:800px}
.law-copy h3{font-size:1rem;margin:.6em 0}
.law-copy p{margin:0 0 .6em;font-size:.95rem}
.law-copy a{font-size:.9rem}

.law-legend{display:flex;flex-wrap:wrap;gap:6px 15px;margin:4px 0 12px;font-size:.85rem}
.law-legend span{padding:2px 6px;border-radius:4px}
.law-direct{background:#ffe59a;color:#332400}
.law-related{background:#d7eeff;color:#102f4e}
.law-copy mark{border-radius:2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
@media(forced-colors:active){.law-direct{outline:1px solid MarkText}.law-related{outline:1px dashed MarkText}}

.law-source+.law-source,.article-copy+.article-copy{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.law-article{margin:.45em 0;background:white;border:1px solid var(--line);border-radius:8px}
.law-article>.article-copy{padding:0 10px 7px}
li>.law{margin:.5em 0 .8em}
.levels{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.quiz-box{max-width:790px}
.quiz-meta{font-size:.89rem;color:var(--muted);margin:0 0 7px}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font-weight:750;font-size:1.18rem;line-height:1.4;margin:0 0 13px}
.option{display:flex;align-items:baseline;gap:10px;border:1px solid var(--line);padding:11px 13px;margin-bottom:9px;border-radius:8px;cursor:pointer}
.option:has(input:checked){border-color:#517bc9;background:#f0f5ff}
.option input{accent-color:var(--blue);flex:none}
.option.correct{border-color:#54a58b;background:#e9f7ef}
.option.wrong{border-color:#d38d92;background:#fff0f1}
.feedback{padding:12px 15px;margin:15px 0;background:#edf4ff;border-radius:8px}
.feedback p{margin:3px 0 0}
.feedback.ok strong{color:var(--green)}
.feedback.err strong{color:var(--red)}
.review-list{display:grid;gap:10px;padding:0;list-style:none}
.review-list li{background:#f2f6ff;border-radius:9px;padding:11px 14px}
.review-list a{font-weight:700}
footer{max-width:1450px;margin:auto;padding:0 20px 25px;text-align:center;color:var(--muted);font-size:.87rem}
@media(max-width:960px){.layout{grid-template-columns:218px minmax(0,1fr);gap:17px}}
@media(max-width:710px){.layout{grid-template-columns:minmax(0,1fr);padding-top:15px}.top-inner{padding:12px 16px}.top-links{gap:12px}aside{position:static;max-height:none;padding:12px}.hero{padding:24px 17px}.panel{padding:17px}.tabs{padding:8px;gap:2px}.tabs a{padding:7px 9px}.chapter-nav{font-size:.9rem}}
@media(max-width:350px){.top-inner{gap:8px}}
@media print{header.top,aside,.tabs,.actions,.chapter-nav,footer{display:none!important}.layout{display:block;padding:0}.hero,.panel{background:white;color:black;border:0;padding:0}.eyebrow{color:black}}
.nav-chapter{min-width:0}
.nav-articles{display:block;margin-top:4px;color:#b7c8e1;font-size:.76rem;font-weight:400;line-height:1.39;overflow-wrap:anywhere}
.nav-articles span{display:block}
.fact-catalog{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:11px;list-style:none;padding:0}
.fact-catalog a{display:block;height:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#f7faff;text-decoration:none}
.fact-catalog a:hover{background:var(--pale)}
.fact-catalog span{display:block;color:var(--muted);font-size:.9rem;margin-top:3px}
#fact-response{margin-top:18px}
.fact-feedback{padding:14px 16px;background:var(--pale);border-radius:9px;margin:0 0 20px}
.fact-feedback p,.fact-column p{margin:.4em 0}
.fact-comparison{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:18px}
.fact-column{padding:12px 14px;border:1px solid var(--line);border-radius:10px}
.fact-column h3{font-size:1rem;margin:0 0 5px}
.fact-column mark{background:#ffe59a;color:#332400}
@media(max-width:550px){.fact-comparison{grid-template-columns:1fr}}
.tabs .fact-tab{order:1}
.tabs .glossary-tab{order:2;margin-inline-start:auto;border:1px solid #c1d2ee;color:#153d95}
.glossary{max-width:760px}
.glossary-entry{margin:8px 0;border:1px solid var(--line);border-radius:9px;background:#f9fbff}
.glossary-entry summary{padding:11px 14px;font-weight:700;color:#173e82}
.glossary-entry[open] summary{border-bottom:1px solid var(--line)}

.glossary-definition strong{display:block;color:var(--muted);font-size:.88rem}

.lesson-video video{display:block;width:100%;height:auto;aspect-ratio:16/9;border-radius:12px;background:#101d35}

.index-tools{display:grid;gap:6px;padding:10px 8px;margin-top:10px;border-top:1px solid #304561;font-size:.9rem}

</style>

<script type="application/json" id="study-data">{"chapters":[{"id":"principios","number":1,"semester":1,"map":[["Proteção","Reduz desigualdade na relação de emprego","Uma regra de proteção pode orientar a interpretação de uma dúvida sobre a norma. Na dúvida sobre o que aconteceu, examine as provas e o ônus probatório."],["Realidade","Os fatos ajudam a definir o vínculo e as parcelas","O contrato diz “autônomo”, mas o técnico cumpre escala fixa e recebe ordens e sanções. Compare os documentos com a prestação real."],["Continuidade","Prazo indeterminado é a regra","Um contrato de experiência com mais de uma prorrogação pode se converter em contrato por prazo indeterminado."],["Boa-fé","Lealdade de ambas as partes","Facilitar a apuração de um erro na folha e fornecer informações verdadeiras são formas de agir com lealdade no vínculo."],["Salário","Limites à redução e aos descontos","Uma queda nas vendas faz parte do risco do negócio. A empresa não pode, por esse motivo, descontar a perda do salário da equipe."],["Disciplina","Prova, proporcionalidade e uma sanção por fato","Um atraso pontual pode justificar advertência proporcional. Se a empresa já advertiu pelo atraso, não pode aplicar outra sanção pelo mesmo fato."]],"questions":[{"id":"principios-1","chapter":"principios","level":"B","text":"Qual princípio orienta a análise do que realmente aconteceu na prestação de serviços?","options":["Primazia da realidade","Unicidade sindical","Intangibilidade salarial","Primazia da forma escrita","Indisponibilidade dos direitos"],"explanation":"A conduta concreta é examinada junto com os documentos para identificar a natureza da relação."},{"id":"principios-2","chapter":"principios","level":"B","text":"Qual princípio explica a preferência pelo contrato de prazo indeterminado?","options":["Continuidade da relação de emprego","Não discriminação","Boa-fé objetiva","Irredutibilidade do salário","Inalterabilidade contratual lesiva"],"explanation":"O vínculo é presumido duradouro e o contrato a termo depende das hipóteses legais."},{"id":"principios-3","chapter":"principios","level":"M","text":"A empresa advertiu por escrito uma falta e, sem fato novo, aplicou suspensão pela mesma ocorrência. Qual limite foi violado?","options":["Vedação da dupla punição","Imediatidade","Alteridade","Falta de imediatidade da advertência original","Ausência de previsão de duração do vínculo"],"explanation":"Uma mesma conduta não autoriza duas sanções disciplinares sucessivas."},{"id":"principios-4","chapter":"principios","level":"M","text":"O empregador descobre falsificação grave e comprovada de atestado. Precisa aplicar três advertências antes de dispensar?","options":["A gravidade comprovada pode justificar ruptura imediata","Sempre precisa aplicar três advertências","Atenção à gradação impede qualquer justa causa","A empresa pode investigar, mas precisa advertir antes em qualquer hipótese","O atestado falso autoriza apenas suspensão, desde que haja perícia"],"explanation":"A gradação é importante em faltas leves e reiteradas. Para falta grave, avalie enquadramento, prova e proporcionalidade."},{"id":"principios-5","chapter":"principios","level":"A","text":"Lívia recebe 3% por cada venda registrada. A loja identifica essa parcela na folha como prêmio e também entrega, separadamente, uma bonificação espontânea por desempenho acima da meta normal. O regulamento usa o mesmo nome para as duas rubricas. Como classificar o percentual de 3%?","options":["Examinar a contraprestação efetiva e aplicar o art. 457 conforme sua natureza","Reconhecer o prêmio apenas pela rubrica","Repartir o risco do negócio com o empregado","Enquadrá-lo como prêmio porque o regulamento aplica o mesmo nome à bonificação extraordinária","Reconhecer natureza salarial apenas nos meses em que Lívia supera a meta normal"],"explanation":"A primazia da realidade protege o enquadramento correto da parcela e a definição legal de prêmio exige desempenho superior ao ordinário."},{"id":"principios-6","chapter":"principios","level":"A","text":"Depois de queda nas vendas, a rede de Diego rateia R$ 4.000 de redução do faturamento entre os vendedores. No mesmo mês, a empresa deduz dele um adiantamento regularmente concedido. Diego impugna somente o rateio. Quais princípios sustentam a impugnação?","options":["Intangibilidade salarial e alteridade","Continuidade e unicidade sindical","Primazia da realidade e liberdade sindical apenas","Irredutibilidade e continuidade, porque o desconto altera a duração do contrato","Boa-fé e proporcionalidade, porque basta repartir a perda em cotas iguais"],"explanation":"O empregador assume o risco do empreendimento. O art. 462 limita descontos sobre salário."},{"chapter":"principios","level":"B","text":"O que a boa-fé objetiva exige de empregado e empregador?","options":["Lealdade e cooperação na relação","Identidade de interesses em toda negociação","Renúncia prévia a direitos em troca de salário","Prioridade da vontade expressa sobre a conduta de ambas as partes","Distribuição automática dos riscos do negócio"],"explanation":"O dever de agir lealmente vale para os dois lados do vínculo.","id":"principios-7"},{"chapter":"principios","level":"B","text":"Qual ideia limita os descontos no salário?","options":["Intangibilidade salarial","Continuidade do vínculo","Unicidade sindical","Primazia da realidade","Inalterabilidade da função"],"explanation":"A CLT restringe descontos para proteger a contraprestação do trabalhador.","id":"principios-8"},{"chapter":"principios","level":"B","text":"Qual princípio relaciona a punição à gravidade da conduta?","options":["Proporcionalidade","Alteridade","Onerosidade","Imediatidade","Irrenunciabilidade"],"explanation":"Proporcionalidade exige compatibilidade entre infração e medida aplicada.","id":"principios-9"},{"chapter":"principios","level":"B","text":"O que a dignidade da pessoa humana protege no trabalho?","options":["A pessoa contra tratamento humilhante e degradante","Só a regularidade dos registros da empresa","A empresa contra qualquer reclamação","Qualquer redução de metas por decisão patronal","A permanência no mesmo cargo em toda alteração interna"],"explanation":"O poder de direção convive com a proteção da pessoa e de seus direitos.","id":"principios-10"},{"chapter":"principios","level":"B","text":"Que ideia protege o trabalhador de renunciar livremente a direitos indisponíveis?","options":["Irrenunciabilidade","Eventualidade","Subsidiariedade","Autonomia privada irrestrita","Continuidade do vínculo"],"explanation":"A disponibilidade de cada direito precisa ser analisada antes de aceitar uma renúncia.","id":"principios-11"},{"chapter":"principios","level":"M","text":"A empresa rebaixa unilateralmente o salário fixo por queda nas vendas. Qual proteção está diretamente em jogo?","options":["Irredutibilidade salarial","Pessoalidade","Unicidade sindical","Intangibilidade por adiantamento regularmente concedido","Não eventualidade da prestação"],"explanation":"A redução unilateral conflita com a garantia constitucional. A queda da receita é risco da atividade.","id":"principios-12"},{"chapter":"principios","level":"M","text":"Um supervisor cobra metas com insultos reiterados diante de colegas. Qual limite interessa?","options":["Dignidade e vedação ao assédio moral","Apenas a intangibilidade do salário","Somente a data do contrato","Limitação da cobrança apenas pelo prazo contratual","Imediatidade da sanção aplicada ao supervisor"],"explanation":"A existência de metas não legitima humilhações. A repetição e o contexto importam.","id":"principios-13"},{"chapter":"principios","level":"M","text":"Um contrato diz “eventual”, mas o trabalhador comparece em toda escala mensal. Qual fato deve ser examinado?","options":["Regularidade efetiva da prestação","Só a nomenclatura do contrato","Somente se o pagamento era em dinheiro","Qualificação fiscal do pagamento como único elemento","Número de vezes em que o contrato escrito foi renovado, independentemente da prática"],"explanation":"A primazia da realidade exige confrontar o rótulo com a rotina.","id":"principios-14"},{"chapter":"principios","level":"M","text":"A empresa impõe uma sanção meses após saber da falta, sem explicar a demora. Qual requisito merece exame?","options":["Imediatidade","Continuidade","Estabilidade acidentária","Vedação à dupla punição, ainda que só tenha havido uma penalidade","Adequação do valor de eventual desconto salarial"],"explanation":"A demora após a ciência, sem diligência justificável, pode enfraquecer a punição.","id":"principios-15"},{"chapter":"principios","level":"M","text":"O empregado recebe adiantamento e a empresa o deduz na folha. Qual é a leitura do art. 462?","options":["Adiantamento é hipótese admitida de desconto","A intangibilidade veda qualquer desconto","O desconto transfere o risco do empreendimento por definição","O desconto exige dolo comprovado, mesmo tratando-se de adiantamento","O desconto depende sempre de autorização coletiva"],"explanation":"A proteção salarial tem exceções previstas na CLT.","id":"principios-16"},{"chapter":"principios","level":"A","text":"Renata descobre indícios de que Caio adulterou três comprovantes. O RH registra a ciência no dia 3, inicia a conferência no mesmo dia e ouve os envolvidos até o dia 7. Sem ter aplicado punição antes, decide no dia 8. O que essas datas permitem concluir sobre a imediatidade?","options":["Não. A apuração razoável pode ser compatível com a imediatidade","Sim. O prazo máximo é sempre o próprio dia","Sim. A proporcionalidade fixa prazo de dois dias","A contagem parte do primeiro comprovante adulterado, mesmo se a empresa não sabia do fato","Qualquer apuração formal reinicia o prazo sem limite, mesmo que haja inércia patronal"],"explanation":"O ponto é distinguir demora injustificada de tempo necessário à investigação.","id":"principios-17"},{"chapter":"principios","level":"A","text":"Em uma manobra de rotina, Iara quebra por negligência um equipamento. A empresa prova a culpa e exibe cláusula assinada antes do dano autorizando desconto nessa hipótese. O gerente fundamenta o desconto na cláusula, sem alegar dolo. O que o art. 462 permite nessa situação?","options":["A previsão acordada pode permitir desconto pelo dano culposo","O desconto por culpa sempre depende de ação judicial","Qualquer perda de faturamento se enquadra como dano do empregado","A cláusula permite desconto só se tiver sido assinada depois do dano","Provada a culpa, a previsão contratual é irrelevante mesmo sem dolo"],"explanation":"O art. 462 distingue dano com previsão acordada e dolo. A culpa ainda precisa ser demonstrada.","id":"principios-18"},{"chapter":"principios","level":"A","text":"Fábio, em discussão com o supervisor, danifica de propósito um aparelho da empresa. A gravação comprova o dolo. O contrato nada diz sobre descontos por dano. Qual é o efeito dessa omissão no exame do art. 462, § 1º?","options":["Não. O dolo é fundamento próprio na regra do art. 462, § 1º","Sim. Dolo e previsão contratual são requisitos cumulativos","Sim. Dano doloso só pode gerar advertência","O desconto depende de cláusula prévia sempre que o equipamento já integrava o patrimônio da empresa","A empresa precisaria provar simultaneamente dolo e autorização escrita posterior ao dano"],"explanation":"O dispositivo usa hipóteses alternativas. Prova e enquadramento continuam necessários.","id":"principios-19"},{"chapter":"principios","level":"A","text":"Bia cobra parcelas alegando que trabalhava aos sábados. As partes discordam sobre os horários e o texto da norma, quanto ao ponto discutido, é claro. Seu advogado diz que a dúvida, por si, basta para considerar verdadeira a jornada alegada. Qual é a análise adequada?","options":["É preciso aplicar as regras de prova e distinguir dúvida sobre fatos de interpretação da norma","O princípio cria presunção absoluta em qualquer litígio","Basta escolher o relato do empregador para aplicar a alteridade","Aplicar a interpretação mais protetiva sempre que os depoimentos forem contraditórios","Resolver a dúvida de fato pela primazia da realidade sem examinar regras de prova ou o conjunto probatório"],"explanation":"O critério interpretativo não substitui a distribuição do ônus da prova.","id":"principios-20"},{"chapter":"principios","level":"A","text":"Davi recebeu advertência por atraso em maio. Em junho, uma ausência diferente foi documentada e a empresa quer aplicar uma sanção pelo segundo episódio, mencionando a advertência anterior no histórico. Como avaliar o uso da advertência de maio?","options":["Não. A segunda ocorrência é fato distinto e pode ser avaliada no histórico","Sim. Qualquer nova sanção é duplicidade","Não, porque o primeiro atraso pode ser punido novamente sozinho","A advertência anterior pode ser aumentada por decisão posterior, mesmo que o segundo fato não seja provado","Mencionar o histórico sempre equivale a punir novamente a primeira falta"],"explanation":"A vedação alcança dupla punição pelo mesmo fato, e não a reação proporcional a fato posterior.","id":"principios-21"}],"title":"Princípios e proteção do trabalhador","body":[{"type":"body","text":"O Direito do Trabalho disciplina a prestação de trabalho e protege quem se encontra em posição de menor poder na relação de emprego. A dignidade da pessoa humana, os valores sociais do trabalho e da livre iniciativa e os direitos sociais formam sua base constitucional (CF, arts. 1º, III e IV, 6º e 7º). O contrato cria obrigações para as duas partes, mas a liberdade de negociar encontra limites legais.","refs":[{"law":"CF","ids":["1","6","7"],"label":"arts. 1, 6, 7","highlights":{"1":{"3":["direct",35],"4":["direct",58],"0":["related",191]},"6":{"0":["direct",245]},"7":{"0":["direct",116],"6":["related",83],"10":["related",80]}}}]},{"type":"heading","text":"Proteção e primazia da realidade"},{"type":"body","text":"O princípio da proteção orienta a interpretação e a aplicação do Direito do Trabalho. O in dubio pro operario é um critério doutrinário para dúvida interpretativa real entre leituras juridicamente possíveis. Na análise de fatos controvertidos, observe as regras de prova. A primazia da realidade manda examinar como o trabalho ocorreu. Um recibo de autônomo, por exemplo, é um dado a ser confrontado com a prestação pessoal, a rotina e a direção efetiva do trabalho."},{"type":"body","text":"A norma mais favorável e a condição mais benéfica ajudam a entender a proteção, dentro das regras aplicáveis. Há limites e critérios específicos, como a prevalência de ACT sobre CCT (art. 620 da CLT). A continuidade ajuda a explicar por que o contrato sem termo final é a regra. A irrenunciabilidade protege direitos indisponíveis contra renúncia ou fraude. A intangibilidade salarial limita descontos (art. 462), e a irredutibilidade do salário admite a exceção constitucional da negociação coletiva.","refs":[{"law":"CLT","ids":["620","462"],"label":"arts. 620, 462","highlights":{"620":{"0":["direct",143]},"462":{"0":["direct",178],"1":["related",233]}}},{"law":"CF","ids":["7"],"label":"art. 7","highlights":{"7":{"6":["direct",83],"10":["related",80],"26":["related",69]}}}]},{"type":"heading","text":"Boa-fé e limites do poder disciplinar"},{"type":"body","text":"A boa-fé objetiva exige lealdade, transparência e cooperação de ambas as partes. A falsificação comprovada de atestado e o atraso reiterado de salários ilustram violações de lados diferentes da relação. A dignidade e a não discriminação vedam práticas como humilhação, assédio e distinções discriminatórias na admissão. Cobrança de desempenho deve respeitar a pessoa. Humilhações repetidas diante da equipe podem caracterizar assédio moral."},{"type":"body","text":"Ao avaliar uma punição, verifique enquadramento, prova, proporcionalidade, imediatidade após ciência e apuração razoável, e vedação à dupla punição pelo mesmo fato. Faltas leves reiteradas podem exigir gradação. Uma falta grave comprovada pode justificar a ruptura imediata. A lei não impõe uma sequência fixa de advertências para todos os casos."},{"type":"heading","text":"Como identificar o princípio aplicável"},{"type":"body","text":"Comece pelo fato que a questão quer explicar. Se o contraste é entre um recibo e o modo de trabalhar, pense em primazia da realidade. Se o problema é quem absorve o prejuízo da atividade, pense em alteridade. Se a discussão é a validade de uma renúncia, identifique o direito e o limite à negociação. Princípios podem atuar juntos. A consequência concreta ainda precisa de fundamento jurídico, como a nulidade de atos destinados a fraudar a CLT no art. 9º.","refs":[{"law":"CLT","ids":["9"],"label":"art. 9","highlights":{"9":{"0":["direct",165]}}}]},{"type":"example","text":"Exemplo. Um vendedor é contratado como pessoa jurídica, mas presta serviços pessoalmente, recebe pagamento regular e é submetido a ordens e sanções. O contrato escrito entra na análise, e os fatos permitem investigar se há emprego e fraude. Já uma consultora que negocia entregas e organiza sua própria equipe apresenta sinais diferentes de autonomia."},{"type":"heading","text":"Como examinar uma punição"},{"type":"body","text":"Separe a existência do fato, sua autoria, a gravidade e a resposta da empresa. A imediatidade conta a partir da ciência e admite tempo razoável de apuração. A punição deve guardar relação com o episódio e evitar dupla sanção. Para a justa causa, procure a hipótese do art. 482 e a prova específica. Desídia pode resultar de reiterada negligência, enquanto improbidade envolve desonestidade.","refs":[{"law":"CLT","ids":["482"],"label":"art. 482","highlights":{"482":{"0":["direct",87],"1":["direct",22],"5":["direct",49],"8":["related",44]}}}]},{"type":"example","text":"Exemplo. Um atraso pontual e sem consequência grave pode justificar uma advertência proporcional. Se a empresa já puniu esse atraso, aplicar suspensão pela mesma ocorrência sem fato novo caracteriza dupla punição. Um segundo atraso é outro fato e pode ser avaliado no histórico."},{"type":"body","text":"A proteção também opera na remuneração. A Constituição prevê irredutibilidade do salário, com ressalva para convenção ou acordo coletivo. A CLT limita descontos e, no caso de dano causado pelo empregado, diferencia a hipótese de previsão acordada da ocorrência de dolo. Portanto, perda no faturamento e dano doloso comprovado pedem análises diferentes.","refs":[{"law":"CF","ids":["7"],"label":"art. 7","highlights":{"7":{"6":["direct",83],"10":["related",80],"26":["related",69]}}},{"law":"CLT","ids":["462"],"label":"art. 462","highlights":{"462":{"0":["direct",178],"1":["direct",233]}}}]},{"type":"prompt","text":"Teste sem olhar. O que a primazia da realidade resolve? Que fatos ajudam a distinguir uma cobrança legítima de uma humilhação?"}],"mapTitle":"Princípios do trabalho","citedArticles":["CF · arts. 1, 6, 7","CLT · arts. 9, 462, 482, 620"],"glossary":[{"term":"Primazia da realidade","meaning":"Os fatos da prestação ajudam a determinar a natureza do vínculo e das parcelas, mesmo quando os documentos usam outros nomes.","example":"Um contrato chama a pessoa de autônoma, mas ela cumpre escala e recebe ordens. Esses fatos entram na análise do vínculo."},{"term":"Alteridade","meaning":"O empregador assume o risco econômico da atividade.","example":"Uma queda nas vendas faz parte do risco do negócio e não é motivo para cobrar essa perda da equipe."},{"term":"Boa-fé objetiva","meaning":"Dever de agir com lealdade e cooperação durante a relação de trabalho.","example":"Empregado e empregador devem fornecer informações verdadeiras ao apurar um erro na folha."},{"term":"Irrenunciabilidade","meaning":"Limite à possibilidade de abrir mão de direitos trabalhistas indisponíveis.","example":"Uma assinatura individual por si só não valida qualquer renúncia a um direito obrigatório."},{"term":"Intangibilidade salarial","meaning":"Proteção que limita os descontos no salário.","example":"O empregador precisa identificar a hipótese legal que autoriza o desconto."},{"term":"In dubio pro operario","meaning":"Expressão latina usada para um critério doutrinário de interpretação em favor do trabalhador quando há dúvida real sobre o sentido da norma.","example":"Uma dúvida sobre o que aconteceu no caso exige análise das provas e das regras de ônus probatório."},{"term":"Imediatidade","meaning":"Relação de tempo entre a ciência da falta e a punição, considerando a apuração necessária.","example":"Uma demora injustificada pode enfraquecer a justificativa da sanção."},{"term":"Proporcionalidade","meaning":"A consequência deve corresponder à gravidade da conduta.","example":"Uma falta leve isolada e uma fraude grave comprovada pedem avaliações diferentes."}],"lesson":{"title":"Princípios do trabalho","file":"principios-rafael-aula.mp4","poster":"principios-rafael-aula.jpg"}},{"id":"fontes","number":2,"semester":1,"map":[["Interpretar","Sentido de norma existente","Pergunte o que a expressão significa no contexto da norma. Para entender “até 90 dias” na experiência, leia também a regra da CLT sobre prorrogação."],["Integrar","Analogia, costumes, princípios e equidade","Se não houver regra para uma situação, a analogia permite aproveitar a solução de um caso juridicamente semelhante."],["Justiça do Trabalho","Varas, TRTs e TST","A Vara julga em primeiro grau. Em um recurso ordinário contra a sentença, quem examina o caso é, em regra, o TRT."],["ACT","Sindicato profissional e empresa","Sindicato profissional e uma fábrica pactuam banco de horas para os trabalhadores abrangidos. Os signatários apontam para um ACT."],["CCT","Sindicatos profissional e econômico","Sindicato dos comerciários e sindicato patronal negociam condições para a categoria em uma base territorial. Os signatários apontam para uma CCT."],["Limites","Arts. 611-A e 611-B e Tema 1046 do STF","Uma cláusula sobre banco de horas e outra que reduz o salário mínimo passam por análises diferentes. Confira a matéria negociada antes de comparar ACT e CCT."]],"questions":[{"id":"fontes-1","chapter":"fontes","level":"B","text":"Quem celebra o acordo coletivo de trabalho?","options":["Sindicato profissional e uma ou mais empresas","Dois empregados e o prefeito","Somente os dois sindicatos","Sindicato profissional e autoridade fiscalizadora","Sindicato econômico e uma ou mais empresas sem representação profissional"],"explanation":"A convenção coletiva, por sua vez, envolve os sindicatos profissional e econômico."},{"id":"fontes-2","chapter":"fontes","level":"B","text":"Qual método pergunta pela finalidade social da norma?","options":["Teleológico","Literal","Histórico","Sistemático","Comparativo"],"explanation":"A interpretação teleológica investiga o fim da regra. A literal examina as palavras e a histórica, a evolução da norma."},{"id":"fontes-3","chapter":"fontes","level":"M","text":"Há uma lacuna e existe uma regra de situação semelhante. Qual técnica permite aproveitar a solução?","options":["Analogia","Interpretação literal","Vedação de dupla punição","Interpretação teleológica","Aplicação direta de regra expressa para o mesmo caso"],"explanation":"A analogia integra o ordenamento diante da lacuna e pressupõe semelhança relevante."},{"id":"fontes-4","chapter":"fontes","level":"M","text":"ACT e CCT válidos disciplinam de maneira diferente um mesmo ponto. Qual regra específica da CLT deve ser consultada?","options":["Prevalência do ACT conforme o art. 620","Prevalência obrigatória da CCT por abranger mais trabalhadores","Prevalência automática do instrumento mais antigo","Critério exclusivo da norma mais recente","Prevalência da CCT por ter abrangência territorial maior"],"explanation":"O art. 620 determina a prevalência do ACT. A validade das cláusulas ainda deve respeitar os limites legais e constitucionais."},{"id":"fontes-5","chapter":"fontes","level":"A","text":"Otávio examina ACT que reduz o salário mínimo e oferece um auxílio mensal como contrapartida. A empresa cita o Tema 1046 e diz que a assembleia aprovou tudo. Considerando que o salário mínimo está no catálogo de direitos protegidos, qual análise prevalece?","options":["A indisponibilidade absoluta impede a negociação dessa parcela","Qualquer compensação torna a cláusula válida","Toda limitação por ACT é inválida","A aprovação torna válida a redução se a contrapartida estiver quantificada","O salário mínimo pode ser afastado por ACT, mas não por CCT"],"explanation":"A tese admite negociação coletiva dentro dos limites e ressalva os direitos absolutamente indisponíveis."},{"id":"fontes-6","chapter":"fontes","level":"A","text":"Para estudar uma regra de jornada, Yasmin compara o dispositivo com a Constituição e, depois, verifica o que mudou entre a redação antiga e a atual. Ela usa a evolução do texto para evitar aplicar ao caso uma exigência já superada. Quais métodos aparecem nessas duas etapas?","options":["Sistemático e histórico","Analogia e equidade","Apenas literal","Literal e histórico","Teleológico e analógico"],"explanation":"Relacionar diplomas é interpretação sistemática. Examinar alterações da regra é interpretação histórica."},{"chapter":"fontes","level":"B","text":"Quem negocia uma convenção coletiva de trabalho?","options":["Sindicato profissional e sindicato econômico","Empregador e empregado individualmente","Tribunal e Ministério Público","Assembleia de trabalhadores e empresa, sem participação sindical","Dois sindicatos da mesma categoria profissional"],"explanation":"A CCT nasce de negociação entre os sindicatos das categorias profissional e econômica.","id":"fontes-7"},{"chapter":"fontes","level":"B","text":"O que significa integração do direito?","options":["Preencher uma lacuna por técnica juridicamente admitida","Repetir literalmente norma existente","Aplicar sempre o instrumento mais recente","Escolher entre sentidos possíveis de uma norma que já resolve o caso","Afastar norma expressa porque outra seria mais justa"],"explanation":"Integração pressupõe lacuna. A interpretação determina o sentido de norma existente.","id":"fontes-8"},{"chapter":"fontes","level":"B","text":"Que método examina o significado das palavras do dispositivo?","options":["Literal","Histórico","Teleológico","Sistemático","Comparativo"],"explanation":"O método literal parte do texto e do vocabulário da norma.","id":"fontes-9"},{"chapter":"fontes","level":"B","text":"Qual órgão atua tipicamente no primeiro grau trabalhista?","options":["Vara do Trabalho","TST","STF","Tribunal Regional Federal","Superior Tribunal de Justiça"],"explanation":"As Varas julgam em primeiro grau. Os TRTs analisam recursos, entre outras competências.","id":"fontes-10"},{"chapter":"fontes","level":"B","text":"Para que servem súmulas e orientações jurisprudenciais?","options":["Condensar entendimentos jurisprudenciais","Fixar salário individual de cada empregado","Substituir todas as leis trabalhistas","Criar autonomamente obrigações de caráter geral","Substituir a prova de fatos em todos os processos"],"explanation":"Esses enunciados sintetizam a jurisprudência e têm alcance jurídico próprio.","id":"fontes-11"},{"chapter":"fontes","level":"M","text":"Para interpretar “atividade principal”, a estudante compara o texto de dois dispositivos da mesma lei. Qual método predomina?","options":["Sistemático","Histórico","Analogia por lacuna","Teleológico","Integração por costumes"],"explanation":"A interpretação sistemática lê a expressão em conjunto com as demais normas relevantes.","id":"fontes-12"},{"chapter":"fontes","level":"M","text":"Uma cláusula de ACT trata de banco de horas anual. Qual dispositivo lista essa matéria entre as negociáveis?","options":["Art. 611-A da CLT","Art. 467 da CLT","Art. 137 da CLT","Art. 468 da CLT","Art. 620 da CLT"],"explanation":"O banco de horas anual está no catálogo de matérias do art. 611-A.","id":"fontes-13"},{"chapter":"fontes","level":"M","text":"Dois sindicatos querem representar a mesma categoria na mesma base territorial. Qual regra deve ser examinada?","options":["Unicidade sindical","Onerosidade do vínculo","Prorrogação da experiência","Autonomia individual de contratação","Liberdade de escolha do empregador pela entidade patronal"],"explanation":"O art. 8º, II, da Constituição disciplina a unicidade sindical e a base territorial.","id":"fontes-14"},{"chapter":"fontes","level":"M","text":"Uma trabalhadora recorre da sentença da Vara do Trabalho. Qual órgão julga tipicamente esse recurso?","options":["TRT competente","STF diretamente","Sindicato patronal","Turma do Tribunal Regional Federal","Conselho Superior da Justiça do Trabalho"],"explanation":"O Tribunal Regional do Trabalho julga recursos do primeiro grau na respectiva região.","id":"fontes-15"},{"chapter":"fontes","level":"M","text":"Ao decidir caso omisso, o julgador usa uma regra prevista para situação juridicamente semelhante. Que técnica aplicou?","options":["Analogia","Interpretação histórica","Interpretação literal","Solução pelo precedente de fato sem semelhança com o caso","Aplicação de norma coletiva posterior sem análise temporal"],"explanation":"A semelhança relevante permite usar a solução de uma hipótese regulada em outra omissa.","id":"fontes-16"},{"chapter":"fontes","level":"A","text":"A Rede Jatobá recolhe a assinatura individual de Bruno e de todo o turno em um documento chamado acordo coletivo. O sindicato profissional não negociou nem celebrou o ajuste. A empresa invoca o documento contra uma CCT já existente. Qual é a objeção inicial?","options":["O instrumento individual não tem os signatários exigidos para ACT","Todo acordo escrito é ACT","A falta do sindicato importa apenas em CCT","A soma de assinaturas individuais substitui o sindicato quando todos aderem","O documento é ACT, mas só prevalece sobre a CCT se for assinado depois"],"explanation":"O ACT exige participação do sindicato profissional e de uma ou mais empresas.","id":"fontes-17"},{"chapter":"fontes","level":"A","text":"Isadora analisa uma CCT que preserva determinado direito e um ACT que o reduz. Os instrumentos estão vigentes e foram assinados pelos legitimados, mas o direito é absolutamente indisponível. A empresa invoca a prioridade do ACT. Qual é a ordem correta da análise?","options":["Primeiro verifique a validade da cláusula e os limites à negociação. Só depois examine a prevalência do ACT.","Aplique imediatamente a prevalência do ACT, que sana a invalidade material da cláusula.","Aplique a CCT apenas porque abrange a categoria inteira, sem examinar as cláusulas.","Aplicar primeiro a regra de prevalência e só examinar a validade se a CCT for posterior","Escolher o instrumento mais específico ainda que a cláusula reduza direito indisponível"],"explanation":"A prioridade entre instrumentos não torna válida uma cláusula proibida.","id":"fontes-18"},{"chapter":"fontes","level":"A","text":"Marcela prova que, há dez anos, uma empresa adota prática contrária a uma proibição expressa. A defesa pede que o costume seja usado para integrar suposta lacuna. A regra já regula exatamente a situação. Como resolver?","options":["Não. A integração supre lacuna e respeita a disciplina vigente","Sim. Costume empresarial reiterado revoga a lei","Sim. Equidade sempre prevalece sobre a norma expressa","A aplicação prolongada converte a proibição em lacuna superveniente","A integração pelo costume admite contrariar a lei se a prática for pública e reiterada"],"explanation":"Prática reiterada não autoriza desrespeitar proibição legal.","id":"fontes-19"},{"chapter":"fontes","level":"A","text":"Felipe analisa um contrato de terceirização atual. Reconstrói a legislação anterior à reforma, mas usa essa redação como única regra e deixa de examinar a Lei 6.019 atual e o Tema 725. Que problema há na fundamentação?","options":["Tomar o contexto histórico como regra suficiente para o caso atual","Aplicar a interpretação sistemática de maneira completa","Preencher corretamente uma lacuna pelo costume","Dar efeito vinculante automático à interpretação sistemática da norma atual","Confundir analogia com aplicação direta do texto vigente, embora o tenha analisado"],"explanation":"A leitura histórica auxilia, mas a solução deve considerar normas e precedentes aplicáveis aos fatos.","id":"fontes-20"},{"chapter":"fontes","level":"A","text":"A advogada Joana encontra uma súmula do TST que, segundo a tese apresentada, cria uma obrigação sem previsão legal. A parte contrária cita a súmula como único fundamento para impor a obrigação. Qual dispositivo limita essa criação por enunciado?","options":["Art. 8º, § 2º","Art. 452-A","Art. 488","Art. 611-A, § 2º, sobre contrapartidas na negociação coletiva","Art. 8º, § 3º, sobre o exame dos instrumentos coletivos"],"explanation":"O art. 8º, § 2º, limita a criação de obrigações e a restrição de direitos por enunciados.","id":"fontes-21"}],"title":"Fontes, interpretação e negociação coletiva","body":[{"type":"heading","text":"Interpretar e integrar"},{"type":"body","text":"Interpretar é determinar o sentido de uma norma existente. O método literal examina as palavras. O lógico examina a coerência da leitura. O sistemático relaciona a norma com o restante do ordenamento. O teleológico procura sua finalidade. O histórico considera o contexto de elaboração e as mudanças posteriores. Vários métodos podem ser usados no mesmo caso. Ao estudar a terceirização, por exemplo, compare a disciplina histórica com o texto legal e os precedentes posteriores."},{"type":"body","text":"Integrar é preencher uma lacuna. A LINDB, arts. 4º e 5º, orienta o uso de analogia, costumes e princípios gerais e a consideração dos fins sociais da norma. O art. 8º da CLT prevê, entre outros critérios, jurisprudência, analogia, equidade, princípios, usos e costumes e direito comparado. Analogia aproveita a solução de situação semelhante. Equidade considera a justiça do caso dentro dos limites jurídicos. Direito comum atua subsidiariamente. O art. 8º, § 2º, limita a criação de obrigações ou restrições por enunciados jurisprudenciais.","refs":[{"law":"LINDB","ids":["4","5"],"label":"arts. 4, 5","highlights":{"4":{"0":["direct",128]},"5":{"0":["direct",111]}}},{"law":"CLT","ids":["8"],"label":"art. 8","highlights":{"8":{"0":["direct",441],"1":["direct",226],"2":["direct",242]}}}]},{"type":"heading","text":"Justiça do Trabalho e normas coletivas"},{"type":"body","text":"As Varas do Trabalho atuam no primeiro grau. Os TRTs julgam, entre outros casos, recursos regionais. O TST uniformiza a interpretação trabalhista nas hipóteses de sua competência. Súmulas e orientações jurisprudenciais condensam entendimentos. O STF aprecia questões constitucionais. A EC 45/2004 ampliou a competência trabalhista do art. 114 da Constituição. A expressão relação de trabalho nesse artigo tem alcance maior que o emprego típico, observadas as exclusões e definições da jurisprudência constitucional.","refs":[{"law":"CF","ids":["114"],"label":"art. 114","highlights":{"114":{"0":["direct",59],"1":["direct",198],"2":["related",57],"9":["related",78]}}}]},{"type":"body","text":"Na convenção coletiva (CCT), negociam sindicato profissional e sindicato econômico. No acordo coletivo (ACT), negociam sindicato profissional e uma ou mais empresas. A unicidade sindical impede a coexistência de entidades representativas da mesma categoria na mesma base territorial, que tem piso municipal (CF, art. 8º, II). A Reforma de 2017 destacou a negociação coletiva. O art. 611-A enumera matérias negociáveis, enquanto o art. 611-B protege direitos contra supressão ou redução. O art. 620 define a prevalência do ACT sobre a CCT. O Tema 1046 do STF admite negociar limitações de direitos, resguardados os absolutamente indisponíveis.","refs":[{"law":"CF","ids":["8"],"label":"art. 8","highlights":{"8":{"2":["direct",277],"6":["direct",87],"3":["related",149]}}},{"law":"CLT","ids":["611-A","611-B","620"],"label":"arts. 611-A, 611-B, 620","highlights":{"611-A":{"0":["direct",132],"1":["related",78],"2":["related",26]},"611-B":{"0":["direct",159],"4":["related",20],"11":["related",51]},"620":{"0":["direct",143]}}}]},{"type":"body","text":"Direito comparado. As tradições civil law e common law dão pesos diferentes à legislação e aos precedentes. Compare também a cobertura da negociação coletiva, o papel do Estado e a proteção legal. Cada país combina esses elementos de forma própria."},{"type":"heading","text":"Um roteiro para ler a lei"},{"type":"body","text":"Primeiro, identifique o suporte fático descrito no dispositivo. Depois, veja o que o texto exige cumulativamente, quais exceções aparecem nos parágrafos e qual consequência se liga a cada hipótese. A leitura sistemática compara a regra com normas do mesmo tema em outros diplomas. O art. 5º da LINDB orienta a consideração dos fins sociais e do bem comum.","refs":[{"law":"LINDB","ids":["5"],"label":"art. 5","highlights":{"5":{"0":["direct",111]}}}]},{"type":"example","text":"Exemplo. Na expressão “até” 90 dias de experiência, a leitura literal identifica o máximo. A leitura sistemática com as regras de prorrogação revela um segundo limite. Um total de 90 dias pode ser irregular se tiver havido mais de uma prorrogação.","refs":[{"law":"CLT","ids":["445","451"],"label":"arts. 445, 451","highlights":{"445":{"0":["direct",138],"1":["direct",149]},"451":{"0":["direct",161]}}}]},{"type":"body","text":"Lacuna é ausência de regra para a situação. O art. 4º da LINDB e o art. 8º da CLT apresentam técnicas de integração. Analogia exige semelhança juridicamente relevante. Equidade exige considerar o caso e os limites legais. Costume supõe prática reiterada com relevância jurídica, e uma prática empresarial isolada não se transforma automaticamente em regra geral.","refs":[{"law":"LINDB","ids":["4"],"label":"art. 4","highlights":{"4":{"0":["direct",128]}}},{"law":"CLT","ids":["8"],"label":"art. 8","highlights":{"8":{"0":["direct",441],"1":["related",226]}}}]},{"type":"heading","text":"Como ler uma cláusula coletiva na prova"},{"type":"body","text":"Identifique os signatários, a categoria, a base territorial e a vigência. Depois, determine o direito regulado. O art. 611-A apresenta exemplos de matérias negociáveis. O art. 611-B traz limites que precisam ser lidos junto com a Constituição e com o Tema 1046 do STF. Após verificar a validade, examine se há ACT e CCT concorrentes e aplique o critério do art. 620.","refs":[{"law":"CLT","ids":["611-A","611-B","620"],"label":"arts. 611-A, 611-B, 620","highlights":{"611-A":{"0":["direct",132],"1":["related",78],"2":["related",26]},"611-B":{"0":["direct",159],"4":["related",20],"11":["related",51],"12":["related",97]},"620":{"0":["direct",143]}}},{"law":"CF","ids":["7","8"],"label":"arts. 7, 8","highlights":{"7":{"26":["direct",69],"6":["related",83]},"8":{"2":["direct",277],"6":["direct",87],"3":["related",149]}}}]},{"type":"example","text":"Exemplo. Uma cláusula sobre banco de horas e uma que reduz o salário mínimo exigem respostas distintas. A primeira envolve matéria expressamente negociável nos limites legais. A segunda encontra a proteção do salário mínimo no próprio catálogo de direitos indisponíveis da CLT.","refs":[{"law":"CLT","ids":["611-A","611-B"],"label":"arts. 611-A, 611-B","highlights":{"611-A":{"2":["direct",26],"0":["related",132]},"611-B":{"4":["direct",20],"0":["related",159]}}}]},{"type":"prompt","text":"Teste sem olhar. Ao interpretar uma norma, você já tem o texto a aplicar. Qual seria um exemplo de lacuna? Quem assina ACT e CCT?"}],"mapTitle":"Fontes e interpretação","citedArticles":["LINDB · arts. 4, 5","CLT · arts. 8, 445, 451, 611-A, 611-B, 620","CF · arts. 7, 8, 114"],"glossary":[{"term":"Analogia","meaning":"Uso da solução de uma situação semelhante para preencher uma lacuna.","example":"Compare o problema sem regra específica com outro caso cuja solução já esteja prevista."},{"term":"ACT","meaning":"Acordo coletivo de trabalho firmado entre sindicato profissional e uma ou mais empresas.","example":"O sindicato profissional negocia com uma fábrica uma regra para os trabalhadores abrangidos."},{"term":"CCT","meaning":"Convenção coletiva de trabalho firmada entre sindicatos das categorias profissional e econômica.","example":"Sindicato dos comerciários e sindicato patronal negociam as condições da categoria abrangida."},{"term":"Equidade","meaning":"Consideração da justiça do caso concreto dentro dos limites do ordenamento.","example":"A equidade auxilia a solução da lacuna sem afastar uma proibição legal expressa."},{"term":"Jurisprudência","meaning":"Conjunto de decisões judiciais que ajuda a identificar como os tribunais interpretam determinado tema.","example":"A jurisprudência esclarece, por exemplo, como uma regra é aplicada a diferentes formas de contratação."},{"term":"Súmula","meaning":"Enunciado que sintetiza um entendimento jurisprudencial.","example":"A Súmula 276 do TST resume o entendimento sobre a dispensa do aviso e a prova de novo emprego."},{"term":"Interpretação teleológica","meaning":"Leitura que procura a finalidade da regra.","example":"Ao estudar a redução do aviso trabalhado, pergunte por que a lei libera parte da jornada."},{"term":"Unicidade sindical","meaning":"Regra que limita a coexistência de sindicatos da mesma categoria na mesma base territorial.","example":"Na prova, confirme se a categoria e a base são as mesmas antes de aplicar o princípio."}],"lesson":{"title":"Fontes e interpretação","file":"fontes-rafael-aula.mp4","poster":"fontes-rafael-aula.jpg"}},{"id":"vinculo","number":3,"semester":1,"map":[["Pessoa física","Prestação humana e pessoal","Uma substituição pontual e autorizada é diferente da liberdade de mandar qualquer pessoa cumprir a prestação rotineiramente."],["Onerosidade","Contraprestação devida","O pagamento por tarefa, comissão ou mês pode remunerar o trabalho. Mesmo se o pagamento atrasa, a contraprestação pode continuar devida."],["Não eventualidade","Inserção na atividade","Um trabalhador atende toda terça e quinta e integra a rotina do estabelecimento. Examine essa regularidade no contexto da atividade."],["Subordinação","Direção e controle, inclusive telemático","Exigir que um laudo seja entregue no prazo indica controle do resultado. Fixar a rotina, impor ordens e aplicar sanções pode indicar direção da prestação."],["Alteridade","Risco econômico do empregador","Uma loja tem prejuízo em certo mês. A perda comercial normal pertence ao negócio, ainda que a equipe receba comissões."],["Autonomia","Liberdade real de organizar a prestação","Uma consultora negocia o preço, escolhe quando trabalhar e distribui tarefas à própria equipe. Esses fatos são indícios de autonomia."]],"questions":[{"id":"vinculo-1","chapter":"vinculo","level":"B","text":"Qual elemento descreve a direção jurídica da prestação pelo empregador?","options":["Subordinação","Onerosidade","Pessoalidade","Alteridade","Continuidade"],"explanation":"A subordinação envolve o poder de direção, controle e disciplina do trabalho."},{"id":"vinculo-2","chapter":"vinculo","level":"B","text":"Quem assume normalmente os riscos da atividade econômica no emprego?","options":["O empregador","O empregado","O sindicato profissional","A pessoa empregada quando o pagamento é por tarefa","O sindicato profissional enquanto representante da categoria"],"explanation":"É a alteridade prevista na lógica do art. 2º da CLT."},{"id":"vinculo-3","chapter":"vinculo","level":"M","text":"Um técnico trabalha toda semana, recebe pagamento, segue ordens e presta o serviço pessoalmente. Qual fato demonstra onerosidade?","options":["O pagamento pela prestação","As ordens do gestor","A execução pessoal","A impossibilidade de enviar substituto","A sujeição a sanções por recusa"],"explanation":"Pagamento é onerosidade, ordens apontam subordinação e execução pessoal é pessoalidade."},{"id":"vinculo-4","chapter":"vinculo","level":"M","text":"Um entregador recebe ordens, monitoramento e bloqueios por meio eletrônico. Qual comparação a CLT permite?","options":["Comparar direção telemática à supervisão direta","Descartar subordinação sempre que houver aplicativo","Reconhecer vínculo apenas pelo uso de GPS","Equiparar controle de resultado sempre ao poder disciplinar","Separar comando telemático do direto mesmo quando ambos dirigem a rotina"],"explanation":"O art. 6º admite o comando telemático. É preciso examinar o conjunto dos fatos para o enquadramento."},{"id":"vinculo-5","chapter":"vinculo","level":"A","text":"Helena presta consultoria só para um laboratório por seis meses. Ela negocia os valores por projeto, escolhe a equipe e pode recusar novos pedidos. O laboratório não controla sua rotina. Qual fato isolado a CLT admite na contratação autônoma, embora a parte contrária o invoque para sustentar o reconhecimento de vínculo?","options":["A exclusividade, isoladamente","A direção direta comprovada junto com os demais requisitos de emprego","A fraude demonstrada em contrato civil que reúne todos os requisitos de emprego","A sujeição efetiva ao poder disciplinar do laboratório","A prestação de trabalho com todos os requisitos do vínculo demonstrados"],"explanation":"A exclusividade, só por si, não prova subordinação. O art. 442-B trata da contratação autônoma inclusive com exclusividade."},{"id":"vinculo-6","chapter":"vinculo","level":"A","text":"A clínica Água Clara exige que André abra uma PJ. Durante oito meses, ele atua sozinho em escala fixa, recebe mensalmente e é advertido quando troca turnos sem autorização. O contrato comercial prevê autonomia. Qual deve ser o primeiro eixo de análise?","options":["Se os fatos comprovam os requisitos de emprego e eventual fraude","Se a nota fiscal usa o termo consultoria","Se o contrato possui duas testemunhas","Investigar se a PJ pagava os tributos antes de examinar a direção da prestação","Usar a jornada imposta apenas para calcular horas, sem considerar o vínculo"],"explanation":"O nome contratual é um elemento documental. A análise envolve os requisitos dos arts. 2º e 3º e a eventual fraude do art. 9º."},{"chapter":"vinculo","level":"B","text":"Quem pode ser empregado no sentido do art. 3º da CLT?","options":["Pessoa física que reúne os requisitos legais","Qualquer pessoa jurídica prestadora","Somente entidade sem fins lucrativos","Pessoa jurídica quando não possui outros clientes","Qualquer prestador remunerado, mesmo sem subordinação"],"explanation":"Empregado é pessoa natural. A prestação deve atender aos requisitos do vínculo.","id":"vinculo-7"},{"chapter":"vinculo","level":"B","text":"O que é pessoalidade?","options":["Prestação que deve ser executada pessoalmente pelo trabalhador","Recebimento de comissão","Prestação remunerada com qualquer frequência","Obrigação de prestar trabalho sem remuneração variável","Regularidade do serviço com livre uso de substitutos"],"explanation":"Pessoalidade trata de quem executa o trabalho.","id":"vinculo-8"},{"chapter":"vinculo","level":"B","text":"Qual é a relação entre trabalho e emprego?","options":["Trabalho é gênero e emprego é espécie","Emprego é gênero e trabalho é espécie","Toda atividade remunerada é emprego","Relação de trabalho só existe quando o serviço é subordinado","Emprego compreende tanto serviço autônomo quanto estágio regular"],"explanation":"O emprego é uma forma específica de relação de trabalho.","id":"vinculo-9"},{"chapter":"vinculo","level":"B","text":"O que indica não eventualidade?","options":["Prestação inserida com regularidade na necessidade do tomador","Apenas pagamento em espécie","Obrigatoriedade de ponto eletrônico","Obrigação de usar ferramenta do tomador em um único projeto","Liberdade de prestar o serviço quando surgir uma demanda isolada"],"explanation":"A regularidade deve ser examinada no contexto da atividade.","id":"vinculo-10"},{"chapter":"vinculo","level":"B","text":"Qual artigo define o empregado na CLT?","options":["Art. 3º","Art. 145","Art. 477","Art. 442-B","Art. 9º"],"explanation":"O art. 3º apresenta os elementos caracterizadores do empregado.","id":"vinculo-11"},{"chapter":"vinculo","level":"M","text":"Uma associação sem fins lucrativos admite e dirige empregados. Pode ser empregadora?","options":["Sim, entes sem fins lucrativos podem ser equiparados para fins da relação de emprego","Não, empregador precisa distribuir lucro","Apenas se a associação for tomadora temporária","A associação só pode empregar se converter sua atividade em empresarial","A finalidade não lucrativa transfere o vínculo automaticamente ao dirigente"],"explanation":"O art. 2º admite equiparação de instituições sem fins lucrativos que admitam empregados.","id":"vinculo-12"},{"chapter":"vinculo","level":"M","text":"O empregado trabalhou regularmente, mas sofreu atraso salarial. Isso elimina a onerosidade?","options":["Não. O salário continua devido pela prestação","Sim. Onerosidade exige que todo pagamento já tenha ocorrido","Sim. Atraso transforma a atividade em estágio","Não, mas somente porque o pagamento deveria ser por hora","Sim, se a empresa já tiver atrasado mais de um mês"],"explanation":"A contraprestação devida caracteriza onerosidade mesmo em caso de inadimplemento.","id":"vinculo-13"},{"chapter":"vinculo","level":"M","text":"Uma pessoa comparece toda terça e quinta, segue ordens e é paga. Dois dias semanais afastam sempre vínculo urbano comum?","options":["Não. A não eventualidade depende da prestação no caso, e o doméstico tem critério especial","Sim. Todo vínculo exige pelo menos três dias","Sim. Dois dias caracterizam trabalho temporário","Sim, porque a frequência mínima de três dias vale em qualquer relação","Não, mas o vínculo se presume apenas pelos dois comparecimentos"],"explanation":"O critério de mais de dois dias pertence ao emprego doméstico e não é uma regra universal.","id":"vinculo-14"},{"chapter":"vinculo","level":"M","text":"Uma trabalhadora pode mandar substituto habitual sem autorização e organiza quem executa cada tarefa. Qual elemento fica enfraquecido?","options":["Pessoalidade","Onerosidade","Alteridade apenas","Subordinação jurídica","Não eventualidade mesmo que a rotina permaneça"],"explanation":"Liberdade efetiva de substituição habitual enfraquece a prestação pessoal.","id":"vinculo-15"},{"chapter":"vinculo","level":"M","text":"O cliente exige laudo no prazo e padrão previstos no contrato, sem dirigir a rotina do técnico. Esse controle prova subordinação por si?","options":["Não. Exigência de resultado pode ser compatível com autonomia","Sim. Qualquer prazo prova direção do trabalho","Sim. Contrato civil não admite padrão de qualidade","Sim, sempre que o prazo estiver escrito no contrato","O controle do prazo torna o cliente empregador se o preço foi negociado por entrega"],"explanation":"É preciso investigar a direção da execução, além dos critérios do resultado.","id":"vinculo-16"},{"chapter":"vinculo","level":"A","text":"Marcos dirige por aplicativo e escolhe quando se conectar. Depois de conectado, recebe orientações operacionais e pode ser bloqueado por recusas sucessivas. Ele usa carro próprio e também atende por outra plataforma. Sem presumir o resultado do caso, o que a análise precisa confrontar?","options":["Grau efetivo de liberdade, controle e sanções, além dos demais requisitos","Apenas se possui veículo próprio","Apenas se o aplicativo emite recibos","A propriedade do veículo com exclusividade, descartando os bloqueios","Apenas a autonomia para se conectar, ainda que a rotina depois da conexão seja rigidamente controlada"],"explanation":"Indícios em direções diferentes exigem análise dos fatos e da disciplina jurisprudencial do tema.","id":"vinculo-17"},{"chapter":"vinculo","level":"A","text":"Bárbara é obrigada a cumprir pessoalmente a escala. Em duas consultas médicas, a supervisora escolheu e autorizou uma colega para cobri-la. A empresa afirma que isso prova livre substituição. Qual conclusão cabe quanto à pessoalidade?","options":["Não. Substituição pontual autorizada difere de liberdade habitual de substituição","Sim. Pessoalidade proíbe qualquer substituição em todo contexto","Sim. A autorização torna o contrato intermitente","O vínculo exige que nenhuma substituição ocorra em toda a relação","Uma substituição organizada pela empresa tem o mesmo efeito da livre escolha habitual de substituto"],"explanation":"Examine se a prestação é contratada em caráter pessoal na rotina.","id":"vinculo-18"},{"chapter":"vinculo","level":"A","text":"Natan é pago por peça entregue, sem mensalidade fixa. O tomador exige comparecimento diário, define o modo de execução e registra sanções. A defesa afirma que a variação da renda elimina o pagamento pelo trabalho. O que decidir sobre a onerosidade?","options":["Não. A contraprestação pode ser variável","Sim. Onerosidade exige salário mensal fixo","Somente o documento fiscal decide","Pagamento por peça é reembolso se não houver parte fixa, independentemente da causa da parcela","Só existe onerosidade nos meses em que a produção atinge o salário mínimo"],"explanation":"A forma de cálculo não exclui o pagamento pelo trabalho nem elimina os outros requisitos.","id":"vinculo-19"},{"chapter":"vinculo","level":"A","text":"Lara assina contrato de autônoma, mas recebe ordens diárias, não pode indicar substituta e tem atuação regular e remunerada. A empresa apresenta recibos e pede que o julgador ignore mensagens da chefia. Qual é a fundamentação adequada?","options":["Confrontar contrato com fatos, arts. 2º e 3º e eventual fraude do art. 9º","Aplicar só o nome escrito, sem examinar prova","Presumir que toda contratação civil é fraudulenta","Examinar eventual fraude apenas se o pagamento nunca tiver sido registrado","Limitar a discussão à exclusividade, que substitui a análise da pessoalidade e da subordinação"],"explanation":"A primazia da realidade exige análise concreta. A existência de contrato civil é um dado do caso.","id":"vinculo-20"},{"chapter":"vinculo","level":"A","text":"Marina presta consultoria para quatro clientes. Um deles reserva horários fixos na semana, exige atuação pessoal, dá ordens operacionais e aplica sanções. O cliente invoca os outros três contratos como impedimento jurídico absoluto ao vínculo. Como analisar?","options":["Não. A exclusividade não integra a lista dos requisitos de emprego","Sim. Emprego exige exclusividade","Sim. Mais de um cliente transforma toda prestação em estágio","A pluralidade de clientes afasta somente a onerosidade, sem afetar os demais requisitos","Investigar vínculo apenas com o cliente que paga o maior valor mensal"],"explanation":"A pluralidade de clientes não substitui a análise individual dos requisitos de cada relação.","id":"vinculo-21"},{"id":"vinculo-22","chapter":"vinculo","level":"B","text":"A identidade de sócios basta para caracterizar grupo econômico trabalhista?","options":["Não. Devem ser examinados os requisitos legais de integração e atuação conjunta.","Sim. Basta um sócio em comum.","Sim, se os sócios tiverem contratos escritos.","Sim, se as empresas usarem o mesmo escritório contábil","Não, porque grupo econômico só pode existir com uma única personalidade jurídica"],"explanation":"O art. 2º, § 3º, da CLT afasta a identidade de sócios como critério suficiente."},{"id":"vinculo-23","chapter":"vinculo","level":"M","text":"Uma empresa assume a operação de uma unidade e a sucessão de empregadores fica caracterizada. Quem responde por créditos do período anterior, pela regra geral?","options":["A sucessora.","Somente a empresa vendida.","Somente o trabalhador que permaneceu na unidade.","As duas respondem solidariamente mesmo sem fraude ou outra base de solidariedade","A empresa sucedida responde primeiro e a sucessora só responde subsidiariamente"],"explanation":"A responsabilidade da sucessora alcança obrigações contraídas no período anterior."},{"id":"vinculo-24","chapter":"vinculo","level":"A","text":"Rogério acumulou créditos antes de a Rede Cedro assumir integralmente a operação. A sucessão foi reconhecida e a prova mostra que a antiga empresa simulou a transferência para frustrar cobranças. A sucessora diz que só responde pelo período posterior. Qual é a solução do art. 448-A?","options":["A sucessora responde e a sucedida é solidariamente responsável.","A fraude transfere toda a responsabilidade para a sucedida.","A fraude elimina a responsabilidade de ambas se houve novo contrato.","As duas respondem, mas a sucessora só responde pelos créditos posteriores","A sucedida responde subsidiariamente, porque a fraude não altera a ordem de responsabilidade"],"explanation":"A regra mantém a responsabilidade da sucessora e prevê solidariedade da sucedida quando comprovada fraude."}],"title":"Relação de trabalho e vínculo de emprego","body":[{"type":"body","text":"Relação de trabalho é o gênero. Abrange situações como prestação autônoma e eventual, além do emprego. Relação de emprego é a espécie em que se reúnem os requisitos dos arts. 2º e 3º da CLT. Para resolver um caso, associe cada requisito a um fato concreto.","refs":[{"law":"CLT","ids":["2","3"],"label":"arts. 2, 3","highlights":{"2":{"0":["direct",174],"1":["related",258]},"3":{"0":["direct",153],"1":["related",150]}}}]},{"type":"heading","text":"Os requisitos na prática"},{"type":"bullet","text":"Pessoa física e pessoalidade. Quem presta o trabalho é uma pessoa natural. A prestação tem caráter pessoal. Uma substituição autorizada e pontual tem significado diferente da liberdade de enviar substitutos habitualmente por conta própria."},{"type":"bullet","text":"Não eventualidade. A prestação se insere com regularidade na atividade ou necessidade do tomador. Trabalhar duas vezes por semana pode atender ao requisito. No emprego doméstico existe um critério legal específico de frequência."},{"type":"bullet","text":"Onerosidade. Há contraprestação devida pelo trabalho, inclusive quando parte do pagamento é variável. O atraso salarial não transforma a prestação em voluntariado."},{"type":"bullet","text":"Subordinação jurídica. O empregador dirige a prestação. Ordens, controle, fiscalização e sanções são indícios. O art. 6º da CLT equipara o comando telemático ao direto para caracterizar subordinação.","refs":[{"law":"CLT","ids":["6"],"label":"art. 6","highlights":{"6":{"1":["direct",283],"0":["related",222]}}}]},{"type":"body","text":"O empregador admite, assalaria, dirige e assume os riscos da atividade. A alteridade explica por que a queda nas vendas ou um mês de prejuízo, por si sós, não transferem ao empregado o risco empresarial. O empregador pode ser pessoa natural ou organização, inclusive entidade sem fins lucrativos enquadrada no art. 2º da CLT. O poder diretivo inclui organizar, regulamentar e fiscalizar o trabalho, além de disciplinar nos limites legais.","refs":[{"law":"CLT","ids":["2"],"label":"art. 2","highlights":{"2":{"0":["direct",174],"1":["direct",258]}}}]},{"type":"heading","text":"Autonomia pejotização e plataformas"},{"type":"body","text":"Um prestador genuinamente autônomo organiza a forma de prestar os serviços e assume os riscos próprios de sua atividade. Continuidade ou exclusividade, isoladamente, não resolvem a análise (art. 442-B). Um contrato entre empresas pode ser legítimo. Havendo alegação de fraude, examine os requisitos do vínculo e o art. 9º da CLT. Na discussão sobre pejotização, o Tema 1389 do STF trata de contratação civil ou comercial, competência e ônus da prova. O trabalho por plataforma envolve discussão própria no Tema 1291. Para estudar subordinação algorítmica, examine distribuição de tarefas, bloqueios, controles e liberdade efetiva do prestador.","refs":[{"law":"CLT","ids":["442-B","9"],"label":"arts. 442-B, 9","highlights":{"442-B":{"0":["direct",211]},"9":{"0":["direct",165]}}}]},{"type":"prompt","text":"Caso. Um técnico emite nota fiscal, mas atende pessoalmente em escala fixa, recebe mensalmente e pode sofrer sanções por recusar ordens. Qual fato aponta para cada requisito? Que informação adicional você pediria?"},{"type":"heading","text":"Indícios e requisitos em um caso concreto"},{"type":"body","text":"Faça uma pergunta para cada elemento. A pessoa física tem liberdade real de mandar substituto habitual? O serviço é ocasional ou atende a necessidade regular? Existe pagamento pelo trabalho? Quem define a execução, controla a jornada ou aplica sanções? O art. 3º define o empregado e o art. 2º descreve a posição do empregador. A análise conjunta evita que um indício isolado decida a questão.","refs":[{"law":"CLT","ids":["2","3"],"label":"arts. 2, 3","highlights":{"2":{"0":["direct",174],"1":["related",258]},"3":{"0":["direct",153],"1":["related",150]}}}]},{"type":"example","text":"Exemplo. Uma tradutora é chamada uma vez para um projeto, escolhe horários, negocia o preço e entrega o resultado. Já uma revisora comparece semanalmente, recebe valor mensal e segue ordens e controle de um gestor. A primeira situação traz sinais de autonomia e eventualidade. A segunda traz indícios de emprego a confirmar pelos fatos."},{"type":"body","text":"Controle de resultado e direção da prestação são conceitos próximos. Um cliente pode exigir prazo e qualidade do produto contratado. Subordinação pode aparecer quando o tomador determina a forma cotidiana de execução, controla disponibilidade, impõe ordens operacionais e sanciona o descumprimento. A tecnologia muda o meio de comando, conforme o art. 6º.","refs":[{"law":"CLT","ids":["6"],"label":"art. 6","highlights":{"6":{"1":["direct",283],"0":["related",222]}}}]},{"type":"heading","text":"Quem assume a atividade"},{"type":"body","text":"O empregador organiza o empreendimento e assume seu risco. Pagar comissões pode ser uma estrutura de salário, mas não autoriza cobrar de cada empregado a perda comercial normal. Também é possível haver empregador sem fim lucrativo, como uma associação que admite e dirige empregados.","refs":[{"law":"CLT","ids":["2","457","462"],"label":"arts. 2, 457, 462","highlights":{"2":{"0":["direct",174],"1":["related",258]},"457":{"1":["direct",116],"0":["related",199]},"462":{"0":["direct",178],"1":["related",233]}}}]},{"type":"example","text":"Exemplo. Uma clínica associa o pagamento à quantidade de atendimentos, define escala e impede substituição. A forma variável de pagamento ainda pode ser onerosa. A possibilidade de o prestador escolher clientes, preço e equipe apontaria para outro arranjo."},{"type":"heading","text":"Grupo econômico e responsabilidade solidária"},{"type":"body","text":"Grupo econômico trabalhista pode existir quando empresas com personalidade própria estão sob direção, controle ou administração de outra, ou quando, mesmo mantendo autonomia, integram um grupo. Uma vez caracterizado, as integrantes respondem solidariamente pelas obrigações decorrentes da relação de emprego. A identidade de sócios, sozinha, é insuficiente. A CLT manda demonstrar interesse integrado, efetiva comunhão de interesses e atuação conjunta.","refs":[{"law":"CLT","ids":["2"],"highlights":{"2":{"2":["direct",330],"3":["direct",238],"0":["related",174]}},"label":"art. 2"}]},{"type":"example","text":"Exemplo. Duas lojas têm um sócio em comum, mas mantêm operações e decisões independentes. Só esse nome no contrato social não mostra grupo. Se as empresas compartilham a direção da operação, conduzem atividades em conjunto e atuam em interesse integrado, esses fatos ganham peso na análise.","refs":[{"law":"CLT","ids":["2"],"highlights":{"2":{"3":["direct",238],"2":["related",330]}},"label":"art. 2"}]},{"type":"body","text":"Solidariedade e subsidiariedade respondem a perguntas diferentes. No grupo caracterizado, as integrantes são corresponsáveis solidárias. Na terceirização privada regular, costuma haver prestadora devedora principal e tomadora responsável subsidiária pelo período da prestação. Em questões processuais, o Tema 1232 do STF distingue a responsabilidade material da possibilidade de incluir uma empresa só depois, na execução. A tese exige, em regra, participação na fase de conhecimento e prevê hipóteses excepcionais, como sucessão empresarial e abuso da personalidade jurídica.","refs":[{"law":"CLT","ids":["2"],"highlights":{"2":{"2":["direct",330],"3":["direct",238],"0":["related",174]}},"label":"art. 2"},{"law":"Lei 6.019/1974","ids":["5-A"],"highlights":{"5-A":{"5":["direct",273],"0":["related",190]}},"label":"art. 5-A"}]},{"type":"link","text":"STF • Tema 1232 e grupo econômico na execução","url":"https://portal.stf.jus.br/jurisprudenciarepercussao/verandamentoprocesso.asp?classeprocesso=re&incidente=6422105&numeroprocesso=1387795&numerotema=1232"},{"type":"heading","text":"Sucessão de empregadores"},{"type":"body","text":"Mudança na estrutura jurídica ou na propriedade da empresa não afeta, por si só, direitos adquiridos ou contratos de trabalho. Caracterizada a sucessão empresarial ou de empregadores, a sucessora responde pelas obrigações trabalhistas, inclusive as contraídas quando o trabalhador prestava serviços à sucedida. Em caso de fraude comprovada na transferência, a sucedida responde solidariamente com a sucessora. A natureza da operação e os fatos são decisivos.","refs":[{"law":"CLT","ids":["10","448","448-A"],"highlights":{"10":{"0":["direct",116]},"448":{"0":["direct",135]},"448-A":{"0":["direct",270],"1":["direct",126]}},"label":"arts. 10, 448, 448-A"}]},{"type":"example","text":"Exemplo. Uma empresa compra a operação de uma unidade, assume o estabelecimento e mantém a atividade. Se a sucessão estiver caracterizada, a compradora responde também pelos créditos do período anterior. Para reconhecer a solidariedade da vendedora pela regra do art. 448-A, observe se houve fraude comprovada.","refs":[{"law":"CLT","ids":["448","448-A"],"highlights":{"448":{"0":["direct",135]},"448-A":{"0":["direct",270],"1":["direct",126]}},"label":"arts. 448, 448-A"}]},{"type":"body","text":"Na prova, separe três perguntas. No grupo econômico, verifique como as empresas se relacionam. Na sucessão, verifique se houve transferência que caracterize sucessão de empregadores. Na terceirização, identifique a prestadora, a tomadora e a natureza da responsabilidade.","refs":[{"law":"CLT","ids":["2","448-A"],"highlights":{"2":{"2":["direct",330],"3":["direct",238],"0":["related",174]},"448-A":{"0":["direct",270],"1":["related",126]}},"label":"arts. 2, 448-A"},{"law":"Lei 6.019/1974","ids":["5-A"],"highlights":{"5-A":{"5":["direct",273],"0":["related",190]}},"label":"art. 5-A"}]}],"mapTitle":"Vínculo de emprego","citedArticles":["CLT · arts. 2, 3, 6, 9, 10, 442-B, 448, 448-A, 457, 462","Lei 6.019/1974 · art. 5-A"],"glossary":[{"term":"Pessoalidade","meaning":"A execução é esperada daquela pessoa, com limites à substituição por iniciativa própria.","example":"Uma troca pontual autorizada é diferente de poder mandar outra pessoa no seu lugar rotineiramente."},{"term":"Onerosidade","meaning":"Existe contraprestação pelo trabalho prestado.","example":"Receber por vendas ou por tarefa pode atender a esse requisito."},{"term":"Não eventualidade","meaning":"A prestação se insere com regularidade na atividade ou na necessidade do tomador.","example":"Compare um reparo isolado com atendimentos que fazem parte da rotina semanal do estabelecimento."},{"term":"Subordinação jurídica","meaning":"O empregador tem poder de dirigir, fiscalizar e disciplinar a prestação.","example":"Escala imposta, ordens operacionais e sanções podem ser indícios de subordinação."},{"term":"Alteridade","meaning":"O risco da atividade econômica pertence ao empregador.","example":"A empresa que perdeu clientes continua responsável pelo salário devido."},{"term":"Autonomia","meaning":"Liberdade efetiva para organizar a execução do serviço e assumir os próprios riscos.","example":"Uma consultora que aceita ou recusa projetos e combina como fará as entregas apresenta sinais de autonomia."},{"term":"Pejotização","meaning":"Contratação de uma pessoa por intermédio de pessoa jurídica. A discussão jurídica envolve saber se o arranjo é genuíno ou mascara emprego.","example":"Emitir nota fiscal é um dado do caso. Também importam a execução pessoal, as ordens e o controle da rotina."},{"term":"Grupo econômico","meanin
